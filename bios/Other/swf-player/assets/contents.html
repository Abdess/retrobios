<title>SWF Player</title>
    <script src="/ruffle/ruffle/ruffle.js"></script>
</head>
<body>
<center>
<table width="" height="" cellpadding="0" cellspacing="0" border="0">
	<tr>
		<td align="center" valign="middle">
		<object type="application/x-shockwave-flash"
			id='myFlashMovie'
			align="middle"
			data=""
			wmode=""
			height=""
			width="">
				<param name="movie" value="">
				<param name="quality" value="">
				<param name="wmode" value="">
				<param name="bgColor" value="#000000">
				<param name="allowScriptAccess" value="always">
				<param name="menu" value="false">
				<param name="scale" value="">
				<param name="allowFullScreen" value="true">
				<div style="height: 100%; margin: 0; padding: 0; ">
				<div id="center">
				<center>
				<br>
				<h1><font color="#C23352">Flash Player Not Found!</font></h1>
				<h1>
				<script type='text/javascript'>
					if (typeof CallJava !== 'undefined') {
						CallJava.notInstalled();
					}
				</script>
				</center>
				</div>
				</div>
		</object>
		<script type='text/javascript'>
		    function getFlashInfo(){
		    	if (typeof CallJava !== 'undefined') {
		    		CallJava.SetFlashInfo(myFlashMovie.TotalFrames(),myFlashMovie.CurrentFrame());
		    	}
		    }
		    function callPlay(){
		    	myFlashMovie.Play();
		    }
		    function callStop(){
		    	myFlashMovie.StopPlay();
		    }
		    function callRewind(){
		    	myFlashMovie.Rewind();
		    }
		    function callFastforward(){
		    	myFlashMovie.GotoFrame(myFlashMovie.TotalFrames()-1);
		    }
		    function zoomIn(){
		    	myFlashMovie.Zoom(90);
		    }
		    function zoomOut(){
		    	myFlashMovie.Zoom(110);
		    }
		    function gotoFrame(goframe){
		    	myFlashMovie.GotoFrame(goframe);
		    }
		</script>
		</td>
	</tr>
</table>
</center>

</body>
</html>
