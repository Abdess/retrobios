<?xml version="1.0"?>
<systemList>
	<system>
		<name>psx</name>
		<path>/storage/roms/psx</path>
		<extension>.cue .CUE .chd</extension>
		<command>runemu.py %ROM%</command>
		<platform>psx</platform>
		<emulators>
			<emulator name="retroarch">
				<cores>
					<core>pcsx_rearmed</core>
					<core default="true">duckstation</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<!-- <system><name>commented</name><path>/storage/roms/commented</path> --no-gui </system> -->
	<system>
		<name>advision</name>
		<path>/storage/roms/advision/</path>
		<extension>.bin .zip</extension>
		<command>retroarch -L /cores/mess_libretro.so %ROM% 2>&1 > /dev/null</command>
		<platform>advision</platform>
	</system>
	<system>
		<name>tools</name>
		<path>/storage/.config/modules</path>
		<extension>.sh</extension>
		<command>ignore</command>
		<platform>ignore</platform>
	</system>
	<system>
		<name>mame</name>
		<path>/storage/roms/mame</path>
		<extension>.zip</extension>
		<command>runemu.py %ROM%</command>
		<platform>arcade</platform>
		<emulators>
			<emulator name="retroarch">
				<cores>
					<core>mame2003_plus</core>
				</cores>
			</emulator>
		</emulators>
	</system>
</systemList>
