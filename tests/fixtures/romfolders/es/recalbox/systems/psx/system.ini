[system]
name = "psx"
roms.folder = "%ROOT%/psx"

[properties]
type = console

[core.0]
package = BR2_PACKAGE_LIBRETRO_PCSX_REARMED
priority = 1
emulator = "libretro"
core = "pcsx_rearmed"
extensions = ".cue .chd"

[core.1]
package = BR2_PACKAGE_LIBRETRO_SWANSTATION
priority = 1
emulator = "libretro"
core = "swanstation"
extensions = ".cue .pbp"

[core.2]
package = BR2_PACKAGE_LIBRETRO_BEETLE_PSX
priority = 2
priority.rpi1 = 0
emulator = "libretro"
core = "mednafen_psx"
extensions = ".cue"

[core.3]
package = BR2_PACKAGE_PCSX_STANDALONE
priority = 0
emulator = "pcsx"
core = "pcsx"
extensions = ".iso"
