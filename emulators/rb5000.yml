notes: |
  Philips VG 5000 emulator by Recalbox, a C++ fork of Daniel Coulom's
  DCVG5K v2. The standalone build and the libretro core live in
  two repositories and share the same Engine.

  The 16 KB system ROM is not a file. It is encoded in the
  Video::sPixels image table compiled into the binary, one ROM bit per
  entry as bit 0 XOR bit 5 (ref: source/Data.cpp:2). The Engine
  constructor copies that table into sMirror (ref: source/Engine.cpp:54)
  and Z80ReadW() rebuilds each ROM byte from eight table entries the
  first time the CPU reads it, caching it in mMemory
  (ref: source/Engine.cpp:379-389). The libretro core carries the same
  table and decoder.

  The libretro core can map a user cartridge file over 0x0000-0x3FFF
  when one is configured (ref: source/Engine.cpp:302-316), and that file is
  content. The on-screen display font is an Ubuntu TTF from the host
  system fonts directory (ref: source/Video.cpp:90-92).

exclusion_note: "VG 5000 system ROM is encoded in a compiled-in image table and decoded on first access, so no file is read"
