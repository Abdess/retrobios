notes: |
  Android and Linux member of the EX Emulator series by Robert Broglia, published as
  com.explusalpha.MsxEmu (MSX.emu/metadata/conf.mk:2,4,6,7, README.md:3-4) and reached
  by ES-DE through its MSX-EMU find rule. blueMSX is vendored under
  MSX.emu/src/blueMSX and driven by the app's own board, ROM loader and archive
  layers (MSX.emu/src/CMakeLists.txt:6-16). Content is read from .rom, .mx1, .mx2
  and .col cartridge images and from .dsk disk images, directly or as the first
  matching entry of a .zip, .7z or .rar (MSX.emu/src/main/system.ccm:83-87,
  MSX.emu/src/main/Main.cc:521-618). A disk image of 1 MB or more is mounted on a
  Sunrise IDE controller instead of a floppy drive
  (MSX.emu/src/main/Main.cc:549,556-561,588-603).

  Two of blueMSX's board types are built, every MSX variant and ColecoVision.
  createBoard returns 0 for anything else, and SVI, ColecoAdam, SG-1000, SF-7000 and
  SC-3000 have neither a board file in the build nor their mappers
  (MSX.emu/src/main/Main.cc:171-200, MSX.emu/src/CMakeLists.txt:80-83,
  MSX.emu/src/blueMSX/Common/MsxTypes.h:145,150).

  Everything the emulator loads comes from a machine definition. machineCreate opens
  Machines/<name>/config.ini and reads its [Slots] section, where each line carries a
  slot, a subslot, a start page, a page count, a numeric ROM type and the ROM's path
  (MSX.emu/src/blueMSX/Board/Machine.c:300-339,450-468). machineInitialize then loads
  each named path, and a file it cannot read sets success to 0 for every ROM type but
  one, which fails msxCreate or colecoCreate and ends the load with "Error loading
  machine files for" (MSX.emu/src/blueMSX/Board/Machine.c:1168-1181,
  MSX.emu/src/blueMSX/Board/MSX.c:247,277-281,
  MSX.emu/src/blueMSX/Board/Coleco.c:403,416-420,
  MSX.emu/src/main/Main.cc:215-219,262-269). Every ROM a definition names is therefore
  required for that machine, and only for it.

  Paths are resolved against the user's BIOS folder first and the application bundle
  second (MSX.emu/src/main/RomLoader.cc:57-92,94-133,135-144). That folder may be a
  directory or an archive and is refused unless it carries a Machines entry
  (MSX.emu/src/main/options.cc:212-228); with none set the app falls back to the asset
  path on Linux and to the storage path elsewhere
  (MSX.emu/src/main/options.cc:230-243). The machine picker lists every subdirectory
  holding a config.ini and appends the three bundled C-BIOS names on Android, where
  the asset directory enumeration skips directories
  (MSX.emu/src/main/EmuMenuViews.cc:32-97,548-608).

  The default machine is MSX2 and the default Coleco machine is COL - ColecoVision; a
  .col name picks the second and a session setting overrides both
  (MSX.emu/src/main/system.ccm:75-76, MSX.emu/src/main/Main.cc:534,563-577). Neither
  default is bundled. The application ships only the three C-BIOS machines in its
  assets (MSX.emu/res/firmware/Machines, symlinked into MSX.emu/res/android/assets),
  which run cartridge images; the definitions and ROMs behind every other name come
  from MSX.emu.zip, the firmware set on the author's site, whose Machines folder holds
  MSX, MSX2, MSX2+, MSXturboR, COL - ColecoVision and Shared Roms. Its MSXturboR
  definition spells MSXTR, MSXTREXT, MSXTRMUS, MSXTROPT and MSXDOS23 with a lowercase
  .rom extension where blueMSX's own set spells them .ROM, and the loader opens the
  string verbatim.

  One ROM path is written in the code rather than in a definition,
  Machines/Shared Roms/SUNRISEIDE.rom
  (MSX.emu/src/blueMSX/Memory/MegaromCartridge.c:302-311). The four others cannot be
  reached. Beer IDE, Gouda SCSI and the two Nowind images hang off cart names the app
  never passes and off mappers EXCLUDE_IDE_DEVICES and EXCLUDE_NOWIND compile out, and
  the FMPAC branch needs ROM_FMPAC as the incoming type where boardChangeCartridge
  only ever passes ROM_UNKNOWN, ROM_SCC, ROM_SCCPLUS and ROM_SUNRISEIDE
  (MSX.emu/src/blueMSX/Memory/MegaromCartridge.c:283-335,
  MSX.emu/src/blueMSX/Common/MsxTypes.h:145-151, MSX.emu/src/main/Main.cc:56-70,
  MSX.emu/src/main/EmuMenuViews.cc:385-413). Two of them are also spelled in lower
  case there against the upper case of the set.

  No hash is checked anywhere, and the sizes below are the ones the shipped set
  carries. The machine definitions still carry one, because config.ini is the name of
  every definition there is and nothing else tells two of them apart; the values are
  those of the emulator's own assets and of the author's firmware set. A single length
  test exists, the Kanji mapper taking 131072 or 262144 bytes
  and nothing else (MSX.emu/src/blueMSX/Memory/romMapperKanji.c:141-149). The other
  mappers refuse only a ROM that does not fit the pages left in its slot, which is a
  property of the definition rather than of the dump
  (MSX.emu/src/blueMSX/Memory/romMapperNormal.c:60-65,
  MSX.emu/src/blueMSX/Memory/romMapperCasette.c:58-68,
  MSX.emu/src/blueMSX/Memory/romMapperMsxMusic.c:55-68,
  MSX.emu/src/blueMSX/Memory/romMapperDRAM.c:88-99), and the Philips FDC, Panasonic
  FDC and MoonSound mappers test nothing at all
  (MSX.emu/src/blueMSX/Memory/romMapperPhilipsFdc.c:139-146,
  MSX.emu/src/blueMSX/Memory/romMapperTC8566AF.c:236-262,
  MSX.emu/src/blueMSX/Memory/romMapperMoonsound.c:129-158).

  The ROM database is compiled in. mediaDbGuessRom matches a cartridge's SHA-1 against
  the table of EmbeddedRomDBData.h to pick its mapper, the TinyXML and MediaDb.cpp
  sources that would read msxromdb.xml and msxsysromdb.xml are built only under
  useXMLDB, and the two calls that loaded them are commented out
  (MSX.emu/src/main/MediaDb.cc:50-59, MSX.emu/src/CMakeLists.txt:174-188,
  MSX.emu/src/main/system.ccm:165-167). The floppy drive sounds read nothing either:
  NO_EMBEDDED_SAMPLES turns fdcAudioCreate into a stub and takes the FdcRead.wav and
  FdcMotor.wav reads with it (MSX.emu/CMakeLists.txt:33,
  MSX.emu/src/blueMSX/IoDevice/FdcAudio.c:35-42,3456-3486).

  Per content the app writes and reads files under its save path, <machine>.cmos for a
  battery backed clock, an SRAM image named after the cartridge, and .sta save states
  in blueMSX's own zip format (MSX.emu/src/blueMSX/Board/MSX.c:232-233,
  MSX.emu/src/blueMSX/Memory/sramLoader.c:36-74,81-99,
  MSX.emu/src/main/Main.cc:45,380-383,385-429). Settings live in MsxEmu.config
  (MSX.emu/src/main/AppMeta.cc:32). gpOverlay.png, kbOverlay.png, ui.png and the
  shader sources are drawn by the framework from the application bundle.

