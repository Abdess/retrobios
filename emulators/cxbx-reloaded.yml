    source_ref: "src/core/hle/D3D8/Direct3D9/FixedFunctionPixelShader.hlsl:1, src/core/hle/D3D8/Direct3D9/Shader.cpp:486-490, src/core/hle/D3D8/Direct3D9/Shader.cpp:704-709"

