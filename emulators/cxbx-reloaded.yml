  - name: dokan2.dll
    required: false
    unread_on: [retrobat]
    description: "Dokany user mode library"
    note: >-
      Loaded by name with every entry point resolved individually, and the
      failure message tells the user to install the upstream signed Dokany
      runtime. It backs the only path that reads a disc image: an .iso or .xiso
      is mounted to a drive letter and the default.xbe of the mount is opened, so
      without it only unpacked titles load. The build produces an import library
      from the Dokany definition file and takes headers from the vendored tree,
      but ships no runtime of its own.
    source_ref: "src/gui/xiso/XisoMount.cpp:36-61, src/gui/WndMain.cpp:2252-2272, projects/dokany/CMakeLists.txt:8-10, projects/cxbx/CMakeLists.txt:17-18"

exclusion_note: >
  Five host libraries the code names are not listed. ntdll.dll and the XInput
  libraries tried in turn, xinput1_4, xinput1_3 and xinput9_1_0, are Windows
  components resolved by the loader, and cxbxr-emu.dll is the emulator's own
  build output shipped beside cxbx.exe. xbdm.dll is not opened at all: the name
  is compared against the import table of the loaded XBE so the debug monitor
  imports can be thunked to the emulator's own implementations. Two further
  files belong to the title rather than the system: boot.id, read from the title
  directory for its region flags, and default.xbe. logo.bmp is only the name
  offered in the open and save dialogs of the XBE logo editor.
  ref: src/common/input/XInputPad.cpp:100-120,
       src/core/kernel/init/CxbxKrnl.cpp:356-365,
       src/devices/chihiro/MediaBoard.cpp:46-57,
       src/gui/WndMain.cpp:880-890
