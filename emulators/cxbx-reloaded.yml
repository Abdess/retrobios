    source_ref: "src/core/hle/D3D8/Direct3D9/Shader.cpp:881-888, src/core/hle/D3D8/XbPixelShader.cpp:887-968"

  - name: FixedFunctionPixelShader.hlsli
    path: "hlsl/FixedFunctionPixelShader.hlsli"
    system: microsoft-xbox
    required: true
    bundled: true
    size: 5770
    sha1: "3a6d77bf7a7f591bb2092ad818044df8478d61da"
    md5: "0bbd94bdd8955212754c2f72f3ef2313"
    description: "Fixed function pixel shader state"
    note: >-
