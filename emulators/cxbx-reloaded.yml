    size: 13700
    sha1: "b3691aa041ded53c153668e12e0577715275c60a"
    md5: "fcf5cc618c91ed2a863134380c4b4de5"
    description: "Fixed function pixel shader"
    note: >-
      Compiled once per fixed function texture stage setup, under a name in
