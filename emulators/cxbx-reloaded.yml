      and again whenever the hlsl folder changes, and the run ends when the
      file cannot be opened.
    source_ref: "src/core/hle/D3D8/Direct3D9/Shader.cpp:852-879, src/core/hle/D3D8/Direct3D9/Shader.cpp:812-825, src/core/hle/D3D8/Direct3D9/Shader.cpp:829-844, src/core/hle/D3D8/Direct3D9/Direct3D9.cpp:691-692"

  - name: FixedFunctionPixelShader.hlsl
