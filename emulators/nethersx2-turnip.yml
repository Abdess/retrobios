notes: |
  PlayStation 2 emulator for Android, package xyz.aethersx2.tturnip, activity
  xyz.aethersx2.android.EmulationActivity. The application id is the only part
  of the package name that changes, which is what lets it sit beside the build
  it derives from. That build is NetherSX2 v2.2n-4248, itself a patch of the
  AetherSX2 v1.5-4248 package, and the library still reports itself as
  NetherSX2 v2.2n-4248 (Patched). The project publishes its shim sources and
  the libraries it packs; lib/libvulkad.so, lib/libhook_impl.so and
  lib/libmain_hook.so at the pinned revision are byte for byte the ones in the
  v0.7 package, so the sources describe the shipped binaries. Everything below
  was read from that package: lib/arm64-v8a/libemucore.so, libvulkad.so, the
  dex and the assets.
  ref: VulkanShim2/compile2.bat:21-64,
       nethersx2-turnip v0.7 AndroidManifest.xml,
       nethersx2-turnip v0.7 libemucore.so 0xe180c

  The patch rewrites twenty places in the 4248 library. Three are the strings
  libvulkan.so, libvulkan.so.1 and the message naming them, each turned into
  libvulkad.so, so the Vulkan loader opens the shim instead of the system
  driver. Twelve turn comparisons into unconditional paths, among them the
  memchr scan for the twenty-two byte pattern that precedes the certificate
  test and two byte-wise string comparisons whose result is forced to equal,
  which is what lets the package be resigned under a new application id. One
  skips the notification built from the android_warning key. The last four move
  settings defaults: the renderer enum from 12 to 14, the upscale multiplier
  fallback from 1.0 to 2.0 with the configuration read short-circuited, the
  hardware download mode default, and the warning text that went with it. None
  of them is in a file loading path, so the file set below is that of the
  package it patches, read from this library rather than carried over.
  ref: nethersx2-turnip v0.7 libemucore.so 0x10728e,
       nethersx2-turnip v0.7 libemucore.so 0x83cebc-0x83cee4,
       nethersx2-turnip v0.7 libemucore.so 0x83b728,
       nethersx2-turnip v0.7 libemucore.so 0x83bb3c,
       nethersx2-turnip v0.7 libemucore.so 0x83cfbc,
       nethersx2-turnip v0.7 libemucore.so 0x80e910,
       nethersx2-turnip v0.7 libemucore.so 0x840ff4,
       nethersx2-turnip v0.7 libemucore.so 0x84130c,
       nethersx2-turnip v0.7 libemucore.so 0x8421a0

  A BIOS image is required and boot stops without one, the application saying
  it needs a PS2 BIOS in the bios folder of the data directory. The data
  directory is getExternalFilesDir(null) with getDataDir() behind it, so it
  follows the application id, and the folder names under it come from the
  Folders section, Bios defaulting to bios.
  ref: nethersx2-turnip v0.7 libemucore.so 0xf70a9,
       nethersx2-turnip v0.7 libemucore.so 0x7ea908-0x7ea930,
       xyz/aethersx2/android/NativeLibrary getExternalFilesDir

  Detection is by content. The scan lists the BIOS folder with a * mask, keeps
  files between 4194304 and 8388608 bytes, and accepts an image whose romdir
  carries a RESET entry followed by a readable ROMVER; the fifth ROMVER
  character gives the zone, A for USA, C for China, E for Europe, H for Asia,
  J for Japan, P for Free, T for T10K and X for Test, any other character
  standing for itself. The sixth character is compared against D and the result
  discarded, the acceptance flag being set outright, so development images pass.
  An image named in the configuration is combined with the BIOS folder and
  opened at that path when it exists, without the size filter and without the
  romdir test. No name and no hash is matched anywhere. The image is read into
  the 4 MB ROM region and truncated to it.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:27-28,
       aethersx2/pcsx2/ps2/BiosTools.cpp:62-145,
       aethersx2/pcsx2/ps2/BiosTools.cpp:235-260,
       aethersx2/pcsx2/ps2/BiosTools.cpp:272-322,
       nethersx2-turnip v0.7 libemucore.so 0x828d80-0x828f14,
       nethersx2-turnip v0.7 libemucore.so 0x829140-0x8292f4

  Companions derive from the selected image. rom1 and rom2 are appended to the
  full name first, then substituted for the existing extension, so an image at
  ps2-0230a-20080220.bin is followed by ps2-0230a-20080220.bin.rom1 then
  ps2-0230a-20080220.rom1. The nvm and the mec are read at the substituted
  extension only, and both are written with defaults when they are absent or
  too short. No erom is loaded on this code line.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:193-216,
       aethersx2/pcsx2/CDVD/CDVD.cpp:120-144,
       aethersx2/pcsx2/CDVD/CDVD.cpp:158-214,
       nethersx2-turnip v0.7 libemucore.so 0x8288b0-0x828bb8

  The network adapter opens eeprom.dat and flash.dat by bare name, so they
  resolve against the process working directory, which the application never
  sets. A compiled-in image stands in for the first and a card filled with 0xFF
  for the second. DEV9hdd.raw is the default name of the empty disk image its
  settings page writes. An IRX named in the configuration is read into the ROM
  region at 0x3C0000 at boot; the field is empty by default and names no file
  of its own.
  ref: aethersx2/pcsx2/DEV9/DEV9.cpp:146-161,
       aethersx2/pcsx2/DEV9/flash.cpp:76-103,
       aethersx2/pcsx2/ps2/BiosTools.cpp:220-233,
       nethersx2-turnip v0.7 libemucore.so 0x7c5bec-0x7c5ca0,
       nethersx2-turnip v0.7 libemucore.so 0x828bb8-0x828ca8

  The Vulkan path is the reason this build exists. libemucore.so opens
  libvulkad.so where the stock library opens libvulkan.so, and that shim reads
  the Adreno model from the kgsl sysfs nodes, picks one of six Turnip drivers
  packed beside it, creates a linker namespace over its own library directory
  and loads libhook_impl.so and libmain_hook.so into it. The system
  /system/lib64/libvulkan.so is then opened inside that namespace with its
  soname patched, so its own driver load lands in the hook, which opens the
  chosen Turnip driver instead of the vendor ICD. A driver present at
  /data/local/tmp/libvulkan_freedreno.so is tested first and wins over all six.
  When the namespace cannot be built the shim falls back to patching the
  system library's global offset table, and that path alone loads libbase.so,
  libcutils.so, libvndksupport.so and libhardware.so from the library
  directory. The shim appends to vulkan_shim.log under the files folder of the
  data directory.
  ref: VulkanShim2/vulkan_shim.cpp:43-73,
       VulkanShim2/vulkan_shim.cpp:1010-1092,
       VulkanShim2/vulkan_shim.cpp:1099-1171,
       VulkanShim2/vulkan_shim.cpp:1186-1204,
       VulkanShim2/hook_impl.cpp:38-139,
       nethersx2-turnip v0.7 libemucore.so 0x8b473c-0x8b4768

  Resources are read out of the package itself. The library has no asset
  manager of its own and calls back into readPackageFile, readPackageFileToString
  and playSoundAsync, each taking an asset-relative name, so the game database,
  the patch archives, the interface fonts, the shader sources every backend
  compiles at startup and the achievement sounds are versioned with the build
  and never looked for on disk. The game list draws its region flags and rating
  stars from the same assets. Four of the Vulkan shader sources differ from the
  ones the package it patches carries.
  ref: nethersx2-turnip v0.7 libemucore.so 0x8348d0,
       xyz/aethersx2/android/NativeLibrary readPackageFile,
       xyz/aethersx2/android/NativeLibrary playSoundAsync

files:
  - name: ps2-0230a-20080220.bin
    path: bios/ps2-0230a-20080220.bin
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and a readable ROMVER is accepted,
      whatever its name. The 4 to 8 MB range gates the folder scan; an image
      named in the configuration skips both that range and the romdir test.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:27-28, aethersx2/pcsx2/ps2/BiosTools.cpp:235-260, nethersx2-turnip v0.7 libemucore.so 0x828e20-0x828e44 (size window), nethersx2-turnip v0.7 libemucore.so 0x829244-0x829248 (device type result discarded)"

  - name: ps2-0230a-20080220.rom1
    path: bios/ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1. Read at 0x2404000 of the EE
      memory block and truncated to 4 MB. Logged and skipped when absent.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-216, nethersx2-turnip v0.7 libemucore.so 0x8288b0-0x828a24"

  - name: ps2-0230a-20080220.rom2
    aliases:
      - "SCPH-90006_BIOS_VX_HK _230.ROM2"
    path: bios/ps2-0230a-20080220.rom2
    required: false
    max_size: 524288
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1. Read at 0x2804000 of the EE memory block and
      truncated to 512 KB. Only present on Chinese region consoles.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-216, nethersx2-turnip v0.7 libemucore.so 0x828a34-0x828ba8"

  - name: ps2-0230a-20080220.nvm
    path: bios/ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    min_size: 1024
    validation: [size]
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm, opened r+b.
      Carries the console id, the iLink id, the language and the OSD
      configuration. A 1024 byte image is written when the file is missing or
      shorter, zeroed except for a fixed iLink id and the language defaults of
      the BIOS region.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:158-214, nethersx2-turnip v0.7 libemucore.so 0x79b930-0x79ba68"

  - name: ps2-0230a-20080220.mec
    path: bios/ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    min_size: 4
    validation: [size]
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Written as
      03 06 02 00 when the file is missing or shorter than 4 bytes.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:120-144, nethersx2-turnip v0.7 libemucore.so 0x79cbd0-0x79cc20"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    size: 64
    description: "DEV9 EEPROM"
    note: >-
      Opened O_RDWR by bare name when the network adapter starts and mapped over
      64 bytes. A compiled-in image stands in when the file is missing or cannot
      be mapped.
    source_ref: "aethersx2/pcsx2/DEV9/DEV9.cpp:146-161, nethersx2-turnip v0.7 libemucore.so 0x7c5c44"

  - name: flash.dat
    required: false
    hle_fallback: true
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened rb by bare name at network adapter init and read as 1024 blocks of
      16 pages of 512 bytes plus 16 ECC bytes. The card is filled with 0xFF when
      the file is absent.
    source_ref: "aethersx2/pcsx2/DEV9/flash.cpp:76-103, nethersx2-turnip v0.7 libemucore.so 0x7c5bf0"

  - name: "<module>.irx"
    required: false
    unsourceable: "any IOP module the user points at, under no name the code expects"
    description: "IOP module injected at boot"
    note: >-
      Opened at the path the configuration holds once it is longer than three
      characters, and read into the ROM region at 0x3C0000, capped at 0x40000
      bytes. The field is empty by default and names no file of its own.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:220-233, aethersx2/pcsx2/ps2/BiosTools.cpp:327-328, nethersx2-turnip v0.7 libemucore.so 0x828bb8-0x828ca8"

