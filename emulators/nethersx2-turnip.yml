exclusion_note: >
  Left out are the libraries the package carries for the dynamic linker rather
  than for its own code. libc.so, libm.so, libdl.so, ld-android.so and
  libc++_shared.so sit beside the drivers so the namespace built over that
  directory can satisfy their DT_NEEDED, and no code path names any of them;
  android_linker_ns.o is a relocatable object nothing can open. libc++.so and
  libsync.so are named in the fallback and promote arrays but the package
  carries neither, and the promote call passes RTLD_NOLOAD, which never reads
  from disk. libnativewindow.so, libsync.so and libz.so, which every driver
  needs, come from the system through the link to the default namespace. The
  deps cache the shim would fill under cache/vulkan_deps is unreachable: the
  functions that build it have no call site and the compiler dropped their
  strings. Also left out are the assets no code path on this platform opens:
  shaders/vulkan/New and shaders/vulkan/Old, reference copies for which no path
  string exists in the library; game_controller_db.txt, whose name appears in
  neither the library nor the dex, pad input arriving through
  handleControllerButtonEvent and handleControllerAxisEvent; the seven Direct3D
  shader sources under shaders/dx11; icons/AppIconLarge.png and
  cover-placeholder.png; fonts/Roboto-Regular-copyright and
  sounds/achievements/README.txt, which are licence and credit texts; and
  dexopt/baseline.prof and baseline.profm, which the Android runtime consumes.
  Everything the emulator produces for itself under the data directory is out
  as well: memory cards as Mcd<nnn>.ps2, DEV9hdd.raw for the internal disk,
  save states, screenshots, covers, texture dumps, per-game settings, input
  profiles, the gamedb and pipeline caches, and vulkan_shim.log.
  ref: VulkanShim2/vulkan_shim.cpp:599-729, VulkanShim2/vulkan_shim.cpp:1107-1112,
       VulkanShim2/vulkan_shim.cpp:1186-1201,
       nethersx2-turnip v0.7 libvulkad.so
