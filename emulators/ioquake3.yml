notes: |
  Quake III Arena / Team Arena source port maintained by the ioquake
  team. BASEGAME = "baseq3", BASETA = "missionpack" (code/qcommon/q_shared.h
  :44,65). FS_Startup (code/qcommon/files.c:3360) scans each search path
  for pak0.pk3 through pak(NUM_ID_PAKS-1).pk3 under baseq3, and up to
  NUM_TA_PAKS paks under missionpack (code/qcommon/qcommon.h:591-593,
  NUM_ID_PAKS=9, NUM_TA_PAKS=4).

  Loaded paks are matched against hardcoded unsigned 32-bit checksums
  (code/qcommon/files.c:178-198: pak_checksums[], missionpak_checksums[]).
  These are NOT MD5 / SHA1 / CRC32 of the file; they are id's own custom
  pak checksum (sum of each lump CRC, see FS_LoadZipFile). A mismatch
  prints "WARNING: baseq3/pak0.pk3 is present but its checksum (%u) is
  not correct" (code/qcommon/files.c:3574) and keeps running: the loader
  does not refuse the file, so no md5/sha1 is written below.

  Missing paks are only fatal when neither com_standalone nor fs_basegame
  override the base game (code/qcommon/files.c:3697, 3738).

