exclusion_note: >
  Left out are the files FPseNG writes and reads back itself, which are emulator
  state rather than files a user has to obtain: fpse.ini and the per-title
  configurations under cfg, the memory cards slot1.mcd and slot2.mcd under
  FPse64/memcards, the savestates and snapshots under FPse64/sstates, the game
  list cache FPse64/filelist.txt, the recorded clips under FPse64/videos, and
  the fpselog.txt, cpulog.txt and gpulog.txt traces. gamelist.ini is left out
  with them for a different reason: it is rewritten from the package at every
  start, so a copy placed there never survives. Left out too are the covers,
  titles and game notes the application downloads into FPse64/icons,
  FPse64/titles and fpse64/infos, which are interface metadata keyed by game
  identifier, and the shipped overlay pad artwork, skin/pad.ini with its button
  and stick images, which unpacks from the package. The .sbi files downloaded
  into FPse64/sbi are left out on the ground that nothing loads them: neither
  the java nor any of the eight libraries reads that directory back, and the
  string ".sbi" appears nowhere in the native code. The disc images and their
  .cue sidecars are not emulator files. The HLE BIOS is not a file either: it is
  code, and the identification strings it answers with sit in .rodata beside the
  rest of the core messages, with no 512 KB image anywhere in the library.
  ref: res/raw fpse.ini MemCard1, Main.java:27463, Main.java:34054-34057,
       Main.java:15415-15430, libfpse.so .rodata 0x1b8d81-0x1b8dfb
