notes: |
  PlayStation emulator for Android, closed source, sold on Google Play as package
  com.emulator.fpse64 and named FPse64 until the rename. The build read here is
  1.13, versionCode 245, minSdk 23, targetSdk 33, activity
  com.emulator.fpse64.Main. Google signs the package through Play App Signing,
  CN=Android O=Google Inc. issued 2020-05-02, sha256
  5df4c204abac4d2a10c4b8f497689e28c2bfb5dc44a56081ebb4a5e1c2f1d27f, and that
  signature block travels inside the copy read here: the repackager kept the
  original apk as assets/SignatureKiller/origin.apk, whose MANIFEST.MF carries
  the sha256 of all 1278 entries of the distributed build. 1274 match byte for
  byte, among them every native library and every resource; AndroidManifest.xml,
  classes.dex and resources.arsc differ, stamp-cert-sha256 is dropped and one
  class, bin/mt/signature/KillerApplication, is added. Native code and resources
  are therefore the distributed ones and the java below is the application's own,
  minus that injection. A second copy, apkvision 1.8, is signed with the Android
  test key and ships three of the eight libraries its own core links against; it
  is read only to confirm that the preference key, the two size tests and the
  checksum constant below are the application's and not the repackager's.
  ref: com.emulator.fpse64 1.13 assets/SignatureKiller/origin.apk
       META-INF/GOOGPLAY.RSA, META-INF/MANIFEST.MF

  Two roots hold everything. The private files directory of the package is the
  one the core is given, and bios, plugin, cfg and skin are created under it
  right after the libraries load; the emulator resolves its own paths against it.
  The second is a directory named FPse64 at the root of shared storage, holding
  memcards, cheats, shaders, ogl, sbi, sstates, titles, icons, videos and
  filelist.txt. Paths below are relative to the first root unless they name the
  second.
  ref: Main.java:36420, Main.java:3004, Main.java:27329-27332,
       Main.java:27458-27459, Main.java:30411-30413

  Exactly one BIOS image is ever loaded and its full path is a setting rather
  than a name the code looks for. The Load Bios browser keeps .bin files and
  lists only those of exactly 524288 bytes, the chosen path is written to the
  preference com.emulator.fpse64.biospath and pushed into the core as string
  slot 6, and the stored path is re-checked at every start: a file that no longer
  exists or is not exactly 524288 bytes clears the preference and the session
  runs on HLE. Slot 6 receives the empty string whenever the path is empty, the
  BIOS switch is off or the launching intent carried bios=0, which is the
  documented way to ask for HLE; the shortcuts the application pins carry that
  same extra. On the core side the value is opened as given, then retried below
  bios/ under the root, so a bare name resolves there; a hit is read as one block
  of 0x80000 bytes after "Loading '%s'...", and a miss reports "Can't load
  biosfile '%s', switching to HLE", sets the HLE bit and writes
  "CEX-3000/1001/1002 by K.S.", "System ROM Version 2.2 12/04/95 A" and the Sony
  copyright line into BIOS memory, so no image is needed on its own. The FAQ on
  the emulator's own site states that a file named scph1001.bin is recommended
  and is not distributed with the emulator.
  ref: Main.java:1169, Main.java:21925-21927, Main.java:25833-25835,
       Main.java:9943-9977, Main.java:30177-30192, Main.java:5392-5396,
       Main.java:36446-36451, Main.java:28751-28754,
       libfpse.so 0x70e20-0x70f20, fpsece.net/faq.html

  Automatic detection recognises one dump and does it on content. Scanning
  storage, FPseNG keeps files whose lowercased name ends in .bin and whose length
  is exactly 524288, reads all 524288 bytes, sums them as signed bytes and
  accepts the file when the total is 85958, writing the path to the preference
  and turning the BIOS on. The same constant answers over NFS through isnfsbios.
  Recomputed over the collection, that sum resolves to a single image, the
  v2.2 12/04/95 A dump listed below, and to no other. The HLE path impersonates
  the same revision: its identification strings sit in .rodata beside "HLE
  enabled." and the library carries no 512 KB image of its own.
  ref: Main.java:24466-24487, Main.java:24491, Main.java:25670,
       libfpse.so .rodata 0x1b8d81-0x1b8dfb

  Emulation is split across libraries the core links against. libfpse.so lists
  libopengl, libsoft1, libspuplugin, libneon, libsdl and libnfsplugin in
  DT_NEEDED, and Main names uncompress, spuplugin, soft1, nfsplugin and opengl
  before fpse; sdl and neon are named earlier from a static block that swallows
  UnsatisfiedLinkError, the rest are not guarded. All eight ship in the package
  for arm64-v8a and no other ABI. Eighteen constants naming nine plugins296
  archives on fpse.net and fpsece.net survive in the class and nothing reads
  them, and the two archive extractors keep a branch counting eight .so members
  that no caller reaches. What getfile.php still answers, once per versionCode
  and keyed by ABI as type p64, is a blob handed to setnfspos and summed into a
  preference, not a library anything writes to disk. An OpenGL plugin picked by
  hand from the .so browser is copied over libopengl1.so under the root.
  libGLESv2, libjnigraphics, liblog, libstdc++, libdl, libm and libc are the
  Android runtime and are not files anyone supplies.
  ref: Main.java:25134-25137, Main.java:27300-27312, Main.java:9985,
       Main.java:1116-1133, Main.java:8496, Main.java:13854,
       Main.java:23615-23621, libfpse.so readelf -d

  Resources unpack through helpers that differ in one respect. The guarded one
  writes only when the target is absent, so bios/kanji.rom, fpse.ini and the
  whole skin set survive being replaced by hand, and the same rule puts
  slot1.mcd and slot2.mcd under FPse64/memcards on shared storage. The
  unguarded one truncates, so gamelist.ini is rewritten from the package at every
  start and a copy put there does not last. The shipped shaders are copied out of
  assets into FPse64/shaders once storage access is granted.
  ref: Main.java:33974-33977, Main.java:34054-34057, Main.java:34750-34753,
       Main.java:27334, Main.java:27346-27347, Main.java:27463,
       Main.java:35829-35845

  What the application fetches for itself comes from the developer's servers:
  cheat files from fpse.net/c/, per title OpenGL option files packed as
  fpse.net/o/ogl.zip, covers from fpse.net/i64/, titles from fpse.net/t/, game
  notes from fpse.net/games64/, overlay pad skins from fpse.net/s/ as
  padtemp.zip extracted into skin/, and vrback.zip extracted at the root of
  shared storage. Files named after a game identifier and ending in .sbi are
  downloaded into FPse64/sbi for the titles of one internal list; no library and
  no java path reads them back, and the string ".sbi" appears in none of the
  eight libraries.
  ref: Main.java:10505-10507, Main.java:16605, Main.java:16644,
       Main.java:11468, Main.java:11827, l0.java:82-89, Main.java:10846,
       Main.java:11014, Main.java:12555-12585, Main.java:15415-15430,
       Main.java:15489

