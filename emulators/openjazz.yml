systems: [jazz-jackrabbit]

notes: |
  Open-source reimplementation of Jazz Jackrabbit 1 (Epic MegaGames,
  1994). Reads the original DOS game data; no asset bundling in the
  engine binary.

  File lookup walks a path list (platform paths, command-line paths,
  binary directory, working directory, compiled-in DATAPATH) and opens
  the first match.
  ref: src/io/file.cpp:51-77 (File::File), src/main.cpp:186-220

  PANEL.000 is the first file opened at startup; the engine aborts with
  "Unable to find game data files" if that probe fails. The five .0FN
  fonts follow and abort startup the same way.
  ref: src/main.cpp:279-295, src/main.cpp:308-333

  Level, tileset, sprite and planet names are built by createFileName():
  LEVEL<n>.<world>, BLOCKS.<world>, SPRITES.<world>, PLANET.<world>,
  with a three-digit world extension. The episode menu enables an
  episode when LEVEL0.<world> exists for its first world (0, 3, 6, 9,
  12, 15, then 30, 33, 36 and 50).
  ref: src/util.cpp:123-193, src/jj1/jj1episodeutils.cpp:19-36,
       src/menu/gamemenu.cpp:557-566

  JJ2 engine support is experimental and gated by `ENABLE_JJ2` at build
  time (off by default); it reads JJ2's .j2l/.j2t files directly (no
  conversion step).
  ref: CMakeLists.txt:241-255, src/jj2/level/jj2level.cpp:54-67

