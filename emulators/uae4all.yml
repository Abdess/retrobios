emulator: UAE4All2
type: standalone
core_classification: community_fork
source: "https://github.com/RetroPie/uae4all2"
source_branch: retropie
upstream: "https://github.com/lubomyr/uae4all2"
profiled_date: "2026-10-20"
source_commit: "5c514dd6d8bb374bd22e2ee423bad99539207cbd"
upstream_commit: "0f919a32b6d41a04cbc766c0e6076cda9fa7a63b"
core_version: "2.3.6.2"
version_basis:
  kind: file
  path: "AndroidAppSettings.cfg"
  pattern: '^AppVersionName="([^"]+)"'
display_name: "Commodore - Amiga (UAE4All2)"
cores: [uae4all]
systems: [commodore-amiga]
verification: existence
standalone_directories:
  - "getcwd"

notes: |
  UAE4All2 is Lubomyr's Android and Pandora Amiga emulator. RetroPie builds
  its own branch (retropie), forked from lubomyr's master at 0f919a3
  (upstream_commit, their merge base), with Makefile.pi, which defines GP2X,
  PANDORA, RASPBERRY and USE_GUICHAN but not ANDROIDSDL
  (Makefile.pi:31-34, 109). The Amiga Forever lookup under
  com.cloanto.amigaforever.essentials is therefore compiled out.
  AndroidAppSettings.cfg:178 names the version 2.3.6.2.

  launchDir is the working directory (getcwd, src/main.cpp:219), and the
  Kickstarts and rom.key are read from launchDir/kickstarts/
  (src/main.cpp:95-111). Paths below are relative to the working directory.
  RetroPie starts the emulator in its install directory and links
  kickstarts/ there to the BIOS directory's amiga/ folder
  (scriptmodules/emulators/uae4all.sh, configure_uae4all).

  The kickstart choice indexes kickstarts_rom_names and extended_rom_names
  (src/memory.cpp:34-35): 0 kick12.rom, 1 kick13.rom, 2 kick20.rom,
  3 kick31.rom, 4 the AROS pair. The default is 1 (src/main.cpp:1). A missing
  file falls back to kick.rom in the working directory (src/main.cpp:95-103).
  The menu refuses to start or reset the machine until the selected file
  exists (src/menu_guichan/menu_guichan.cpp:74-101, 210-214, 489-493), so one
  of the five ROMs has to be present. The AROS pair ships in the source tree
  (AndroidData/aros20140110.zip) and RetroPie unpacks it into the BIOS
  folder, which lets the emulator start without a Commodore ROM.

  read_kickstart (src/memory.cpp:795-830) accepts 8 KB (A1000 bootstrap),
  half the ROM space (mirrored) or the full size. A Kickstart checksum
  mismatch only writes a log line (src/memory.cpp:778-793). No hash is
  checked. A ROM starting with AMIROMTYPE1 is decoded with rom.key
  (src/memory.cpp:732-776).

  The data/ folder (GUI fonts, keyboard and menu images, click.wav) is
  unpacked by RetroPie from AndroidData/data.zip and
  AndroidData/guichan26032014.zip in the source tree. It belongs to the
  program and is not listed.

files:
  - name: "kick13.rom"
    path: "kickstarts/kick13.rom"
    system: commodore-amiga
    description: "Kickstart 1.3, the default selection"
    required: false
    source_ref: "upstream src/memory.cpp:34, source src/main.cpp:1, source src/main.cpp:95-103"

  - name: "kick12.rom"
    path: "kickstarts/kick12.rom"
    system: commodore-amiga
    description: "Kickstart 1.2"
    required: false
    source_ref: "upstream src/memory.cpp:34"

  - name: "kick20.rom"
    path: "kickstarts/kick20.rom"
    system: commodore-amiga
    description: "Kickstart 2.0"
    required: false
    source_ref: "upstream src/memory.cpp:34"

  - name: "kick31.rom"
    path: "kickstarts/kick31.rom"
    system: commodore-amiga
    description: "Kickstart 3.1"
    required: false
    source_ref: "upstream src/memory.cpp:34"

  - name: "aros-amiga-m68k-rom.bin"
    path: "kickstarts/aros-amiga-m68k-rom.bin"
    bundled: true
    system: commodore-amiga
    description: "AROS Kickstart replacement, main ROM (build of 2014-01-10)"
    required: false
    size: 524288
    sha1: "f930eb22ab62fb3c6990e95c6ae2bf4d700c849f"
    md5: "8c9e0e3b3686c362ccf2dfd8a86669b2"
    crc32: "69bf6f2b"
    source_ref: "upstream src/memory.cpp:34"
    note: "Hashes are of the file in AndroidData/aros20140110.zip in the source tree. RetroPie unpacks that zip into the BIOS folder on install."

  - name: "aros-amiga-m68k-ext.bin"
    path: "kickstarts/aros-amiga-m68k-ext.bin"
    bundled: true
    system: commodore-amiga
    description: "AROS Kickstart replacement, extended ROM (build of 2014-01-10)"
    required: false
    size: 524288
    sha1: "cc5404e22099ca4064622bb836db439589e378b4"
    md5: "272c1306032674b4fa120d56a0b1b99a"
    crc32: "6aa2b4d2"
    source_ref: "upstream src/memory.cpp:35, source src/memory.cpp:832-878"
    note: "Loaded with the AROS main ROM only. Hashes are of the file in AndroidData/aros20140110.zip in the source tree."

  - name: "rom.key"
    path: "kickstarts/rom.key"
    system: commodore-amiga
    description: "Cloanto key for AMIROMTYPE1 encrypted Kickstarts"
    required: false
    source_ref: "upstream src/main.cpp:106-111, source src/memory.cpp:732-776"

  - name: "kick.rom"
    path: "kick.rom"
    system: commodore-amiga
    description: "Custom Kickstart, the file the custom choice opens until the user picks another"
    required: false
    source_ref: "source src/gp2x/menu/menu_config.cpp:139, source src/gp2x/menu/menu_config.cpp:1243-1246, source src/menu_guichan/menu_guichan.cpp:91-99, source src/menu_guichan/menu_guichan.cpp:1004-1006, source src/main.cpp:100-104"
    note: "Read from the working directory. default_prefs also falls back to it when the selected Kickstart is missing from kickstarts/."

  - name: "rom.key"
    path: "rom.key"
    system: commodore-amiga
    description: "Cloanto key, read from the working directory when kickstarts/rom.key is absent"
    required: false
    source_ref: "source src/main.cpp:106-111, source src/memory.cpp:732-776"
