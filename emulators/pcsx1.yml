emulator: PCSX1
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/pcsx1-libretro"
upstream: "https://github.com/notaz/pcsx_rearmed"
profiled_date: "2026-03-24"
source_commit: "35dabb85ff3af6825820f54090d344945f65d24e"
upstream_commit: "8b6c163575e6ce9a0537553e0d4ed4225315955e"
core_version: "r22"
version_basis:
  kind: file
  path: "frontend/libretro.c"
  pattern: 'info->library_version\s+=\s+"([^"]+)'
display_name: "Sony - PlayStation (PCSX1)"
cores: [pcsx1]
systems: [sony-playstation]
notes: >
  Fork of PCSX-ReARMed targeting general PC hardware. The last commit on libretro/pcsx1-libretro is from 2018-02-11.
  HLE BIOS built-in: if no BIOS file found, core warns and falls back to HLE automatically.
  BIOS search order: scph1001.bin, scph5501.bin, scph7001.bin by exact filename, then scans system
  directory for any file matching "scph*" (case-insensitive) with size == 512 KB.
  No region detection, no hash validation. First valid BIOS found is used regardless of region.
  .info declares scph5500/5501/5502 but code explicitly searches scph1001/5501/7001 first.

groups:
  bios:
    required: false

files:
  - name: "scph1001.bin"
    description: "SCPH-1001 (v2.2 12-04-95 A)"
    group: bios
    priority: 1
    hle_fallback: true
    size: 524288
    validation: [size]
    source_ref: "source frontend/libretro.c:1229 (bios[0]), :1181 (size check)"
    evidence:
      hle_fallback: ["2026-10-27-c535a6e54730"]
      validation: ["2026-10-27-c535a6e54730", "2026-10-27-dd7185b51e4e"]

  - name: "scph5501.bin"
    description: "SCPH-5501 (v3.0 11-18-96 A)"
    group: bios
    priority: 2
    hle_fallback: true
    size: 524288
    validation: [size]
    source_ref: "source frontend/libretro.c:1229 (bios[1]), :1181 (size check)"
    evidence:
      hle_fallback: ["2026-10-27-c535a6e54730"]
      validation: ["2026-10-27-c535a6e54730", "2026-10-27-fb7efd4c1af6"]

  - name: "scph7001.bin"
    description: "SCPH-7001 (v4.1 12-16-97 A)"
    group: bios
    priority: 3
    hle_fallback: true
    size: 524288
    validation: [size]
    source_ref: "source frontend/libretro.c:1229 (bios[2]), :1181 (size check)"
    evidence:
      hle_fallback: ["2026-10-27-c535a6e54730"]
      validation: ["2026-10-27-c535a6e54730", "2026-10-27-5fccbc0c830b"]

  # Dynamic scan fallback: after the 3 named files, find_any_bios() scans the
  # system directory for any file starting with "scph" (case-insensitive) that
  # is exactly 512 KB. This covers scph5500.bin, scph5502.bin, scph3000.bin, etc.
