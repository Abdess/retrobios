notes: |
  Unfinished Picross puzzle game, part of the libretro-samples repository.
  The libretro API is its only target, with no separate upstream.

  supports_no_game true (tests/cruzes/cruzes.c:772), valid_extensions "" (tests/cruzes/cruzes.c:749).
  Puzzle grid hardcoded in retro_init (tests/cruzes/cruzes.c:706-717) via load_challenge.
  retro_load_game (tests/cruzes/cruzes.c:728-732) sets pixel format and returns true.
  No file I/O, no RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY call.

  Font data (Carlito-Regular.ttf) compiled in via ttf2c (font10.h, font16.h,
  font24.h).

files: []

exclusion_note: >
  Game core with no external file dependencies. All assets compiled in.

