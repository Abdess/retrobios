emulator: UZDoom
type: standalone + libretro
core_classification: game_engine
source:
  standalone: "https://github.com/UZDoom/UZDoom"
  libretro: "https://git.libretro.com/libretro/uzdoom"
profiled_date: "2026-11-09"
source_commit:
  standalone: "7910df7102033fd7754a317f3254f24101135926"
  libretro: "829f29959d01203c1971f75ee784912edc2297e8"
core_version:
  standalone: "5.0.3"
  libretro: "5.1.0-pre"
version_basis:
  standalone:
    kind: tag
    tag: "5.0.3"
    distance: 0
  libretro:
    kind: file
    path: "src/version.h"
    pattern: '#define\s+VERSIONSTR\s+"([^"]+)"'
display_name: "UZDoom"
cores:
  - uzdoom
systems: [doom, heretic, hexen, strife, chex]

notes: |
  Doom-engine source port continued from GZDoom under a new name. The
  engine resource archive is uzdoom.pk3, the default soundfont
  uzdoom.sf2 and the configuration uzdoom.ini. The IWAD definitions in
  iwadinfo.txt are the ones GZDoom carries, line for line.

  Engine resources (built from wadsrc*/static/ via add_pk3):
    uzdoom.pk3            BASEWAD, searched by BaseFileSearch
                          ref: src/version.h:85, src/d_main.cpp:4148-4151
    game_support.pk3      OPTIONALWAD, filter/game assets per IWAD
                          ref: src/version.h:87, src/d_main.cpp:4205
    lights.pk3            dynamic light definitions
    brightmaps.pk3        brightmap textures
    game_widescreen_gfx.pk3  widescreen HUD/menu replacements
  The last three are skipped for shareware IWADs and with -noextras.
  ref: src/d_main.cpp:2392-2412

  Game data is a user-supplied IWAD. The search directories are scanned
  for the file names of the iwadinfo.txt Names block and for any .iwad,
  .ipk3 or .ipk7 file. Each candidate is then identified by its lumps,
  not by its name. The Names block also lists doomu.wad, doom1.wad,
  bfgdoom.wad, bfgdoom2.wad, freedoomu.wad, freedoom.wad, hereticsr.wad,
  heretic1.wad, hexendemo.wad, hexdemo.wad, strife0.wad and strife.wad.
  ref: wadsrc_extra/static/iwadinfo.txt:650-703, src/d_iwad.cpp:518-546

  Startup refuses to run if BASEWAD (uzdoom.pk3) is absent, and stops
  with "Cannot find a game IWAD" when no candidate is identified.
  ref: src/d_main.cpp:4148-4151, src/d_iwad.cpp:816

  RetroBat starts uzdoom.exe with -iwad on the IWAD it finds in the ROM
  folder and writes that folder into the IWADSearch.Directories section
  of uzdoom_portable.ini.

  Hashes of the engine resources are those of the files in the 5.0.3
  Windows release archive (Windows-UZDoom-Release-x86_64.zip, sha256
  3a41131845415bc4bb5474f8de301a77736bd858e2ab489926325a2675e8263f,
  built from this commit). They are rebuilt with every release.

  The libretro build lives on the libretro branch of libretro's copy of
  the project, which carries UZDoom trunk of 2026-10-28 (67bdb4b, after
  the 5.0.3 branch point) and adds src/common/platform/libretro/. The core
  takes a .wad or .iwad by full path and starts the engine with -iwad on
  it, the configuration uzdoom-libretro.ini and the savegames in the save
  directory, and $PROGDIR set to the system directory. A frontend without
  a system directory or a save directory gets no game.
  ref: src/common/platform/libretro/retro_core.cpp:57-66,
       src/common/platform/libretro/retro_core.cpp:296-299,
       src/common/platform/libretro/retro_core.cpp:317-331,
       src/common/platform/libretro/retro_paths.cpp:4-17

  uzdoom.pk3 and game_support.pk3 are compiled into the libretro binary
  and served under uzdoom-internal:/ whenever BaseFileSearch asks for
  those names, so no copy on disk is read. The other engine resources
  are not: lights.pk3, brightmaps.pk3 and game_widescreen_gfx.pk3 are
  looked for in $PROGDIR first, and the soundfont directories are
  $PROGDIR/soundfonts and $PROGDIR/fm_banks, both below the system
  directory.
  ref: src/common/platform/libretro/embedded_pk3.S.in:1-39,
       src/common/platform/libretro/retro_resources.h:7-26

  The IWAD is the content, and the files an IWAD entry loads from its own
  folder (voices.wad, extras.wad, soundtrack, nerve.wad, nerveunity.wad)
  are read beside it. A Required IWAD (hexen.wad under hexdd.wad,
  strife1.wad under sve.wad) and id24res.wad are looked for in the IWAD
  search paths, which hold "." and $PROGDIR and never the content folder.

