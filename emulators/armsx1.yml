  - name: "<expansion>.rom"
    required: false
    config_key: "paths.expansion_rom"
    max_size: 524288
    unsourceable: "any expansion port ROM the user points at, under no name and no version the code expects"
    description: "Expansion port ROM image"
    note: >-
      Read by the psxe frontends into the 512 KB region at 0x1f000000, which
      is filled with 0xff when no path is set. A path that is set and cannot be
      opened fails psx_init. The Android settings only display the key, and
      the PSX Lab adapter never reads it.
    source_ref: "psx/dev/exp1.c:12-44, psx/dev/exp1.h:9, psx/psx.c:312-313, frontend/config.c:93, frontend/main.cpp:2569-2570, android/app/src/main/java/com/armsx2/ui/settings/Ps1AdvancedTab.kt:102-108"
