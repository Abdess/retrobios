notes: |
  PlayStation emulator forked from psxe. The released application is the
  Android build, com.nanodata.armsx, versionName 0.3.18-dma at this revision.
  That build runs the PSX Lab engine from the psxlab tree, through the
  ArmSxBackend adapter. The SDL desktop, iOS, UWP, web and PSVita frontends
  in the same tree still build on psxe. The release tags 0.1.5 to 0.3.6 all
  sit on 99b3081 of the main branch, a 2026-09-05 tree that carries none of
  this code. The version is the versionName android-compose builds.
  ref: android/app/build.gradle:87-90, PSXLAB-BACKEND.md:1-6

  Android accepts a BIOS only through its importer. The setup wizard, the
  BIOS manager and its folder scan all ask getBiosInfoFromFd, which requires
  exactly 512 KB and then either the OpenBIOS signature at 0x78 or one of 25
  MD5 values. A recognised file is copied into <external files>/bios under
  its own name. The wizard does not leave the BIOS page until one is
  recognised.
  ref: android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:1297-1307,
       android/app/src/main/java/com/armsx2/core/Ps1BiosProbe.java:16-79,
       android/app/src/main/java/com/armsx2/ui/onboarding/OnboardingViewModel.kt:183-203,
       android/app/src/main/java/com/armsx2/ui/onboarding/OnboardingViewModel.kt:250-255,
       android/app/src/main/java/com/armsx2/ui/bios/BiosManagerViewModel.kt:172-187

  At launch the adapter lists the 512 KB files of the BIOS folder, the folder
  of the BIOS the wizard selected or <external files>/bios, sorted by name.
  It loads the file named by Filenames/BIOS, which the host sets to the
  per-game BIOS or the wizard's file, else the first of the list, and refuses
  anything but 512 KB. No hash is checked at that point, and with no file the
  launch stops with "A 512 KiB PlayStation BIOS is required". The settings
  store still writes the MD5 match for preferred_model as [bios].resolved_file
  and an empty override_file, and the adapter reads neither for the choice.
  ref: psxlab/app/src/main/java/dev/psxlab/ArmSxBackend.java:149-168,
       psxlab/app/src/main/java/dev/psxlab/ArmSxBackend.java:338,
       android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:124-151,
       android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:225,
       android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt:268-269,
       android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt:1027-1038,
       android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt:2850-2856,
       android/app/src/main/java/com/armsx2/config/Ps1SettingsStore.kt:178-197,
       android/app/src/main/java/com/armsx2/config/Ps1SettingsStore.kt:416-419

  The psxe frontends take [bios].override_file or -b, by default bios.bin
  under SDL_GetPrefPath("nanodata", "armsx"), when that file exists.
  Otherwise they scan [bios].search_path, bios by default, for .bin and .rom
  files and return the first whose stem normalises to preferred_model, else
  one named bios.bin, else the override path unchanged. psx_bios_load refuses
  anything but 512 KB or the 1 MB SCPH-5903 image and checks no hash.
  ref: frontend/config.c:54-57, frontend/config.c:279-352,
       frontend/config.c:1384-1405, frontend/config.c:1541-1560,
       frontend/main.cpp:2555-2561, psx/dev/bios.c:22-75

