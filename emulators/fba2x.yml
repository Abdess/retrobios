notes: |
  Recalbox's standalone ARM port of Final Burn Alpha, lineage pifba (originally
  by Franxis / Oopsware for the GP2X, modernised to SDL2 by Recalbox). The
  binary is installed as fba2x and runs with a ZIP path on the command line
  (rpi/main.cpp:187 — "Usage: fba2x <path to rom><shortname>.zip").

  BIOS and ROM archives are resolved relative to szAppRomPath, hardcoded to
  "roms/" in rpi/bzip.cpp:4 and overridden only through the rom path argument.
  BzipOpen (rpi/bzip.cpp:355-394) iterates BurnDrvGetZipName(z) for every
  BIOS/parent slot and opens "<roms/><name>" directly — no fallback
  directory walking.

  Shared BIOS ROM sets flagged BDF_BOARDROM in the driver source:
    - neogeo (burn/neogeo/d_neogeo.cpp)  — SNK Neo Geo system BIOS
    - pgm    (burn/pgm/d_pgm.cpp)        — IGS PGM board BIOS

  CPS1 and CPS2 titles embed their program/encryption ROMs directly in each
  game archive — no CPS board BIOS zip. CPS3 (burn/cps3/d_cps3.cpp) carries
  the SH-2 BIOS as a BRF_BIOS member of each game's archive (red-earth,
  jojo, sfiii, etc.), so there is no shared cps3.zip here either.

  pifba is a FROZEN snapshot of Final Burn Alpha 0.2.97.x with ARM-specific
  speedhacks (NEOGEO_HACKS, OOPSWARE_FIX, USE_SPEEDHACKS) and a reduced driver
  set compared with upstream FBA / FBNeo: 32 BIOS entries in d_neogeo.cpp vs
  ~45 in modern FBNeo, no newer Neo Geo UniBios revisions (uni-bios.10 through
  uni-bios.13 are commented out), no Hyper Street Fighter 2 refresh, and no
  SNK Hyper NeoGeo 64. Keep this separate from fbalpha2012 (libretro port of
  the same base) because it does not share binaries or load behaviour.

