emulator: PPSSPP 1.5.4
type: standalone
core_classification: frozen_snapshot
source: "https://github.com/hrydgard/ppsspp"
profiled_date: "2026-10-20"
source_commit: "a1e74d0d4f89ba3fa2d4fe64bac7a0fa16fc146f"
pin_frozen: "RetroPie, the only platform that ships it, builds the v1.5.4 tag at this commit (RetroPie scriptmodules/emulators/ppsspp-1.5.4.sh:16). Later releases are packaged separately as ppsspp."
pin_build:
  - platform: retropie
    repo: "https://github.com/RetroPie/RetroPie-Setup"
    revision: "46128cd252cdecae852a4d0bafa2aaf9d03ab563"
    path: "scriptmodules/emulators/ppsspp-1.5.4.sh"
    variable: rp_module_repo
    value: "git https://github.com/hrydgard/ppsspp.git v1.5.4"
core_version: "v1.5.4"
version_basis:
  kind: tag
  tag: "v1.5.4"
  distance: 0
display_name: "Sony - PlayStation Portable (PPSSPP 1.5.4)"
mode: standalone
cores:
  - ppsspp-1.5.4
systems:
  - sony-psp

data_root:
  linux:
    path: "$XDG_CONFIG_HOME/ppsspp"
    source_ref: "UI/NativeApp.cpp:354-362"
    note: "~/.config/ppsspp when XDG_CONFIG_HOME is unset. The memory stick root, where a Sony font placed under PSP/flash0/font/ overrides the replacement. The assets below sit beside the binary."

notes: |
  PPSSPP at the v1.5.4 tag, offered by RetroPie on VideoCore Raspberry Pi
  systems only. The package reuses the ppsspp build steps: cmake
  builds PPSSPPSDL and copies assets/ beside it, both are installed to
  the package directory, and PPSSPPSDL is launched from there with the
  ROM. ~/.config/ppsspp, the memory stick root, is moved into the psp
  configuration directory.

  The PSP kernel is high level emulated, so no firmware image is read.

  On Linux, assets are read through the VFS from <binary dir>/assets/,
  then the binary directory, /usr/share/ppsspp/assets/ and ./assets/.
  flash0: is <binary dir>/assets/flash0/. Paths below are written under
  ppsspp-1.5.4/, which stands for the binary's directory, except zh_gb.pgf,
  which ships with nothing and is written at the memory stick override
  path, relative to the memory stick root named in data_root.
  ref: UI/NativeApp.cpp:329-335, UI/NativeApp.cpp:356-363,
       Core/HLE/sceFont.cpp:643-644

  The 19 font slots of the sceFont registry are filled from the game's
  USRDIR, then ms0:/PSP/flash0/font/ on the memory stick, then flash0:.
  The repository ships open replacements for jpn0.pgf, kr0.pgf and
  ltn0.pgf to ltn15.pgf. zh_gb.pgf, the Chinese font, is marked
  ignoreIfMissing and is not shipped. A Sony font placed under the memory
  stick override path takes precedence over the replacement.
  ref: Core/HLE/sceFont.cpp:88-108, Core/HLE/sceFont.cpp:638-698

  The PPGe atlas draws the emulated system dialogs. The UI atlas,
  langregion.ini and gamecontrollerdb.txt serve the host program, as do
  the translations under assets/lang and the post processing shaders
  under assets/shaders.
  ref: Core/Util/PPGeDraw.cpp:186-190, UI/NativeApp.cpp:630-633,
       Core/Config.cpp:270-280, SDL/SDLJoystick.cpp:23-36,
       ext/native/i18n/i18n.cpp:67, GPU/Common/PostShader.cpp:38

