notes: |
  Retro game engine for Python by Takashi Kitao. The engine is a Python
  package with a Rust-based extension (crates/pyxel-core, built via maturin).
  Pyxel programs are either .py scripts that import pyxel or self-contained
  .pyxapp bundles (zip archives containing a startup script plus assets).

  There is no external BIOS, firmware, or retail data to collect. Everything
  the engine needs ships inside the Python wheel:
    python/pyxel/: Python API, fonts, shader, examples
    crates/pyxel-core/: Rust engine (compiled as pyxel_extension)
    crates/pyxel-platform/: SDL2 wrapper
    crates/pyxel-wrapper/: Python to Rust glue (PyO3)

  Batocera's packaging (package/batocera/emulators/python-pyxel/python-pyxel.mk)
  installs the wheel into site-packages, drops the examples, and provides a
  pyxel.keys evmapy layout. The content run by Pyxel is the user's .pyxapp or
  .py file, which plays the role of a cartridge. Those are user content, not
  pack contents.

  The engine refuses nothing on startup: a bare `pyxel init` plus a user
  script is enough to run.

