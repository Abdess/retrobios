emulator: yaps2
type: standalone + libretro
core_classification: community_fork
bios_mode: agnostic
source: "https://github.com/yaps2/yaps2"
upstream: "https://github.com/PCSX2/pcsx2"
profiled_date: "2026-09-17"
source_commit: "57ea93c0ce8306063b31fe6658dab6b492bbedfe"
upstream_commit: "342db51523f288c5ced20f5be3c679f46472cc45"
core_version: "Git"
display_name: "Sony - PlayStation 2 (yaps2)"
cores: [yaps2]
systems: [sony-playstation-2]

bios_directory: "pcsx2/bios/"
resources_directory: "pcsx2/resources/"

data_directories:
  - ref: yaps2-resources
    destination: "pcsx2/resources"
    source_ref: "pcsx2-libretro/Main.cpp:157-158, pcsx2/Pcsx2Config.cpp:2399-2413"

notes: |
  PlayStation 2 emulator, a GPL-3.0 fork of PCSX2 for arm64 Linux handhelds:
  native AArch64 EE, IOP and VU recompilers, a persisted VU program cache,
  libmali and Adreno gates in the Vulkan backend. One tree builds the Qt
  desktop application, an SDL3 kmsdrm frontend (yaps2-sdl) and a libretro core
  (yaps2_libretro.so); the nightly release ships all three for arm64 Linux
  plus a macOS build. The fork is discontinued and its recompilers moved to
  ARMSX2; main is the final state. The tree is PCSX2 at 342db515 (2026-06-19)
  plus 335 fork commits, and bin/resources is byte for byte that PCSX2
  revision.
  ref: README.md:1-3, CMakeLists.txt:51-53, CMakeLists.txt:92-110,
       cmake/BuildParameters.cmake:16-21, .github/workflows/nightly_release.yml:104-118

  The libretro core keeps everything under <system>/pcsx2: AppRoot and
  DataRoot are that directory, Resources is pcsx2/resources, Settings is
  pcsx2/inis, and LoadStartupSettings derives bios, memcards, cheats, patches,
  textures, gamesettings, cache, snaps, sstates, logs, covers, inputprofiles
  and videos from DataRoot with the PCSX2 defaults. The core writes its own
  yaps2-libretro.ini and secrets.ini there. The renderer is forced to Vulkan
  through the frontend's context negotiation interface, the SDL input source
  is switched off, and audio goes out through the libretro batch callback.
  ref: pcsx2-libretro/Main.cpp:145-165, pcsx2-libretro/Main.cpp:196-209,
       pcsx2-libretro/Main.cpp:213-223, pcsx2-libretro/Main.cpp:1489-1521,
       pcsx2/Pcsx2Config.cpp:2304-2318, pcsx2/Pcsx2Config.cpp:2330-2346,
       pcsx2/VMManager.cpp:557-561

  The standalone builds resolve resources beside the binary, or under the
  share/PCSX2 data directory of a PACKAGE_MODE install, and the data directory
  as YAPS2 under the platform configuration root: Documents on Windows,
  $XDG_CONFIG_HOME or ~/.config on Linux, Library/Application Support on
  macOS, or beside the binary in portable mode. bios, memcards, cheats,
  patches and the rest sit under that data directory. The SDL frontend keeps
  its ini at inis/PCSX2.ini, forces the Vulkan renderer, SDL audio and SDL
  input, and exits at startup when the resources directory or
  Roboto-Regular.ttf is missing.
  ref: pcsx2/Pcsx2Config.cpp:2159-2204, pcsx2/Pcsx2Config.cpp:2227-2302,
       cmake/BuildParameters.cmake:251-257, pcsx2-sdl/Main.cpp:114-137,
       pcsx2-sdl/Main.cpp:150-160, pcsx2-sdl/Main.cpp:176-189,
       pcsx2-qt/QtHost.cpp:1343-1346

  A BIOS image is required. VMManager::Initialize calls LoadBIOS before
  opening the CDVD, and a false return is a startup failure; only a GS dump
  replay skips it. In the libretro core that failure ends the CPU thread and
  no frame is ever presented. Detection is by content: LoadBIOS opens the
  image named by Filenames/BIOS, or when that is empty or absent scans the
  bios folder for any file between 4 and 8 MB whose romdir carries a RESET
  entry followed by a readable ROMVER. The fifth ROMVER character gives the
  zone among Japan, USA, Europe, Asia, China, T10K, COH-H, Test and Free, an
  EXTINFO entry supplies the serial. No name and no hash is matched. The image
  is read into the 4 MB ROM region and truncated to it; one shorter than
  2465792 bytes turns off the OSDSys parameter HLE.
  ref: pcsx2/VMManager.cpp:1444-1461, pcsx2-libretro/Main.cpp:670-680,
       pcsx2/ps2/BiosTools.cpp:16-17, pcsx2/ps2/BiosTools.cpp:80-197,
       pcsx2/ps2/BiosTools.cpp:258-282, pcsx2/ps2/BiosTools.cpp:317-369,
       pcsx2/Pcsx2Config.cpp:2100-2106

  The core option yaps2_bios lists the files of <system>/pcsx2/bios whose name
  ends in .bin, sorted, behind an auto entry; auto writes an empty
  Filenames/BIOS and leaves the choice to the folder scan, a listed name is
  written as is. The libretro boot always sets fast_boot.
  ref: pcsx2-libretro/Main.cpp:937-940, pcsx2-libretro/Main.cpp:989-1039,
       pcsx2-libretro/Main.cpp:1237-1243, pcsx2-libretro/Main.cpp:1482

  Companions derive from the selected image. rom1 and rom2 are tried as the
  full name plus extension, then with the extension replaced, opened
  case-insensitively, copied to 4 MB regions and skipped with a console line
  when absent. The nvm is read at the replaced extension and rebuilt in memory
  with region and language defaults when missing, short or blank; the mec is
  read the same way and written back as 0x00020603 when it cannot be read. No
  EROM path exists. The IRX injection at 0x1630 reads EmuConfig.CurrentIRX,
  which is set at runtime only and assigned by nothing in this tree.
  ref: pcsx2/ps2/BiosTools.cpp:214-241, pcsx2/ps2/BiosTools.cpp:366-367,
       pcsx2/MemoryTypes.h:12-14, pcsx2/CDVD/CDVD.cpp:46-50,
       pcsx2/CDVD/CDVD.cpp:136-205, pcsx2/ps2/BiosTools.cpp:384-385,
       pcsx2/Config.h:1443-1445, pcsx2/R3000AInterpreter.cpp:219

  Nothing from the resources folder is compiled into the binaries. Every
  resource is read at its own name under EmuFolders::Resources, and
  GetOverridableResourcePath lets a copy under UserResources take precedence.
  The libretro core ships as a bare shared object, so the user supplies
  <system>/pcsx2/resources from a yaps2 build; the SDL and Qt packages carry
  the folder beside the binary.
  ref: pcsx2/Pcsx2Config.cpp:2399-2413, pcsx2-libretro/Main.cpp:157-158,
       pcsx2-sdl/CMakeLists.txt:29-33, .github/workflows/linux_build_libretro.yml:139-150

  Missing resources are not uniformly survivable. The three fonts LoadFontData
  reads fail ImGuiManager::Initialize, which fails OpenGSDevice and the VM
  boot. Roboto-Regular.ttf is loaded by the frontends: the SDL frontend exits
  without it, the libretro core only logs a warning, but with no standard
  font AddTextFont returns null and AddImGuiFonts fails the same way. Every
  Vulkan shader source is read in GSDeviceVK::Create, cas.glsl and its two
  includes with the others, and any read failure fails the device; the
  OpenGL backend behaves the same except that a missing cas.glsl only turns
  sharpening off. Vulkan is the only backend the libretro core presents
  through; the OpenGL device is what the software renderer opens when the
  first Vulkan GPU is Intel or a software rasterizer, and what the standalone
  builds open when OpenGL is selected. Direct3D sources are read by Windows
  builds only, which the libretro target excludes. The databases, the patch
  archive, the controller mappings, the sounds and the interface artwork
  degrade instead.
  ref: pcsx2/ImGui/ImGuiManager.cpp:148-153, pcsx2/ImGui/ImGuiManager.cpp:205-211,
       pcsx2/ImGui/ImGuiManager.cpp:472-524, pcsx2/ImGui/ImGuiManager.cpp:598-637,
       pcsx2/ImGui/ImGuiManager.cpp:772-790, pcsx2-libretro/Main.cpp:177-193,
       pcsx2/GS/GS.cpp:154-172, pcsx2/GS/GS.cpp:386-408,
       pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:2308-2351,
       pcsx2/GS/Renderers/OpenGL/GSDeviceOGL.cpp:577-581,
       pcsx2/GS/GSUtil.cpp:276-311, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:2240-2270,
       CMakeLists.txt:108-110

  The fullscreen interface and its textures are opened by the SDL and Qt
  frontends, and by the achievements client when it shows a login or a
  notification; the libretro core never opens it on its own, and its
  achievements stay off unless yaps2-libretro.ini enables them. Achievement
  sounds play from the resources folder when the sound effects are enabled
  and no custom sound is set.
  ref: pcsx2-sdl/Main.cpp:746, pcsx2-qt/QtHost.cpp:163,
       pcsx2/Achievements.cpp:256-260, pcsx2/VMManager.cpp:423-424,
       pcsx2/ImGui/FullscreenUI.cpp:321-345, pcsx2/Achievements.cpp:942-951

  The Qt build reads a per-script interface font by filename, first under
  UserResources then under the resources folder, and offers to download the
  first entry of the script table into UserResources/fonts from the PCSX2
  runtime-resources release when neither holds it. Only the Latin and emoji
  entries are shipped. Compiled .qm translations are read from a translations
  folder beside the Qt binary, built from the .ts sources at build time.
  ref: pcsx2-qt/Translations.cpp:314-371, pcsx2-qt/Translations.cpp:414-424,
       pcsx2-qt/Translations.cpp:541-549, pcsx2-qt/Translations.cpp:624-650,
       pcsx2-qt/QtHost.cpp:64-65, pcsx2-qt/Translations.cpp:133-171

  Files the emulator produces rather than reads from a distribution: memory
  cards, save states, snapshots, the shader caches and the persisted VU
  program cache under cache/vu_jit, the game list cache, the DEV9 HDD image
  named in the ini. Per-game user files keep the PCSX2 layout under the data
  directory: cheats and patches as <serial>_<crc>.pnach, which the libretro
  option yaps2_cheats enables from <system>/pcsx2/cheats,
  gamesettings/<serial>_<crc>.ini, textures/<serial>/replacements.
  ref: pcsx2/arm64/microVU_ProgCache-arm64.inl:33-40,
       pcsx2/arm64/microVU_ProgCache-arm64.inl:452-462, pcsx2/Patch.cpp:320-355,
       pcsx2-libretro/Main.cpp:945-947, pcsx2-libretro/Main.cpp:1245-1247,
       pcsx2/DEV9/DEV9.cpp:86-94

files:
  - name: ps2-0230a-20080220.bin
    path: pcsx2/bios/ps2-0230a-20080220.bin
    standalone_path: bios/ps2-0230a-20080220.bin
    agnostic: true
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and ROMVER is accepted, whatever its
      name. The 4 to 8 MB range gates the folder scan; an image named in the
      configuration skips that range. The libretro option list only shows
      names ending in .bin. Read into the 4 MB ROM region and truncated to
      it. Shorter than 2465792 bytes disables the OSDSys parameter HLE.
    source_ref: "pcsx2/ps2/BiosTools.cpp:16-17, pcsx2/ps2/BiosTools.cpp:80-197, pcsx2/ps2/BiosTools.cpp:258-294, pcsx2/ps2/BiosTools.cpp:317-369, pcsx2-libretro/Main.cpp:999-1006"

  - name: ps2-0230a-20080220.rom1
    path: pcsx2/bios/ps2-0230a-20080220.rom1
    standalone_path: bios/ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1, opened case-insensitively.
      Copied to the ROM1 region and truncated to 4 MB. Logged and skipped
      when absent.
    source_ref: "pcsx2/ps2/BiosTools.cpp:214-241, pcsx2/ps2/BiosTools.cpp:366, pcsx2/MemoryTypes.h:13"

  - name: ps2-0230a-20080220.rom2
    path: pcsx2/bios/ps2-0230a-20080220.rom2
    standalone_path: bios/ps2-0230a-20080220.rom2
    required: false
    max_size: 4194304
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1. Copied to the ROM2 region, 4 MB in this
      tree. Only Chinese region consoles carry one, so no such companion
      exists for this image.
    source_ref: "pcsx2/ps2/BiosTools.cpp:214-241, pcsx2/ps2/BiosTools.cpp:367, pcsx2/MemoryTypes.h:14"

  - name: ps2-0230a-20080220.nvm
    path: pcsx2/bios/ps2-0230a-20080220.nvm
    standalone_path: bios/ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    size: 1024
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm. Carries the
      console id, the iLink id, the MAC, the model number and the OSD
      configuration. A 1024 byte image is built in memory when the file is
      absent, short, or carries a blank config block, zeroed except for a
      fixed iLink id and the language and region defaults of the BIOS region.
    source_ref: "pcsx2/CDVD/CDVD.cpp:46-47, pcsx2/CDVD/CDVD.cpp:136-188"

  - name: ps2-0230a-20080220.mec
    path: pcsx2/bios/ps2-0230a-20080220.mec
    standalone_path: bios/ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    size: 4
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Defaults to
      0x00020603 and is written back at that path when it cannot be read.
    source_ref: "pcsx2/CDVD/CDVD.cpp:49-50, pcsx2/CDVD/CDVD.cpp:190-204"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    load_from: working_directory
    size: 64
    description: "DEV9 network adapter EEPROM"
    note: >-
      Opened read-write from the process working directory when the network
      adapter starts and mapped over 64 bytes. A compiled-in image stands in
      when the file is missing or cannot be mapped.
    source_ref: "pcsx2/DEV9/DEV9.cpp:59-70, pcsx2/DEV9/DEV9.cpp:97-158, pcsx2/VMManager.cpp:1592"

  - name: flash.dat
    required: false
    hle_fallback: true
    load_from: working_directory
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened from the process working directory at network adapter init and
      read as 1024 blocks of 16 pages of 512 bytes plus 16 ECC bytes. The
      card is filled with 0xFF when the file is absent; a short read is
      logged.
    source_ref: "pcsx2/DEV9/flash.cpp:9-16, pcsx2/DEV9/flash.cpp:62-86"

  - name: GameIndex.yaml
    path: pcsx2/resources/GameIndex.yaml
    standalone_path: resources/GameIndex.yaml
    required: false
    bundled: true
    size: 2693579
    sha1: 7efb2ed721cf0c0f0677324e09be311a8337e793
    description: "Game database"
    note: >-
      Read from the resources folder on the first serial lookup, keyed by
      serial, carrying the per-game fixes, patches and settings overrides.
      A console error when absent; no game is then matched.
    source_ref: "pcsx2/GameDatabase.cpp:39, pcsx2/GameDatabase.cpp:974-984, pcsx2/GameDatabase.cpp:1020-1034"

  - name: RedumpDatabase.yaml
    path: pcsx2/resources/RedumpDatabase.yaml
    standalone_path: resources/RedumpDatabase.yaml
    required: false
    bundled: true
    mode: standalone
    size: 1906463
    sha1: dceb4536fba7fb89452864fc512a4d071a19eae0
    description: "Disc track hash database"
    note: >-
      Loaded on the first hash lookup, which only the Qt game summary page
      performs, to tell whether a dump matches a known good one.
    source_ref: "pcsx2/GameDatabase.cpp:1081, pcsx2/GameDatabase.cpp:1131-1146, pcsx2-qt/Settings/GameSummaryWidget.cpp:322"

  - name: patches.zip
    path: pcsx2/resources/patches.zip
    standalone_path: resources/patches.zip
    required: false
    bundled: true
    category: game_data
    description: "Game patch archive"
    note: >-
      Opened read only from the resources folder when a game's patches are
      enumerated, searched for <serial>_<crc>.pnach then <crc>.pnach. Files
      in the patches and cheats folders take precedence. The widescreen and
      no-interlacing options enable the named groups it carries. Absent from
      the source tree: the Qt workflow downloads it from the PCSX2
      pcsx2_patches releases, the SDL and libretro packages ship without it.
      A failed open is reported once on screen.
    source_ref: "pcsx2/Patch.cpp:115-117, pcsx2/Patch.cpp:289-317, pcsx2/Patch.cpp:365-406, pcsx2/Patch.cpp:596-611, .github/workflows/linux_build_qt.yml:130-133"

  - name: game_controller_db.txt
    path: pcsx2/resources/game_controller_db.txt
    standalone_path: resources/game_controller_db.txt
    required: false
    bundled: true
    mode: standalone
    size: 512366
    sha1: ca84ef31b6d48c6ab9530b743da373790a4f723b
    description: "SDL controller mapping database"
    note: >-
      A copy in the data root wins, then the resources folder, and the path
      is handed to SDL as a hint; SDL falls back to its built-in mappings
      when neither exists. Read by the SDL input source, which the libretro
      core switches off.
    source_ref: "pcsx2/Input/SDLInputSource.cpp:24, pcsx2/Input/SDLInputSource.cpp:614-629, pcsx2-libretro/Main.cpp:219"

  - name: Roboto-Regular.ttf
    path: pcsx2/resources/fonts/Roboto-Regular.ttf
    standalone_path: resources/fonts/Roboto-Regular.ttf
    required: true
    bundled: true
    size: 305608
    sha1: 00d62fbdc8d5dec4c659005e116d0ba2ee63b547
    description: "Interface font"
    note: >-
      Mapped by each frontend and handed to ImGuiManager as the standard
      font. The SDL frontend exits without it; the libretro core logs a
      warning, then AddTextFont has nothing to add and ImGui setup fails with
      the GS device.
    source_ref: "pcsx2-libretro/Main.cpp:177-193, pcsx2-sdl/Main.cpp:129-137, pcsx2/ImGui/ImGuiManager.cpp:598-637, pcsx2/ImGui/ImGuiManager.cpp:772-779, pcsx2/GS/GS.cpp:154-172"

  - name: RobotoMono-Medium.ttf
    path: pcsx2/resources/fonts/RobotoMono-Medium.ttf
    standalone_path: resources/fonts/RobotoMono-Medium.ttf
    required: true
    bundled: true
    size: 86820
    sha1: 9056e59b69c6f1160fdfb92a0773f17f6307f3ad
