notes: |
  MAME 0.106 core (mame/version.c:11) under the Advance video, input and
  sound layer, with driver backports from later MAME releases and the BIOS
  and device archive names of current MAME. RetroPie builds the branch tip
  with make install (RetroPie scriptmodules/emulators/advmame.sh:39-62).

  Twenty-eight BIOS root sets registered in mame/mamedriv.c, each declared
  with BIOS, BIOSB or the NOT_A_DRIVER flag (mame/driver.h:183-187,
  526-530). bctvidbs is one of them and declares no ROM of its own
  (mame/drivers/mpu4.c:2016-2019), so it has no entry below.
  mame/drivers/macs.c:615 declares macs2bios, which mame/mamedriv.c never
  registers. Fifteen device archives are registered too, declared with
  DEVICE or DEVICEB (mame/driver.h:520-524). mame/devices/namcoc75.c
  declares a sixteenth that mame/mamedriv.c never registers. A BIOS or
  device entry cannot be run (mame/mame.c:266-270, advance/osd/emu.c:90-93).

  ROM archives are searched under dir_rom, defaulting to $home/rom:$data/rom
  on Linux and Mac OS X and to rom on DOS and Windows, in the forms
  DIR/GAME/ROM.EXT, DIR/GAME.zip/ROM.EXT and DIR/GAME/ROM.zip/ROM
  (advance/osd/fileio.c:74, doc/advmame.d:680,699-701). $home is $ADVANCE,
  or $HOME/.advance when that variable is unset (doc/advmame.d:503-509).
  RetroPie sets dir_rom to $romdir/mame-advmame:$romdir/arcade (RetroPie
  scriptmodules/emulators/advmame.sh:100). A ROM is looked up along the
  parent chain, so a child game reads its BIOS from the root set's archive.
  A ROM a driver declares with BIOS_LOAD is looked up in the named device
  archive first, under the name the device lists, then along the parent
  chain (mame/romload.h:290-296, mame/romload.c:250-268). BIOS_LOAD naming
  an unregistered archive is fatal (mame/romload.c:194-248, 1320-1321).
  Inside an archive a member is matched by name, then by its printable
  CRC32 (mame/fileio.c:1191-1201).

  No BIOS or device ROM carries ROM_OPTIONAL or a no-good-dump marker, so a
  missing one counts as an error and aborts with "required files are
  missing, the game cannot be run" (mame/romload.c:407-430, 549-552).
  Loaded ROMs are checked for exact length and against the declared CRC32
  and SHA1, both mismatches being warnings (mame/romload.c:489-533). The
  three laserdisc player programs are opened directly by name and any
  mismatch there is fatal (see their entries).

  Where a system offers several BIOS revisions, SYSTEM_BIOS_ADD names them
  and misc_bios selects one, the default being the ROM_BIOS_DEFAULT the set
  names, else entry 0 (doc/advmame.d:2142-2150, mame/romload.c:299-345).
  Only the selected revision is read, and the others share the archive as
  alternatives. Neo Geo lists MVS revisions alone, the AES, Universe and
  debug entries being commented out (mame/drivers/neogeo.c:1422-1425,
  1441-1444).

  The support files sit directly in $home or $data
  (advance/osd/fileio.c:81,88-90, advance/linux/file.c:249-256). A language
  file is read too, under whatever name misc_languagefile carries
  (advance/osd/glue.c:899-900). The project ships none, English being built
  into the binary (mame/ui_text.c:262-264). Samples and artwork are
  per-game, under dir_sample and dir_artwork. Samples are ZIP archives
  named after the driver with WAV members (mame/sound/samples.c:228-230).
  Artwork is a folder or ZIP archive named after the driver or one of its
  parents, holding default.lay and the PNG or JPEG images it names
  (mame/artwork_package.c:43-81, mame/artwork_lay.c:1615-1625). Laserdisc
  games read their disc as a CHD named in their own ROM list.

  misc_historyfile and misc_infofile were retired and are discarded when found
  in a configuration file (advance/osd/emu.c:520-521), leaving history.dat and
  mameinfo.dat unread. options.controller is pinned to zero
  (advance/osd/glue.c:892), so no controller file is read either. blitmax.dat,
  startup.dat and help.dat are compiled into the binary
  (advance/osd/video.c:1794,1802, advance/osd/ui.c:1575).

