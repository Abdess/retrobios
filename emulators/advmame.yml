  - name: hiscore.dat
    required: false
    bundled: true
    category: game_data
    system: arcade
    sha1: "23e0dec66680aa4545eafe436c23d2bf5622e32e"
    md5: "2490bad5079ec0991c23c579092cca19"
    size: 176851
    source_ref: "mame/hiscore.c:27,132-146,312, mame/mame.c:1109-1110"
    note: >-
      High score definitions, selected by misc_hiscorefile
      (advance/osd/glue.c:984,3518). Absent, hiscore_open matches no entry and
      no high score is restored or saved. support/hiscore.dat, installed by
      MAME_INSTALL_DATAFILES (advance/advance.mak:24-29). is_mem_range reads
      only "cpu:addr:len:start:end" lines under a "gamename:" header.

  - name: cheat.dat
    required: false
    bundled: true
    category: game_data
    system: arcade
    sha1: "4978ecafc4634cf20b639d8801c044dc156ab162"
    md5: "69c6bbe7194e4bc62d53764dd6c6d890"
    size: 13923773
    source_ref: "mame/cheat.c:8681,8750"
    note: >-
      Cheat definitions, selected by misc_cheatfile
      (advance/osd/glue.c:983,3516) and read only when misc_cheat is on, which
      it is not by default. Absent, the cheat menu reads "cheat database not
