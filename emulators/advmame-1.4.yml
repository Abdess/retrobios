    required: false
    category: game_data
    system: arcade
    source_ref: "src/cheat.c:8504,8681-8684"
    note: >-
      Cheat definitions, selected by misc_cheatfile
      (advance/osd/glue.c:742,2870,2922) and read only when misc_cheat is on,
