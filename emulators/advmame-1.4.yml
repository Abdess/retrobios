notes: |
  AdvanceMAME 1.4, the MAME 0.106 core (src/version.c:12) under the Advance
  video, input and sound layer. RetroPie builds the release tarball
  advancemame-1.4.tar.gz
  (RetroPie scriptmodules/emulators/advmame-1.4.sh:16), whose src/ tree is
  identical to the tag advancemame-1.4 pinned here. The RetroPie patches
  rename the configuration file to advmame-1.4.rc, adjust the Pi
  framebuffer output and add extern qualifiers
  (RetroPie scriptmodules/emulators/advmame-1.4.sh:25-51). None of them
  changes what is read.

  Twenty-seven BIOS root sets, each a NOT_A_DRIVER entry
  (src/driver.h:180). Twenty-six are registered in src/mamedriv.c and listed
  below. src/drivers/macs.c:613 declares macs2bios, which src/mamedriv.c
  never registers and whose two ROMs are NO_DUMP, so no load reaches it.
  taitogn is a plain game in this release (src/drivers/zn.c:4623), not a
  root set.

  ROM archives are searched under dir_rom, $home/rom:$data/rom by default
  (advance/osd/fileio.c:74, advance/linux/file.c:249-256), in the forms
  DIR/GAME/ROM, then DIR/GAME.zip/ROM (src/fileio.c:1045-1064,1157-1160).
  $home is $ADVANCE, or $HOME/.advance when that variable is unset
  (advance/linux/file.c:83-99). RetroPie sets dir_rom to
  $romdir/mame-advmame:$romdir/arcade
  (RetroPie scriptmodules/emulators/advmame.sh:100), so the BIOS archives
  sit beside the games, not in the BIOS directory. Each ROM is looked up
  along the parent chain (src/romload.c:478-482), so a child game reads its
  BIOS from the root set's own archive. Inside an archive a member is
  matched by name, then by its printable CRC32 (src/fileio.c:1213-1223).

  No BIOS ROM carries ROM_OPTIONAL or a no-good-dump marker, so a missing one
  counts as an error and the load aborts with "required files are missing,
  the game cannot be run" (src/romload.c:248-271,384-388). A wrong length or
  checksum is only a warning (src/romload.c:327-370).

  Where a system offers several BIOS revisions, SYSTEM_BIOS_ADD names them
  and misc_bios selects one by number or short name, "default" selecting
  entry 0 (advance/osd/glue.c:655-657,2874, src/romload.c:167-200). Only ROMs
  of the selected revision are read (src/romload.c:747). Neo Geo lists MVS
  revisions alone, the Universe, debug and AES entries being commented out
  (src/drivers/neogeo.c:1378-1381,1397-1400).

  The support files are read from $home, then $data
  (advance/osd/fileio.c:81,88-90, advance/linux/file.c:204-235,249-256). A
  language file is opened under the name misc_languagefile carries,
  english.lng by default (advance/osd/glue.c:659-662,2869). The release
  ships none, and without one the built-in English strings are used
  (src/ui_text.c:263). misc_historyfile and misc_infofile are discarded when
  found in a configuration file (advance/osd/emu.c:516-517) and the core has
  no history reader, so history.dat, though installed by
  advance/advance.mak:31, is never opened. No controller file is read,
  options.controller being pinned to zero (advance/osd/glue.c:652).
  blitmax.h, startup.h and help.dat are compiled into the binary
  (advance/osd/video.c:1393,1401, advance/osd/ui.c:1395). Samples and
  artwork are per-game archives under dir_sample and dir_artwork, named
  after the driver (src/sound/samples.c:198-200,
  src/artwork.c:2055-2056,2161).

