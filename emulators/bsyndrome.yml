notes: |
  Rewrite of the engine of Bermuda Syndrome (Century Interactive, BMG, 1995)
  by Gregory Montoir, from the reversing of the original Windows executable.
  It runs the original data files, retail or demo. RetroBat installs bs.exe
  with the 0.1.7 README beside it, the release the 0.1.7 tag builds.

  RetroBat starts bs.exe with --datapath=<rom folder>/DATA,
  --savepath=<saves>/bsyndrome and --musicpath=<bios>/bsyndrome/MUSIC, and
  stops when the DATA folder is missing.
  ref: emulatorLauncher Generators/PortsLauncher.Configuration.cs:131-166

  Data path (default DATA): either a directory, listed once and searched by
  name without regard to case, or a single romfs image ("-rom1fs-"
  signature). Scene files are looked up under SCN/, every name the scripts
  give with a leading "..\" is taken from the data root, so the expected
  tree is the game folder itself: SCN/, WGP/, MENU/, MIDI/, DATA/ for the
  videos, and the bermuda.* files at its root.
  ref: main.cpp:13-28, fs.cpp:230-305

  Version detection: SCN/-00.SCN marks the demo, otherwise SCN/-01.SCN
  (German) or SCN/_01.SCN (English and French) is the startup scene, and
  with none of them the engine stops with "Unable to find startup scene
  file". bermuda.wgp and bermuda.spr are loaded at startup, bermuda.ovr only
  for the full game.
  ref: game.cpp:33-51, resource.cpp:44-60

  Music path (default MUSIC): when a scene asks for one of the game's MIDI
  tracks, trackNN.ogg is tried first, NN being the CD audio track that
  replaces it (title.mid 01 through complete.mid 12, musik.mid of the demo
  03). Without the .ogg the MIDI file of the data tree is played. The tracks
  are rips of the retail CD soundtrack, 22 kHz stereo Vorbis per the README.
  ref: game.cpp:1074-1119, mixer_sdl.cpp:64-76, README.TXT:21-23

  gamecontrollerdb.txt is read from the working directory when present
  (systemstub_sdl.cpp:168). RetroBat ships none.

files:
  - name: "_01.SCN"
    path: "DATA/SCN/_01.SCN"
    category: game_data
    system: bermuda-syndrome
    required: true
    description: "Startup scene of the English and French releases"
    source_ref: "game.cpp:33-51"
    note: "The German release has -01.SCN instead and the demo -00.SCN. The rest of the SCN, WGP, MENU and MIDI trees is opened by name as scenes call for it."
    unsourceable: "retail game data the collection does not hold, and a same-named file of another release must not stand in"

