emulator: Ryujinx
type: standalone
source: "https://git.ngram.ca/mirrors/Ryujinx"
upstream: "https://github.com/Ryujinx/Ryujinx"
profiled_date: "2026-03-26"
source_commit: "7d158acc3b5826a08941d6e8d50d3a3897021bcd"
core_version: "1.1.1402"
version_basis:
  kind: tag
  tag: "1.1.1402"
  distance: 0
display_name: "Ryujinx (Nintendo Switch)"
cores:
  - ryujinx
systems: [nintendo-switch]
analysis_date: "2026-03-26"
mode: standalone

standalone_directories:
  - "$XDG_CONFIG_HOME/Ryujinx"
  - "$HOME/.config/Ryujinx"
  - "DefaultPortableDir"
data_root:
  windows:
    path: "%APPDATA%/Ryujinx"
    source_ref: "src/Ryujinx.Common/Configuration/AppDataManager.cs:11-12, 52-82"
    note: "A portable folder beside the executable, or the folder given with --root-data-dir, is used instead."
  linux:
    path: "$XDG_CONFIG_HOME/Ryujinx, else ~/.config/Ryujinx"
    source_ref: "src/Ryujinx.Common/Configuration/AppDataManager.cs:11-12, 52-82"
    note: "A portable folder beside the executable, or the folder given with --root-data-dir, is used instead."
  macos:
    path: "~/Library/Application Support/Ryujinx"
    source_ref: "src/Ryujinx.Common/Configuration/AppDataManager.cs:11-12, 52-82"
    note: "A portable folder beside the executable or beside the app bundle, or the folder given with --root-data-dir, is used instead."

# Key files are read from {BaseDirPath}/system/ (src/Ryujinx.Common/Configuration/AppDataManager.cs:229)
# Also searched in ~/.switch/ (src/Ryujinx.Common/Configuration/AppDataManager.cs:47)
# Batocera copied bios/switch/prod.keys to Ryujinx/system/prod.keys (batocera ryujinxGenerator.py:108 at 1f69a46e) until it dropped the package in ee8a418f
# Firmware NCAs are installed via UI (src/Ryujinx.HLE/FileSystem/ContentManager.cs:429), not placed as files

files:
  - name: "prod.keys"
    required: true
    path: "system/prod.keys"
    note: "Switch production keys for NCA decryption"
    source_ref: "src/Ryujinx.HLE/FileSystem/VirtualFileSystem.cs:238"

  - name: "title.keys"
    required: false
    path: "system/title.keys"
    note: "Per-title decryption keys, needed for specific game content"
    source_ref: "src/Ryujinx.HLE/FileSystem/VirtualFileSystem.cs:239"

  - name: "console.keys"
    required: false
    path: "system/console.keys"
    note: "Console-specific keys for encrypted content"
    source_ref: "src/Ryujinx.HLE/FileSystem/VirtualFileSystem.cs:240"

notes: |
  Ryujinx is a standalone Nintendo Switch emulator written in C#, created by gdkchan.
  Original repo discontinued October 2024 after Nintendo takedown.
  Firmware (system NCAs) must be installed through Ryujinx's UI from a ZIP or XCI.
  Required for commercial games (.nsp, .xci). Homebrew (.nro, .nso) runs without firmware.
  Firmware provides shared fonts, timezone data, SSL certificates, system version info.
