  - name: games.db
    path: "games.db"
    system: sony-playstation-2
    required: false
    bundled: true
    category: game_data
    description: "bundled catalog of PS2 titles"
    note: >-
      SQLite catalog carried in the package assets and copied into internal
      storage the first time the catalog is queried, then read from there. A copy
      already present is kept.
    source_ref: "app/src/main/java/com/sbro/emucorex/data/ps2/Ps2CatalogRepository.kt:18, app/src/main/java/com/sbro/emucorex/data/ps2/Ps2CatalogRepository.kt:38-56"

  - name: "<SERIAL>_<CRC>.pnach"
    path: "cheats/<SERIAL>_<CRC>.pnach"
    system: sony-playstation-2
    required: false
    category: game_data
    unsourceable: "cheat list authored per title, with no released artefact behind it"
    description: "per-title cheat file"
    note: >-
      The cheats folder is searched for the running serial and CRC, then for files
      carrying the CRC alone, both with a trailing wildcard so a suffix after the
      CRC is kept. The patches folder is searched the same way for patches rather
      than cheats. The app also imports pnach files out of a picked zip.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/Patch.cpp:331-342, app/src/main/cpp/pcsx2/pcsx2/Patch.cpp:344-366, app/src/main/java/com/sbro/emucorex/core/NativeApp.kt:355"

  - name: "<hash>.png"
    path: "textures/<SERIAL>/replacements/<hash>.png"
    system: sony-playstation-2
    required: false
    category: game_data
    unsourceable: "replacement artwork authored against the texture hashes of one title"
    description: "replacement texture"
    note: >-
      Read when texture replacement is on. The replacements folder under the
      running serial is walked recursively and a file counts only when its name
      parses as the TEX0 hash, optional CLUT hash, optional region size and format
      that the texture cache looks it up by. A directory whose case does not match
      is reported.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:36-42, app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:328-331, app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:442-500"

  - name: "<driver>.zip"
    system: sony-playstation-2
    required: false
    unsourceable: "Vulkan driver built for one Adreno family, not an emulator artefact"
    description: "replacement Vulkan driver package"
    note: >-
      Listed by a catalog fetched from the EmuCoreV-Drivers repository, or picked
      from the device. The archive is unpacked into a directory named after it
      under driver in internal storage, entries carrying a parent path segment
      being refused, and the Vulkan library it holds is recorded in a
      driver_name.txt written beside it. The renderer then resolves the driver
      through adrenotools from that pair. The system loader is used when no driver
      is configured.
    source_ref: "app/src/main/java/com/sbro/emucorex/core/GpuDriverCatalogRepository.kt:131-135, app/src/main/java/com/sbro/emucorex/core/GpuDriverManager.kt:89-128, app/src/main/java/com/sbro/emucorex/core/GpuDriverManager.kt:135-141, app/src/main/cpp/ARM_ANDROID/src/runtime/android_runtime.cpp:98-112, app/src/main/cpp/ARM_ANDROID/src/runtime/android_runtime.cpp:362"

exclusion_note: >
  Left out are the parts of the bundled resource tree that this platform compiles
  out. ImGuiManager::Initialize returns false before the ImGui context exists, so
  LoadFontData never runs and fonts/RobotoMono-Medium.ttf, fonts/fa-solid-900.ttf
  and fonts/promptfont.otf are never read; InitializeFullscreenUI returns false
  unconditionally, so FullscreenUI::Initialize never runs and nothing under
  fullscreenui or icons is loaded, cover-placeholder.png included. The DX11 and
  DX12 renderers sit in the Windows branch of the core CMakeLists, so
  shaders/dx11 is dead here. game_controller_db.txt has one consumer,
  Input/SDLInputSource.cpp, which the adapter removes from the target and replaces
  with a source that never opens it. The user resource override folder is only
  ever consulted by those same font and controller database reads, so it is dead
  with them. Left out with these are the app's other package assets, which are
  read through the asset manager and never reach the filesystem:
  catalog/rom_identity_index.json, catalog/rom_identity_overrides.json and
  catalog/pcsx2_compat_index.json. Left out too is what the emulator writes and
  reads back, which is state rather than system files: the inis, the per-game
  settings and input profiles, the memory cards, the save states, the snapshots,
  the shader and texture caches, the logs, the dumped textures, and the
  system-ca-bundle.pem the app exports from the Android trust store. The covers
  folder is inert: its only readers are the FullscreenUI game list and
  GameList::DownloadCovers, which has no caller, and the app runs its own cover
  cache.
