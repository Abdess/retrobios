    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and ROMVER is accepted, whatever its
      name. The 2 to 8 MB range gates the folder scan, but an image named in the
      configuration skips that range. Read into the 4 MB ROM region, which is
      zero-filled first, and truncated to it. Shorter than 2465792 bytes disables
      the OSDSys parameter HLE.
