    system: sony-playstation-2
    required: false
    hle_fallback: true
    size: 1024
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm, case-insensitively.
      Carries the console id, the iLink id, the model number and the OSD
      configuration. A 1024 byte image is built in memory when the file is absent,
      short, or carries a blank config block, filled with a fixed iLink id and the
