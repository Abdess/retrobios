notes: |
  PlayStation 2 emulator for Android, package com.sbro.emucorex, arm64-v8a only,
  minSdk 29. A Kotlin and Compose front end drives a PCSX2 tree vendored under
  app/src/main/cpp/pcsx2 and pinned to v2.8.0, reached through the ARM_ANDROID
  adapter that owns the JNI entry points. Frontends start the exported activity
  com.sbro.emucorex.MainActivity; ES-DE passes the disc as the intent data URI.
  ref: app/build.gradle.kts:66-70, app/build.gradle.kts:97,
       app/src/main/AndroidManifest.xml:90-104,
       app/src/main/cpp/ARM_ANDROID/CMakeLists.txt:78-82,
       app/src/main/cpp/ARM_ANDROID/CMakeLists.txt:359-360

  The whole upstream core is linked, with three files swapped out of the target:
  Achievements.cpp, Host/SDLAudioStream.cpp and Input/SDLInputSource.cpp are
  removed and replaced by the adapter's own achievements, AAudio and OpenSL, and
  input sources. OpenGL and Vulkan are on, pcsx2-qt is never added, and the
  DX11 and DX12 renderers sit in the Windows branch of the core CMakeLists.
  ref: app/src/main/cpp/ARM_ANDROID/CMakeLists.txt:259-272,
       app/src/main/cpp/ARM_ANDROID/CMakeLists.txt:59-60,
       app/src/main/cpp/pcsx2/pcsx2/CMakeLists.txt:706,
       app/src/main/cpp/pcsx2/pcsx2/CMakeLists.txt:723-734

  Storage. The data root is the app files directory; the app creates cache,
  resources, inis, sstates and memcards under it, then copies the whole resources
  asset tree out of the package into resources. The core is handed AppRoot,
  DataRoot, Resources, Settings and Cache from that root, and the launcher sets
  Folders for Bios, Savestates, MemoryCards, Textures, Cheats, Patches and Logs
  per run.
  ref: app/src/main/java/com/sbro/emucorex/core/NativeApp.kt:30,
       app/src/main/java/com/sbro/emucorex/core/NativeApp.kt:430-432,
       app/src/main/java/com/sbro/emucorex/core/NativeApp.kt:563-570,
       app/src/main/java/com/sbro/emucorex/core/NativeApp.kt:587-619,
       app/src/main/cpp/ARM_ANDROID/src/runtime/upstream_vm_bridge.cpp:261-265,
       app/src/main/java/com/sbro/emucorex/core/EmulatorBridge.kt:612-618

  A BIOS image is required and boot stops without one: LoadBIOS returning false
  makes VMManager report that a PlayStation 2 BIOS is needed. Only a GS dump
  replay skips the load. Detection is by content: the folder scan keeps files
  between 2 and 8 MB and accepts an image whose romdir carries a RESET entry
  followed by a readable ROMVER, the fifth ROMVER character giving the zone among
  Japan, USA, Europe, Asia, China, T10K, COH-H, Test and Free, with EXTINFO
  supplying the serial. An image named in the configuration is opened at its own
  path without the size filter. No hash is matched, and a console image is
  matched under no name.

  MIN_BIOS_SIZE was halved to 2 MB to admit the Namco System 246/256 chip dumps,
  which are 2 MB where a console image is 4. Three other changes came with it:
  a COH-H board is region 11 rather than 8, its description is built from the
  EXTINFO serial because Sony left the version and date fields identical across
  those BIOSes, and the ROM window is zero-filled before the read so the unused
  upper half cannot retain the previous image.
  ref: app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:16-17,
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:80-217,
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:150-151 (COH-H region),
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:176-190 (serial description),
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:278-314,
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:337-391,
       app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:365-367 (ROM window cleared),
       app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1898-1912

  An arcade launch starts from a manifest carrying an NM game id and a board
  generation. It selects the board BIOS by name from the BIOS folder,
  r27v1602f.8g for System 256 and Super 256 and r27v1602f.7d for System 246, and
  keeps the configured BIOS with a warning when that file is absent. The dongle,
  memory card, boot ELF, SRAM and media the manifest names are per-title content
  resolved beside it.
  ref: app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1530-1598,
       app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1608-1733

  The app runs its own gate before launching. A candidate is a .bin, .rom, .7d
  or .8g between 512 KB and 8 MB. It passes when the core's IsBIOS accepts it,
  reached through isBiosPath on the path or isBiosFd on /proc/self/fd, or when
  its name carries scph, ps2, bios, rom or r27v1602f. The two extra extensions
  are the board positions the Namco dumps carry instead of a conventional one.
  ref: app/src/main/java/com/sbro/emucorex/core/BiosValidator.kt:13-21,
       app/src/main/java/com/sbro/emucorex/core/BiosValidator.kt:112-146,
       app/src/main/java/com/sbro/emucorex/core/BiosValidator.kt:177-185,
       app/src/main/cpp/ARM_ANDROID/src/jni/native_app_jni.cpp:493-515

  A BIOS folder picked through the storage access framework is copied flat into
  imported-bios under the external files directory, and Folders/Bios points there.
  The import filter takes any .bin, .rom, .7d or .8g, plus .mec, .nvm and .elf
  whose name carries one of the hints. Neither rom1 nor rom2 is an accepted
  extension, and LoadExtraRom looks for exactly {bios}.rom1 or {biosbase}.rom1,
  so the two ROM modules only reach the core when Folders/Bios is a plain
  filesystem path used as-is. A re-import preserves the .nvm and .mec sitting
  beside the image.
  ref: app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:26-28,
       app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:104-157,
       app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:430-452,
       app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:497-502,
       app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:556-563

  Much of the bundled resource tree is compiled out on this platform and never
  read. ImGuiManager::Initialize returns false before creating the ImGui context,
  so LoadFontData and the three fonts it reads are unreachable, and SetFonts and
  ReloadFonts both guard on that context. InitializeFullscreenUI returns false
  unconditionally, so FullscreenUI::Initialize never runs and nothing under
  fullscreenui or icons is loaded. The adapter reads two fonts of its own instead
  and hands them over through SetFonts.
  ref: app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:131-146,
       app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:148-152,
       app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:163,
       app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:224-229,
       app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:296-316,
       app/src/main/cpp/pcsx2/pcsx2/ImGui/ImGuiManager.cpp:483-536,
       app/src/main/cpp/ARM_ANDROID/src/runtime/upstream_vm_bridge.cpp:384-412,
       app/src/main/cpp/ARM_ANDROID/src/runtime/upstream_vm_bridge.cpp:437

  The three achievement sounds are the one resource the code reads that the tree
  does not carry. Their directory holds only the README naming their origin,
  while upstream v2.8.0 ships message.wav at 15696 bytes, lbsubmit.wav at 82096
  and unlock.wav at 202702. All four sound settings default on, so a signed-in
  session asks for them at every notification.
  ref: app/src/main/cpp/pcsx2/bin/resources/sounds/achievements/README.txt:1-3,
       app/src/main/cpp/ARM_ANDROID/src/integration/pcsx2_achievements_android.cpp:81-83,
       app/src/main/cpp/pcsx2/pcsx2/Config.h:1371-1374,
       app/src/main/cpp/pcsx2/pcsx2/Pcsx2Config.cpp:1963-1966

files:
  - name: ps2-0230a-20080220.bin
    path: bios/ps2-0230a-20080220.bin
    system: sony-playstation-2
    agnostic: true
    required: true
    min_size: 2097152
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and ROMVER is accepted, whatever its
      name. The 2 to 8 MB range gates the folder scan; an image named in the
      configuration skips that range. Read into the 4 MB ROM region, which is
      zero-filled first, and truncated to it. Shorter than 2465792 bytes disables
      the OSDSys parameter HLE.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:16-17, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:80-217, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:278-314, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:337-391"

  - name: r27v1602f.7d
    path: bios/r27v1602f.7d
    system: sony-playstation-2
    agnostic: true
    required: false
    size: 2097152
    md5: 52cca0058626569c7a9699838baab2d8
    sha1: f0a74bbcaf801f3fd0b7002ebd0118564aae3528
    crc32: 2b2e41a2
    description: "Namco System 246 COH-H BIOS chip dump"
    note: >-
      Admitted since MIN_BIOS_SIZE fell to 2 MB. The board position is the
      extension, so the picker takes .7d alongside .bin and .rom, and the name
      hint r27v1602f carries it past the name test. Read into the 4 MB ROM
      window, whose upper half is cleared first. ROMVER marks it T with a fifth
      character Z, which is what makes it COH-H and region 11; its description
      comes from the EXTINFO serial. A System 246 arcade manifest selects this
      name from the BIOS folder. Byte-identical to the r27v1602f.7d member of the
      MAME sys246 set.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:16-17, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:150-151, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:176-190, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:365-367, app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1590-1598, app/src/main/java/com/sbro/emucorex/core/BiosValidator.kt:13-21"

  - name: r27v1602f.8g
    path: bios/r27v1602f.8g
    system: sony-playstation-2
    agnostic: true
    required: false
    size: 2097152
    md5: a58676c6bd79229bda967d07b4ec2e16
    sha1: bc4fb4e1e53adbd92385f1726bd69663ff870f1e
    crc32: b2a8eeb6
    description: "Namco System 256 COH-H BIOS chip dump"
    note: >-
      The System 256 counterpart, taken by the same path and the same widened
      size gate. A System 256 or Super 256 arcade manifest selects this name
      from the BIOS folder. Byte-identical to the r27v1602f.8g member of the
      MAME sys256 set.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:16-17, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:150-151, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:176-190, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:365-367, app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1590-1598, app/src/main/java/com/sbro/emucorex/core/BiosValidator.kt:13-21"

  - name: ps2-0230a-20080220.rom1
    path: bios/ps2-0230a-20080220.rom1
    system: sony-playstation-2
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1, with a case-insensitive retry on
      the open. Copied to the ROM1 region and truncated to 4 MB. Logged and
      skipped when absent. The storage access framework import does not carry
      this extension, so it is reachable only from a plain BIOS folder path.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:234-261, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:388, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:393-403, app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:26-28, app/src/main/java/com/sbro/emucorex/core/DocumentPathResolver.kt:497-502"

  - name: ps2-0230a-20080220.rom2
    aliases:
      - "SCPH-90006_BIOS_VX_HK _230.ROM2"
    path: bios/ps2-0230a-20080220.rom2
    system: sony-playstation-2
    required: false
    max_size: 4194304
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1, copied to the ROM2 region. Present on Chinese
      region consoles. Carried by the same import restriction as rom1.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:234-261, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:389, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:393-403"

  - name: ps2-0230a-20080220.nvm
    path: bios/ps2-0230a-20080220.nvm
    system: sony-playstation-2
    required: false
    hle_fallback: true
    size: 1024
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm, case-insensitively.
      Carries the console id, the iLink id, the model number and the OSD
      configuration. A 1024 byte image is built in memory when the file is absent,
      short, or carries a blank config block, filled with a fixed iLink id and the
      language and region defaults of the detected BIOS region. Under a COH-H
      BIOS the blank-block test is skipped and the built image is 0xFF-filled
      with the iLink id alone.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:47-48, app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:139-162, app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:164-167, app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:169-193"

  - name: ps2-0230a-20080220.mec
    path: bios/ps2-0230a-20080220.mec
    system: sony-playstation-2
    required: false
    hle_fallback: true
    size: 4
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Defaults to
      0x00020603, or 0x0104020a under a COH-H BIOS, and is written back at that
      path when it cannot be read.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:50-51, app/src/main/cpp/pcsx2/pcsx2/CDVD/CDVD.cpp:195-208"

  - name: eeprom.dat
    system: sony-playstation-2
    required: false
    hle_fallback: true
    size: 64
    description: "DEV9 EEPROM"
    note: >-
      Opened from the working directory when the network adapter starts and mapped
      over 64 bytes. A compiled-in image stands in when the file is missing or
      cannot be mapped.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/DEV9/DEV9.cpp:104-167"

  - name: flash.dat
    system: sony-playstation-2
    required: false
    hle_fallback: true
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened from the working directory at network adapter init and read as 1024
      blocks of 16 pages of 512 bytes plus 16 ECC bytes. The card is filled with
      0xFF when the file is absent.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/DEV9/flash.cpp:9-16, app/src/main/cpp/pcsx2/pcsx2/DEV9/flash.cpp:62-86"

  - name: "<module>.irx"
    system: sony-playstation-2
    required: false
    config_key: "EmuCore/CurrentIRX"
    unsourceable: "any IOP module the user points at, under no name and no version the code expects"
    description: "IOP module injected at boot"
    note: >-
      Read into the ROM region at 0x3C0000 when the IOP program counter reaches
      0x1630 and the setting is longer than three characters. The launcher fills
      it from the boot parameters when the picked file is an IRX. Empty otherwise.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:263-276, app/src/main/cpp/pcsx2/pcsx2/ps2/BiosTools.cpp:406-407, app/src/main/cpp/pcsx2/pcsx2/R3000AInterpreter.cpp:220, app/src/main/cpp/pcsx2/pcsx2/arm64/iop/iR3000A-arm64.cpp:1695, app/src/main/cpp/pcsx2/pcsx2/VMManager.cpp:1846, app/src/main/cpp/ARM_ANDROID/src/runtime/upstream_vm_bridge.cpp:462-467"

