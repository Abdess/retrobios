  - name: "<SERIAL>_<CRC>.pnach"
    path: "cheats/<SERIAL>_<CRC>.pnach"
    system: sony-playstation-2
    required: false
    category: game_data
    unsourceable: "cheat list authored per title, with no released artefact behind it"
    description: "per-title cheat file"
    note: >-
      The cheats folder is searched for the running serial and CRC, then for files
      carrying the CRC alone, both with a trailing wildcard so a suffix after the
      CRC is kept. An arcade title, whose serial starts with NM and whose CRC is
      zero, is matched on the serial alone. The patches folder is searched the
      same way for patches rather than cheats. The app's cheat manager keeps a
      picked pnach document in its own store and writes the enabled blocks into
      the cheats folder as <SERIAL>_<CRC>.pnach, or <CRC>.pnach without a serial.
    source_ref: "app/src/main/cpp/pcsx2/pcsx2/Patch.cpp:332-345, app/src/main/cpp/pcsx2/pcsx2/Patch.cpp:347-369, app/src/main/java/com/sbro/emucorex/ui/cheats/CheatManagerScreen.kt:291-309, app/src/main/java/com/sbro/emucorex/data/CheatRepository.kt:186-220, app/src/main/java/com/sbro/emucorex/data/CheatRepository.kt:304-311"

