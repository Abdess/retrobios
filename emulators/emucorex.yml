      is reported.
    source_ref: "source app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:36-42, source app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:330-333, source app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp:444-502"

  - name: "<driver>.zip"
    system: sony-playstation-2
    required: false
    unsourceable: "Vulkan driver built for one GPU family, not an emulator artefact"
    description: "replacement Vulkan driver package"
    note: >-
      Listed by a catalog fetched from the EmuCoreV-Drivers repository, or picked
      from the device. A catalog download whose length differs from the size the
      catalog states is discarded. The archive is unpacked into a directory named
      after it under driver in internal storage, entries carrying a parent path
      segment being refused, and the Vulkan library it holds is recorded in a
      driver_name.txt written beside it. The install is removed when that library
      does not start with the ELF magic or when its GPU vendor, taken from the
      catalog or from markers in the library, does not match the device. A
      library named libvulkan_malisx2.so is also refused unless the GL renderer
      reports a Mali or Immortalis G57, G68, G77, G78, G615 or G715. The
      renderer then resolves the driver through adrenotools from that pair. The
      system loader is used when no driver is configured.
    source_ref: "source app/src/main/java/com/sbro/emucorex/core/GpuDriverCatalogRepository.kt:143-147, source app/src/main/java/com/sbro/emucorex/core/GpuDriverCatalogRepository.kt:76-87, source app/src/main/java/com/sbro/emucorex/core/GpuDriverManager.kt:98-176, source app/src/main/java/com/sbro/emucorex/core/GpuDriverManager.kt:178-195, source app/src/main/java/com/sbro/emucorex/core/GpuDriverManager.kt:228-242, source app/src/main/java/com/sbro/emucorex/core/GpuDriverCompatibility.kt:204-208, source app/src/main/java/com/sbro/emucorex/core/GpuDriverCompatibility.kt:244-257, source app/src/main/cpp/ARM_ANDROID/src/runtime/android_runtime.cpp:249-263, source app/src/main/cpp/ARM_ANDROID/src/runtime/android_runtime.cpp:581, source app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/Vulkan/VKLoader.cpp:136, source app/src/main/cpp/pcsx2/pcsx2/GS/Renderers/Vulkan/VKLoader.cpp:201-207"

exclusion_note: >
  Left out are the parts of the bundled resource tree that this platform compiles
  out. ImGuiManager::Initialize returns false before the ImGui context exists, so
  LoadFontData never runs and fonts/RobotoMono-Medium.ttf, fonts/fa-solid-900.ttf
  and fonts/promptfont.otf are never read. InitializeFullscreenUI returns false
  unconditionally, so FullscreenUI::Initialize never runs and nothing under
  fullscreenui or icons is loaded, cover-placeholder.png included. The DX11 and
  DX12 renderers sit in the Windows branch of the core CMakeLists, so
  shaders/dx11 is dead here. game_controller_db.txt has one consumer,
  Input/SDLInputSource.cpp, which the adapter removes from the target and replaces
  with a source that never opens it. The user resource override folder is only
  ever consulted by those same font and controller database reads, so it is dead
  with them. Left out with these are the app's other package assets, which are
  read through the asset manager and never reach the filesystem:
  catalog/rom_identity_index.json, catalog/rom_identity_overrides.json and
  catalog/pcsx2_compat_index.json. Left out too is what the emulator writes and
  reads back, which is state rather than system files: the inis, the per-game
  settings and input profiles, the memory cards, the save states, the snapshots,
  the shader and texture caches, the logs, the dumped textures, and the
  system-ca-bundle.pem the app exports from the Android trust store, and the
  per-title arcade content a manifest names. The covers folder is inert: its
  only readers are the FullscreenUI game list and GameList::DownloadCovers,
  which only FullscreenUI calls, and the app runs its own cover cache.
