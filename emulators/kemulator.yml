notes: |
  MIDP/CLDC runtime running on the host JVM, developed from decompiled KEmulator
  1.0.3. MIDlet bytecode executes against the javax.microedition classes compiled
  into the application, so no device firmware is read.

  Yamaha SMAF audio is the one thing the user supplies. MMFPlayer.initialize()
  probes the directory holding the executable for a hardware emulator library in
  a fixed order, MA-7 then MA-5 then MA-3, and keeps the first complete set. MA-3
  ships with the emulator, so .mmf playback works on a stock install and the MA-5
  and MA-7 libraries raise the chip generation: MA-5 adds 32 PCM channels, MA-7
  adds DSP effects and is the only mode where supportsAudioTracks() is true,
  which the MEXA phrase audio track API reads to size its track array.
  ref: src/media/emulator/media/mmf/MMFPlayer.java:11-40,
       src/media/emulator/media/mmf/MaDll.java:862-864,
       src/media/emulator/media/mmf/PhrasePlayerImpl.java:20-26

  The probe is 32-bit Windows only. isX64() returns before any file is touched,
  so the x64 build loads none of these. The MIDI-through-MA path passes
  notMmf=true, which skips the MA-7 branch and leaves MA-5 or MA-3.
  ref: src/media/emulator/media/mmf/MMFPlayer.java:15-17,
       src/media/javax/microedition/media/PlayerImpl.java:206-211,
       win/src/main/emulator/EmulatorPlatform.java:9-11,
       x64/src/main/emulator/EmulatorPlatform.java:9-11

  Every caller degrades when the probe fails. PlayerImpl.midi() breaks out of the
  ma block and falls back to MidiSystem; PlayerImpl.mmf(), SmafPlayer, AudioClip
  and PhrasePlayerImpl each throw and lose SMAF audio alone. Only the file's
  existence is tested, then the path goes to Native.load, so the code reads no
  size and no hash.
  ref: src/media/javax/microedition/media/PlayerImpl.java:212-249,
       src/oem/com/jblend/media/smaf/SmafPlayer.java:91,
       src/oem/com/samsung/util/AudioClip.java:61,
       src/media/emulator/media/mmf/MaDll.java:181-190

  The 3D and Mascot Capsule backends default to their OpenGL implementations, so
  the two shipped native libraries below load only when the user selects the
  SWERVE M3G engine or the Mascot Capsule DLL engine.
  ref: src/main/emulator/Settings.java:20-21,
       win/src/main/emulator/EmulatorPlatform.java:41-80

  Two settings hold user-chosen paths with no fixed filename. SoundfontPath takes
  any .sf2 or .dls and is empty by default, leaving useCustomSoundfont() false and
  the JVM default soundbank in place. VlcDir points at a VLC installation that
  vlcj scans for libvlc.
  ref: src/media/emulator/media/EmulatorMIDI.java:26-36,
       src/main/emulator/ui/swt/Property.java:1864-1905

