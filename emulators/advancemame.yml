notes: |
  MAME 0.106 core (src/version.c:12) carrying its own video layer and driver
  backports from later MAME releases. Twenty-six BIOS root sets, each a
  NOT_A_DRIVER entry (src/driver.h:180) registered in src/mamedriv.c.
  src/drivers/macs.c:613 declares a twenty-seventh, macs2bios, that
  src/mamedriv.c never registers, so no build reaches it and the five MACS
  games all parent to macsbios. The set is unchanged between release 5.0 and
  the profiled commit.

  ROM archives are searched under dir_rom, defaulting to $home/rom:$data/rom
  on Linux and Mac OS X and to rom on DOS and Windows, in the forms
  DIR/GAME/ROM.EXT, DIR/GAME.zip/ROM.EXT and DIR/GAME/ROM.zip/ROM
  (advance/osd/fileio.c:74, doc/advmame.d:680,699-701). $home is $ADVANCE, or
  $HOME/.advance when that variable is unset (doc/advmame.d:503-509). Each ROM
  is looked up along the parent chain (src/romload.c:481-483), so a child game
  reads its BIOS from the root set's own archive, which has to sit beside the
  game archive. Inside an archive a member is matched by name, then by its
  printable CRC32 (src/fileio.c:1213-1223).

  No BIOS ROM carries ROM_OPTIONAL or a no-good-dump marker, so a missing one
  counts as an error rather than a warning and aborts with "required files are
  missing, the game cannot be run" (src/romload.c:248-268,385-388). Loaded
  ROMs are checked for exact length and against the declared CRC32 and SHA1,
  both mismatches being warnings (src/romload.c:327-363).

  Where a system offers several BIOS revisions, SYSTEM_BIOS_ADD names them and
  misc_bios selects one, entry 0 being the default (doc/advmame.d:2086-2094).
  Only the selected revision is read; the others share the archive as
  alternatives. Neo Geo lists MVS revisions alone, the AES, Universe and debug
  entries being commented out (src/drivers/neogeo.c:1420-1423,1439-1442).

  The support files sit directly in $home or $data
  (advance/osd/fileio.c:81,88-90, advance/linux/file.c:249-256). A language
  file is read too, under whatever name misc_languagefile carries
  (advance/osd/glue.c:715-716); the project ships none, English being built
  into the binary (src/ui_text.c:263-265). Samples and
  artwork are per-game archives under dir_sample and dir_artwork, ZIP only,
  named after the driver: WAV members for samples
  (src/sound/samples.c:198-200), a <driver>.art layout and its PNGs for
  artwork (src/artwork.c:2119,2224).

  misc_historyfile and misc_infofile were retired and are discarded when found
  in a configuration file (advance/osd/emu.c:517-518), leaving history.dat and
  mameinfo.dat unread. options.controller is pinned to zero
  (advance/osd/glue.c:708), so no controller file is read either. blitmax.dat,
  startup.dat and help.dat are compiled into the binary
  (advance/osd/video.c:1787,1795, advance/osd/ui.c:1575).

files:
  # Support files ($home or $data)
  - name: hiscore.dat
    required: false
    category: game_data
    source_ref: "src/hiscore.c:28,313"
    note: >-
      High score definitions, selected by misc_hiscorefile
      (advance/osd/glue.c:800,3293). Absent, hiscore_open matches no entry and
      no high score is restored or saved.

  - name: cheat.dat
    required: false
    category: game_data
    source_ref: "src/cheat.c:8682,8751"
    note: >-
      Cheat definitions, selected by misc_cheatfile
      (advance/osd/glue.c:799,3291) and read only when misc_cheat is on, which
      it is not by default. Absent, the cheat menu reads "cheat database not
      found" (src/cheat.c:2536).

  - name: event.dat
    required: false
    category: game_data
    source_ref: "advance/osd/safequit.c:165-180,260"
    note: >-
      Event and safequit definitions, selected by misc_eventfile and read
      straight from $home then $data rather than through the file type table.
      Absent, the exit menu always prompts instead of checking coin and play
      state.

