notes: |
  MAME 0.106 core (src/version.c:11) carrying its own video layer and driver
  backports from later MAME releases. Twenty-nine BIOS root sets, each a
  NOT_A_DRIVER entry (src/driver.h:179) registered in src/mamedriv.c, release
  5.0 having all but coh1002v, which came with the Video System PSX driver,
  aleck64, which came with the Aleck64 games, atarisy1, which came with the
  Atari System 1 driver, and cedmag, which came with the Cedar Magnet System
  driver. src/drivers/macs.c:615 declares a thirtieth, macs2bios, that
  src/mamedriv.c never registers, so no build reaches it and the five MACS
  games all parent to macsbios.

  ROM archives are searched under dir_rom, defaulting to $home/rom:$data/rom
  on Linux and Mac OS X and to rom on DOS and Windows, in the forms
  DIR/GAME/ROM.EXT, DIR/GAME.zip/ROM.EXT and DIR/GAME/ROM.zip/ROM
  (advance/osd/fileio.c:74, doc/advmame.d:680,699-701). $home is $ADVANCE, or
  $HOME/.advance when that variable is unset (doc/advmame.d:503-509). Each ROM
  is looked up along the parent chain (src/romload.c:527-529), so a child game
  reads its BIOS from the root set's own archive, which has to sit beside the
  game archive. Inside an archive a member is matched by name, then by its
  printable CRC32 (src/fileio.c:1191-1201).

  No BIOS ROM carries ROM_OPTIONAL or a no-good-dump marker, so a missing one
  counts as an error rather than a warning and aborts with "required files are
  missing, the game cannot be run" (src/romload.c:294-314,431-434). Loaded
  ROMs are checked for exact length and against the declared CRC32 and SHA1,
  both mismatches being warnings (src/romload.c:373-409).

  Where a system offers several BIOS revisions, SYSTEM_BIOS_ADD names them and
  misc_bios selects one, entry 0 being the default (doc/advmame.d:2142-2150).
  Only the selected revision is read, and the others share the archive as
  alternatives. Neo Geo lists MVS revisions alone, the AES, Universe and debug
  entries being commented out (src/drivers/neogeo.c:1422-1425,1441-1444).

  The support files sit directly in $home or $data
  (advance/osd/fileio.c:81,88-90, advance/linux/file.c:249-256). A language
  file is read too, under whatever name misc_languagefile carries
  (advance/osd/glue.c:865-866). The project ships none, English being built
  into the binary (src/ui_text.c:262-264). Samples and
  artwork are per-game, under dir_sample and dir_artwork. Samples are ZIP
  archives named after the driver with WAV members
  (src/sound/samples.c:228-230). Artwork is a folder or ZIP archive named
  after the driver or one of its parents, holding default.lay and the PNG or
  JPEG images it names (src/artwork_package.c:43-81,
  src/artwork_lay.c:1615-1625).

  misc_historyfile and misc_infofile were retired and are discarded when found
  in a configuration file (advance/osd/emu.c:515-516), leaving history.dat and
  mameinfo.dat unread. options.controller is pinned to zero
  (advance/osd/glue.c:858), so no controller file is read either. blitmax.dat,
  startup.dat and help.dat are compiled into the binary
  (advance/osd/video.c:1794,1802, advance/osd/ui.c:1575).

files:
  # Support files ($home or $data)
  - name: hiscore.dat
    required: false
    bundled: true
    category: game_data
    system: arcade
    sha1: "23e0dec66680aa4545eafe436c23d2bf5622e32e"
    md5: "2490bad5079ec0991c23c579092cca19"
    size: 176851
    source_ref: "src/hiscore.c:27,132-146,312, src/mame.c:1104-1105"
    note: >-
      High score definitions, selected by misc_hiscorefile
      (advance/osd/glue.c:950,3484). Absent, hiscore_open matches no entry and
      no high score is restored or saved. support/hiscore.dat, installed by
      MAME_INSTALL_DATAFILES (advance/advance.mak:30-32). is_mem_range reads
      only "cpu:addr:len:start:end" lines under a "gamename:" header.

  - name: cheat.dat
    required: false
    bundled: true
    category: game_data
    system: arcade
    sha1: "4978ecafc4634cf20b639d8801c044dc156ab162"
    md5: "69c6bbe7194e4bc62d53764dd6c6d890"
    size: 13923773
    source_ref: "src/cheat.c:8681,8750"
    note: >-
      Cheat definitions, selected by misc_cheatfile
      (advance/osd/glue.c:949,3482) and read only when misc_cheat is on, which
      it is not by default. Absent, the cheat menu reads "cheat database not
      found" (src/cheat.c:2535). Installed beside hiscore.dat by
      MAME_INSTALL_DATAFILES, and shipped in the 5.0 Windows zip and .deb.

  - name: event.dat
    required: false
    bundled: true
    category: game_data
    system: arcade
    sha1: "8c34c85f92bc6771d789e880953a1cc43341485e"
    md5: "ee99bb541116967f8785a5bc09932475"
    size: 22066
    source_ref: "advance/osd/safequit.c:165-180,260"
    note: >-
      Event and safequit definitions, selected by misc_eventfile and read
      straight from $home then $data rather than through the file type table.
      Absent, the exit menu always prompts instead of checking coin and play
      state. The hash is support/event.dat as make install copies it. The
      Windows zip carries the same file with CRLF line endings.

