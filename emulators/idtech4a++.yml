  - name: autoexec.cfg
    required: false
    description: "Console script the engine runs at startup"
    note: >-
      Executed by the id-derived engines from the mod folder and from the base
      folder. The launcher lists both positions next to the config file each game
      writes for itself, DoomConfig.cfg, Quake4Config.cfg, preyconfig.cfg,
      q3config.cfg, wolfconfig.cfg, Darkmod.cfg, uzdoom.ini and the rest, and
      opens any of them in its editor. The config files are written by the
      engines; this one only ever comes from the user.
    source_ref: "Q3E/src/main/java/com/n0n3m4/q3e/Q3EInterface.java:722-836, Q3E/src/main/java/com/n0n3m4/q3e/Q3EGameConstants.java:63-88, idTech4Amm/src/main/java/com/karin/idTech4Amm/ConfigEditorActivity.java:103"

  - name: description.txt
    required: false
    description: "Blurb shown for a mod in the chooser"
    note: >-
      Read from the root of a mod folder when the mod list is built and shown
      under the folder name with its size. The control theme chooser reads a file
      of the same name from a theme folder, there with an optional language
      suffix.
    source_ref: "idTech4Amm/src/main/java/com/n0n3m4/DIII4A/launcher/ChooseGameModFunc.java:242-251, Q3E/src/main/java/com/n0n3m4/q3e/Q3EContextUtils.java:330-341"

  - name: controller_map.txt
    required: false
    load_from: internal_storage
    description: "Extra SDL controller mappings"
    note: >-
      SDL builds this path from the internal storage directory of the package
      when SDL_GAMECONTROLLERCONFIG_FILE is unset, which it is here, and reads it
      while the game controller subsystem starts, after the compiled-in mappings
      and before the ones the environment carries. It reaches the six games the
      app runs on SDL, Xash3D, Source, ECWolf, Skin Deep, Quadrilateral Cowboy
      and Icarus; the other engines take input from the Q3E frontend instead. The
      SDL2 tree under deplibs is what the build compiles, version 2.32.5.
    source_ref: "Q3E/src/main/jni/deplibs/SDL2/src/joystick/SDL_gamecontroller.c:1873-1884, 1890-1916, Q3E/src/main/jni/deplibs/SDL2/include/SDL_version.h:59-61, Q3E/src/main/jni/CMakeLists.txt:90-102, Q3E/src/main/java/com/n0n3m4/q3e/Q3EGameConstants.java:430, 454-461"

  - name: "controls_theme/<name>/btn_jump.png"
    required: false
    description: "Button images of a user theme"
    note: >-
      A folder under `controls_theme/` in any search path, or inside a `.zipak`
      there, appears in the chooser under its own name and its images replace the
      built-in ones. A `description.txt` beside them, optionally suffixed with a
      language tag, supplies the name, author and description the chooser shows.
    source_ref: "Q3E/src/main/java/com/n0n3m4/q3e/Q3EContextUtils.java:305-345, idTech4Amm/src/main/java/com/n0n3m4/DIII4A/launcher/SetupControlsThemeFunc.java:136-179"

  - name: gameaarch64.so
    required: false
    aliases: [gamearm.so]
    unsourceable: "compiled per mod against the published SDK, with no released binary to collect"
    description: "External idTech 4 mod game library"
    note: >-
      Looked for in the mod folder of DOOM 3, Quake 4, Prey or ETQW when the
      external-library preference is on, copied to a private cache and named to
      the engine through harm_fs_gameLibPath. The suffix follows the running
      architecture, gameaarch64.so on arm64 and gamearm.so on armv7. Without it
      the engine keeps the game code built into the apk. The launcher also
      accepts a full path to any libxxxxx.so instead.
    source_ref: "Q3E/src/main/java/com/n0n3m4/q3e/Q3EGameHelper.java:342-372, 429-434, idTech4Amm/src/main/java/com/n0n3m4/DIII4A/launcher/AddExternalLibraryFunc.java:71-86, README.md:229-233, 241-251"

  - name: server.so
    required: false
    aliases: [client.so, menu.so]
    unsourceable: "compiled per mod from hlsdk-portable, with no released binary to collect"
    description: "External Xash3D game libraries"
    note: >-
      Read from `lib/<arch>/` inside the Xash3D mod folder when the
      external-library preference is on, copied to the private cache and passed
      as the dll, clientlib and menulib parameters with gamelibdir pointing at
      the cache. The three default names are used unless the command line names
      others, and any further libraries in the folder are copied alongside.
    source_ref: "Q3E/src/main/java/com/n0n3m4/q3e/Q3EGameHelper.java:373-414, 445-475"

exclusion_note: >
  The retail game data is not listed. Every engine here loads it by globbing the
  base folder rather than by name, `.pk4` for the idTech 4 lineage, `.resources`
  for DOOM 3 BFG, the four container suffixes for Yamagi, `*.gro` for Serious
  Sam, and what it gates on is a `default.cfg` that lives inside those archives
  rather than beside them. The names that do appear in the code are the forty-nine
  the DOOM engine accepts as an IWAD, read from `iwadinfo.txt` in
  `game_support.pk3`, the four the launcher offers as selectable UZDOOM data
  files, and the five extensions ECWolf reports when no Wolfenstein data is
  found; all of them are game content, held here the same way the PrBoom and
  boom3 profiles hold theirs, in the notes. `stdout.txt` and `stderr.txt` are
  opened for writing by the engine and read back only to show the last run log,
  and an `idtech4amm.version` stamp is written beside each extracted resource.
  ref: doom3/neo/framework/FileSystem.cpp:2052, 3397-3399,
       Q3E/src/main/jni/quake2/yquake2/src/common/filesystem.c:1801-1850,
       Q3E/src/main/jni/serioussam/SamTFE/Sources/Engine/Base/Stream.cpp:212-247,
       Q3E/src/main/jni/ecwolf/src/wl_iwad.cpp:766,
       Q3E/src/main/jni/q3e/q3emisc.c:23-25,
       idTech4Amm/src/main/java/com/n0n3m4/DIII4A/GameLauncher.java:2899, 2916,
       Q3E/src/main/java/com/n0n3m4/q3e/Q3EGameHelper.java:697-703
