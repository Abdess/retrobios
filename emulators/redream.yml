notes: |
  Last public tree of redream (2018-04-18). It builds the SDL program and
  a libretro core that reports library_name redream
  (src/host/retro_host.c:214-220). retro_init makes <system>/dc the
  application directory (src/host/retro_host.c:192-199), where the boot ROM
  and the flash ROM are read. Later releases, 1.5.0 included, are built from
  a private tree and published as binaries only.

