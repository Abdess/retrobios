emulator: "EKA2L1"
type: standalone + libretro
core_classification: community_fork
source:
  standalone: "https://github.com/EKA2L1/EKA2L1"
  libretro: "https://github.com/WizzardSK/eka2l1-libretro/tree/libretro"
upstream: "https://github.com/EKA2L1/EKA2L1"
profiled_date: "2026-10-27"
source_commit:
  standalone: "6ad873a07ee3d745cd17179026dca247f6d11f6b"
  libretro: "e39ccac46e631be7470b4f420fb8eebed9c24eca"
upstream_commit:
  libretro: "11f5b6cd141c0884a130ee45743f1f5e17bb1783"
core_version:
  standalone: "0.0.9"
  libretro: "0.0.9"
version_basis:
  standalone:
    kind: file
    path: "src/emu/common/include/common/configure.h.in"
    pattern: '#define\s+CURRENT_EKA2L1_VERSION_STRING\s+"([^"]+)"'
  libretro:
    kind: file
    path: "src/emu/common/include/common/configure.h.in"
    pattern: '#define\s+CURRENT_EKA2L1_VERSION_STRING\s+"([^"]+)"'
display_name: "Nokia - Symbian / N-Gage (EKA2L1)"
cores:
  - eka2l1
systems:
  - ngage
  - symbian

data_root:
  android:
    path: "Android/data/com.github.eka2l1/files"
    source_ref: "src/emu/android/app/src/main/java/com/github/eka2l1/emu/Emulator.java:183-198, src/emu/android/app/src/main/java/com/github/eka2l1/emu/Emulator.java:245, src/emu/android/app/src/main/cpp/src/native-lib.cpp:118-129"
    note: "EKA2L1 at the root of shared storage when the app runs with legacy external storage. A working folder chosen in the settings replaces it"
  ios:
    path: "Documents/data"
    source_ref: "src/emu/ios/App/EKA2L1Bridge.swift:7-9, src/emu/ios/Bridge/IosEmulator.mm:1068-1070, src/emu/ios/Bridge/IosEmulator.mm:1100, src/emu/ios/Bridge/IosEmulator.mm:1115"
    note: "the data-storage folder is this folder itself, so roms and drives sit directly in it. The shipped patch and resources folders are read from the app bundle"
  windows:
    path: "<folder of eka2l1_qt.exe>"
    source_ref: "src/emu/qt/src/main.cpp:105-126"
    note: "the working directory the program is started from, which nothing changes on Windows"
  macos:
    path: "~/Library/Application Support/EKA2L1"
    source_ref: "src/emu/qt/src/main.cpp:105-126"
  linux:
    path: "$XDG_DATA_HOME/EKA2L1, else ~/.local/share/EKA2L1"
    source_ref: "src/emu/qt/src/main.cpp:105-126"

notes: |
  Symbian OS and N-Gage emulator: the EKA1 and EKA2 kernels are emulated and
  the critical application servers and libraries reimplemented in C++, while
  the ROM of a real phone supplies the rest of the operating system, so every
  device to emulate is built from a firmware dump. Covers the N-Gage and
  N-Gage 2.0 libraries and the game libraries from S60v1 to Symbian Belle. One
  tree builds the Qt desktop frontend, the Android and iOS applications, and a
  libretro core. The core lives on the libretro branch of the WizzardSK fork,
  rebased on the upstream revision named in its upstream.version, 11f5b6cd.
  content.cpp passes isolate_drives false to install_firmware and
  install_rom_with_optional_rpkg, so drives C, D and E are shared between
  devices.
  ref: README.md:20, README.md:29-32, src/emu/CMakeLists.txt:62-63,
       CMakeLists.txt:18, .gitlab-ci.yml:17-25, src/emu/libretro/CMakeLists.txt:40-46,
       src/emu/libretro/src/content.cpp:178-184,
       src/emu/system/src/installation/rpkg.cpp:208-210,
       src/emu/system/src/installation/firmware.cpp:290-293

  A device is registered in <storage>/devices.yml and holds its ROM image at
  <storage>/roms/<firmware code, lower case>/SYM.ROM with the unpacked ROFS
  tree beside it under <storage>/drives/z/<firmware code>/. Selecting the
  device opens that SYM.ROM, and a parse failure or a missing file makes set_device
  return false and nothing runs. The image is parsed for its root directory
  list and never checked against a size or a hash. <storage> is the
  data-storage option, "data" by default, relative to the working directory.
  ref: src/emu/system/include/system/consts.h:23-25,
       src/emu/system/src/epoc.cpp:1487-1495, src/emu/system/src/epoc.cpp:824-848,
       src/emu/loader/src/rom.cpp:281-299, src/emu/system/src/devices.cpp:177-202,
       src/emu/config/include/config/options.inl:45

  Three installers produce that layout from a dump. A bare ROM image is enough
  when it is an EKA1 image carrying one of the device naming files: product.txt,
  sw.txt or langsw.txt under z:\resource\versions, sw.txt or langsw.txt under
  z:\system\versions, or z:\system\install\sonyericssonp90xplatform.sis. That
  is the N-Gage case: its files are unpacked to drives/z/, the firmware code is
  read from them and the image is copied to SYM.ROM. Any other image needs
  the RPKG made by the Dumber tool beside it, which supplies the ROFS. A .vpl
  variant packing list names the .fpsx flash images of a factory firmware,
  from which the core image, the ROFS and the drive contents are extracted.
  The names of the dump files are free. SYM.ROM is the name the installers
  give the resident copy.
  ref: src/emu/system/src/installation/rpkg.cpp:44-68,
       src/emu/system/src/software.cpp:396-408,
       src/emu/system/src/installation/rpkg.cpp:132-199,
       src/emu/system/src/installation/rpkg.cpp:208-255,
       src/emu/system/src/installation/rpkg.cpp:257-259,
       src/emu/system/src/installation/firmware.cpp:290-293, 303,
       src/emu/system/src/installation/firmware.cpp:381-406,
       src/emu/system/src/installation/firmware.cpp:438-441,
       src/emu/system/src/installation/firmware.cpp:480-515

  Standalone, the Qt frontend installs through its device dialog, from a ROM,
  a ROM with its RPKG, or a VPL, and the settings dialog can also rescan drives/z/
  and rebuild devices.yml from the directories that still hold a SYM.ROM. A
  device installed with the isolate-drives box ticked keeps drives C, D and E
  under <storage>/drives/<firmware code>/ instead of <storage>/drives/. On
  Linux and macOS the working directory is the EKA2L1 folder of the user data
  location and the shipped patch, resources, scripts and compat folders are
  copied there at startup. On Windows it is the directory the executable is
  started from.
  ref: src/emu/qt/src/device_install_dialog.cpp:162-172,
       src/emu/qt/src/device_install_dialog.cpp:181-185,
       src/emu/qt/src/settings_dialog.cpp:535, src/emu/system/src/epoc.cpp:396-462,
       src/emu/qt/src/device_install_dialog.cpp:138,
       src/emu/system/src/devices.cpp:378-385, src/emu/system/src/epoc.cpp:877-884,
       src/emu/qt/src/main.cpp:106-126

  The libretro core keeps everything under <system>/eka2l1: data-storage is
  forced to that directory whatever config.yml carries. On retro_init, when no
  device is registered, <system>/eka2l1/firmware is scanned once and the first
  .vpl found is installed, otherwise the first .rom or .fpsx with the first
  .rpkg beside it. The result is saved to devices.yml and device 0 is selected.
  Without a device the core logs where the dump goes and refuses to start when
  the GL context arrives, so the firmware folder is required. Content is a
  .sis, .sisx or .n-gage package, installed on first load and remembered in
  <system>/eka2l1/libretro-content.txt against the UID it registered, or a
  .eka2l1 text shortcut naming the UID of an application already installed.
  supports_no_game is false. is_experimental is true in the .info.
  ref: src/emu/libretro/src/main.cpp:55-57, src/emu/libretro/src/state.cpp:12-17,
       src/emu/libretro/src/main.cpp:92-110, src/emu/libretro/src/content.cpp:129-195,
       src/emu/libretro/src/main.cpp:173-181, src/emu/libretro/src/main.cpp:72-73,
       src/emu/libretro/src/main.cpp:126-127, src/emu/libretro/src/content.cpp:203,
       src/emu/libretro/src/content.cpp:350-355

  At this revision the libretro build stages none of the shipped resource
  folders and never calls set_runtime_resource_root, so the GL shaders, the
  compat folder and panic.json are looked up relative to the process working
  directory. It calls neither initialize_user_parties nor mount for drive Z
  and creates no audio or controller driver, so the patch libraries, the Lua
  scripts, the MIDI banks and the controller database are not read there.
  Those entries carry mode standalone.
  ref: src/emu/libretro/CMakeLists.txt:8-80, src/emu/libretro/src/thread.cpp:20-61,
       src/emu/libretro/src/thread.cpp:87-93,
       src/emu/common/src/path.cpp:427-450, src/emu/system/src/epoc.cpp:1389-1410

  Shipped runtime files are read at their own name below the working
  directory. Patch libraries: every patch/*.map is parsed, the DLL is
  <map name>_<version suffix>.dll for the device's Symbian version upward,
  stopping at 8.1a on an EKA1 device, then <map name>_general.dll on EKA2
  only. A map naming a source picks that DLL prefix, a map requiring host-tls
  is skipped below S60v3 FP1, and a missing folder is skipped. A map routes exports
  of the original DLL to the patch DLL and is dropped when it holds no route
  for the device's version. A map whose requirements carry replace holds no
  route: its DLL is loaded in place of the image of that name, and with
  qt-plugin only when the Qt plugin verification data of the original accepts
  it. goommonitor_general.dll and avkonfep_general.dll are reached by no map:
  when patch/ holds them, the Qt and Android frontends copy them over the
  ROM's own Z:\sys\bin DLL, kept as .bak, from S60v5 and from S60v3 FP1
  on. Shaders:
  the eight files under resources are compiled by the OpenGL driver at start
  and an unreadable one leaves the program without source. The upscale filter
  named in an application's screen-upscale setting is read from
  resources/upscale/<name>.frag, and the 21 filters ship from the upscale-shaders
  submodule, pinned at 49dd304c. MIDI: resources/defaultbank.sf2 feeds the
  TinySoundFont player and resources/defaultbank.hsb the miniBAE player, the
  paths being the sf2-bank-path and hsb-bank-path options. SDL2 controller
  mappings come from resources/gamecontrollerdb.txt. compat/panicBlackList.json
  names thread panics to swallow and compat/<UID>.yml carries per-application
  settings. panic.json holds the panic category descriptions. Lua scripts under
  scripts/ are loaded when the build carries LuaJIT and require the eka2l1.*
  modules from scripts/eka2l1/; the libretro recipe builds without it. Fonts
  the user imports live in <storage>/fonts and are added to the font store
  after the ROM fonts.
  ref: src/emu/kernel/src/libmanager.cpp:439-443, src/emu/kernel/src/libmanager.cpp:468-471,
       src/emu/kernel/src/libmanager.cpp:503-531, src/emu/kernel/src/libmanager.cpp:533-584,
       src/emu/kernel/src/libmanager.cpp:586-597, src/emu/kernel/src/libmanager.cpp:614-618,
       src/emu/kernel/src/libmanager.cpp:725-808, src/emu/kernel/src/libmanager.cpp:1219-1221,
       src/emu/qt/src/state.cpp:179-204,
       src/emu/drivers/src/graphics/backend/ogl/graphics_ogl.cpp:292-310,
       src/emu/drivers/src/graphics/backend/ogl/shader_ogl.cpp:184-189,
       src/emu/drivers/src/graphics/backend/ogl/graphics_ogl.cpp:425-437,
       src/emu/drivers/src/audio/backend/tinysoundfont/player_tsf.cpp:66-77,
       src/emu/drivers/src/audio/backend/minibae/player_minibae.cpp:86-96,
       src/emu/config/include/config/options.inl:72-73,
       src/emu/drivers/src/input/backend/emu_controller_sdl2.cpp:143-145,
       src/emu/config/src/panic_blacklist.cpp:27-35, src/emu/config/src/app_settings.cpp:82-114,
       src/emu/utils/src/panic.cpp:32-38, src/emu/scripting/src/manager.cpp:196-202,
       src/emu/scripting/src/manager.cpp:230-256, src/emu/services/src/fbs/fbs.cpp:444,
       src/emu/services/src/fbs/impls/font.cpp:1185-1208, .gitlab-ci.yml:22,
       src/emu/qt/CMakeLists.txt:267-281, src/emu/qt/CMakeLists.txt:292-293,
       src/emu/qt/CMakeLists.txt:379-380, cmake/Symbian.cmake:20-31

  config.yml, bindings/<profile>.yml, devices.yml, the drives/ tree and
  libretro-content.txt are written by the emulator itself.
  ref: src/emu/config/src/config.cpp:344-350, src/emu/config/src/config.cpp:358-368,
       src/emu/system/src/devices.cpp:260-261

