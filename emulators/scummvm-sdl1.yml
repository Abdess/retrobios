notes: |
  Standalone ScummVM at tag v2026.3.0, as RetroPie's scummvm-sdl1 package
  builds it: ./configure --enable-release --enable-vkeybd with SDL1
  (SDL_CONFIG=sdl-config), and --opengl-mode=none on the Raspberry Pi. The
  package then runs make install with --prefix set to its install
  directory. RetroPie's scummvm package builds the same tag the same way
  against SDL2 and reads the same files.

  Paths below are relative to that install prefix. configure sets datadir
  to ${datarootdir}/scummvm and passes it to the code as DATA_PATH
  (configure:391, configure:7462). OSystem_SDL::addSysArchivesToSearchSet
  adds DATA_PATH to the search set, four levels deep, then the current
  directory (backends/platform/sdl/sdl.cpp:639-652). base/main.cpp:281-291
  also adds the extrapath. RetroPie's launch script passes
  --extrapath=<prefix>/extra unless scummvm.ini already sets one, and
  copies the virtual keyboard packs there. Every file is opened by name
  through this search set, so any of these directories, or the game
  directory, serves it.

  make install copies DIST_FILES_THEMES, DIST_FILES_VKEYBD,
  DIST_FILES_ENGINEDATA, DIST_FILES_ENGINEDATA_BIG and
  DIST_FILES_SOUNDFONTS to datadir (ports.mk:8-26, Makefile.common:400-471).
  The engine data list depends on the engines configure enables. A release
  build enables the engines marked yes in their configure.engine. Hashes
  below are those of the files in the tagged tree.

  Files the build does not read at this configuration: cryo.dat,
  macventure.dat and monkey4-patch.m4b belong to engines that default to
  off. fonts-imgui.dat needs ImGui, which RetroPie disables. wwwroot.zip
  needs SDL_net, which RetroPie's dependencies do not install. The engine
  GLSL shaders are installed only with USE_OPENGL_SHADERS.

  The MT-32 emulator reads the CM-32L pair first, then the MT-32 pair
  (audio/softsynth/mt32.cpp:286-301). ScummVM does not ship them.
  Without them MT-32 music is not available. Path extra/ is where
  RetroPie points the extrapath.

  An engine data file marked required is one whose engine refuses to start
  a game without it. Other engines and the launcher run without it.

