emulator: Stone Soup
type: libretro
core_classification: frozen_snapshot
source: "https://github.com/libretro/crawl-ref"
upstream: "https://github.com/crawl/crawl"
profiled_date: "2026-03-25"
source_commit: "cc2530f377a3a5d686d4b6a360d88b01de0fbc59"
upstream_commit: "a5ed93406571b9682050cfc318b15b9f637d4e7e"
core_version: "0.16-a0"
version_basis:
  kind: file
  path: "crawl-ref/source/build.h"
  pattern: '#define\s+CRAWL_VERSION_SHORT\s+"([^"]+)"'
display_name: "Dungeon Crawl Stone Soup"
cores: [stonesoup]
systems: []

notes: |
  Roguelike dungeon crawler. Fork frozen at DCSS 0.16-a0.
  Last libretro commit: Oct 2019. Marked experimental.

  Accepts .crawlrc config files as content (supported_extensions: crawlrc).
  The libretro wrapper sets -dir to the content directory.
  ref: crawl-ref/libretro/libretro.cc:178-198 (main_wrap() passes -dir content_dir)

  Game data loaded at runtime from dat/ tree via datafile_path().
  ref: crawl-ref/source/files.cc:375-458 (_get_base_dirs() + datafile_path())
  No DATA_DIR_PATH defined in Makefile.libretro, so it falls back to SysEnv.crawl_dir.
  Data is not compiled into the binary.

  dat/ tree contents (532 files, 16 MB):
  - dat/tiles/*.png (floor, wall, feat, player, main, gui, icons) (crawl-ref/source/tiletex.cc:89-97)
  - dat/DejaVuSans.ttf, dat/DejaVuSansMono.ttf (crawl-ref/source/fontwrapper-ft.cc:79)
  - dat/descript/*.txt, dat/database/*.txt (crawl-ref/source/database.cc:72-140)
  - dat/des/*.des (level generation) (crawl-ref/source/maps.cc:1457)
  - dat/dlua/*.lua, dat/clua/*.lua (crawl-ref/source/maps.cc:1465)
  - dat/defaults/ (settings)

  Not on buildbot.libretro.com/assets/system/.
  No divergence in file loading between upstream and libretro fork.

data_directories:
  - ref: stonesoup
    installed_on: [recalbox]
    source_ref: "crawl-ref/source/files.cc:375-458"

files: []
# no BIOS/firmware, game data loaded via data_directories
