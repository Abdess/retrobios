notes: |
  Frozen snapshot of MAME 0.139 (mid-2010). Sourced from mame0139s.zip.
  51 BIOS root sets. Upstream comparison (tag mame0139): BIOS root sets
  identical, romload.c modified (libretro_content_directory), hiscore.c
  added (not in upstream), cheat.c modified (cheatpath global).

  hiscore.dat is embedded in binary (precompile/hiscore_dat.h). External
  hiscore.dat loadable via core option mame-external_hiscore from
  system_dir/mame2010/. cheatpath declared but never initialized in
  libretro port (cheat loading non-functional). Samples in
  system_dir/mame2010/samples/.

  ROMs are opened with libretro_content_directory as the search path,
  the folder of the loaded game (src/emu/romload.c:667-685,
  src/osd/retro/retromain.c:552-554). The BIOS root sets sit beside the
  games.

  ROM naming follows MAME 0.139 conventions.

files:
  # Data files (system_dir/mame2010/)
  - name: hiscore.dat
    installed_on: [recalbox, retrobat]
    path: "mame2010/hiscore.dat"
    required: false
    system: arcade
    category: game_data
    sha1: "17b8b03a89d8443927aa92ede799e117b4ab6fdb"
    md5: "bb8023a43e357b7f0cc06bf00f0470b2"
    size: 202298
    source_ref: "source src/emu/hiscore.c:25, 136-150, 304-358, source src/emu/machine.c:362-363"
    note: >-
      high score definitions, embedded in binary by default, external via core
      option mame-external_hiscore. metadata/hiscore.dat of the core repository,
      the same bytes as the embedded precompile/hiscore_dat.h. is_mem_range
      reads only "cpu:addr:len:start:end" lines under a "gamename:" header.

  - name: cheat.zip
    installed_on: [recalbox, retrobat]
    path: "mame2010/cheat.zip"
    required: false
    category: game_data
    system: arcade
    source_ref: "source src/emu/cheat.c:1027"
    note: "per-game XML cheat files in ZIP, cheatpath never initialized in libretro port (non-functional)"

  # SNK Neo Geo MVS/AES
  - name: neogeo.zip
    required: true
    category: bios_zip
    load_from: content_dir
    system: snk-neogeo-mvs
    note: "MVS/AES BIOS, 21 variants (11 official + 10 Universe BIOS up to 2.3)"
    source_ref: "source src/mame/drivers/neodrvr.c:565-614"
    contents:
      - name: sp-s2.sp1
        description: Europe, default
      - name: usa_2slt.bin
        description: US, 2 slot
      - name: asia-s3.rom
        description: Asia
      - name: vs-bios.rom
        description: Japan VS
      - name: sp-45.sp1
        description: MV1C Asia
        size: 524288
      - name: sm1.sm1
        description: Z80 sound, always required
      - name: sfix.sfix
        description: fix tiles, always required
      - name: 000-lo.lo
        description: zoom table, always required

  # IGS PGM
  - name: pgm.zip
    required: true
    category: bios_zip
    load_from: content_dir
    system: igs-pgm
    note: "PGM system BIOS, 2 program ROM versions + shared tiles/samples"
    source_ref: "upstream src/mame/drivers/pgm.c:1525-1533"
    contents:
      - name: pgm_p02s.u20
        description: 68K BIOS v2, default
      - name: pgm_p01s.u20
        description: 68K BIOS v1
      - name: pgm_t01s.rom
        description: text tiles
        size: 2097152
      - name: pgm_m01s.rom
        description: samples
        size: 2097152

