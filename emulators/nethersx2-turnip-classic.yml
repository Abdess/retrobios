notes: |
  PlayStation 2 emulator for Android, package xyz.aethersx2.cturnip, activity
  xyz.aethersx2.android.EmulationActivity, version name v2.2n-3668, label
  NetherSX2 Classic (Turnip). It sits on the 3668 line: the library it starts
  from is NetherSX2 Classic v2.2n-3668, itself a patch of the AetherSX2
  v1.5-3668 package, and the library still names itself NetherSX2 v2.2n-3668
  (Classic). Everything below was read from the v0.7 package:
  lib/arm64-v8a/libemucore.so, libvulkad.so, the dex and the assets.
  ref: nethersx2-turnip-classic v0.7 AndroidManifest.xml,
       nethersx2-turnip-classic v0.7 libemucore.so 0xcdcba

  The package pairs two revisions of the project. libemucore.so is the blob the
  v0.7 commit carries, byte for byte; libvulkad.so is the one committed for
  v0.6 and reports its own build date. libhook_impl.so, libmain_hook.so and the
  six packed drivers are the same at both revisions. The shim rules described
  here are therefore those of the older revision, which this profile pins:
  SM8350, lahaina, sdm845 and napali still route to the a6xx-Patched driver,
  and SM6475, SM6650 and SM7325 are not known to it.
  ref: VulkanShim2/vulkan_shim.cpp:1027-1059,
       nethersx2-turnip-classic v0.7 libvulkad.so

  The patch rewrites twenty-four places in the library it starts from. Three are
  the strings libvulkan.so, libvulkan.so.1 and the message naming them, each
  turned into libvulkad.so, so the Vulkan loader opens the shim instead of the
  system driver. Sixteen turn comparisons into unconditional paths, among them
  the memchr scan for the twenty-two byte pattern that precedes the certificate
  test and two byte-wise string comparisons whose result is forced to equal,
  which is what lets the package be resigned under a new application id. Five
  move settings defaults: the renderer enum from 12 to 14, the upscale
  multiplier fallback from 1.0 to 2.0 with the configuration read
  short-circuited, the hardware download mode default, and the warning text that
  went with it. The same five sites carry their unpatched forms in the 4248
  library this project also starts from, which is what places them here rather
  than in the base. None of them is in a file loading path.
  ref: nethersx2-turnip-classic v0.7 libemucore.so 0x105f5b,
       nethersx2-turnip-classic v0.7 libemucore.so 0x829ae0-0x82a018,
       nethersx2-turnip-classic v0.7 libemucore.so 0x82d10c-0x82d5c0,
       nethersx2-turnip-classic v0.7 libemucore.so 0x82e41c,
       nethersx2-turnip-classic v0.7 libemucore.so 0x82fbac-0x82fcac,
       nethersx2-turnip-classic v0.7 libemucore.so 0x8034c4,
       nethersx2-turnip-classic v0.7 libemucore.so 0x833d04,
       nethersx2-turnip-classic v0.7 libemucore.so 0x83401c-0x834028,
       nethersx2-turnip-classic v0.7 libemucore.so 0x834cb0

  A BIOS image is required and boot stops without one, the application raising a
  startup error saying it needs a PS2 BIOS in the bios folder of the data
  directory. The data directory is getExternalFilesDir(null) with getDataDir()
  behind it, so it follows the application id, and the folder names under it
  come from the Folders section, Bios defaulting to bios. An image imported
  through the interface is written to that folder under the CRC32 of its
  contents, as %08X.bin.
  ref: nethersx2-turnip-classic v0.7 libemucore.so 0x8057dc,
       nethersx2-turnip-classic v0.7 libemucore.so 0x7dfaf0-0x7dfb10,
       xyz/aethersx2/android/NativeLibrary initializeOnce,
       xyz/aethersx2/android/NativeLibrary importBIOS

  Detection is by content. The scan lists the BIOS folder with a * mask, keeps
  files between 4194304 and 8388608 bytes, and accepts an image whose romdir
  carries a RESET entry followed by a readable ROMVER; the fifth ROMVER
  character gives the zone, A for USA, C for China, E for Europe, H for Asia,
  J for Japan, P for Free, T for T10K and X for Test, any other character
  standing for itself. The sixth character is read only to pick the word
  Console or Devel for the description, and the acceptance flag is set outright
  once ROMVER has been read, so development images pass with nothing patched
  here. RESET and ROMVER are the only two names the scan compares. An image
  named in the configuration is combined with the BIOS folder and opened at that
  path when it exists, without the size filter and without the romdir test. No
  name and no hash is matched anywhere. The image is read into the 4 MB ROM
  region and truncated to it, and one shorter than 2465792 bytes turns off the
  OSDSys parameter HLE.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:27-28,
       aethersx2/pcsx2/ps2/BiosTools.cpp:62-175,
       aethersx2/pcsx2/ps2/BiosTools.cpp:235-260,
       aethersx2/pcsx2/ps2/BiosTools.cpp:272-332,
       nethersx2-turnip-classic v0.7 libemucore.so 0x81bc00-0x81bc24,
       nethersx2-turnip-classic v0.7 libemucore.so 0x81be44-0x81c1c0,
       nethersx2-turnip-classic v0.7 libemucore.so 0x81b5e8-0x81b62c

  Companions derive from the selected image. rom1 and rom2 are appended to the
  full name first, then substituted for the existing extension, so an image at
  ps2-0230a-20080220.bin is followed by ps2-0230a-20080220.bin.rom1 then
  ps2-0230a-20080220.rom1. The nvm and the mec are read at the substituted
  extension only, and both are written with defaults when they are absent or too
  short. This code line loads no erom: the extension is named nowhere in the
  library and the boot path goes from rom2 straight to the IRX.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:193-218,
       aethersx2/pcsx2/CDVD/CDVD.cpp:120-144,
       aethersx2/pcsx2/CDVD/CDVD.cpp:158-226,
       nethersx2-turnip-classic v0.7 libemucore.so 0x81b688-0x81b9a4

  The network adapter opens eeprom.dat and flash.dat by bare name, so they
  resolve against the process working directory, which the application never
  sets. A compiled-in image stands in for the first and a card filled with 0xFF
  for the second. DEV9hdd.raw is the default name of the empty disk image its
  settings page writes. An IRX named in the configuration is read into the ROM
  region at 0x3C0000 at boot; the field is empty by default and names no file of
  its own.
  ref: aethersx2/pcsx2/DEV9/DEV9.cpp:73, aethersx2/pcsx2/DEV9/DEV9.cpp:145-160,
       aethersx2/pcsx2/DEV9/flash.cpp:76-103,
       aethersx2/pcsx2/ps2/BiosTools.cpp:220-233,
       nethersx2-turnip-classic v0.7 libemucore.so 0x7bb5cc-0x7bb680,
       nethersx2-turnip-classic v0.7 libemucore.so 0x81b9a4-0x81bac4

  The Vulkan path is the reason this build exists. libemucore.so opens
  libvulkad.so.1 then libvulkad.so where the stock library names libvulkan.so,
  and vkCreateInstance is resolved from it. That shim reads the Adreno model and
  the platform name from the kgsl sysfs nodes, picks one of six Turnip drivers
  packed beside it, creates a linker namespace over its own library directory
  and loads libhook_impl.so and libmain_hook.so into it. The system
  /system/lib64/libvulkan.so is then opened inside that namespace with its
  soname patched, so its own driver load lands in the hook, which opens the
  chosen Turnip driver instead of the vendor ICD. A driver present at
  /data/local/tmp/libvulkan_freedreno.so is tested first and wins over all six.
  When the namespace cannot be built the shim falls back to patching the system
  library's global offset table, and that path alone loads libbase.so,
  libcutils.so, libvndksupport.so and libhardware.so from the library directory.
  The shim derives the package name from its own library path and appends to
  vulkan_shim.log under the files folder of that package.
  ref: VulkanShim2/vulkan_shim.cpp:43-73,
       VulkanShim2/vulkan_shim.cpp:1008-1085,
       VulkanShim2/vulkan_shim.cpp:1107-1175,
       VulkanShim2/vulkan_shim.cpp:1179-1194,
       VulkanShim2/hook_impl.cpp:38-140,
       nethersx2-turnip-classic v0.7 libemucore.so 0x8a45ec-0x8a4624

  Resources are read out of the package itself. The library has no asset manager
  of its own and calls back into readPackageFile, readPackageFileToString and
  playSoundAsync, each taking an asset-relative name, so the game database, the
  patch archives, the interface fonts, the shader sources every backend compiles
  at startup and the achievement sounds are versioned with the build and never
  looked for on disk. The sound names are joined to a file:///android_asset base
  before they cross into Java. The game list draws its region flags and rating
  stars from the same assets. The game database is this build's own, and five of
  the shader sources differ from the ones the 4248 line carries: the OpenGL
  preamble, its format conversion and texture function fragment shaders, and the
  Vulkan texture function and format conversion shaders.
  ref: nethersx2-turnip-classic v0.7 libemucore.so 0x828110,
       xyz/aethersx2/android/NativeLibrary readPackageFile,
       xyz/aethersx2/android/NativeLibrary playSoundAsync

files:
  - name: ps2-0230a-20080220.bin
    path: bios/ps2-0230a-20080220.bin
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and a readable ROMVER is accepted,
      whatever its name. The 4 to 8 MB range gates the folder scan; an image
      named in the configuration skips both that range and the romdir test.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:27-28, aethersx2/pcsx2/ps2/BiosTools.cpp:235-260, nethersx2-turnip-classic v0.7 libemucore.so 0x81bc00-0x81bc24 (size window), nethersx2-turnip-classic v0.7 libemucore.so 0x81c1c0 (acceptance flag set outright)"

  - name: ps2-0230a-20080220.rom1
    path: bios/ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1. Read at 0x2404000 of the EE
      memory block and truncated to 4 MB. Logged and skipped when absent.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-218, nethersx2-turnip-classic v0.7 libemucore.so 0x81b688-0x81b810"

  - name: ps2-0230a-20080220.rom2
    aliases:
      - "SCPH-90006_BIOS_VX_HK _230.ROM2"
    path: bios/ps2-0230a-20080220.rom2
    required: false
    max_size: 524288
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1. Read at 0x2804000 of the EE memory block and
      truncated to 512 KB. Only present on Chinese region consoles.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-218, nethersx2-turnip-classic v0.7 libemucore.so 0x81b820-0x81b994"

  - name: ps2-0230a-20080220.nvm
    path: bios/ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    min_size: 1024
    validation: [size]
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm, opened r+b.
      Carries the console id, the iLink id, the language and the OSD
      configuration. A 1024 byte image is written when the file is missing or
      shorter, zeroed except for a fixed iLink id and the language defaults of
      the BIOS region.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:158-226, nethersx2-turnip-classic v0.7 libemucore.so 0x790470-0x7906c8, nethersx2-turnip-classic v0.7 libemucore.so 0x790820-0x790944"

  - name: ps2-0230a-20080220.mec
    path: bios/ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    min_size: 4
    validation: [size]
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Written as
      03 06 02 00 when the file is missing or shorter than 4 bytes.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:120-144, nethersx2-turnip-classic v0.7 libemucore.so 0x791700-0x7918f4"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    size: 64
    description: "DEV9 EEPROM"
    note: >-
      Opened O_RDWR by bare name when the network adapter starts and mapped over
      64 bytes. A compiled-in image stands in when the file is missing or cannot
      be mapped.
    source_ref: "aethersx2/pcsx2/DEV9/DEV9.cpp:73, aethersx2/pcsx2/DEV9/DEV9.cpp:145-160, nethersx2-turnip-classic v0.7 libemucore.so 0x7bb620-0x7bb680"

  - name: flash.dat
    required: false
    hle_fallback: true
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened rb by bare name at network adapter init and read as 1024 blocks of
      16 pages of 512 bytes plus 16 ECC bytes. The card is filled with 0xFF when
      the file is absent.
    source_ref: "aethersx2/pcsx2/DEV9/flash.cpp:76-103, nethersx2-turnip-classic v0.7 libemucore.so 0x7bb5cc-0x7bb61c"

  - name: "<module>.irx"
    required: false
    unsourceable: "any IOP module the user points at, under no name the code expects"
    description: "IOP module injected at boot"
    note: >-
      Opened at the path the configuration holds once it is four characters or
      longer, and read into the ROM region at 0x3C0000, capped at 0x40000 bytes.
      The field is empty by default and names no file of its own.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:220-233, aethersx2/pcsx2/ps2/BiosTools.cpp:327-328, nethersx2-turnip-classic v0.7 libemucore.so 0x81b9a4-0x81bac4"

