exclusion_note: >
  Left out are the libraries the package carries for the dynamic linker rather
  than for its own code. libc.so, libm.so, libdl.so, ld-android.so, liblog.so
  and libc++_shared.so sit beside the drivers so the namespace built over that
  directory can satisfy their DT_NEEDED, and no code path names any of them;
  android_linker_ns.o is a relocatable object nothing can open. libc++.so and
  libsync.so are named in the fallback and promote arrays but the package
  carries neither, and the promote call passes RTLD_NOLOAD, which never reads
  from disk. libfile_redirect_hook.so and libgsl_alloc_hook.so are reachable
  only under feature flags the shim never sets, the only flag passed being the
  custom driver one. The system Vulkan loader and libandroid.so come from the
  platform. Also left out are the assets no code path on this platform opens:
  game_controller_db.txt, whose name appears in neither the library nor the dex,
  pad input arriving through handleControllerButtonEvent and
  handleControllerAxisEvent; the seven Direct3D shader sources under
  shaders/dx11; icons/AppIconLarge.png and cover-placeholder.png;
  fonts/Roboto-Regular-copyright and sounds/achievements/README.txt, which are
  licence and credit texts; and dexopt/baseline.prof and baseline.profm, which
  the Android runtime consumes. Everything the emulator produces for itself
  under the data directory is out as well: memory cards as Mcd<nnn>.ps2 and
  Mcd-Multitap<n>-Slot<nn>.ps2, DEV9hdd.raw for the internal disk, save states,
  screenshots, covers, texture dumps, playtime.dat, emulog.txt, imgui.ini,
  per-game settings, input profiles, the gamedb and gl_programs caches, and
  vulkan_shim.log.
  ref: VulkanShim2/vulkan_shim.cpp:1099-1105, VulkanShim2/vulkan_shim.cpp:1150,
       VulkanShim2/vulkan_shim.cpp:1179-1194,
       nethersx2-turnip-classic v0.7 libemucore.so 0x4a8c7c
