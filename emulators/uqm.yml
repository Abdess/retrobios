notes: |
  The Ur-Quan Masters (UQM) is the open-source port of Toys for Bob's
  Star Control II, built from the sources Toys for Bob released in 2002.
  The engine runs on top of its own virtual filesystem (uio) and expects
  a content/ tree with a packages/ subdirectory holding zip archives
  renamed with the .uqm suffix.

  prepareContentDir() in src/options.c:136 searches for content/
  relative to the executable (default locations are CONTENTDIR, "",
  "content", "../../content"; macOS also probes the app bundle). A
  sentinel file content/version must exist (lines 138-150) or the game
  logs "Could not find content" and exits.

  mountContentDir() (src/options.c:329) mounts content/ at the uio root
  and then auto-mounts every .uqm file found under content/packages/ as
  an overlay archive (lines 354-359). The engine itself does not treat
  individual .uqm packages as mandatory; the fatal check is the
  content/ tree. In practice content/packages/uqm-0.8.0-content.uqm is
  "Core Data" in the Windows installer (uqm-installer.nsi:289-306,
  SectionIn 1 2 3 4 6) and the game is unplayable without it.

  3DO music (uqm-0.8.0-3domusic.uqm) and voice overs
  (uqm-0.8.0-voice.uqm) are optional sections (installer lines 315,
  329 - SectionIn 1 4 6). The four remix packs (uqm-remix-disc1.uqm
  through uqm-remix-disc4-1.uqm) are only in SectionIn 6 ("Full").

  content/base, content/addons and the two .key sentinel files
  (uqm.key, menu.key) are shipped verbatim in the source repository
  and are not external data; they are not listed here.

  MD5 and size values come from build/win32_install/packages.nsh,
  autogenerated by procpkgs.sh at release time; sizes are the KiB
  values the NSIS installer uses with AddSize.

