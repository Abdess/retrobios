version_basis:
  kind: file
  path: "sc2/src/uqmversion.h"
  pattern: '#define UQM_MAJOR_VERSION_S\s+"(\d+)"[\s\S]*?#define UQM_MINOR_VERSION_S\s+"(\d+)"[\s\S]*?#define UQM_PATCH_VERSION_S\s+"(\d+)"[\s\S]*?#define UQM_EXTRA_VERSION\s+"([^"]*)"'
  format: "{1}.{2}.{3}{4}"
display_name: "The Ur-Quan Masters"
cores: [uqm]
systems: [ur-quan-masters, star-control-2]

notes: |
  The Ur-Quan Masters (UQM) is the open-source port of Toys for Bob's
  Star Control II, built from the sources Toys for Bob released in 2002.
  The engine runs on top of its own virtual filesystem (uio) and expects
  a content/ tree with a packages/ subdirectory holding zip archives
  renamed with the .uqm suffix.

  prepareContentDir() in src/options.c:136 searches for content/
  relative to the executable (default locations are CONTENTDIR, "",
  "content", "../../content", while macOS also probes the app bundle). A
  sentinel file content/version must exist (lines 138-182) or the game
  logs "Could not find content" and exits.

  mountContentDir() (src/options.c:330-361) mounts content/ at the uio
  root and then mounts every .zip or .uqm file under content/packages/
  below it (line 357, mountDirZips at 463-489). The archive name is not
  read. LoadKernel then needs at least one .rmp index at the content
  root (src/uqm/setup.c:113-115), and without one the game logs "Could
  not load basic content", names uqm-0.8.0-content.uqm and exits
  (src/uqm/starcon.c:194-204). The content pack carries uqm.rmp and
  base/. A content/ tree that already holds them unpacked passes the
  same check, as the tree at this pin does.

  3DO music (uqm-0.8.0-3domusic.uqm) and voice overs
  (uqm-0.8.0-voice.uqm) are optional sections (installer lines 315,
  329, SectionIn 1 4 6). They go in content/addons/, not packages/:
  a .uqm there is mounted at "addons" (src/options.c:393-402) and
  loadAddon opens addons/3domusic, addons/3dovoice and addons/remix
  (options.c:518-551, uqm/setup.c:118-132). Placed in packages/ their
  files would sit at the root and the addon would not load. The four remix packs (uqm-remix-disc1.uqm
  through uqm-remix-disc4-1.uqm) are only in SectionIn 6 ("Full").

  content/base, content/addons and the two .key sentinel files
  (uqm.key, menu.key) are shipped verbatim in the source repository
  and are not external data, so they are not listed here.

  The engine checks no hash. The MD5 values come from
  build/win32_install/packages.nsh, autogenerated by procpkgs.sh at
  release time, and only the Windows installer compares them, offering
  a fresh download on a mismatch (uqm-installer.nsi:132-190).

