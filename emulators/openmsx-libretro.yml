notes: |
  The buildbot's openmsx core: openMSX 21.0 with a libretro frontend
  (src/libretro/), built from its own repository and branch. openMSX's data
  folder is <system>/openmsx/share and its user folder <saves>/openmsx
  (src/libretro/LibretroCore.cc:146-157). The core carries openMSX's share
  folder with the C-BIOS machines and ROMs and writes it there when it is
  new or differs (build/libretro_share.py, LibretroCore.cc:159-160), so a
  game starts on C-BIOS MSX2+ with nothing else (LibretroCore.cc:332).

  The Machine core option offers nine C-BIOS machines and twelve real ones,
  and each extension option every extension in share/extensions
  (LibretroCore.cc:633-640, 763-788). A real machine or an extension reads
  its system ROMs from the file pool, which holds share/systemroms below
  both folders and searches it recursively by sha1, whatever a file is
  named (src/file/FilePool.cc:21-33, src/file/FilePoolCore.cc:385,
  src/memory/Rom.cc:168-197). When the chosen machine or extension cannot
  start, the core starts C-BIOS without extensions (LibretroCore.cc:1044-1050).

  The Philips NMS 8245 reads two contents both named
  NMS8245SystemROM1.05.bin (share/machines/Philips_NMS_8245.xml:72-73,
  145-146): the second sits in a subfolder of share/systemroms, which the
  pool searches too. The MegaFlashROM SCC and SCC+ initial content is the
  flash the user writes, and the Lascom Kanji dummy ships in share.

