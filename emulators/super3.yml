exclusion_note: >
  No BIOS or firmware file is loaded. Sega Model 3 hardware has no shared system ROM:
  each board carries its own program, video, sound and where fitted drive board, MPEG
  program and MPEG music ROMs, and every one of them reaches the emulator as a region of
  a per-game MAME format zip declared in Games.xml, a child set drawing its remaining
  regions from its parent's zip in the same directory. The three files listed above are
  the emulator's own configuration, reinstalled from the package assets before every
  launch. Config/Music.xml and the two crosshair bitmaps in Assets are shipped by the
  package as well and read by no code in this build.
