    description: "Game and ROM set definitions"
    note: >-
      The ROM set database, 63 games, giving for each one the regions to fill and the
      name and crc32 of every file that fills them, the stepping, the PCI bridge, the
      encryption key, the drive board, net board and MPEG board the machine carries, the
