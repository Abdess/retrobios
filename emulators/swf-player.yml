exclusion_note: >
  Four files the package carries are left out because no code path opens them. The assets
  cached.swf, Hello2.swf and empty.html are named in no class; the cached.swf the AIR
  runtime reads is the copy of the user's movie written into the cache, not the one in the
  assets. libysshared.so, which exports only ysEncrypt and ysDecrypt, is loaded by nothing:
  the three loadLibrary calls in the package name swfplayer, c++_shared and Core, no
  library declares it as a DT_NEEDED, and its soname appears nowhere in the class tree. The
  market link to com.adobe.flashplayer is not a dependency either, being an intent to the
  store page rather than a load of Adobe's plugin.
