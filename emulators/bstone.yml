notes: |
  Source port of Blake Stone: Aliens of Gold and Blake Stone: Planet Strike.

  The engine accepts nine data sets, each a table of file names and SHA-1
  values in src/bstone/src/id_ca.cpp:1493-1688: Aliens of Gold shareware
  v1.0, v2.0, v2.1, v3.0 (.BS1), Aliens of Gold registered v1.0, v2.0, v2.1,
  v3.0 (.BS6) and Planet Strike (.VSI). has_content
  (src/bstone/src/jm_free.cpp:197-220) opens every file of a table, hashes
  each one and rejects the set on the first mismatch, so the files of one
  directory must all belong to the same version. Within a game the versions
  are tried in the order v2.1, v3.0, v2.0, v1.0
  (src/bstone/src/jm_free.cpp:222-356).

  find_contents (src/bstone/src/jm_free.cpp:626-773) looks for the three
  games, or only the one forced by --aog, --aog_sw or --ps, in these
  directories in order:
    1. the --data_dir directory, when given
    2. the working directory
    3. the profile directory (--profile_dir, else the per-user data path)
    4. the GOG install directories (Windows registry)
    5. the Steam install directories (Windows registry)
  One complete set is enough. With none the engine stops on "Content not
  found." (src/bstone/src/jm_free.cpp:754); with several games found it asks
  which one to play. No single file is required on its own.

  Each file is opened under its upper-case name first, then under the
  lower-case name (src/bstone/src/id_ca.cpp:940-961).

  A --mod_dir directory is searched before the data directory for every
  resource. A MAPTEMP file found there replaces the level hash, unless it is
  the official level file of another version, which is refused
  (src/bstone/src/jm_free.cpp:918-950).

