notes: |
  Blake Stone source port by bibendovsky, covering Aliens of Gold (shareware
  v1.0/v2.0/v2.1/v3.0 and registered v1.0/v2.0/v2.1/v3.0) plus Planet Strike.

  The engine identifies the installed game by SHA1-hashing every file in the
  content directory against a hardcoded resource table in id_ca.cpp.
  Assets::get_aog_sw_v1_0_resources, get_aog_sw_v2_0_resources,
  get_aog_sw_v2_1_resources, get_aog_sw_v3_0_resources,
  get_aog_full_v1_0_resources through get_aog_full_v3_0_resources, and
  get_ps_resources (id_ca.cpp:1493-1687) each list one shipping variant.
  has_content() in jm_free.cpp:195-220 opens every file in the chosen set and
  fails the match on the first SHA1 mismatch.

  Search paths come from the command line (-aog_dir, -ps_dir), the Steam install
  (bstone_steam_content_path.cpp) and the GOG install (bstone_gog_content_path.cpp)
  before the current working directory. File names carry the game suffix:
    .BS1  Aliens of Gold shareware
    .BS6  Aliens of Gold registered
    .VSI  Planet Strike

  Every file in a set is required; the game refuses to start otherwise. Levels
  are checked separately: a modded-levels hash saves to the player data instead
  of being refused (jm_free.cpp:934-946).

  No separate BIOS. BStone requires one of the three retail/shareware data sets.

