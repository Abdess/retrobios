notes: |
  Closed-source emulator by Aaron Giles for LucasArts, Lucasfilm Games and
  Lucas Learning titles, shipped as a single executable for Windows, macOS and
  Linux on x64 and ARM64. The game database is compiled in: 67 definitions
  covering 1013 variants, keyed on machine = pc, fmtowns or tandy and
  osenv = dos, windows or fmtowns. Windows titles run on a reimplemented Win16
  and Win32 layer carried inside the executable. The game directory is passed
  on the command line and the title is detected from its contents.
  ref: DREAMM 4.0 linux-x64, appended zip game/*.dreamm

  Support files live in the SDL preference path for organisation
  "Aaron Giles" and application "DREAMM":
  %APPDATA%\Aaron Giles\DREAMM on Windows,
  ~/Library/Application Support/Aaron Giles/DREAMM on macOS,
  $XDG_DATA_HOME/Aaron Giles/DREAMM on Linux. Paths below are relative to that
  directory. Startup writes config.json and creates install, gamedelta,
  screenshots, logs and sounddata.
  ref: SDL_GetPrefPath; strace of DREAMM 4.0 linux-x64 with a clean HOME

  Audio hardware is set per game and per variant: speaker, cms, adlib, sb16,
  tandy, mt32 and gmidi. MT-32 and General MIDI output can go to an external
  MIDI device, to the OPL MIDI generator or to a SoundFont, so no ROM file is
  needed to play any title. ROMs add the two hardware synthesiser options.
  ref: game/*.dreamm audiohw; "Expected one of 'speaker', 'cms', 'adlib',
       'sb16', 'mt32', or 'gmidi' in audiohw"

  MT-32 and CM-32L are emulated by a bundled munt build, unpacked at runtime
  to sounddata/mt32emu-dreamm.so and driven through mt32emu_get_service_i.
  Twelve ROM sets are declared in a table of twelve 64-byte records holding
  display name, id, control ROM full image, control chips A and B, PCM full
  image and PCM low and high halves: MT-32 v1.04, v1.05, v1.06, v1.07, Blue
  Ridge Enhanced, v2.03, v2.04, v2.06, v2.07, CM-32L v1.00, CM-32L v1.02 and
  CM-32LN v1.00. A set is offered once a control ROM is present as the full
  image or as both chips, and a PCM ROM is present as the full image or as
  both halves. The CM-32L sets name cm32l_pcm.rom as the full image,
  mt32_pcm_l.rom as the low half and cm32l_pcm_h.rom as the high half. munt
  identifies each file by size then SHA1 before opening the synth.
  ref: set table 0x23db4a8, id lookup 0x164d050, availability 0x164d2a8;
       munt ROMInfo.cpp:206-214 ROMInfo::getROMInfo

  The SC-55 is emulated by the Nuked SC-55 CLAP plug-in, unpacked to
  sounddata/Nuked-SC55.clap, which reads one model directory under
  Nuked-SC55-Resources/ROMs. Five models are probed at startup: SC-55 v1.00,
  v1.20, v1.21, v2.00 and SC-55mk2 v1.01. The plug-in identifies a set by
  hashing the directory contents, so its own loader does not depend on the
  file names.
  ref: strace of DREAMM 4.0 linux-x64; Nuked-SC55-CLAP nuked_sc55.cpp:145-212
       GetRomBasePaths and Init, rom_loader.cpp:31-80 DetectRomsetsByHash

  Both families install by dropping files on the Manage Sound Fonts & ROMs
  screen, or by copying them into sounddata by hand. A dropped file is matched
  against a 51-entry manifest of {crc32, size, name} sorted by name: one path
  resolves a file by name and checks its size then its CRC32, the other maps a
  size and CRC32 back to the destination paths listed below. The manifest
  sizes agree with the bundled munt ROM table. mt32_ctrl_2_03.rom is named by
  the v2.03 set but has no manifest entry, so it loads from sounddata and
  cannot be installed by drag and drop.
  ref: manifest 0x23daf78, name match 0x16456a0, reverse lookup 0x1645880;
       "To install Sound Fonts (.sf2 files) or ROMs for Roland MIDI emulation,
       drop them onto this screen."

  SoundFonts are read from sounddata as well: the directory is scanned at
  startup and every .sf2 found becomes a MIDI output option for both MT-32 and
  GMIDI. No name and no hash is compiled in and the file keeps the name it
  arrived with, so none is listed below.
  ref: sounddata scan; "Error loading soundfont '{}': {}", "Font file '{}'
       seems to be an MT-32 set, not compatible with GMIDI"

  Everything else the emulator reads is appended to the executable and
  unpacked at runtime: the game definitions and their icons, the copy
  protection artwork, gamecontrollerdb.txt, the shaders, the UI fonts and
  images, the two synthesiser plug-ins, and the Win16 and Win32 system files,
  fonts and sounds.
  ref: appended zip, 488 entries

