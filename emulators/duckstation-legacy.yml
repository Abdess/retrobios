notes: |
  DuckStation as of August 2023, from before its licence change, kept as a
  separate package. Batocera builds it with its own path patches: the BIOS
  directory becomes /userdata/bios, the shared BIOS root, and the resources
  directory /usr/share/duckstation/resources.
  ref: Batocera package/batocera/emulators/duckstation-legacy/duckstation-legacy.mk:6-7,
       Batocera package/batocera/emulators/duckstation-legacy/004-adjust-paths.patch

  A BIOS file is any file of 512 KB, 4 MB (PS2) or 0x3E66F0 bytes (PS3) in the
  BIOS directory. Only its first 512 KB are read, and their MD5 is looked up
  in a table of 29 images. A file carrying "OpenBIOS" at offset 0x78 is
  recognised by that signature instead. With no file configured for the
  console region, the directory is scanned and the first image whose region
  matches, or whose table region is Auto, is used. Otherwise the first known
  image found, else the first unknown one, stands in with a warning, and an
  empty directory stops the boot with "No BIOS image found". The table has no
  priority field: the scan order decides between matching images.
  ref: src/core/bios.h:15-17, src/core/bios.cpp:45-91, src/core/bios.cpp:95-97,
       src/core/bios.cpp:108-137, src/core/bios.cpp:145-167,
       src/core/bios.cpp:276-377

  KNULLI's launcher sets BIOS SearchDirectory to /userdata/bios and fills
  PathNTSCU, PathPAL and PathNTSCJ with the first name it finds from three
  lists, refusing to start when none exists. A configured path is loaded by
  name and only warned about when its image does not match the region.
  ref: KNULLI package/system/knulli-configgen/configgen/configgen/generators/duckstation_legacy/duckstationLegacyGenerator.py:116-153,
       src/core/bios.cpp:296-315

  Fast boot and TTY patching are refused for the two PS3 images, the table's
  only entries marked not patch compatible.
  ref: src/core/system.cpp:1280, src/core/system.cpp:1306

