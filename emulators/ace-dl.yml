notes: |
  SDL port of ACE, the Amstrad CPC/Plus emulator written by Philippe Rimauro
  (OffseT) for MorphOS. ACE-DL is built by Edouard Bergé (Roudoudou) from the
  MorphOS sources and released for Windows, macOS, Linux and Raspberry Pi.
  The sources are private. Every entry below was read from the stripped
  Linux x86-64 executable AceDL of the 2026/10/16 BNDGEN.tar.gz (tarball
  sha256 4f3567bb2196e32f, AceDL sha256 0f159a705028e80e). The binary has no
  symbols, so functions are named FUN_<address> (file offset = virtual
  address in this PIE).

  Machines are CPC 464, 664 and 6128 plus the Plus range, which boots from a
  cartridge and covers the GX-4000. An operating system is one file read by
  FUN_248970 as two 16 KB halves, the firmware ROM then the BASIC ROM, each
  fread having to return 0x4000 bytes. A shorter file is refused, bytes past
  32 KB are ignored. ACE-DL ships them pre-joined under private/firmware/,
  one file per machine and language:

    OS464_UK.rom        Firmware v1 + BASIC 1.00
    OS464_FR.rom        Firmware f1 + French BASIC 1.0 (md5 824f5213...)
    OS664_UK.rom        Firmware v2 + BASIC 1.10
    OS6128_UK.rom       Firmware v3 + BASIC 1.20
    OS6128_FR.rom       Firmware f3 + BASIC 1.23
    OS6128_S.rom        Firmware s3 + BASIC 1.21
    OS6128_DK.rom       Firmware d3 + BASIC 1.20
    XMEM_FW_3_15_UK.rom XMEM 3.15 firmware + BASIC 1.20
    XMEM_FW_3_15_FR.rom XMEM 3.15 firmware + BASIC 1.23

  Firmware versions run 1 to 4 for the 464, 664, 6128 and Plus, and the letter
  is the country: v English, f French, s Spanish, d Danish.

  main (FUN_3a479) builds OS6128_UK.rom and Amsdos.rom from the application
  directory and creates the machine with them before the config file is read.
  If either load fails the machine constructor returns NULL, main prints
  "Initialisation Error should not happend" and the next call dereferences
  the NULL machine, so startup dies. Afterwards the OS= config key
  (FUN_2a4840) loads the path it holds, the firmware requester (FUN_373ad0)
  lists every *.rom under private/firmware/ and loads the pick, and -fuk,
  -ffr, -fsp, -fdk (FUN_345230, applied by FUN_2989f0 after the config) load
  one of the four 6128 files. These three paths keep the current firmware
  when the load fails. The Machine configuration page (FUN_377790) names the
  loaded firmware by comparing its basename with the nine names above.

  Two older code paths switch firmware by RAM size, 64 KB for a 464 or 664,
  more for a 6128, keeping the language through a strstr for "FR" in the
  current path: the SNA loader (FUN_369ce0) opens ./private/firmware/OS464_FR,
  OS464_UK, OS664_UK, OS6128_FR or OS6128_UK and the RAM selector
  (FUN_377790) opens the same names under ./firmware/, both without
  extension and relative to the working directory. When the open fails the
  current firmware stays.

  Plus system cartridges are loaded by the CPR loader FUN_234870, reached
  from the media loader FUN_2a30a0 on a .cpr extension (command line,
  CARTRIDGE= config key, dropped file). No code names the three
  Amstrad_?4.cpr files.

  Plugins pull three more ROMs, each from a path under the application
  directory, loaded when the PLUGIN_ key is 1 in the config file (FUN_2a4840)
  or from the plugin menu (FUN_375320). Multiface II and Play2CPC are also
  reachable with -plugin multiface2 and -plugin play2cpc. A missing
  Multiface II or Hacker ROM leaves the plugin uninstalled, a short one also
  clears its PLUGIN_ flag. A missing YM2608 ROM is reported and Play2CPC runs
  without the rhythm samples. The Windows x64 package omits that ROM, the
  Linux packages carry it.

  Expansion ROMs are user business: config keys ROM0 to ROM255 hold whatever
  the user picks through the requester rooted at media/rom/, loaded by
  FUN_248ae0 with the ROM type check. Disc, tape, snapshot, Dandanator and
  X-MASS images are user content the same way, and the Nova plugin
  regenerates its 32 KB private/Nova/nova.nvram when the file is absent.
  Outside emulation the binary loads its own payload: QOI images, WAV drive
  and monitor samples, and the private/messages catalog.

