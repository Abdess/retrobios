emulator: ACE-DL
type: standalone
core_classification: community_fork
source: "https://roudoudou.com/ACE-DL/"
upstream: "http://ace.cpcscene.net"
profiled_date: "2026-08-08"
core_version: "2026-06-03"
display_name: "Amstrad - CPC/Plus (ACE-DL)"
cores:
  - ace-dl
  - acedl
systems:
  - amstrad-cpc
mode: standalone

notes: |
  SDL port of ACE, the Amstrad CPC/Plus emulator written by Philippe Rimauro
  (OffseT) for MorphOS. ACE-DL is built by Edouard Bergé (Roudoudou) from the
  MorphOS sources and released for Windows, macOS, Linux and Raspberry Pi;
  a third port targets Haiku. All three are closed source, the original author
  keeps the sources private, so the entries below were established on the
  official 2026-06-03 Linux x86-64 build: path constants read from the binary,
  file opens traced with strace, and required/optional decided by removing each
  file and observing the result.

  Machines are CPC 464, 664 and 6128 plus the Plus range, which boots from a
  cartridge and covers the GX-4000. An operating system is one 32 KB file
  holding the 16 KB firmware ROM followed by the 16 KB BASIC ROM; the AMSDOS
  disc ROM is a separate 16 KB file mapped in slot 7. The upstream MorphOS
  release keeps the three ROMs apart under System/ and composes them at
  startup, ACE-DL ships them pre-joined under private/firmware/ with one file
  per machine and language. The pairs are exact:

    OS464_UK.rom        Firmware v1 + BASIC 1.00
    OS464_FR.rom        Firmware f1 + French BASIC 1.0 (md5 824f5213…)
    OS664_UK.rom        Firmware v2 + BASIC 1.10
    OS6128_UK.rom       Firmware v3 + BASIC 1.20
    OS6128_FR.rom       Firmware f3 + BASIC 1.23
    OS6128_S.rom        Firmware s3 + BASIC 1.21
    OS6128_DK.rom       Firmware d3 + BASIC 1.20
    XMEM_FW_3_15_UK.rom XMEM 3.15 firmware + BASIC 1.20
    XMEM_FW_3_15_FR.rom XMEM 3.15 firmware + BASIC 1.23

  Firmware versions run 1 to 4 for the 464, 664, 6128 and Plus, and the letter
  is the country: v English, f French, s Spanish, d Danish. The BASIC revision
  attached to a version 3 firmware follows the country, 1.23 for France, 1.21
  for Spain, 1.20 elsewhere, which is what the pairs above show. The XMEM files
  replace the firmware half with the X-MEM expansion firmware and keep the
  stock BASIC.

  The nine operating systems are the entries of the Machine configuration
  selector. OS6128_UK.rom is the built-in default and is opened at every
  startup even when the config OS= key names another file. Command line -fuk,
  -ffr, -fsp and -fdk switch to the UK, French, Spanish and Danish 6128 files.
  A machine needs at least 32 KB in the file: truncated to 16384 bytes the
  emulator prints "Error initializing ROMs!" and dies, padded to 40000 bytes it
  boots, so the check is a lower bound rather than an exact length. The AMSDOS
  ROM is checked for presence only, an 8 KB stub boots.

  Plus machines boot from a cartridge and no cartridge filename is compiled
  into the binary, the three Amstrad_?4.cpr files are the system cartridges the
  author ships in the same directory, which is also the default browse root of
  the cartridge requester. The loader walks the RIFF chunk list and reports
  "Cartridge Load Error (Header)" on a bad header and "truncated file!" when a
  cb00..cb07 bank is short, each bank being 16 KB for 128 KB total.

  Plugins pull three more ROMs. Multiface II reads multiface2.rom, the Hacker
  plugin reads hackit400uk.rom in its UK flavour and hacker481fr.rom in its
  French one, and Play2CPC reads the YM2608 ADPCM rhythm ROM, warning with
  "ym2608_adpcm_rom.bin not found!" and running without it. The Windows package
  omits that ROM, the Linux and Raspberry Pi packages carry it.

  Expansion ROMs are user business: config keys ROM0 to ROM255 hold whatever
  the user picks through the requester rooted at media/rom/, and the release
  seeds that directory with third-party ROMs (ParaDOS, Protext, Maxam, Utopia,
  uniDOS, SymbOS, FutureOS, Orgams, Discology and others). Disc, tape,
  snapshot, Dandanator and X-MASS images are user content the same way, and the
  Nova plugin regenerates its 32 KB private/Nova/nova.nvram when the file is
  absent. Outside emulation the binary loads its own payload: seventeen QOI
  images, fatal with "Error loading QOI file please reinstall"; seventeen WAV
  drive and monitor samples, each merely reported as not found; and the
  private/messages catalog holding the French, English and Spanish
  translations. private/sounds/hitachi_long_seek.wav ships with every package
  but appears in no path constant and is never opened.

