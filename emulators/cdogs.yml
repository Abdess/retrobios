emulator: C-Dogs SDL
type: standalone
core_classification: game_engine
source: "https://github.com/cxong/cdogs-sdl"
upstream: "https://github.com/cxong/cdogs-sdl"
profiled_date: "2026-10-04"
source_commit: "57782a74ae245d868487094d201d0e56e94a9390"
core_version: "2.4.0"
display_name: "C-Dogs"
cores: [cdogs, cdogs-sdl]
systems: []
verification: existence

notes: |
  Top-down shooter engine, open-source remake of the DOS C-Dogs by Ronny Wester.
  The repository ships every asset the engine reads: data/, graphics/,
  missions/, dogfights/, music/, sounds/ and doc/.

  The data root is baked into the binary through -DCDOGS_DATA_DIR. The
  source default is "../" ("./" on GCW0), CMakeLists.txt:141-147; Batocera
  sets it to /userdata/roms/cdogs/. GetDataFilePath(), src/cdogs/utils.c:392,
  returns an absolute request as it is, and otherwise joins CDOGS_DATA_DIR
  (under the working directory when it is relative) with the requested path.

  Paths below are written under cdogs/, which stands for that data root.

  What the engine reads there:
    data/: the JSON class definitions and name lists loaded by main(),
      src/cdogs.c:226-245, and the two controller databases,
      src/cdogs/joystick.c:43-54
    data/.wolf3d/: campaign templates used when a Wolfenstein 3D, Spear of
      Destiny or Super 3D Noah's Ark installation is found,
      src/cdogs/map_wolf.c:50
    graphics/: every .png, walked by PicManagerLoad,
      src/cdogs/pic_manager.c:247-254, plus the font and the window icon
    missions/ and dogfights/: campaigns, src/cdogs/campaigns.c:203-211
    music/: six track directories, src/cdogs/music.c:45-50
    sounds/: samples, src/cdogs.c:213
    doc/CREDITS: src/credits.c:47

files:
  - name: "ammo.json"
    path: "cdogs/data/ammo.json"
    category: game_data
    description: "Ammo type definitions"
    required: true
    bundled: true
    source_ref: "src/cdogs.c:228, src/cdogs/ammo.c:77-84"

  - name: "bullets.json"
    path: "cdogs/data/bullets.json"
    category: game_data
    description: "Bullet behaviour definitions"
    required: true
    bundled: true
    source_ref: "src/cdogs.c:230-232, src/cdogs/weapon_class.c:739-746"

  - name: "guns.json"
    path: "cdogs/data/guns.json"
    category: game_data
    description: "Weapon definitions"
    required: true
