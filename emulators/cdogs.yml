notes: |
  Top-down shooter engine, open-source remake of the DOS C-Dogs by Ronny Wester.
  Ships every asset it needs in-tree: data/, graphics/, missions/, music/,
  sounds/, dogfights/, doc/, wiki/ (about 100 MB).

  The data root is baked into the binary via -DCDOGS_DATA_DIR (CMakeLists.txt
  option). Batocera sets it to /userdata/roms/cdogs/; the Linux source default
  is cdogs-data. GetDataFilePath() in src/cdogs/utils.c:392 either returns an
  absolute override as-is, or joins the current working directory with
  CDOGS_DATA_DIR plus the requested relative path.

  Top-level sub-trees the game pulls files from (every path is relative to
  CDOGS_DATA_DIR, resolved through GetDataFilePath):
    data/           — ammo.json, bullets.json, guns.json, pickups.json,
                      map_objects.json, character_classes.json, particles.json,
                      gamecontrollerdb.txt, prefixes.txt (configuration data)
    graphics/       — sprites, font, icons; grafx.c:92 (cdogs_icon.bmp),
                      grafx.c:156 (font.png + font.json)
    missions/       — single-player campaigns, mission packs (JSON)
    music/          — menu, briefing, game, end, lose, victory tracks
                      (music.c:45-50 LoadMusic calls)
    sounds/         — sfx wavs
    dogfights/      — deathmatch arenas

  All open-source content (GPL-2.0). No separate BIOS or retail data required.

