notes: |
  Arcade emulator for the PlayStation based boards: Sony ZN-1 and ZN-2 (Capcom,
  Tecmo, Taito FX-1, Raizing/Eighting, Atlus, Video System), Namco System 11 and
  Konami GV. Closed source, last release 1.1 of 2005 ("ZiNc 1.1 (C)1997-2005
  Drunken Muppets"). The build read here is the one RetroBat installs, zinc.7z
  sha256 7bd2e86b38db36c5876b2c7a67840bf930d248f30aacc68db309b89058f21562, whose
  ZiNc.exe (md5 5f3bf0fac64f76c08b12b6cd05e6b159, 2005-01-25, not packed) is
  cited by virtual address. The renderer, controller and sound plugins
  (*.znc, s11player.dll) ship beside it.
  ref: ZiNc.exe 0x493f60

  Games are picked by number on the command line, not by set name. The
  driver table at 0x49fc08 holds 71 records (count returned at 0x463250).
  Each record holds the description, parent, set name, a pointer to its ROM
  list and the name of the BIOS set, then the list gives name, region, load
  offset and CRC32 of every ROM, the BIOS ROM first. Records for glpracr,
  glpracr2, btchamp, mgcldate, sfchamp, PointBlank2, sws99 and mdhorse sit in
  the image but no table entry points at them, so they cannot be run.
  RetroBat maps the set name to the number in zincGameNumber.
  ref: ZiNc.exe 0x463250, 0x463590-0x4635a2,
       emulatorlauncher emulatorLauncher/Generators/Zinc.Generator.cs:136-209

  ROMs are read from the directory given by -roms-directory (default roms),
  which RetroBat writes into zinc.cfg as the folder of the launched game. A ROM
  is looked up in the parent's zip, then in the BIOS set's zip, then in the
  game's own zip. A missing ROM stops the load with "ERROR: missing rom file",
  and every ROM is checked against the CRC32 of its record ("ERROR: BAD CRC
  ... expected").
  ref: ZiNc.exe 0x46366d-0x4636f0, 0x463724-0x463833, 0x463838-0x4638ac,
       emulatorlauncher emulatorLauncher/Generators/Zinc.Generator.cs:109-114

  The Namco System 11 records name no BIOS set: the first ROM of each list is
  the game's own program ROM. sncwgltd (Video System) names none either and
  lists coh-1002v.353 inside its own set. The seven BIOS sets below are the
  only files read outside a game's own set.

