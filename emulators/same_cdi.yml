    bios_path: "same_cdi/bios/"
    forced_system: "cdimono1"
    primary_zip: "cdimono1.zip"
    optional_zips: ["cdimono2.zip", "cdi910.zip", "cdi490a.zip"]
    mame_romsets: ["cdimono1", "cdimono2", "cdi910", "cdi490a"]
    rom_path_flag: "-rp"
    rom_search_path: "<game_path>;<system_dir>/same_cdi/bios/"
    supported_extensions: ["chd", "iso", "cue"]
    source_ref: "src/osd/libretro/libretro-internal/retro_init.cpp:86, src/osd/libretro/libretro-internal/retro_init.cpp:463, src/osd/libretro/libretro-internal/retro_init.cpp:534, src/osd/libretro/libretro-internal/retro_init.cpp:543"
