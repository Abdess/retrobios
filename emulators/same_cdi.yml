notes: |
  SAME CDi is a Single Arcade Machine Emulator fork of MAME libretro, stripped
  down to just the Philips CD-i driver. The core hardcodes "cdimono1" as the
  forced system (src/osd/libretro/libretro-internal/retro_init.cpp:86,463) and searches for MAME ROM ZIPs in:
    <system_dir>/same_cdi/bios/

  The ROM path (-rp) is built at src/osd/libretro/libretro-internal/retro_init.cpp:543 as:
    <game_path>;<system_dir>/same_cdi/bios/

  MAME expects each romset as a ZIP containing the individual ROM files.
  The ZIP filenames match the MAME driver names. Only cdimono1.zip is required
  for consumer CD-i games; the other ZIPs are for alternate hardware models
  (unreachable without boot_from_cli core option).

  ROM definitions: src/mame/drivers/cdi.cpp:639-704. The fork carries four
  sets, cdimono1, cdimono2, cdi910 and cdi490a, declared at
  src/mame/drivers/cdi.cpp:713-716; the Quizard game ROMs upstream MAME
  keeps in this driver are not in it. The .info also lists cdibios.zip, a set
  this driver does not declare.

  The Mono-I machine is built with the Digital Video Cartridge, whose driver
  ROM vmpega.rom is an optional member of cdimono1.zip: without it the
  region stays zero-filled and the player boots as a bare Mono-I
  (src/mame/drivers/cdi.cpp:658-659).

  System forced: src/osd/libretro/libretro-internal/retro_init.cpp:86,463,534.
  BIOS path: src/osd/libretro/libretro-internal/retro_init.cpp:543.

