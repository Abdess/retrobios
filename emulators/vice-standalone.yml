emulator: "VICE (SDL2)"
type: standalone
core_classification: other
source: "https://github.com/VICE-Team/svn-mirror"
upstream: "https://sourceforge.net/projects/vice-emu/"
logo: "https://raw.githubusercontent.com/VICE-Team/svn-mirror/main/vice/data/common/vice-logo-black.svg"
profiled_date: "2026-10-24"
source_commit: "81546e60c222fe4aef750b890b0dbe3a5ac280d8"
pin_frozen: "ROCKNIX, the only platform that ships it, builds this revision (ROCKNIX projects/ROCKNIX/packages/emulators/standalone/vice-sa/package.mk:5). Later commits are not part of that build."
pin_build:
  - platform: rocknix
    repo: "https://github.com/ROCKNIX/distribution"
    revision: "20261001"
    path: "projects/ROCKNIX/packages/emulators/standalone/vice-sa/package.mk"
    variable: PKG_VERSION
    value: "3.8"
core_version: "3.8"
version_basis:
  kind: file
  path: "vice/configure.ac"
  pattern: 'm4_define\(vice_version_major, (\d+)\)\s*m4_define\(vice_version_minor, (\d+)\)\s*m4_define\(vice_version_build, 0\)'
  format: "{1}.{2}"
display_name: "Commodore - 8-bit computers (VICE SDL2)"
mode: standalone
cores:
  - vice-sa
systems:
  - commodore-c64
  - commodore-c64dtv
  - commodore-c128
  - commodore-vic20
  - commodore-plus4
  - commodore-pet
  - commodore-cbm-ii

data_root:
  linux:
    path: "$XDG_DATA_HOME/vice"
    source_ref: "vice/src/arch/shared/archdep_default_sysfile_pathlist.c:104-139, vice/src/arch/shared/archdep_xdg.c:81-92"
    note: "~/.local/share/vice when XDG_DATA_HOME is unset. First directory of the search path, before the executable's directory and the installed data directory."
  macos:
    path: "$XDG_DATA_HOME/vice"
    source_ref: "vice/src/arch/shared/archdep_default_sysfile_pathlist.c:104-139, vice/src/arch/shared/archdep_xdg.c:81-92"
    note: "~/.local/share/vice when XDG_DATA_HOME is unset. A bundled build reads its installed data from Contents/share/vice beside the executable."
  windows:
    path: "<folder of the VICE executables>"
    source_ref: "vice/src/arch/shared/archdep_default_sysfile_pathlist.c:127-139, vice/src/arch/shared/archdep_get_vice_datadir.c:53-54"
    note: "The SDL build has no per-user data folder on Windows. Its data directory is the executable's folder."

notes: |
  VICE 3.8 with the SDL2 user interface. ROCKNIX builds the 3.8 release
  tarball with --enable-sdl2ui and --enable-gtk3ui=no (ROCKNIX
  projects/ROCKNIX/packages/emulators/standalone/vice-sa/package.mk:5-13).
  The tarball's sources are svn trunk r44900, where the version moved to
  3.8, apart from the generated vicedate.h. make install builds every
  emulator (x64, x64sc, x64dtv, xscpu64, x128, xvic, xpet, xplus4, xcbm2,
  xcbm5x0, vsid) and copies the SDL2 set of each data directory to
  $(datadir)/vice (vice/configure.ac:3464, vice/data/C64/Makefile.am:102-104,
  vice/data/DRIVES/Makefile.am:3, vice/data/PRINTER/Makefile.am:3). Every
  file below with bundled set is part of that set.

  A system file is looked up as <dir>/<MACHINE>/<name>, or under DRIVES or
  PRINTER, in each directory of the search path in turn:
  $XDG_DATA_HOME/vice on Linux and macOS, then the executable's directory,
  then the installed data directory. The Directory resource or -directory
  replaces the list, $$ standing for the default one. A name not found
  there is tried as ./<name>
  (vice/src/arch/shared/archdep_default_sysfile_pathlist.c:79-139,
  vice/src/sysfile.c:56-149, vice/src/sysfile.c:245-271). sysfile_load
  refuses a file shorter than the size its caller asks, drops the first two
  bytes of a file two bytes too long and truncates a longer one
  (vice/src/sysfile.c:287-307).

  Each machine loads the ROMs its resources name in mem_load at startup. A
  failed load stops machine initialisation and VICE exits
  (vice/src/init.c:288-291, vice/src/main.c:418-420). x128 loads its
  international and seven national Kernal and character ROMs every time,
  so all of them are required. The other ROMs are read when a machine
  model or a ROM resource selects them. A drive ROM is read for the drive
  types in use, and a missing one turns hardware-level emulation of that
  drive type off (vice/src/drive/driverom.c:96-116). xscpu64 also refuses
  an SCPU64 ROM whose size is not a power of two
  (vice/src/scpu64/scpu64rom.c:80-81). The SDL menu font is read from the
  machine's character ROM, or from the Plus/4 Kernal
  (vice/src/arch/sdl/x64sc_ui.c:282, vice/src/arch/sdl/xplus4_ui.c:263,
  vice/src/arch/sdl/uifonts.c:133-140).

  A palette file is read when the chip's ExternalPalette resource is on.
  Otherwise, or when the file is missing, the palette is computed
  (vice/src/video/video-color.c:930-955). The keymap is
  sdl_sym.vkm or sdl_pos.vkm, with the host layout appended and, on the
  PET, the emulated keyboard type inserted. A keymap without that form is
  read as a user keymap (vice/src/keymap.c:1251-1280).

  Installed files no code opens by their name: the .vrs romset files, read
  only through -romsetfile, the monitor symbol files c64mem.sym and
  scpu64mem.sym, the sdl_joymap_*.vjm files, which JoyMapFile opens with no
  machine subdirectory (vice/src/joyport/joystick.c:2141), and
  chargen-325167-01.bin, edit-4-40-b-60Hz.ts.bin,
  edit-4-40-n-60Hz.901499-01.bin, edit-4-80-b-50Hz.901474-04.bin,
  edit-4-80-b-60Hz.901474-03.bin, edit-4-b-noCRTC.901474-02.bin,
  hre-9000.324992-02.bin, hre-a000.324993-02.bin and 3022-901472-06.bin,
  which only a romset file or a ROM name resource set by the user reaches
  (vice/src/c128/c128rom.h:80, vice/src/pet/petrom.h:64-73).

  ROCKNIX launches x128, x64sc, xplus4 and xvic with -joymenucontrol, after
  writing sdl-hotkeys-<MACHINE>.vhk and sdl-joymap-<MACHINE>.vjm to
  /storage/.config/vice when they are missing (ROCKNIX
  projects/ROCKNIX/packages/emulators/standalone/vice-sa/scripts/start_vice.sh:9-85).

