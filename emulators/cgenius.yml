notes: |
  Open-source reimplementation of the Commander Keen engines (Vorticon, Galaxy,
  Dreams) and the Cosmo engine, by Gerstrong. Needs the original Commander Keen
  data files from the user; the engine itself ships with a 876 KB vfsroot (UI
  art, fonts, sounds) that is not a BIOS and is bundled with the binary.

  For each supported game, Commander Genius expects a flat directory under its
  "games/" tree containing the original DOS data files. KeenFiles::setupFilenames
  (src/fileio/KeenFiles.h:36-57) names them by episode number:

    Vorticon trilogy  (episodes 1-3, Keen 1/2/3)
      egagraph.ck{N}, egahead.ck{N}, egadict.ck{N},
      audio.ck{N}, audiohed.ck{N}, audiodct.ck{N},
      gamemaps.ck{N}, maphead.ck{N}
    Galaxy trilogy    (episodes 4-6, Keen 4/5/6)
      same naming, {N} = 4..6
    Keen Dreams       (episode 7, "KDREAMS")
      KDREAMSDICT.EGA, KDREAMS.AUD, AUDIODCT.KDR, AUDIOHHD.KDR, plus KDREAMS.EXE
      (CExeFile.cpp:190-195 reads kdreams.exe to extract the Dreams tiles)

  Episode 1-6 shareware and demo files are freely redistributable under the
  Apogee/3D Realms terms; the registered Keen 4-6 and Keen Dreams data remain
  commercial. CPatcher.cpp:129-140 lets a patch file override the default names
  so GOG/Steam variants work in-place.

  cosmos engine (added as a git submodule by the build) looks for Cosmo's
  Cosmic Adventures data (COSMOx.STN, VOLUMES.STN, etc.) using the same
  directory-per-game layout; those files are not profiled here because the
  cosmos sub-engine is a separate upstream (Dringgstein/cosmos, pinned to
  8497b5696c92b13ede4f5ad01dfb577b208404cb by cgenius.mk).

  Game directories are searched under the user's roms root. The engine then
  loads from vfsroot/global/ at startup — fonts, trophy UI, generic sounds —
  which is bundled with the install, not with the Keen data.

