emulator: Commander Genius
type: standalone
core_classification: game_engine
source: "https://gitlab.com/Dringgstein/Commander-Genius"
upstream: "https://gitlab.com/Dringgstein/Commander-Genius"
profiled_date: "2026-10-04"
source_commit: "bee4fcbd235b9d3d804a50cc6ecaccbbe89490f7"
core_version: "v3.6.3"
display_name: "Commander Genius"
cores: [cgenius]
systems: [commander-keen]
verification: existence

notes: |
  Reimplementation of the Commander Keen engines: Vorticon (Keen 1 to 3),
  Galaxy (Keen 4 to 6) and Keen Dreams. It reads the data files of the DOS
  releases and the DOS executable itself, from which it extracts tables,
  texts and compressed headers.

  Game detection. The launcher scans its root and every folder up to two
  levels under games/ for .exe and .lua files (src/engine/CGameLauncher.h:36-40,
  src/engine/CGameLauncher.cpp:134-141, 64-78). A file name containing
  keenN.exe, keenNe.exe, keenN.lua or kNdemo.exe (N from 1 to 6) or kdreams
  makes the folder a game (src/engine/CGameLauncher.cpp:437-487). Folder names
  are free; the paths below use the folder names of the packages the project
  publishes for its in-app downloader, which unpacks under games/
  (src/engine/gamedownloader.cpp:455-491). File lookups are case-insensitive.

  Executable. readKeenExeData tries keenN.exe, keenNe.exe, kNdemo.exe, then
  kdreams.exe (src/fileio/CExeFile.cpp:164-203), unpacks LZEXE or PKLITE
  compression (src/fileio/CExeFile.cpp:235-255) and derives the version from
  the size of the unpacked image, never from a hash
  (src/fileio/CExeFile.cpp:350-402):
    Keen 1    100274 v1.1, 100484 v1.31, 100132 v1.34
    Keen 2    118626 v1.0, 118672 v1.31
    Keen 3    127598 v1.0, 127616 v1.31
    Keen 4    258064 v1.0, 259232 v1.1, 263488 v1.4
    Keen 5    262176 v1.0, 266096 v1.4
    Keen 6    236112 v1.0 (the demo executable), 271696 v1.4, 270896 v1.5
    Dreams    213536
  The version selects the offsets used to read data out of the image. Tile
  properties are known for Keen 1 v1.1, v1.31, v1.34, Keen 2 and 3 v1.0 and
  v1.31, Keen 4 and 5 v1.4, Keen 6 v1.4 and v1.5, Keen Dreams and the Keen 6
  demo (src/fileio/CTileLoader.cpp:68-88). The constructor also holds a
  support map keyed by the same sizes (src/fileio/CExeFile.cpp:29-50); its
  result and the CRC comparison of getEXECrc are stored in the launcher entry
  and read nowhere else (src/engine/CGameLauncher.cpp:546-548).

  Vorticon episodes open egahead, egalatch and egasprit, one levelNN file per
  map (80 is the world map, 81 the ending map, 90 the title map; the other
  numbers come from the world map data) and finale.ckN. Episode 1 also reads
  its story, help and ending texts, its sounds and its preview screens from
  files; episodes 2 and 3 take texts and sounds from the executable
  (src/engine/keen/vorticon/CStory.cpp:35-76,
  src/engine/keen/vorticon/CHelp.cpp:38-81,
  src/engine/keen/vorticon/CAudioVorticon.cpp:40-60). A sounds.ckN file, when
  present, replaces the embedded sounds. Without the three EGA files or a
  level file nothing is drawn or the map load fails; the text, finale, sound
  and preview files are skipped when absent. High scores are kept in the
  engine's own highscoreepN.dat, SCORES.CKN is not read
  (src/engine/keen/vorticon/CHighScores.cpp:394-397).

  Galaxy episodes open EGAGRAPH, GAMEMAPS and AUDIO. A missing EGAGRAPH ends
  the load (src/engine/keen/galaxy/GalaxyEngine.cpp:237-243). The graphics and
  audio dictionaries, EGAHEAD, AUDIOHED and MAPHEAD come from the executable;
  a file named egahead.ckN, egadict.ckN, audiohed.ckN, audiodct.ckN or
  maphead.ckN in the game folder takes precedence when present, which is how
  mods replace them (src/fileio/KeenFiles.h:41-48,
  src/engine/keen/galaxy/res/CEGAGraphicsGalaxy.cpp:537-585, 706-742,
  src/engine/keen/galaxy/res/CAudioGalaxy.cpp:350-355, 389-411,
  src/engine/keen/galaxy/common/CMapLoaderGalaxy.cpp:220-235). The Keen 6 demo
  uses its own offsets (src/fileio/CExeFile.cpp:268-289,
  src/engine/keen/galaxy/res/CEGAGraphicsGalaxy.cpp:190-205).

  Keen Dreams runs on an embedded Reflection Keen build for the EGA releases
  (src/engine/refkeen/CMakeLists.txt:11-13). The engine extracts nine tables
  from KDREAMS.EXE at the offsets of shareware v1.13
  (src/engine/keen/dreams/dreamsengine.cpp:103-114, 226-283, 438) and opens
  KDREAMS.EGA, KDREAMS.MAP and KDREAMS.AUD, quitting when one is missing.
  The same file lists a size and CRC-32 for each file of that release
  (src/engine/keen/dreams/dreamsengine.cpp:93-101); the routine that compared
  them is commented out (src/engine/refkeen/be_cross_fs.cpp:660-679), so
  nothing is verified. LAST.SHL is in that list and is never opened.

  A .pat file in the game folder can rename the header and map files and
  patch the image (src/fileio/CPatcher.cpp:102-141,
  src/engine/CGameLauncher.cpp:660-696). Optional replacement graphics, sounds
  and music (gfx/, snd/, music/, songlist.lst) and Lua scripts are looked up
  in the game folder, some also in the bundled global/ folder
  (GsKit/fileio/ResourceMgmt.cpp:34-78).

  Cosmo's Cosmic Adventure is handled by a separate submodule compiled only
  with BUILD_COSMOS, off by default (src/engine/CMakeLists.txt:3).

