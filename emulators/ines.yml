exclusion_note: >
  Left out are the files iNES writes and reads back itself, which are emulator
  state rather than anything a user obtains: <game>.sav holding battery backed
  cartridge RAM, <game>.sta and the desktop builds' DEFAULT.STA holding saved
  emulation state, and LOG.MID, the soundtrack the emulator records when the MIDI
  log is toggled on. libOpenSLES.so is left out as the Android audio library the
  system provides, dlopen'd by name from InitAudio and the only other literal
  filename in the binary. The twenty palettes under Palettes/ in the Windows and
  Ubuntu distributions are left out as the shipped candidates for iNES.pal, which
  the emulator never opens under those names. Four of them are the VS System
  chip palettes, RP2C04-001, RP2C04-002, RP2C04-003 and RP2C05-004, and they
  reach the emulator through the palette entries above rather than a path of
  their own. Neither the VS System nor the FamilyBASIC keyboards need a file:
  DISKSYS.ROM is the only image the binary names.
  ref: libmain.so LoadNES 0x39f5e, 0x3a0ac, libmain.so InitAudio 0x18250-0x18252,
       iNES61-Ubuntu-x86-bin ines DEFAULT.STA, iNES61-Windows-bin.zip Palettes/
