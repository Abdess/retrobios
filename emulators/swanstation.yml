notes: |
  Fork of DuckStation maintained by the libretro community after stenzek removed
  libretro support. Frozen at an early DuckStation state.

  Boot loads a BIOS image. When none is found a built-in OpenBIOS copy
  (dep/openbios) boots instead.
  ref: src/core/system.cpp:650,678-682

  The BIOS option of the console region names a file, scph5500.bin,
  scph5501.bin and scph5502.bin by default, opened by that name with a size
  check only. When it is missing or of another size the core scans system_dir
  for files of known sizes and keeps one whose md5 the table knows.
  ref: src/core/host_interface.cpp:100-133, src/libretro/libretro_core_options.h:96-137
  ref: src/core/host_interface.cpp:136-194 (FindBIOSImageInDirectory)
  Accepts PS1 (512 KB), PS2 (4 MB), and PS3 (0x3E66F0) BIOS images.
  Only the first 512 KB are loaded (src/core/bios.cpp:84, Image(BIOS_SIZE)).
  ref: src/core/bios.h:9 (BIOS_SIZE=0x80000, BIOS_SIZE_PS2=0x400000, BIOS_SIZE_PS3=0x3E66F0)

  27 known BIOS entries identified by MD5 hash.
  ref: src/core/bios.cpp:28-71 (s_image_infos)
  Each entry has: description, region, hash, patch_compatible flag.

  The console region picks the image, Auto by default. NTSC-U answers the
  "Sony Computer Entertainment Amer  ica" licence string, a SCUS or SLUS
  executable, a disc whose region the detector cannot read, an image that
  fails to open and a boot without content.
  ref: src/core/system.cpp:193-209, 401-456, 592-645
  ref: src/core/host_interface.cpp:100-183 (FindBIOSImageInDirectory keeps a region match)
  ref: src/libretro/libretro_core_options.h:82-95 (swanstation_Console_Region, default Auto)

  Upstream DuckStation has evolved significantly (105 entries, PS2 BIOS, OpenBIOS,
  priority system). SwanStation is frozen at the fork point.

