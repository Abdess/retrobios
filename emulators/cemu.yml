firmware_titles:
  - id: "0005001b-10042400"
    name: "Shared fonts"
    content: ["CafeCn.ttf", "CafeKr.ttf", "CafeStd.ttf", "CafeTw.ttf"]
    required: false
    note: "Read from the MLC before the resources/sharedFonts/ copy of the data path."
    source_ref: "src/Cafe/CafeSystem.cpp:286-296"

  - id: "0005001b-10054000"
    name: "SSL certificates"
    content: ["ccerts/", "scerts/"]
    required: false
    note: "Every file of the certificate table must be present for online mode, with a valid otp.bin and seeprom.bin."
    source_ref: "src/Cafe/IOSU/legacy/iosu_crypto.cpp:463-521, src/Cafe/IOSU/legacy/iosu_crypto.cpp:535"

  - id: "0005001b-1004f000"
    name: "Software keyboard applet"
    content: ["content/00/swkbd/swkbd.pack"]
    required: false
    note: "Presence of the pack lets a dumped swkbd.rpl in cafeLibs/ replace the built-in keyboard."
    source_ref: "src/Cafe/OS/RPL/rpl.cpp:1929-1933"

  - id: "0005001b-10051000"
    name: "Error viewer applet"
    content: ["content/00/erreula/erreula.pack"]
    required: false
    note: "Presence of the pack lets a dumped erreula.rpl in cafeLibs/ replace the built-in error viewer."
    source_ref: "src/Cafe/OS/RPL/rpl.cpp:1935-1939"

  - id: "0005001b-1005c000"
    name: "Language and country lists"
    content: ["language.txt", "country.txt"]
    required: false
    note: "Written when absent, by the wx frontend on first run and by the libretro core at init."
    source_ref: "src/gui/wxgui/CemuApp.cpp:580-606, src/libretro/CemuLibretro.cpp:1609-1645"

