emulator: Sudachi
type: standalone
core_classification: community_fork
source: "https://github.com/emuplace/sudachi.emuplace.app"
upstream_gone: "The emuplace GitHub account answers 404 and sudachi.emuplace.app no longer serves. The 1.0.15 source archive (latest.zip, sha256 e2b98c4c2670407342db9f37feb6d2d5af39ff58acf42bbb348010fd8dc23f89) is kept by the Wayback Machine at its release URL, and its zip comment names the commit below. Observed 2026-10-20."
profiled_date: "2026-10-20"
source_commit: "c7431bd420d66c54df277ba0a0b71de42cf0a5bf"
core_version: "1.0.15"
version_basis:
  kind: unverified
  why: host_gone
display_name: "Sudachi (Nintendo Switch)"
cores:
  - sudachi
systems: [nintendo-switch]
mode: standalone
standalone_directories:
  - "$XDG_DATA_HOME/sudachi"
  - "$HOME/.local/share/sudachi"
  - "PORTABLE_DIR"

data_root:
  windows:
    path: "%APPDATA%/sudachi"
    source_ref: "src/common/fs/path_util.cpp:90-96, CMakeLists.txt:68"
    note: "A user folder beside sudachi.exe is used instead when it exists."
  linux:
    path: "$XDG_DATA_HOME/sudachi, else ~/.local/share/sudachi"
    source_ref: "src/common/fs/path_util.cpp:105-115, 303-311"
    note: "A user folder in the working directory is used instead when it exists."
  macos:
    path: "$XDG_DATA_HOME/sudachi, else ~/.local/share/sudachi"
    source_ref: "src/common/fs/path_util.cpp:105-115, 303-311"
    note: "A user folder in the working directory is used instead when it exists."
  android:
    path: "Android/data/org.sudachi.sudachi_emu/files"
    source_ref: "src/android/app/src/main/java/org/sudachi/sudachi_emu/utils/DirectoryInitialization.kt:41-42, src/common/fs/path_util.cpp:100-101"
    note: "relWithDebInfo, debug and ea builds append .relWithDebInfo, .debug or .ea to the package name."

notes: |
  Sudachi is a standalone Nintendo Switch emulator forked from yuzu early
  access 4176 (README.md:1-4). Keys are read from the keys directory of the user data
  directory named in data_root (src/common/fs/fs_paths.h:8-9, 18).
  RetroBat creates the user folder beside sudachi.exe before launching
  sudachi.exe -g <rom> and never copies keys itself.
  Key loading stops when neither prod.keys nor title.keys exists
  (src/core/crypto/key_manager.cpp:649-652).
  Firmware (system NCAs) is installed through the UI (Tools, Install
  Firmware, src/sudachi/main.cpp:4130) into nand/system/Contents/registered/.
  Commercial games need the keys. Homebrew (.nro, .nso) runs without keys or firmware.

files:
  - name: "prod.keys"
    required: true
    path: "keys/prod.keys"
    note: "Production keys for NCA decryption (master, key area, header, titlekek)"
    source_ref: "src/core/crypto/key_manager.cpp:660-661"

  - name: "dev.keys"
    required: false
    path: "keys/dev.keys"
    note: "Development-unit keys, read instead of prod.keys when use_dev_keys is set"
    source_ref: "src/core/crypto/key_manager.cpp:654-657"

  - name: "title.keys"
    required: false
    path: "keys/title.keys"
    note: "Per-title encryption keys (rights_id to titlekey mappings)"
    source_ref: "src/core/crypto/key_manager.cpp:664-665"

  - name: "console.keys"
    required: false
    path: "keys/console.keys"
    note: "Console-specific keys (BIS, SD seed)"
    source_ref: "src/core/crypto/key_manager.cpp:666-667"

  - name: "key_retail.bin"
    required: false
    path: "keys/key_retail.bin"
    size: 160
    note: "Amiibo decryption keys (two InternalKey structs, 0x50 bytes each)"
    source_ref: "src/core/hle/service/nfc/common/amiibo_crypto.cpp:273-295"

  - name: "registered/"
    type: directory
    path: "nand/system/Contents/registered/"
    required: false
    hle_fallback: true
    storage: large_file
    description: "Installed Switch system firmware, the system title NCAs"
    note: >-
      Read as the system NAND content registry at every start. Files are named
      <32 hex digits>.nca or <32 hex digits>.cnmt.nca, flat or under 000000XX
      folders, a directory of the same name holding split parts 00, 01... also
      accepted. The meta NCAs index the rest. Nothing is required to boot: a
      missing system data archive is synthesized for MiiModel, NgWord,
      SystemVersion, TimeZoneBinary and the shared fonts, any other one fails
      the service call, and the applet actions need the MiiEdit program NCA.
    source_ref: "src/core/file_sys/bis_factory.cpp:20, src/core/file_sys/registered_cache.cpp:50-57, 329-348, 379-413, src/core/hle/service/filesystem/fsp/fsp_srv.cpp:416-447, src/sudachi/main.cpp:1604, 4839-4853"

  - name: "<firmware>"
    aliases: ["<firmware>.zip"]
    required: false
    storage: large_file
    description: "Switch system firmware dump, a folder or zip of NCAs"
    note: >-
      Install medium chosen by the user, never read again. The desktop build
      takes a folder and copies the .nca files at its top level, the Android
      build takes a zip whose entries must all be .nca files at its root. Keys
      must be installed first. The registry is emptied, the files copied under
      their own names, then every non-meta NCA is hashed with SHA-256 and the
      first 16 bytes compared with its file name.
    source_ref: "src/sudachi/main.cpp:1597, 4130-4265, src/frontend_common/content_manager.h:257-336, src/core/loader/nca.cpp:86-159, src/android/app/src/main/java/org/sudachi/sudachi_emu/ui/main/MainActivity.kt:424-470, src/android/app/src/main/java/org/sudachi/sudachi_emu/fragments/InstallableFragment.kt:135"
