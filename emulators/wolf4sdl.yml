emulator: Wolf4SDL
type: standalone
core_classification: game_engine
source: "https://github.com/KS-Presto/Wolf4SDL"
upstream: "https://github.com/KS-Presto/Wolf4SDL"
profiled_date: "2026-10-20"
source_commit: "dc8b250af35fb0ace68db5eb879490b50068c20e"
core_version: "v2.0"
version_basis:
  kind: file
  path: "wl_main.c"
  pattern: '"Wolf4SDL (v[0-9][0-9.]*[0-9A-Za-z]*)\\n"'
display_name: "Wolfenstein 3D (Wolf4SDL)"
cores: [wolf4sdl]
systems: [wolfenstein3d]
verification: existence

notes: |
  SDL port of the Wolfenstein 3D and Spear of Destiny engine, from the
  id Software source release. The game a binary plays is chosen at build
  time: version.h:4 skips its own defaults when VERSIONALREADYCHOSEN is
  set, and the build then takes UPLOAD, GOODTIMES, SPEAR and SPEARDEMO
  from the compiler flags. RetroPie builds five binaries this way:
  shareware v1.4 (CARMACIZED UPLOAD), Apogee v1.4 (CARMACIZED), GT v1.4
  (CARMACIZED GOODTIMES), Spear of Destiny (CARMACIZED GOODTIMES SPEAR)
  and the Spear demo (CARMACIZED SPEAR SPEARDEMO).

  CheckForEpisodes (wl_menu.c:3740) picks the data extension by probing
  for vswap.<ext> in the working directory: wl1 for a shareware build,
  wl6 then wl3 then wl1 for a full Wolfenstein build, sdm for the Spear
  demo, and for Spear of Destiny sod, sd1, sd2 or sd3 after --mission 0
  to 3 (wl_main.c:1721-1730). Every data file is then opened as
  <name>.<ext> with a lowercase name and no directory, so it is read from
  the working directory. A file that cannot be opened ends in
  CA_CannotOpen and the program quits.

  Each binary reads eight files: vswap (id_pm.c:36), vgadict, vgahead and
  vgagraph (CAL_SetupGrFile, id_ca.c:440), maphead and gamemaps
  (CAL_SetupMapFile, id_ca.c:531, gamemaps because every build is
  CARMACIZED), audiohed and audiot (CAL_SetupAudioFile, id_ca.c:599).
  The help and end texts and the demos come from vgagraph, since
  version.h defines ARTSEXTERN and DEMOSEXTERN (wl_text.c:762-766,
  wl_game.c:1139-1146).

  The only content check is the length of vgahead: its size divided by
  three must equal NUMCHUNKS + 1 or the engine quits with "Wolf4SDL was
  not compiled for these data files" (id_ca.c:473-480), unless
  --ignorenumchunks is given (wl_main.c:1754-1755). NUMCHUNKS is 156 for
  the shareware build, 161 for Apogee, 149 for GT (gfxv_wl6.h:187), 169
  for Spear and 133 for the Spear demo, so each binary accepts only the
  release it was built for.

  Spear of Destiny mission 1 reads the original game under the sd1
  extension, hence the sd1 aliases on the sod set.

  The engine checks no hash on any data file.

  Written by the engine, not read as data: config.<ext> and savegames
  in ~/.wolf4sdl (wl_menu.c:3745-3760), and screenshots.

