notes: |
  High-level Nintendo 64 emulator. The boot sequence and the RSP are emulated
  at high level: no PIF ROM or other console firmware is opened. The code
  carries no version string, and the tree is 837 commits past tag 1.1.8.

  Every data file is resolved against baseDir, which on Linux is the working
  directory at startup. ROCKNIX copies the package to /storage/.config/DaedalusX64
  and starts the binary from there.
  ref: Source/Utility/Paths.cpp:30-36, Source/Utility/Paths.cpp:40-42

  Linux builds pick the renderer by architecture: OpenGL ES on aarch64 and arm,
  desktop OpenGL elsewhere. Each renderer installs its own n64.psh, the fragment
  shader library prepended to every shader the renderer compiles. The ES
  renderer fails graphics init without it, while the desktop one goes on with an
  empty library and its shaders do not compile.
  ref: Source/CMakeLists.txt:132-137, Source/SysPosix/CMakeLists.txt:12-18,
       Source/SysGLES/HLEGraphics/RendererGL.cpp:77-110,
       Source/SysGLES/Graphics/GraphicsContextGL.cpp:151-156,
       Source/SysGL/HLEGraphics/RendererGL.cpp:86-120

  roms.ini is the per-game settings database (name, save type, a few rendering
  and timing flags), keyed on the two header CRCs and the country code. A game
  it does not list runs on defaults.
  ref: Source/RomFile/RomSettings.cpp:149-157, Source/RomFile/RomSettings.cpp:218-228,
       Source/Core/ROM.cpp:481-484

  The cheat reader is called with "Daedalus.cht" but ignores that argument and
  opens a file named cheat_file in the working directory, creating it empty, so
  the bundled Daedalus.cht is never read.
  ref: Source/Core/ROM.cpp:534, Source/Interface/Cheats.cpp:265, Source/Interface/Cheats.cpp:293-303

