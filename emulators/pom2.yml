notes: |
  Apple ][, ][+, //e, //c and //c+ emulator by Arnaud Verhille, C++ with an
  ImGui frontend, plus a browser build and a headless CLI. Nine machine
  profiles (SystemProfile.cpp:32-300): Apple ][ Original, ][+, //e
  Unenhanced, //e Enhanced, //c, //c Plus, and PAL variants of the //e
  Unenhanced, //e Enhanced (the default) and //c (Le Chat Mauve).

  Every file is looked up by a relative name through findResource
  (ResourcePaths.cpp:173-246): the per-user data directory
  (~/.local/share/POM2, ~/Library/Application Support/POM2,
  %LOCALAPPDATA%\POM2), the executable directory, its parent,
  ../share/POM2, then the working directory and its two parents. The
  first hit wins. Release packages ship the whole roms/ tree, the fonts and
  the two photos (packaging/bundle.manifest).

  Machine firmware is a probe chain per profile, first name found wins
  (SystemProfile.cpp romProbeOrder, MainWindow_Slots.cpp:1458-1481):
    ][ Original     apple2o.rom, apple2.rom
    ][+             apple2p.rom, apple2.rom
    //e Unenhanced  apple2e_unenh.rom, 342-0135-b.64.rom, apple2e.rom
    //e Enhanced    apple2e.rom
    //c             apple2c-32Kv0.rom, apple2c-16K.rom, 3420033a.256
    //c Plus        apple2cp.rom, apple2c-plus.rom, apple2c-32Kv0.rom
  With no candidate the machine runs on a $D000-$FFFF stub and the Welcome
  panel opens (MainWindow.cpp:318-326). A first run with no //e image falls
  back to the ][+ chain (MainWindow.cpp:223-236). Memory::loadAppleIIRom
  (Memory.cpp:174-224) maps 12 KB at $D000, 16 KB at $C000, skips the 4 KB
  pad of a 20 KB ][+ dump, and slices a 32 KB dump by profile: //e images
  carry the firmware in the upper half, //c and //c+ images are two firmware
  banks with bank 0 in the lower half (SystemProfile.cpp:432).

  Character generators follow charRomProbeOrder per profile, or the locale
  picked in the toolbar (CharRomCatalog.cpp:42-79, MainWindow_Slots.cpp:
  1489-1505). Memory::loadCharRom accepts 2 KB, 4 KB and 8 KB dumps
  (Memory.cpp:313-345); an 8 KB dump is two 4 KB banks, loaded as one bank
  or kept dual-bank with annunciator 2 selecting the live set.

  Peripheral ROMs are read when the card is plugged (SlotCardFactory.cpp).
  The Disk II carries the 341-0027-A boot PROM and the 16-sector P6
  sequencer built in (DiskIICard.cpp:135-150). CFFA, Liron, Workstation and
  the MC68705 mouse card leave the slot empty without their dump; Grappler+,
  ThunderClock+ and TransWarp run a synthetic ROM instead. The catalogue
  behind the ROM Status panel (RomCatalog.h) lists every name in probe
  order with the size the loader enforces and, where POM2 vouches for a
  dump, its CRC32; the panel hashes each present file
  (RomStatus_ImGui.cpp:169-181, 306).

  Help > Download missing ROMs (RomFetch.cpp:61-141) fetches 18 dumps with
  curl from raw.githubusercontent.com/Abdess/retrobios and installs a
  download only when its size, CRC32 and SHA-256 match the catalogue
  (RomFetch.cpp:398-431); a present local file is re-checked with the same
  gate (RomFetch.cpp:583-603). Unavailable in the browser build.

  The floppy mechanical sounds are MAME's samples/floppy set, read from
  roms/floppy_samples/ as two banks of ten WAV files prefixed 525_ and 35_
  (FloppySoundDevice.cpp:80-118, MainWindow.cpp:335-348); a missing sample
  is logged and the drive stays silent.

  Media named by the code are not firmware and are not listed here: the
  browser demo boots floppyemu/DIX.po (wasm/shell.html:89) or, when the
  shell passes no disk, floppyemu/Total Replay v6.1.hdv (main.cpp:281-285);
  the headless CLI mounts disks_5.4/dos33_master.dsk by default
  (pom2_headless.cpp:263). Disk, tape and hard-disk images are browsed
  from disks_5.4/, disks_3.5/, hdv/, floppyemu/, cassettes/ and
  prodos_folder/ next to the executable.

