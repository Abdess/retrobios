  - apple-ii
mode: standalone

notes: |
  Apple ][, ][+, //e, //c and //c+ emulator by Arnaud Verhille, C++ with an
  ImGui frontend, plus a browser build and a headless CLI. Nine machine
  profiles (src/SystemProfile.cpp:32-302): Apple ][ Original, ][+, //e
  Unenhanced, //e Enhanced, //c, //c Plus, and PAL variants of the //e
  Unenhanced, //e Enhanced (the default) and //c (Le Chat Mauve).

  Every file is looked up by a relative name through findResource
  (src/ResourcePaths.cpp:178-251): the per-user data directory
  (~/.local/share/POM2, ~/Library/Application Support/POM2,
  %LOCALAPPDATA%\POM2) when it really is per-user, the executable
  directory, its parent, ../share/POM2, the temp fallback data directory
  otherwise, then the working directory and its two parents. The first hit
  wins. Release packages ship the whole roms/ tree, the fonts and the two
  photos (packaging/bundle.manifest).

  Machine firmware is a probe chain per profile, first name found wins
  (SystemProfile.cpp romProbeOrder, src/ProfileSwitch.cpp:113-133):
    ][ Original     apple2o.rom, apple2.rom
    ][+             apple2p.rom, apple2.rom
    //e Unenhanced  apple2e_unenh.rom, 342-0135-b.64.rom, apple2e.rom
    //e Enhanced    apple2e.rom
    //c             apple2c-32Kv0.rom, apple2c-16K.rom, 3420033a.256
    //c Plus        apple2cp.rom, apple2c-plus.rom, apple2c-32Kv0.rom
  With no candidate the machine runs on a $D000-$FFFF stub and the Welcome
  panel opens (src/MainWindow.cpp:328-336). A first run with no //e image
  falls back to the ][+ chain (src/MainWindow.cpp:233-246).
  Memory::loadAppleIIRom (src/Memory.cpp:174-237) maps 12 KB at $D000,
  16 KB at $C000, skips the 4 KB pad of a 20 KB ][+ dump, and slices a
  32 KB dump by profile: //e images carry the firmware in the upper half,
  //c and //c+ images are two firmware banks with bank 0 in the lower half
  (src/SystemProfile.cpp:429).

  Character generators follow charRomProbeOrder per profile, or the locale
  picked in the toolbar (src/CharRomCatalog.cpp:42-91,
  src/ProfileSwitch.cpp:135-141). Memory::loadCharRom accepts 2 KB, 4 KB
  and 8 KB dumps (src/Memory.cpp:325-358); an 8 KB dump is two 4 KB banks,
  loaded as one bank or kept dual-bank with annunciator 2 selecting the
  live set.

  Peripheral ROMs are read when the card is plugged (src/SlotCardFactory.cpp).
  The Disk II carries the 341-0027-A boot PROM and the 16-sector P6
  sequencer built in (src/DiskIICard.cpp:136-149). CFFA, Liron,
  Workstation, the MC68705 mouse card, the 1981 Grappler, the Apple
  Parallel Interface and the Videx Videoterm leave the slot empty without
  their dump; Grappler+, ThunderClock+ and the Super Serial Card run a
  synthetic ROM instead, and TransWarp accelerates without its boot
  firmware. The catalogue behind the ROM Status panel (src/RomCatalog.h)
  lists every name in probe order with the size the loader enforces,
  what a missing dump costs (degraded, card unavailable, unused) and,
  where POM2 vouches for a dump, its CRC32; the panel hashes each present
  file (src/RomStatus_ImGui.cpp:169-181, 311).

  Help > Download missing ROMs (src/RomFetch.cpp:68-301) fetches 45 files,
  43 distinct dumps, with curl from raw.githubusercontent.com/Abdess/retrobios,
  pinned to HTTPS (src/RomFetch.cpp:732-748). Every entry carries a
  SHA-256, fourteen a CRC32 as well; a download is installed only when its
  size, CRC32 and SHA-256 match (src/RomFetch.cpp:629-665). A present file
  is re-checked with the same gate and, when it is not the catalogued dump,
  replaced after a copy to roms-replaced/ under the data directory
  (src/RomFetch.cpp:579-627, 833-853, 862-880); a 12 KB apple2p.rom is the
  one alternate size kept as is. Nine entries are members of MAME romsets,
  read in-process (src/ZipMember.cpp): apple2e_unenh.rom is 342-0135-b.64
  then 342-0134-a.64 from apple2e.zip, mouse_341-0270-c.bin is
  341-0270-c.4b from a2mouse.zip, ssc_341-0065-a.bin is 341-0065-a.bin from
  a2ssc.zip, grappler_eps-1.bin is eps-1_c1981.u6 from a2grappler.zip,
  341-0057.bin is 341-0057.7b from a2pic.zip, and the four Videoterm files
  come from a2vidtrm.zip. Downloads land in the per-user data directory's
  roms/ (src/RomFetch.cpp:801-821). Unavailable in the browser build
  (src/RomFetch.cpp:922-925).

  The floppy mechanical sounds are MAME's samples/floppy set, read from
  roms/floppy_samples/ as two banks of ten WAV files prefixed 525_ and 35_
  (src/FloppySoundDevice.cpp:81-119, src/MainWindow.cpp:345-358); a
  missing sample is logged and the drive stays silent. A second bank, the
  Virtual ][ recordings, is read from roms/virtual_ii_sons/ when that
  directory exists (src/MainWindow.cpp:362-376): eight drive and switch
  takes under lecteur/ and interface/ (src/FloppySoundDevice.cpp:195-204)
  and one printer loop under imprimante/. The bank is selectable once
  Disk Rotation, Move arm, Disk Insertion and Disk Removal have loaded
  (src/FloppySoundDevice.cpp:205-225); an .aiff name is retried as .wav
  (src/FloppySoundDevice.cpp:166-187). The packaging manifest keeps the
  directory out of release packages (packaging/bundle.manifest:75-78).

  Media named by the code are not firmware and are not listed here: the
  browser demo boots floppyemu/DIX.po (wasm/shell.html:89) or, when the
  shell passes no disk, floppyemu/Total Replay v6.1.hdv
  (src/main.cpp:285-289); the headless CLI mounts
  disks_5.4/dos33_master.dsk by default (src/pom2_headless.cpp:262-264).
  Disk, tape and hard-disk images are browsed from disks_5.4/, disks_3.5/,
  hdv/, floppyemu/, cassettes/ and prodos_folder/ next to the executable.

