data_root:
  windows:
    path: "%LOCALAPPDATA%/POM2"
    source_ref: "src/ResourcePaths.cpp:95-124"
    note: "Searched before the files shipped beside the executable."
  macos:
    path: "~/Library/Application Support/POM2"
    source_ref: "src/ResourcePaths.cpp:95-124"
    note: "Searched before the files shipped in the bundle."
  linux:
    path: "$XDG_DATA_HOME/POM2"
    source_ref: "src/ResourcePaths.cpp:95-124"
    note: "~/.local/share/POM2 when XDG_DATA_HOME is unset. Searched before the install tree."

notes: |
  Apple ][, ][+, //e, //c and //c+ emulator by Arnaud Verhille, C++ with an
  ImGui frontend, plus a browser build and a headless CLI. Nine machine
  profiles (src/SystemProfile.cpp:34-314): Apple ][ Original, ][+, //e
  Unenhanced, //e Enhanced, //c, //c Plus, and PAL variants of the //e
  Unenhanced, //e Enhanced (the default) and //c (Le Chat Mauve).

  Every file is looked up by a relative name through findResource
  (src/ResourcePaths.cpp:178-251): the per-user data directory
  (~/.local/share/POM2, ~/Library/Application Support/POM2,
  %LOCALAPPDATA%\POM2) when it really is per-user, the executable
  directory, its parent, ../share/POM2, the temp fallback data directory
  otherwise, then the working directory and its two parents. The first hit
  wins. Since v1.1.0 a desktop release package ships no firmware dump
  (packaging/bundle.manifest:36-42): the user downloads or drops them in.
  The browser build alone preloads the 32 KB //c ROM, the enhanced //e
  ROM, the //e character generator and the AppleMouse slot EPROM
  (packaging/bundle.manifest:58-61). Packages do carry the floppy samples,
  the ImageWriter II recordings, the fonts and the pic/ folder
  (packaging/bundle.manifest:65, 69, 80, 88).

  Machine firmware is a probe chain per profile, first name found wins
  (SystemProfile.cpp romProbeOrder, src/ProfileSwitch.cpp:136-154):
    ][ Original     apple2o.rom, apple2.rom
    ][+             apple2p.rom, apple2.rom
    //e Unenhanced  apple2e_unenh.rom, 342-0135-b.64.rom, apple2e.rom
    //e Enhanced    apple2e.rom
    //c             apple2c-32Kv0.rom, apple2c-16K.rom, 3420033a.256
    //c Plus        apple2cp.rom, apple2c-plus.rom, apple2c-32Kv0.rom
  With no candidate the machine runs on a $D000-$FFFF stub and the Welcome
  panel opens (src/MainWindow.cpp:357-364). A first run boots the //e on
  apple2e.rom, else the ][+ chain, else the //c chain
  (src/MainWindow.cpp:246-296): one of these is the set the machine needs,
  each model's chain is a set of its own.
  Memory::loadAppleIIRom (src/Memory.cpp:177-264) maps 12 KB at $D000,
  16 KB at $C000, skips the 4 KB pad of a 20 KB ][+ dump, and slices a
  32 KB dump by profile: //e images carry the firmware in the upper half,
  //c and //c+ images are two firmware banks with bank 0 in the lower half
  (src/SystemProfile.cpp:455).

  Character generators follow charRomProbeOrder per profile, or the locale
  picked in the toolbar (src/CharRomCatalog.cpp:42-91,
  src/ProfileSwitch.cpp:156-162). Memory::loadCharRom accepts 2 KB, 4 KB
  and 8 KB dumps (src/Memory.cpp:348-381). An 8 KB dump is two 4 KB banks,
  loaded as one bank or kept dual-bank with annunciator 2 selecting the
  live set.

  Peripheral ROMs are read when the card is plugged (src/SlotCardFactory.cpp).
  The Disk II comes up on POM2's own 16-sector boot PROM, assembled from
  the boot protocol (src/DiskIIBootRom.h, src/DiskIICard.cpp:81-91).
  Apple's 341-0027-A replaces it when roms/disk2.rom is present
  (src/DiskIICard.cpp:98-121). Without the P6 PROM, .dsk and .nib images
  run the legacy 32-cycle gate and a WOZ is read by POM2's own sequencer
  (src/DiskIICard.cpp:123-151, src/DiskIICard.cpp:1425-1429). The
  Applicard and the UltraTerm leave the slot empty without their dump
  (src/SlotCardFactory.cpp:328-345, src/SlotCardFactory.cpp:362-385). The
  CCS 7710 and the DAN ][ run POM2's own firmware page without theirs
  (src/SlotCardFactory.cpp:290-327). CFFA, Liron,
  Workstation, the MC68705 mouse card, the 1981 Grappler, the Apple
  Parallel Interface, the Videx Videoterm and the Apple Memory Expansion
  Card leave the slot empty without their dump. Grappler+, ThunderClock+
  and the Super Serial Card run a synthetic ROM instead, and TransWarp
  accelerates without its boot firmware. The catalogue behind the ROM Status panel (src/RomCatalog.h)
  lists every name in probe order with the size the loader enforces,
  what a missing dump costs (degraded, card unavailable, unused) and,
  where POM2 vouches for a dump, its CRC32. The panel hashes each present
  file (src/RomStatus_ImGui.cpp:187-214, 431) and lists the Virtual ][
  recordings with a decode check (src/RomStatus_ImGui.cpp:341-407).

  Help > Download missing ROMs fetches the catalogue of 57 names, 54
  distinct dumps (src/RomFetch.cpp:72-371), with curl pinned to HTTPS
  (src/RomFetch.cpp:753-759). The RetroBIOS URLs are read at one pinned
  commit, never at the branch tip: 441d412, a commit of RetroBIOS main where
  every URL resolves (src/RomFetch.h:119-144). POM2's own archive is asked
  first and RetroBIOS serves what it cannot supply.
  Every entry carries a SHA-256, most a CRC32 as well, and a download is
  installed only when its size, CRC32 and SHA-256 match
  (src/RomFetch.cpp:674, src/RomFetch.cpp:930). A present file is
  re-checked with the same gate and, when it is not the catalogued dump,
  replaced after a copy to roms-replaced/ under the data directory
  (src/RomFetch.cpp:626, src/RomFetch.cpp:900-921). A 12 KB apple2p.rom is
  the one alternate size kept as is. Seventeen entries are members of MAME
  romsets, read in-process (src/ZipMember.cpp): apple2e_unenh.rom is
  342-0135-b.64 then 342-0134-a.64 from apple2e.zip, mouse_341-0270-c.bin
  is 341-0270-c.4b from a2mouse.zip, ssc_341-0065-a.bin is 341-0065-a.bin
  from a2ssc.zip, grappler_eps-1.bin is eps-1_c1981.u6 from a2grappler.zip,
  341-0057.bin is 341-0057.7b from a2pic.zip, the four Videoterm files come
  from a2vidtrm.zip, slinky_341-0344a.bin from a2memexp.zip,
  applicard_v9.bin is applicard-v9.bin from a2aplcrd.zip and the four
  UltraTerm files come from a2ulttrm.zip and a2ultrme.zip, the two CCS 7710
  PROMs are 7710-03h.u5 and 7710-03l.u6 from ccs7710.zip, and the DAN ][
  EPROM is a loose file (src/RomFetch.cpp:333-354). Downloads land in POM2's own roms/ when that
  folder takes files, else in the per-user data directory's roms/
  (src/RomFetch.cpp:836-862). Unavailable in the browser build
  (src/RomFetch.cpp:999-1005).

  The floppy mechanical sounds are MAME's samples/floppy set, read from
  roms/floppy_samples/ as two banks of ten WAV files prefixed 525_ and 35_
  (src/FloppySoundDevice.cpp:83-121, src/MainWindow.cpp:373-386). A
  missing sample is logged and the drive stays silent. A door and a head
  stop for the 5.25 inch drive, which the MAME set lacks, are read from
  roms/floppy_extras/ when present (src/MainWindow.cpp:387-394,
  src/FloppySoundDevice.cpp:135-157). tools/install_drive_extras.py makes
  them from OpenEmulator recordings and packages do not carry them. The
  printer plays Scott Lawrence's ImageWriter II recordings from
  roms/printer_samples/, which packages carry, once the three carriage
  loops and one line feed have loaded, and is synthesised otherwise
  (src/MainWindow.cpp:395-402, src/PrinterSoundDevice.cpp:392-457). A second bank, the
  Virtual ][ recordings, is read from the folder picked with Import
  sounds in the audio mixer, stored as mechanical_sound_path
  (src/MainWindow_AudioPanels.cpp:351-383), then from roms/virtual_ii_sons/,
  and on macOS from Virtual ][.app/Contents/Resources/ under /Applications
  and ~/Applications (src/MainWindow.cpp:404-420,
  src/VirtualIISoundCatalog.h:34-45): eight drive and switch takes under
  lecteur/ and interface/ (src/VirtualIISoundCatalog.h:19-28) and one
  printer loop under imprimante/ (src/VirtualIISoundCatalog.h:30-31). The
  bank is selectable once Disk Rotation, Move arm, Disk Insertion and Disk
  Removal have loaded (src/FloppySoundDevice.cpp:216-252). Each take is
  tried under its path, then an .aiff path as .wav, then the bare file
  name, then the bare name with .aiff turned into .wav or .wav into .raw,
  so a Virtual ][ Contents/Resources/ folder is read as it is
  (src/VirtualIISoundCatalog.h:47-66, src/FloppySoundDevice.cpp:200-214).
  The packaging manifest keeps the directory out of release packages
  (packaging/bundle.manifest:120-123).

  The nine takes come from Contents/Resources/ of Virtual ][.app in
  VirtualII.dmg, the free download on virtualii.com (Virtual ][ 13.3).
  The five .aiff files are copied unchanged. The four .wav files are the
  headerless Boot.raw, Disk Rotation.raw, I-O Error.raw and Matrix
  Printer.raw behind a 44-byte RIFF header, the data chunk being the .raw
  file byte for byte. The header states PCM, one channel, 44100 Hz, signed
  16-bit little-endian. That is the stream Virtual ][ builds for these
  files: every playWithSoundFile:sampleRate:sampleSize: call passes 44100.0
  and 16, and SoundRepeater fills an lpcm AudioStreamBasicDescription with
  one channel, the signed-integer flag for 16 bits and no big-endian flag.
  POM2 decodes the takes through miniaudio into mono float at the file's
  own rate. An .aiff whose FORM chunk declares more bytes than the file
  holds is rejected. A file miniaudio refuses is read as mono signed 16-bit
  little-endian 44100 Hz when it ends in .raw, and through AudioToolbox
  on macOS when it ends in .aiff (src/FloppySoundDevice.cpp:159-192,
  src/PrinterSoundDevice.cpp:92-115, src/VirtualIISoundLoader.h:17-104).

  The screen sits in a Monitor II bezel, pic/retro/monitor/monitor2.png,
  on by default (src/MainWindow_Screen.cpp:367-368), and the Drives window
  shows a picture per drive state from pic/retro/drives/
  (src/RetroArtwork.cpp:44-91, src/MainWindow_DriveRack.cpp:109-120).
  Without a picture the screen has no bezel and the drive is drawn as a
  vector mechanism (src/DriveRack_ImGui.cpp:57-61). The FujiNet card runs
  FujiNet-PC Apple v1.5.2, a separate program the release packages carry
  under fujinet-pc-APPLE/<platform>/ (src/FujiNetRuntime.cpp:38-62,
  packaging/fujinet/stage.py:24-35).

  Media named by the code are not firmware and are not listed here: the
  browser demo boots bundled_disks/DIX-fix.po on the //c PAL preset unless
  ?preset=, ?disk=, ?url= or ?nodisk=1 says otherwise
  (wasm/shell.html:114-120, src/main.cpp:317-323), and the headless CLI
  mounts disks_5.4/dos33_master.dsk by default, a library image packages
  do not carry (src/pom2_headless.cpp:428-433). Disk, tape and hard-disk images are
  browsed from disks_5.4/, disks_3.5/, hdv/, floppyemu/, bundled_disks/,
  cassettes/ and prodos_folder/ next to the executable.

