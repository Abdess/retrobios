notes: |
  Odin, a low-level emulator of the Sega Hikaru board and of Gaelco's PowerVR
  boards (ATV Track, Smashing Drive, Gaelco Football), with a libretro frontend
  by WizzardSK on top of Tovarichtch/Odin. The port's libretro branch holds the
  upstream HEAD 6ebf2b40 as merge base. The ROM loader, the game list and the
  board code are the upstream ones. The only difference in odin-games.json is
  the direction of one Virtual-On lever.
  retro_get_system_info reports library_version "libretro" unless the build
  defines ODIN_LIBRETRO_VERSION, which the CMake files never do.
  ref: src/odin/libretro/libretro_odin.cpp:1926-1936

  The content is a MAME set, recognised by its stem in the game list. The
  list is odin-games.json, embedded in the core and written to
  <system>/odin/odin-games.json whenever the file there differs, then read back.
  The mesh program lists under <system>/odin/shaders/ are written the same way,
  and <system>/odin/cache/ is filled by the renderer. None of these is a file
  the user supplies.
  ref: src/odin/libretro/games_json.S:9, src/odin/libretro/libretro_odin.cpp:1019-1041,
       src/odin/libretro/libretro_odin.cpp:1059-1090, src/odin/libretro/libretro_odin.cpp:1989-1993

  Each file of a section is looked for in the content's folder (a folder
  named after the game, then <game>.zip or .7z), then for the set the list
  names (and for the parent set) as <set>.zip, <set>.7z and a <set>/ folder,
  first in <system>/odin and then beside the content. Inside an archive a member
  matches by size and the CRC32 of the list, the member name is not read. In a
  folder the file matches by size and name, then by size and CRC32. A loose
  file whose CRC32 differs is loaded with an error line in the log.
  ref: src/odin/host/app/rom_files.cpp:296-314, src/odin/host/app/rom_files.cpp:316-347,
       src/odin/host/app/rom_files.cpp:349-380, src/odin/host/app/rom_files.cpp:416-436,
       src/odin/libretro/libretro_odin.cpp:2004-2006

  A section of type alternative loads the first of its files found. A missing
  section stops the load unless the list marks it optional, and the frontend is
  told which sets miss files.
  ref: src/odin/host/app/games.cpp:138-149, src/odin/host/app/games.cpp:1281-1316,
       src/odin/libretro/libretro_odin.cpp:2007-2021

  Every Hikaru game needs mie (315-6146) and the hikaru set: one of three boot
  ROMs and the two EEPROM images 93c46.ic115 and x76f100.ic85. The I/O board
  program (jvs13551 for 837-13551, 18wheelr for NASCAR Arcade's 837-13741) and
  NASCAR Arcade's drive board program (srally2) are optional: without them
  the board's imitation of that part runs.
  ref: odin-games.json:56-93, odin-games.json:583-628,
       src/odin/machine/boards/hikaru/hikaru.cpp:216-233,
       src/odin/machine/boards/hikaru/mie_board.cpp:75-95,
       src/odin/machine/boards/hikaru/hikaru.cpp:496-511

  The Gaelco games read only their own sets, none shared.
  ref: odin-games.json:853-1184

