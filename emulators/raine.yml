  - name: "neogeo.zip"
    system: snk-neogeo-mvs
    required: true
    category: bios_zip
    description: "Neo-Geo BIOS set"
    note: >-
      Parent of every MVS set (ROMOF("neogeo") in the drivers). The board ROMs
      come from rom_neogeo and the 68K BIOS from the rom_bios list, picked by
      the [neogeo] bios index (source/neocd/neocd.c:159-161). Index 0 is
      sp-s2.sp1, RetroBat writes 25 by default, uni-bios_3_2.rom. The
      selected BIOS, sm1.sm1, 000-lo.lo and sfix.sfix are read for every MVS
      game, and a missing one ends the load. Members are matched by CRC32,
      so sp-s3.sp1 answers for asia-s3.rom.
