  - name: "neocd.bin"
    system: snk-neogeo-cd
    required: true
    size: 524288
    description: "Neo-Geo CD BIOS"
    note: >-
      Path from [neocd] neocd_bios (source/raine.c:571). Left empty, neocd.bin
      then neocd.zip are looked up through get_shared. A path ending in zip is
      opened and its neocd.bin member read by name, anything else is read raw,
      0x80000 bytes. Nothing found opens a file dialog once, then the program
      exits. The image is byte swapped when the word at 0x582 reads f94e and
      rejected unless it then reads 4ef9. RetroBat sets neocd_bios to
      neocdz.zip in its bios folder, which must hold a neocd.bin member.
    source_ref: "source/neocd/neocd.c:335-385"

