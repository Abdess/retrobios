emulator: RAINE
type: standalone
core_classification: other
source: "https://github.com/zelurker/raine"
upstream: "https://github.com/zelurker/raine"
profiled_date: "2026-10-20"
source_commit: "8e25d5d8907ae459181610912b0030c955683015"
pin_frozen: "RetroBat, the only platform that ships it, installs this release: the raine.exe of its raine.7z package (8 August 2026) reports 0.97.5 and was built on 16 March 2025, the bump its changelog records (RetroBat CHANGELOG.md:284). The beta 8.4.0 package of 7 November 2026 is the same archive. Later commits are not part of that package."
core_version: "0.97.5"
version_basis:
  kind: file
  path: "makefile"
  pattern: 'VERSION\s+=\s+"([^"]+)'
display_name: "Arcade (RAINE)"
mode: standalone
cores:
  - raine
systems:
  - arcade
  - snk-neogeo-mvs
  - snk-neogeo-cd

notes: |
  Multi-system arcade emulator by Emmanuel Anne, built on SDL2. RetroBat
  installs a package whose raine.exe reports 0.97.5 and carries the joystick
  dead zone setting added on 2025-03-15, one day before the build date, so the
  pin is the last commit before that build. Its hiscore.dat, command.dat and
  history.dat are byte for byte the ones at that commit.

  emulatorlauncher runs `raine.exe -n -fs 0|1 <set>` from the package folder
  and rewrites config/raine32_sdl.cfg first: rom_dir_0 is the folder of the
  game, rom_dir_1 the RetroBat bios folder, neocd_bios points at
  bios/neocdz.zip, emudx and artwork stay under the package, and the Neo-Geo
  BIOS selection defaults to 25
  (emulatorLauncher Generators/Raine.Generator.cs:76-142).

  A set is loaded from each rom_dir in turn as <set>.zip, <set>.7z or a
  <set>/ folder (source/loadroms.c:258-275). Inside an archive a ROM is found
  by CRC32 first and by name second (source/files.c:370-403). A ROM missing
  from the set and its parents ends the load with a fatal error
  (source/loadroms.c:1301-1316). The Windows build has curl and, before
  giving up, offers to download a missing archive from archive.org, neogeo.zip
  included (source/loadroms.c:1200-1240).

  Files read from the shared folder go through get_shared, which tries the
  current directory, then the share path, then share path config/
  (source/files.c:50-95). On Windows the share path is the folder of the
  executable (source/raine.c:378).

