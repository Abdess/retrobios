notes: |
  Android package me.dt2dev.infinity, closed source, free with ads on Google Play.
  Two builds are read here, versionCode 501 (versionName 5, minSdk 32, targetSdk 37,
  xapk sha256 d0040583814a634c9aa2ff56b8245f1eb94f33ee0785c264bccfa5188cd3a273) and
  versionCode 404 (minSdk 30), both carrying lib/arm64-v8a, the Play app signing
  certificate sha256
  eb7b3dd469cf44ab614abda7a367c20de540014a37bb2b915dffecf5f3268da2 and the Play
  distribution source stamp.

  The engine is fake-08 compiled into libinfinity.so and driven through a nine
  method JNI bridge. Its Lua blobs are upstream: the settings cart is byte identical
  to fake-08 814991a and the default cart differs only where VER_STR is spliced, the
  Android build leaving that macro undefined so the boot cart reports v0.0.0.0. The
  global Lua glue is patched in five places, all in the pause menu, where "exit to
  menu" and "exit to settings" give way to a single "quit game" calling the native
  __quitgame, navigation wraps around and the menu holds eight items instead of
  nine. No menu entry reaches the cart browser or the settings cart any more, the
  Compose interface listing the library instead.
  ref: Fake8.java:27-44, 60, 95,
       libinfinity.so arm64 .rodata DefaultCart / FakoSettings / p8GlobalLuaFunctions
       blobs, symbol __quitgame

  A cart never reaches the engine as a path. Java reads the bytes into a direct
  ByteBuffer, from the application assets for a built-in cart or through the content
  resolver for anything else, then hands the buffer to nativeStart with the save
  state name <cart>.ss and the application's internal files directory, where a cdata
  subdirectory holds the <id>.p8d.txt cart data files. No storage permission is
  declared: the cart library is a directory tree granted through the storage access
  framework, and the only write outside internal storage is the .nomedia file that
  the "Show Carts in Photos" switch creates or deletes there.
  ref: pg0.java:50-92, ok0.java:139-146, yk0.java:54-63,
       libinfinity.so arm64 .rodata ".p8d.txt"

  ES-DE targets me.dt2dev.infinity/.SchemeActivity with a VIEW intent on its own
  content provider. The activity reads the display name from the provider, accepts
  it only when it ends in .p8 or .p8.png, strips that extension and forwards
  infinity://game with cart_uri, filename, save_state=false and assets=false to
  MainActivity. The manifest filter announces the content scheme with the image/png
  type, which an explicit component bypasses.
  ref: SchemeActivity.java:25-84, AndroidManifest.xml activity me.dt2dev.infinity.SchemeActivity

  Two graphics backends. OpenGL ES is the default and carries its three fragment
  programs as GLSL string literals inside the library. Vulkan, offered as beta,
  reads SPIR-V modules from the application assets instead, one vertex module plus
  one fragment module chosen by the display filter. Version 501 ships no shader
  asset at all, version 404 ships the four listed below, and both libraries name
  them; the loader takes no null check between AAssetManager_open and
  AAsset_getLength. The manifest requires only abi and density splits, so no asset
  pack can deliver them separately.
  ref: vh.java:381 graphics_backend default 0, vh.java:297 display_filter default 0,
       libinfinity.so arm64 0xa6ee0-0xa7098, 0x9c72c-0x9c828

