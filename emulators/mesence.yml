notes: |
  MesenCE is the community edition of Mesen2, a multi-system emulator
  covering NES/FDS, SNES (with Satellaview, Sufami Turbo, Super Game Boy),
  GB/GBC/GBA, PC Engine (including CD-ROM and SuperGrafx), SMS/Game Gear/
  SG-1000/ColecoVision and WonderSwan (including Pocket Challenge V2).

  All firmware is loaded from a flat <home>/Firmware/ folder
  (FolderUtilities::GetFirmwareFolder, Utilities/FolderUtilities.cpp:81-91).
  The core enforces exact file sizes at load time (FirmwareHelper.h
  AttemptLoadFirmware). The UI additionally knows SHA256 values per file
  (UI/Interop/FirmwareTypeExtensions.cs) and warns on mismatch when
  importing through the firmware prompt, but a mismatched file can still
  be used. The sha256 values below come from that table.

  SNES DSP-1/1B/2/3/4 and ST010/ST011 firmware is loaded from the combined
  file listed below, or from a split pair <name>.program.rom + <name>.data.rom
  (FirmwareHelper.h AttemptLoadDspFirmware). ROM dumps with the firmware
  appended to the game ROM need no external file (LoadDspFirmware embedded
  path, FirmwareHelper.h:131-135).

  GB/GBC/SGB boot ROM images are compiled into the core
  (Core/Gameboy/GbBootRom.h:8,49,99); the external files below override them.
  Super Game Boy mode falls back to the plain GB core when SGB1.sfc/SGB2.sfc
  is missing (BaseCartridge.cpp:698-717).

  Satellaview data broadcasts are read from <home>/Satellaview/ as
  BSX<channel>-<index>.bin (BsxStream.cpp:67-74). Five stream files and
  MesenNesDB.txt ship inside the application binary (Dependencies.zip) and
  are extracted to the home folder at startup; user-provided replacements
  are preserved (UI/Utilities/DependencyHelper.cs:14-66). NES and SNES
  cheat databases (CheatDb.Nes.json, CheatDb.Snes.json) are read directly
  from the embedded archive and never touch the filesystem
  (DependencyHelper.cs GetFileContent, CheatDatabaseViewModel.cs:33).

  HdPacks are per-game texture/audio replacements under <home>/HdPacks/,
  game content rather than system files.

