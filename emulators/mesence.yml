notes: |
  MesenCE is the community edition of Mesen2, a multi-system emulator
  covering NES/FDS, SNES (with Satellaview, Sufami Turbo, Super Game Boy),
  GB/GBC/GBA, PC Engine (including CD-ROM and SuperGrafx), SMS/Game Gear/
  SG-1000/ColecoVision and WonderSwan (including Pocket Challenge V2).

  The libretro port lives in the libretro fork of the same tree: Libretro/
  wraps the core and Makefile.libretro compiles every file under Core/ with
  LIBRETRO defined (Makefile.libretro:165-166,183-184). The fork branched from
  af2342818ca81a93b346146802047760400fc7b1 and does not touch
  Core/Shared/FirmwareHelper.h, so both builds read the same names with the
  same size checks. The buildbot publishes it as mesen2_libretro; the port
  announces library_version 2.0.0 (Libretro/libretro.cpp:2803) while the
  compiled core reports 2.2.1 (Core/Shared/EmuSettings.cpp:165-168).

  Firmware folder. Standalone reads <home>/Firmware/ (Utilities/FolderUtilities.cpp:81-91).
  The libretro port sets the home folder to the frontend system directory
  and overrides the firmware folder with that same directory
  (Libretro/libretro.cpp:2253-2256), so every firmware sits at the system
  directory root. Satellaview streams and MesenNesDB.txt are read relative
  to the home folder in both builds, which puts them under system/Satellaview/
  and system/MesenNesDB.txt for libretro.

  Size checks are exact at load time (FirmwareHelper.h AttemptLoadFirmware).
  The standalone UI additionally knows SHA256 values per file
  (UI/Interop/FirmwareTypeExtensions.cs) and warns on mismatch when
  importing through the firmware prompt; a mismatched file can still be
  used. The sha256 values below come from that table. The libretro port
  has no prompt: a MissingFirmware notification reaches no listener, the
  retry in FirmwareHelper fails the same way and the error goes to the OSD
  (Libretro/LibretroMessageManager.h:26-39).

  SNES DSP-1/1B/2/3/4 and ST010/ST011 firmware is read as the combined
  file first, then as the split pair <name>.program.rom + <name>.data.rom
  (FirmwareHelper.h AttemptLoadDspFirmware). ROM dumps with the firmware
  appended to the game ROM need no external file (LoadDspFirmware embedded
  path, Core/Shared/FirmwareHelper.h:132-135).

  GB/GBC/SGB boot ROM images are compiled into the core
  (Core/Gameboy/GbBootRom.h:8,49,99); the external files override them.
  Super Game Boy mode falls back to the plain GB core when the SNES-side
  ROM is missing (Core/SNES/BaseCartridge.cpp:698-716). GameboyConfig
  keeps UseSgb2 at true and no core option changes it
  (Core/Shared/SettingTypes.h:433), so the libretro build only ever asks
  for SGB2.sfc and sgb2_boot.bin; SGB1.sfc and sgb_boot.bin are standalone
  reads. The libretro port also offers a "Super Game Boy" subsystem taking
  a GB ROM plus an SNES-side ROM (Libretro/libretro.cpp:1041-1052): the
  second entry is copied into the system directory as SGB1.sfc or SGB2.sfc
  by size for the duration of the load, then removed or restored
  (Libretro/libretro.cpp:2627-2677,2692-2761).

  WonderSwan boot ROMs are read only when WsConfig.UseBootRom is on
  (Core/WS/WsConsole.cpp:145-150). The libretro port never sets it, so
  those three files are standalone reads.

  PC Engine CD. For .cue content the libretro port first materialises
  "[BIOS] Super CD-ROM System (Japan) (v3.0).pce" in the system directory
  from syscard3.pce, syscard3.bin, syscard.pce or syscard.bin when the
  canonical file is absent or not 256 KB: a 0x40200 or 0x60200 source is
  read past its 512-byte header, only the first 256 KB are written, and the
  stub is removed after the load (Libretro/libretro.cpp:108-196,2347-2358,2380-2384).
  Then FirmwareHelper reads the canonical name or syscard3.pce at exactly
  256 KB, in both builds.

  NES game database. The libretro port embeds a 6213-line MesenDB.txt
  (Libretro/libretro.cpp:85-86,592-594) and then reads MesenNesDB.txt from
  the home folder on the first lookup (Core/NES/GameDatabase.cpp:92-103),
  merging its 10668 entries over the embedded ones. Standalone deploys the
  file from the application's Dependencies.zip. Five Satellaview stream
  files ship the same way and are extracted to the home folder at startup;
  user replacements are preserved (UI/Utilities/DependencyHelper.cs:14-67).
  Nothing deploys them for libretro. NES and SNES cheat databases
  (CheatDb.Nes.json, CheatDb.Snes.json) are read directly from the
  embedded archive and never touch the filesystem
  (DependencyHelper.cs GetFileContent, UI/ViewModels/CheatDatabaseViewModel.cs:33).

  MesenPalette.pal is a libretro read: the mesen_palette core option value
  Custom loads it from the home folder, 192 or 1536 bytes
  (Libretro/libretro.cpp:1178-1204,1304-1306).

  HdPacks are per-game texture/audio replacements under <home>/HdPacks/
  (system/HdPacks/ for libretro), game content rather than system files.

  The libretro port lists nes|fds|unf|unif|sfc|smc|gb|gbc|gba|pce|sgx|cue|
  sms|gg|ws|wsc as valid extensions (Libretro/libretro.cpp:2838-2840). The
  load path itself dispatches on the console extension tables, so .bs, .st,
  .col, .sg, .pc2 and .studybox content loads when the frontend passes it.

exclusion_note: >-
  The .info declares syscard1.pce, syscard2.pce and gexpress.pce. No code
  path opens those names: the CD firmware loader reads
  "[BIOS] Super CD-ROM System (Japan) (v3.0).pce" or syscard3.pce and the
  Games Express loader reads "[BIOS] Games Express CD Card (Japan).pce" or
  gecard.pce (Core/Shared/FirmwareHelper.h:330-368); the libretro stub
  adds syscard3.bin, syscard.pce and syscard.bin as sources for the Super
  CD-ROM image only (Libretro/libretro.cpp:114).

