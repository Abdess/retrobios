core_version: "2.2.1"
display_name: "Multi-System (MesenCE)"
cores: [mesence, mesen2]
systems:
  - nintendo-nes
  - nintendo-fds
  - nintendo-snes
  - nintendo-satellaview
  - nintendo-sufami-turbo
  - nintendo-super-game-boy
  - nintendo-gb
  - nintendo-gbc
  - nintendo-gba
  - nec-pc-engine
  - nec-pc-engine-cd
  - nec-supergrafx
