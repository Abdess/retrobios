version_source:
  url: "https://mijet.eludevisibility.org/XM6%20Pro-68k/Version.txt"
  pattern: '^(\d+)'
based_on: "XM6 v2.06 by PI."
profiled_date: "2026-11-10"
core_version: "260920"
version_basis:
  kind: package
  url: "https://www.retrobat.ovh/repo/win64/stable/emulators/xm6pro.7z"
