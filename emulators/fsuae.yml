emulator: FS-UAE
type: standalone + libretro
core_classification: community_fork
source: "https://github.com/libretro/libretro-fsuae"
upstream: "https://github.com/FrodeSolheim/fs-uae"
profiled_date: "2026-03-26"
source_commit: "089bb69207fe8fa5eec0006d1d759fb6426f4027"
upstream_commit: "79ac88e3727ee4d35d964aa07ad78894b844da27"
core_version: "5.0.7"
version_basis:
  kind: file
  repo: upstream
  path: "configure.ac"
  pattern: 'AC_INIT\(\[FS-UAE\],\s+\[([0-9][\w.+-]*)'
display_name: "Commodore - Amiga (FS-UAE)"
library_name: ""
cores:
  - fsuae
found_by: content
systems:
  - amiga

data_root:
  windows:
    path: "%APPDATA%/FS-UAE/Data"
    source_ref: "od-fs/fsuae/fsuae-init.c:81-88, od-fs/fsuae/fsuae-init.c:90-123"
    note: "A Portable.ini starting with # FS-UAE in the folder of the executable or one of its parents makes Data beside it the root"
  macos:
    path: "~/Library/Application Support/FS-UAE/Data"
    source_ref: "od-fs/fsuae/fsuae-init.c:81-88, od-fs/fsuae/fsuae-init.c:90-123"
    note: "A Portable.ini starting with # FS-UAE in the folder of the executable or one of its parents makes Data beside it the root"
  linux:
    path: "$XDG_DATA_HOME/FS-UAE/Data, else ~/.local/share/FS-UAE/Data"
    source_ref: "od-fs/fsuae/fsuae-init.c:81-88, od-fs/fsuae/fsuae-init.c:90-123"
    note: "A Portable.ini starting with # FS-UAE in the folder of the executable or one of its parents makes Data beside it the root"

notes: |
  FS-UAE is an Amiga emulator by Frode Solheim, based on UAE/WinUAE.

  Standalone: the launcher walks ROMs/Kickstart, ROMs/Kickstarts, ROM/Kickstart
  and ROM/Kickstarts under the data directory (data_root), with lowercase variants on Linux,
  and the Amiga Forever shared ROM folder. Every .rom, .bin or model-suffixed
  file up to 8 MB is handed to the emulator with its CRC32 and SHA-1. rom.key
  is read from the folder of the encrypted ROM being loaded.
  ref: od-fs/Python/fsuae/services/pathservice.py:47-57, od-fs/Python/fsuae/roms/romservice.py:25-75,
  od-fs/Python/app/app_init.py:83-86, od-fs/fsuae/fsuae-messages.cpp:83-104, rommgr.cpp:2067-2078
  Batocera overrides to bios/amiga/ via --kickstarts_dir (batocera fsuaePaths.py:8, batocera fsuaeGenerator.py:68).
  Libretro port: scans save_dir/fsuae/Kickstarts/ (frozen at v2.7.15), and
  reads rom.key there. The base directory is <save_dir>/fsuae, the build
  leaving USE_FSUAEDIRS off. The core reports an empty library_name, for
  which RetroArch adds no folder of its own.
  ref: source Makefile.libretro:125-126, source sources/src/fs-uae/paths.c:133-138,
  source sources/src/fs-uae/paths.c:196-198, source sources/src/fs-uae/paths.c:258-265,
  source sources/src/fs-uae/config.c:128, source libretro/libretro.c:194-206,
  source libretro/libretro.c:575

  Identification by SHA-1 checksum, not filename (rommgr.cpp:93-152, od-fs/Python/fsuae/roms/romservice.py:78-91).
  AROS kickstart (1 MB) compiled into binary as fallback for all models (rommgr.cpp:113).
  rom.key searched in kickstart dir and multiple fallback paths (rommgr.cpp:1433-1534).

  Supported models: A1000, A500, A500+, A600, A1200, A3000, A4000, A4000T, CD32, CDTV.
  Default model is A500. Each model auto-selects its kickstart via quickstart
  mechanism (cfgfile.cpp:9592-9641 for A500, cfgfile.cpp:9856-9915 for dispatch).

  ROM database shared between standalone and libretro (same WinUAE-derived rommgr.cpp).
  Upstream v5.0.7 has a larger database (344 vs ~200 ROM IDs in libretro port, rommgr.cpp:101).
  Also supports Arcadia, ALG, freezer cartridges, SCSI/CPU board ROMs when configured.

