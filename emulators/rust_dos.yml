emulator: Rust-DOS
type: standalone + libretro
core_classification: official_port
source: "https://git.libretro.com/libretro/rust-dos"
upstream: "https://github.com/dividebysandwich/rust-dos"
profiled_date: "2026-10-04"
source_commit: "9a5df84571a6a8442df4ef4d55e2a5c92add6421"
core_version: "1.3.0"
display_name: "DOS (Rust-DOS)"
cores:
  - rust_dos
systems:
  - dos
mode: both

notes: |
  Rust-DOS is an x86 DOS emulator written in Rust by dividebysandwich,
  with a built-in DOS, BIOS, XMS, EMS, DPMI host and software MIDI
  (OPL3). The README states "no DOS or BIOS images needed" and the
  libretro core declares supports_no_game = "true" with no firmware
  entries (libretro/rust_dos_libretro.info).

  Three optional firmware families enhance accuracy for games written
  for specific sound hardware. All three have HLE / software fallbacks
  that keep audio working without the ROMs.

  - AWE32 sample ROM (awe32.raw): the Creative Sound Blaster AWE32's
    1 MB sample ROM. src/awe32/rom.rs:13-17 declares FILE_NAME and the
    required SHA-256. Without it, the EMU8000 synth still plays what
    programs load into its sample RAM but ROM sounds are silent
    (src/awe32/rom.rs:4-6).

  - Roland Sound Canvas ROMs: a Rust port of Nuked-SC55 covers the
    SC-55, SC-55mkII, SC-55ST, CM-300/SCC-1, SCB-55, RLP-3237, SC-155
    and SC-155mkII. src/sc55/rom.rs:131-295 lists 13 romsets, each 4-5
    ROM files identified by the SHA-256 of their contents whatever the
    filenames are. The settings window can download eight of them from
    the Internet Archive item roland-sc-55-series-roms
    (src/sc55/download.rs:12-24, 39). Without a complete set, MIDI
    falls back to the OPL3 / soundfont / GUS synths
    (src/sc55/mod.rs:116-120).

  - Roland MT-32 ROMs: played by munt (libmt32emu) loaded at runtime
    (src/mt32.rs:1-6). munt identifies the control+PCM pair by its own
    SHA-1 table internally; rust-dos does not declare hashes. Without
    them (or without libmt32emu on the host), midisynth=mt32 fails and
    the other MIDI backends take over.

  The libretro frontend adds its system directory to each loader's
  search path (libretro/src/core.rs:148-157), so BIOS files sit next
  to the core like any other RetroArch firmware.

files:
  - name: "awe32.raw"
    system: dos
    required: false
    hle_fallback: true
    category: bios
    size: 1048576  # 1 MB (2 * ROM_WORDS, 512 Ki 16-bit words)
    sha256: "4e143b94f758734f594ded78f4e5115635975c16fa37fabeae0baa4938ca710e"
    validation: [size, sha256]
    description: "Creative Sound Blaster AWE32 sample ROM for the EMU8000 synth"
    source_ref: "src/awe32/rom.rs:13 (FILE_NAME), 15-17 (DOWNLOAD_URL + SHA256), 60-63 (parse size check)"

