emulator: Rust-DOS
type: standalone + libretro
core_classification: official_port
source: "https://git.libretro.com/libretro/rust-dos"
upstream: "https://github.com/dividebysandwich/rust-dos"
profiled_date: "2026-10-04"
source_commit: "12d8fe849f737b92d0b03b4db79cacc7ba898fab"
upstream_commit: "12d8fe849f737b92d0b03b4db79cacc7ba898fab"
core_version: "1.3.0"
display_name: "DOS (Rust-DOS)"
cores:
  - rust_dos
systems:
  - dos
mode: both

notes: |
  Rust-DOS is an x86 DOS emulator written in Rust by dividebysandwich,
  with a built-in DOS, BIOS, XMS, EMS, DPMI host and software MIDI
  (OPL3). The README states "no DOS or BIOS images needed" and the
  libretro core declares supports_no_game = "true" with no firmware
  entries (libretro/rust_dos_libretro.info).

  Three optional firmware families serve games written for specific
  sound hardware. None is needed with the default settings.

  - AWE32 sample ROM (awe32.raw): the Creative Sound Blaster AWE32's
    1 MB sample ROM. src/awe32/rom.rs:13-17 declares FILE_NAME and the
    SHA-256 the built-in download has to match (src/awe32/rom.rs:88-93).
    A file found on disk is only checked for its length, 1 MB or the
    two bytes shorter AWE-DUMP image (src/awe32/rom.rs:68-71). Without
    it, the EMU8000 synth still plays what programs load into its
    sample RAM but ROM sounds are silent (src/awe32/rom.rs:4-6,
    src/sound.rs:26-38).

  - Roland Sound Canvas ROMs: a Rust port of Nuked-SC55 covers the
    SC-55, SC-55mkII, SC-55ST, CM-300/SCC-1, SCB-55, RLP-3237, SC-155
    and SC-155mkII. src/sc55/rom.rs:143-295 lists 14 romsets of 3 to 5
    ROM files, each identified by the SHA-256 of its contents whatever
    the file is called. The search covers sc55-roms/ and
    soundcanvas-roms/ with their subfolders and zip archives
    (src/sc55/rom.rs:352-362). The settings window can download eight
    of the sets from the Internet Archive item
    roland-sc-55-series-roms into sc55-roms/<set name>/
    (src/sc55/download.rs:12-24, 39, 63-82). With midisynth=sc55 and no
    complete set, the MPU-401 gets no synthesizer and a warning is
    logged (src/sc55/mod.rs:112-122, src/sound.rs:99-106).

  - Roland MT-32 ROMs: played by munt (libmt32emu) loaded at runtime
    (src/mt32.rs:1-6). munt identifies the ROMs from their contents;
    rust-dos declares no hashes and picks a control and PCM pair by
    munt's ids (src/mt32.rs:254-278). Without them (or without
    libmt32emu on the host), midisynth=mt32 fails with a warning and
    the MPU-401 gets no synthesizer (src/sound.rs:94-98).

  The libretro frontend adds its system directory and the rust-dos
  folder in it to the AWE32 and Sound Canvas search paths
  (libretro/src/core.rs:148-157).

