pin_frozen: "The analysed revision, the one the EA 4176 build documented here comes from. yuzu stopped in March 2024 and the mirror's later commits are a fork's."
upstream_gone: "GitHub withdrew the repository for legal reasons: the API answers HTTP 451 for both yuzu-emu/yuzu and the yuzu-emu-mirror copy. Observed 2026-09-04. The fork Zenfone-5-X00QD-4-19/yuzu, pushed 2024-03-05, still serves the analysed commit."
