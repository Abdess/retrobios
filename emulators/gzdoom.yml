    note: "Fonts, menus, zscript, textures. Fatal if absent."

  - name: "game_support.pk3"
    category: game_data
    required: false
    source_ref: "src/version.h:92, src/d_main.cpp:3794-3796, wadsrc_extra/CMakeLists.txt:1"
    note: "Per-game filters under static/filter/ (doom.id, strife, hexen, heretic, chex...)."
    unsourceable: "ships inside the engine package; a same-named file of another program must not stand in"

