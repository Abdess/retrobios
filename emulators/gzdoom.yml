emulator: GZDoom
type: standalone
core_classification: game_engine
source: "https://github.com/ZDoom/gzdoom"
upstream: "https://github.com/ZDoom/gzdoom"
profiled_date: "2026-10-04"
source_commit: "c26ce2e6ca2a0c770f140cb25dde0d30073ca8f7"
core_version: "4.15pre"
display_name: "GZDoom"
cores: []
systems: [doom, heretic, hexen, strife, chex]

notes: |
  Doom-engine source port by Christoph Oelckers. Supports Doom, Heretic,
  Hexen, Strife, Chex Quest and derived games through a unified IWAD
  identification pass.

  Engine resources (built from wadsrc*/static/ via add_pk3):
    gzdoom.pk3            BASEWAD, searched by BaseFileSearch
                          ref: src/version.h:90, src/d_main.cpp
    game_support.pk3      OPTIONALWAD, filter/game assets per IWAD
                          ref: src/version.h:92
    lights.pk3            dynamic light definitions
    brightmaps.pk3        brightmap textures
    game_widescreen_gfx.pk3  widescreen HUD/menu replacements

  Game data is a user-supplied IWAD. iwadinfo.txt declares each known IWAD
  with its IWADName, MustContain lumps and support files.
  ref: wadsrc_extra/static/iwadinfo.txt

  Startup refuses to run if BASEWAD (gzdoom.pk3) is absent. The other
  engine pk3s and the IWAD selection are read from the same base search
  (fs_basepath, home dir, system paths).

files:
  # ================================================================
  # Engine resources (shipped with the port, add_pk3 in CMakeLists)
  # ================================================================

  - name: "gzdoom.pk3"
    category: game_data
    required: true
    source_ref: "src/version.h:90 (BASEWAD), wadsrc/CMakeLists.txt:1"
    note: "Fonts, menus, zscript, textures. Fatal if absent."

  - name: "game_support.pk3"
    category: game_data
    required: false
    source_ref: "src/version.h:92 (OPTIONALWAD), wadsrc_extra/CMakeLists.txt:1"
    note: "Per-game filters under static/filter/ (doom.id, strife, hexen, heretic, chex...)."

  - name: "lights.pk3"
    category: game_data
    required: false
    source_ref: "src/d_main.cpp:2055, wadsrc_lights/CMakeLists.txt:1"

  - name: "brightmaps.pk3"
    category: game_data
    required: false
    source_ref: "src/d_main.cpp:2061, wadsrc_bm/CMakeLists.txt:1"

  - name: "game_widescreen_gfx.pk3"
    category: game_data
    required: false
    source_ref: "src/d_main.cpp:2067, wadsrc_widepix/CMakeLists.txt:1"

