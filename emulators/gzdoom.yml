emulator: GZDoom
type: standalone
core_classification: game_engine
source: "https://github.com/ZDoom/gzdoom"
upstream: "https://github.com/ZDoom/gzdoom"
profiled_date: "2026-10-04"
source_commit: "c26ce2e6ca2a0c770f140cb25dde0d30073ca8f7"
core_version: "4.15pre"
version_basis:
  kind: file
  path: "src/version.h"
  pattern: '#define\s+VERSIONSTR\s+"([^"]+)'
display_name: "GZDoom"
cores: ["GZDoom", "gzdoom-sa"]
systems: [doom, heretic, hexen, strife, chex]

notes: |
  Doom-engine source port by Christoph Oelckers. Supports Doom, Heretic,
  Hexen, Strife, Chex Quest and derived games through a unified IWAD
  identification pass.

  Engine resources (built from wadsrc*/static/ via add_pk3):
    gzdoom.pk3            BASEWAD, searched by BaseFileSearch
                          ref: src/version.h:90, src/d_main.cpp:3757-3761
    game_support.pk3      OPTIONALWAD, filter/game assets per IWAD
                          ref: src/version.h:92, src/d_main.cpp:3794
    lights.pk3            dynamic light definitions
    brightmaps.pk3        brightmap textures
    game_widescreen_gfx.pk3  widescreen HUD/menu replacements
  The last three are skipped for shareware IWADs and with -noextras.
  ref: src/d_main.cpp:2050-2071

  BaseFileSearch tries the program directory first for these resources, then
  the name as given, then each FileSearch.Directories path. The same search
  serves -file, -deh and -bex arguments and zvox.wad. IWADs are not looked up
  there: candidates come from the IWADSearch.Directories paths, and the Load
  files of an IWAD block from the IWAD's own directory.
  ref: src/common/utility/findfile.cpp:106-115, 224-296,
       src/d_main.cpp:1802-1803, 2083, src/d_iwad.cpp:456-476, 613-624, 877-901

  Game data is a user-supplied IWAD. iwadinfo.txt declares each known
  IWAD with its IWADName, MustContain lumps and support files. The
  search directories are scanned for the file names of its Names block
  and for any .iwad, .ipk3 or .ipk7 file. Each candidate is then
  identified by its lumps, not by its name. The Names block also lists
  doomu.wad, doom1.wad, bfgdoom.wad, bfgdoom2.wad, freedoomu.wad,
  freedoom.wad, hereticsr.wad, heretic1.wad, hexendemo.wad, hexdemo.wad,
  strife0.wad and strife.wad.
  ref: wadsrc_extra/static/iwadinfo.txt:650-703, src/d_iwad.cpp:502-530

  Startup refuses to run if BASEWAD (gzdoom.pk3) is absent, and stops
  with "Cannot find a game IWAD" when no candidate is identified.
  ref: src/d_main.cpp:3757-3761, src/d_iwad.cpp:789-798

