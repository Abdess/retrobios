notes: |
  Closed Windows emulator for the Dreamcast and the arcade boards built on it.
  The build read is demul.exe 0.7 dated 20 December 2025, sha1
  e326ae663c97e5982e40dbbfe7d02a0c38bd426a. RetroBat installs it from
  demul.7z and Batocera 43.1 ships it as demul_251220.7z: both archives carry
  the same executable. Batocera runs it under Wine. It is a 32-bit PE
  with no packer, and every address below is a virtual address in it.

  The BIOS images are rows of seven tables of 28-byte records (id, description,
  set, member, size, crc32, sha1), registered at startup (0x544270-0x5443cf):
  dc 0x6b4d80, naomi 0x6b46b8 (whose rows name the sets naomi, naomi2 and
  segasp), awbios 0x6b4648, hikaru 0x6b44a0, segadimm 0x6b4530, mie 0x6b4468
  and crp 0x6b4430. The machine loader (0x53c300-0x53d5d3) takes one row per
  board and passes its set, member, size, crc32 and sha1 to the file loader
  (0x53daa0-0x53eb8c). For each [files] romsN path that loader tries the loose
  file <romsN>\<set>\<member>, then <romsN>\<set>.zip, then <romsN>\<set>.7z.
  Inside an archive a member is taken when its name or its crc32 matches, and
  is then rejected on a wrong size, crc32 or sha1 ("Wrong size", "Wrong Crc32",
  "Wrong SHA1 of '...' in romset '...'"). When no path holds it the loader
  shows "Unable to find '<member>' in romset '<set>'" and returns false.

  The row comes from the Demul.ini [main] index of the board (dreamBios,
  naomiBios, atomiswaveBios, hikaruBios, [dimm] bios), or from the -bios=
  switch. An index past the end of its table is reset to 0 (0x535963-0x5359d5)
  and none of the platforms writes these keys, so the first row is the one read
  by default. With naomiBiosAuto or hikaruBiosAuto the row is the one the game
  record names (0x53ec90). Each set below therefore lists every row Demul may
  read, and one of them is enough.

  The sets are MAME-style archives, with older MAME groupings: the House of the
  Dead 2, F355 Challenge and Airline Pilots BIOS rows belong to the naomi set,
  so Demul reads them from naomi.zip and never opens hod2bios.zip, f355bios.zip,
  f355dlx.zip or airlbios.zip. No string or record names those archives,
  naomigd.zip, jvs13551.zip, dc_boot.bin or dc_flash.bin. The flash and EEPROM
  images (.flash, .eeprom, .sram) live in the nvram directory and are written by
  the emulator (0x544b20).

  The crp set (crp-1231br-10_ver01.07.epr, CRP firmware, crc32 d1ba64b3) is
  registered at 0x544348-0x54436f but no code reads its table to load a file.

  Batocera points roms0 at the BIOS directory, RetroBat writes roms0 =
  bios\dc and roms1 = bios, so both find these sets at the BIOS root. Gaelco
  PowerVR and Cave CV1000 games read no BIOS set.

