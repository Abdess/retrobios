notes: |
  Closed-source Windows pinball simulator and table editor written by Chris
  Leathley for BSP Software Design Solutions. Development stopped with
  v1.9.1.20101231, still served from futurepinball.com. Rendering is OpenGL
  (88 imports from opengl32 and 4 from glu32). ddraw is loaded by name only to
  call DirectDrawCreateEx while enumerating display modes. Physics come from
  Newton Game Dynamics, audio from FMOD 3, image decoding from DevIL and the
  script editor from Scintilla. The binary registers its own type library at
  startup through LoadTypeLib and RegisterTypeLib on its own path, which is the
  registration RetroBat checks under TypeLib\{FB22A459-4AD0-4CB3-B959-15158F7139F5}
  before deciding to relaunch elevated.
  ref: Future Pinball.exe 1.9.1.20101231 import directory, .text:0x0042c7a2-0x0042c82e

  The release is named 1.9.1.20101231 but the executable inside it carries
  FileVersion 1.9.2008.1225 in its version resource and prints
  "Version 1.9.1.20091231" in its own banner. The executable unpacked from
  FuturePinballSetup_v1.9.1.20101231.exe has sha256
  da400d3b80ab855a6a6f63fd1b552cb9900cd3355925e6086a2d409df3b27a2d.
  ref: Future Pinball.exe 1.9.1.20101231 .rsrc version, .text:0x0043d288-0x0043d298

  Every relative path below hangs off one root. At startup GetModuleFileNameA
  fills a buffer, the code scans back to the last backslash and terminates the
  string just after it, and that install directory with its trailing separator
  is kept for the life of the process.
  ref: Future Pinball.exe 1.9.1.20101231 .text:0x00432af0-0x00432b49

  A table is an OLE compound document with the .fpt extension and it carries
  its own media. Every FMOD load passes FSOUND_LOADMEMORY (mode 0x8130 for
  samples, 0x4000a130 for streams) and images go through ilLoadL, the memory
  lump entry point, never ilLoadImage. So sounds, music and textures are read
  out of the table file and no external media is opened while a table plays.
  ref: Future Pinball.exe 1.9.1.20101231 .text:0x00457ede,0x00457f6f,0x00457fe6,0x0045805b,0x004417f6

  What a table can pull from outside itself is a resource library. Libraries
  are .fpl files, also OLE compound documents, holding models, textures, sounds,
  DMD fonts and scripts under one storage per item. The Texture, Sound, Model
  and DMD Font managers each offer Import, which copies the item into the table,
  and Link, which records the library name and the item name instead. A linked
  library is opened by StgOpenStorage on the name as written, which resolves
  against the table's own folder, and on failure against the install directory
  plus "Libraries\". Both failing raises "Unabled to Open Library - '<name>'"
  followed by "There will be some functions missing from the game." as a warning
  box, and the program carries on.
  ref: Future Pinball.exe 1.9.1.20101231 FUN_004e6cf0 0x4e6d66 (StgOpenStorage on the name
  as written), 0x4e6d8d-0x4e6dd8 (install directory, Libraries\, name, second StgOpenStorage),
  0x4e6e1c-0x4e6eb7 (string resources 149 and 150, MessageBoxA with MB_ICONWARNING)

  A table script reaches outside itself through LoadExternalScript, whose result
  is handed to VBScript's ExecuteGlobal. When the reference ends in .fpl the
  script is pulled from that library, otherwise the name is tried as given
  against the working directory, then under the install directory with the
  "Scripts\" prefix, then with "Tables\", and a miss reports
  "Unable to load external script". No Scripts directory ships, so what it holds
  is whatever a given table asks for.
  ref: Future Pinball.exe 1.9.1.20101231 FUN_004797c0 0x47985a-0x479881 (lstrcmpiA of the
  extension with fpl, then FUN_00478d20, which reaches the library opener FUN_004e6cf0
  through FUN_004ed9c0 at 0x4eda31), 0x479891, 0x4798a7, 0x4798bd (FUN_00478be0 bare, with
  Scripts\, with Tables\), 0x4798dc (the error string), FUN_00478be0 0x478c60 (CreateFileA
  GENERIC_READ OPEN_EXISTING)

  Settings live in the registry under HKCU\Software\Future Pinball, split into
  GamePlayer, GamePlayer\Joypads and Editor keys. There is no ini file.
  RetroBat writes resolution, aspect ratio, camera, render preset and the whole
  joypad map there before launching. Per table state is written to
  fpRAM\<table>.fpRAM beside the program. Nothing in the program verifies a size
  or a hash on any file it opens, so the figures recorded below are those of the
  1.9.1.20101231 release and are informative.
  ref: Future Pinball.exe 1.9.1.20101231 .text:0x0043aa80,0x00475602,0x00475892,
  retrobat emulatorLauncher/Generators/Fpinball.Generator.cs:326-491

  Front ends drive it with the switches /Open "<table>", /Play, /Exit and
  /ArcadeRender, which WinMain compares beside RegServer, UnregServer,
  Minimise, DemoMode and TableNumber. ES-DE declares it for Windows only, as
  FUTURE-PINBALL finding "Future Pinball.exe" and as FUTURE-PINBALL-FPLOADER finding
  "BAM\FPLoader.exe", both invoked with /Exit /Play /Open. The fpinball system
  is a placeholder on its six other platforms. RetroBat maps the emulator keys
  fpinball and bam to one generator, one install folder and the same
  "Future Pinball.exe" presence check, swapping only the launched binary, and
  optionally starts dmdext against DmdDevice.ini to mirror the DMD. Batocera ran
  it in a wine bottle on x86_64 and dropped it for Visual Pinball. BAM is
  ravarcade's loader: FPLoader.exe starts the same executable with BAM.dll
  injected, and it names none of its own files from inside Future Pinball.
  ref: es-de resources/systems/windows/es_find_rules.xml:438-461,
  es-de resources/systems/windows/es_systems.xml,
  Future Pinball.exe 1.9.1.20101231 WinMain FUN_0042c480 0x42c5f0-0x42c710,
  retrobat emulatorLauncher/Generators/Fpinball.Generator.cs:109-181,
  batocera-linux batocera-Changelog.md:214

files:

  # -- Bound in the import directory, so the loader resolves them before any
  #    Future Pinball code runs. A cold start opens these six and SciLexer,
  #    nothing else, in the program directory.

  - name: Newton.dll
    sha1: f41672abeef6b9751b0ef4f341b973a60cb03a7a
    system: fpinball
    required: true
    bundled: true
    size: 446464
    description: "Newton Game Dynamics, the rigid body solver under the ball physics"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor Newton.dll IAT 0x53f340-0x53f48b (83 functions, no delay-load directory, so loader-resolved), FUN_00455b10 0x4581c4 (status line Initialising Newton..), 0x45823d (NewtonCreate, world kept in [esi+0x2d08] and 0x5cc80c), 0x458250 (NewtonWorldSetUserData), 0x45825f (NewtonSetSolverModel)"
    note: >-
      83 functions are bound from it, the largest third party surface in the
      binary. The loader resolves the import before WinMain, so the process does
      not start without it. FUN_00455b10, reached from 0x4ede62, creates the
      physics world.

  - name: fmod.dll
    sha1: ee8f68d94645de24be930d6f453297d5b7b4d052
    system: fpinball
    required: true
    bundled: true
    size: 162816
    description: "FMOD 3 audio engine"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor fmod.dll IAT 0x53f820-0x53f877 (22 functions, loader-resolved), FUN_0044a0f0 0x44a3ff-0x44a413 (FSOUND_SetHWND, FSOUND_SetOutput 2, FSOUND_SetDriver 0, FSOUND_SetMixer 4 through the thunks at 0x51b656-0x51b668), 0x44a420 (FSOUND_Init 44100 Hz, 32 channels), 0x44a425-0x44a434 (a failed init sends WM_CLOSE to the window at [esi+0xac])"
    note: >-
      22 functions bound, FSOUND_Init through the sample and stream calls. The
      import makes it a start condition. FUN_0044a0f0 is the startup routine
      WinMain calls at 0x42c8d8. Every sample and stream call passes
      FSOUND_LOADMEMORY, so it decodes the table's own buffers rather than
      reading files.

  - name: devil.dll
    sha1: 313a23600a169adbe130b1ae1784d8de437ce7d9
    system: fpinball
    aliases:
      - DevIL.dll
    required: true
    bundled: true
    size: 269312
    description: "DevIL image decoder"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor DevIL.dll IAT 0x53f074-0x53f093 (8 functions, loader-resolved), FUN_0044a0f0 0x44a3ea (ilInit at startup), FUN_00463420 0x463430 (ilGenImages), 0x46343b (ilBindImage), 0x463485 (ilLoadL on an image held in memory), 0x463495 (ilConvertImage to IL_RGB, IL_UNSIGNED_BYTE)"
    note: >-
      8 functions bound, ilInit through ilLoadL, so the process does not start
      without it. FUN_00463420 is the decoder the texture and preview paths call
      (0x43f522, 0x4e6a7c, 0x4fb100). Spelled DevIL.dll in the import
      descriptors and shipped lowercase, which the case insensitive loader treats
      as one name.

  - name: ilu.dll
    sha1: d3534cd62d312fe28988c6229c47ab81a3ae1f9e
    system: fpinball
    aliases:
      - ILU.dll
    required: true
    bundled: true
    size: 27648
    description: "DevIL image utility library, scaling and canvas resize"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor ILU.dll IAT 0x53f13c-0x53f14b (4 functions, loader-resolved), FUN_0044a0f0 0x44a3f0 (iluInit at startup), FUN_00463420 0x463519 (iluImageParameter ILU_FILTER), 0x463523 (iluScale)"
    note: >-
      4 functions bound: iluInit, iluScale, iluEnlargeCanvas and
      iluImageParameter, used to fit decoded artwork to texture dimensions. The
      import makes it a start condition.

  - name: ilut.dll
    sha1: 30566eda672fef3036fbd3998af3cc9fdcef38e7
    system: fpinball
    aliases:
      - ILUT.dll
    required: true
    bundled: true
    size: 16384
    description: "DevIL toolkit layer, image to Windows bitmap conversion"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor ILUT.dll IAT 0x53f150-0x53f15b (3 functions, loader-resolved), FUN_0044a0f0 0x44a3f8 (ilutRenderer ILUT_WIN32), FUN_00463420 0x4634a3 (ilutConvertToHBitmap), 0x4634b2 (ilutGetBmpInfo)"
    note: >-
      3 functions bound: ilutRenderer, ilutConvertToHBitmap and ilutGetBmpInfo,
      which turn a decoded image into the Windows bitmap the manager windows
      draw. The import makes it a start condition.

  - name: libcurl.dll
    sha1: 8189136493d48adc2bdeff1e77297ab988ae789d
    system: fpinball
    required: true
    bundled: true
    size: 626688
    description: "HTTP client for the table feed"
    source_ref: "Future Pinball.exe 1.9.1.20101231 import descriptor libcurl.dll IAT 0x53f87c-0x53f88b (4 functions, loader-resolved), FUN_0043d300 (dialog procedure of resource 0x1f0, DialogBoxParamA at 0x449559) 0x43dd3c (curl_easy_init), 0x43dd4f-0x43dd8d (curl_easy_setopt user agent FuturePinball-agent/1.0, URL http://www.pinsimdb.org/fpreleases/backend_xml.php, write callback 0x46e450), 0x43dd90 (curl_easy_perform), 0x43d694-0x43d6ff (the same sequence for a screenshot not yet in feeds\\)"
    note: >-
      Only four functions are bound, curl_easy_init, setopt, perform and cleanup,
      and both uses sit in the latest tables dialog, the table list and its
      screenshots. The binding is static all the same, so the process still
      refuses to start without the file.

  - name: SciLexer.dll
    sha1: 661675f4d8539e14f2be10d144ab986fc5fccb46
    system: fpinball
    required: false
    bundled: true
    size: 407552
    description: "Scintilla, the editing control behind the table script editor"
    source_ref: "Future Pinball.exe 1.9.1.20101231 WinMain FUN_0042c480 0x42c4fc-0x42c501 (LoadLibraryA SciLexer.DLL), 0x42c511-0x42c524 (null handle: MessageBoxA The Scintilla DLL could not be loaded., handle stored as 0, startup continues at 0x42c528)"
    note: >-
      The one library taken with LoadLibraryA rather than the import directory.
      A null return puts up "The Scintilla DLL could not be loaded.", stores a
      null handle and falls through to the rest of startup, so the program runs
      and only the script editor is lost.

