    source_ref: "Future Pinball.exe 1.9.1.20101231 FUN_0045eff0 0x45f01a-0x45f08e (RegOpenKeyExA HKCU Software\\NaturalPoint\\NATURALPOINT\\NPClient Location, RegQueryValueExA Path), FUN_0045f100 0x45f16b-0x45f1cf (separator then NPClient.dll appended), 0x45f1d9 (LoadLibraryA, a null handle jumps to 0x45f35a), 0x45f1f2-0x45f1f8 (GetProcAddress NP_GetSignature)"
    note: >-
      The directory is read from the Path value of
      HKCU\Software\NaturalPoint\NATURALPOINT\NPClient Location, this name
      appended and the result given to LoadLibraryA,
      then NP_GetSignature and the rest are bound with GetProcAddress. A null
      handle jumps past all tracking setup. It comes from a TrackIR install, not
      from any Future Pinball distribution, which is why no path is given here.

analysis:
  shipped_with_the_binary:
    note: >-
      Present in the release and read by the program, but named at runtime rather
      than by a literal in the code, so there is no fixed filename to record.
    entries:
      - what: "Tables\\, four demonstration tables"
        source_ref: "FuturePinballSetup_v1.9.1.20101231.exe app/Tables"
        note: >-
          DmdDisplayDemo.fpt, LightSequencerDemo.fpt, Ramp-VUK-Demo.fpt and
          SegmentDisplayDemo.fpt. The directory itself is the default table path
          and the last prefix the external script resolver tries.
      - what: "Feeds\\, 385 table screenshots"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x0043d60f"
        note: >-
          Named st_<id>_<n>_<n>.jpg from the entries of fpLatestTables.xml and
          fetched with the same libcurl path, so the set changes with the feed.

  user_supplied_paths:
    note: "Named by a table or written by the program, with no fixed filename"
    entries:
      - what: "external table scripts, tried bare then under Scripts\\ then Tables\\"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x004797c0-0x00479905, 0x00478be0"
        note: >-
          LoadExternalScript takes whatever name the table's script passes. The
          bare attempt resolves against the working directory, which is the
          table's own folder. No Scripts directory ships.
      - what: "fpRAM\\<table>.fpRAM, per table persistent state"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x0043aa80, 0x00475602, 0x00475892"
        note: >-
          Built as the prefix, the table name and the .fpRAM extension. Written
          from play, so it is save data rather than something to obtain. The
          installer creates the directory empty.
      - what: "DmdFonts\\ and Models\\, editor working directories"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x00443595, 0x00443efc, 0x00516ba8, 0x00516d31, 0x00441fc8, 0x004429bb, 0x004317fa"
        note: >-
          Each site only fills the initial directory of a GetOpenFileName or
          GetSaveFileName call in the DMD font and model import and export
          dialogs, so nothing is read until the user picks a file. DmdFonts ships
          empty and Models is not created at all. Fonts carry .dmdf and models
          .fpm, both authored rather than distributed.

  named_but_not_read:
    note: "String literals that survive a path scan without ever reaching a file"
    entries:
      - what: "skin\\toolbar.bmp"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x00438ff5, 0x00448ba0, 0x00432240-0x00432290"
        note: >-
          Passed to the toolbar builder, which calls CreateToolbarEx with
          hBMInst zero and a bitmap handle held in a global as wBMID. The module
          has no resource under that name and neither syscall trace shows an open
          for it, although both traces reach the main window.
      - what: "tables\\ in lower case"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x00439e40-0x00439e79"
        note: >-
          Searched for inside a feed URL and skipped past to recover the table
          name, with the literal opps as the fallback. Not a path being built.
      - what: ".jlb"
        source_ref: "Future Pinball.exe 1.9.1.20101231 .text:0x004414d0"
        note: >-
          A second extension accepted beside .fpl in the library dialogs. No file
          with it ships and nothing opens one by name.
