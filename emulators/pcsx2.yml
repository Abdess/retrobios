emulator: PCSX2
type: standalone
core_classification: official_port
bios_mode: agnostic
source: "https://github.com/PCSX2/pcsx2"
upstream: "https://github.com/PCSX2/pcsx2"
cores:
  - pcsx2
profiled_date: "2026-03-30"
source_commit: "81526d4dc7cc70e4ae75abb35a789417456c6d43"
core_version: "Git"
display_name: "Sony - PlayStation 2 (PCSX2)"
systems: [sony-playstation-2]

notes: |
  Filename-agnostic BIOS detection. Scans bios/ for any file between 4-8 MB
  with valid romdir structure (RESET + ROMVER entries). No hash validation.
  Companion files (.rom1, .rom2, .nvm, .mec) derive their names from the selected BIOS.
  ROM1 (DVD player) and ROM2 (Chinese extension) silently skipped if missing.
  NVM and MEC auto-created with defaults if missing.

files:
  - name: ps2-0230a-20080220.bin
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    source_ref: "pcsx2/ps2/BiosTools.cpp:258-362"
    note: "Accepts any file 4-8 MB with valid romdir (RESET + ROMVER). Naming convention ps2-VVVVr-YYYYMMDD.bin (version, region, date)."

  - name: ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: "Tried as {bios}.rom1 then {biosbase}.rom1, opened case-insensitively. Copied to the ROM1 region. Logged and skipped when absent."
    source_ref: "pcsx2/ps2/BiosTools.cpp:214-241, pcsx2/ps2/BiosTools.cpp:366"

  - name: ps2-0230a-20080220.rom2
    required: false
    max_size: 4194304
    description: "Chinese ROM extension"
    note: "Same two-step naming as rom1. Only Chinese region consoles carry one."
    source_ref: "pcsx2/ps2/BiosTools.cpp:214-241, pcsx2/ps2/BiosTools.cpp:367"

  - name: ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    size: 1024
    description: "Console NVRAM"
    note: "Read at the BIOS path with the extension replaced by nvm, opened case-insensitively. Built in memory from region defaults when absent or blank."
    source_ref: "pcsx2/CDVD/CDVD.cpp:160-188"

  - name: ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    size: 4
    description: "Mechacon version"
    note: "Read at the BIOS path with the extension replaced by mec. Defaults to 0x00020603 and is written back when it cannot be read."
    source_ref: "pcsx2/CDVD/CDVD.cpp:190-204"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    size: 64
    source_ref: "pcsx2/DEV9/DEV9.cpp:110-160"
    note: "DEV9 network adapter EEPROM. Falls back to built-in defaults if missing."

  - name: GameIndex.yaml
    path: pcsx2/resources/GameIndex.yaml
    required: false
    mode: libretro
    source_ref: "pcsx2/GameDatabase.cpp:46, pcsx2/GameDatabase.cpp:896"
    note: "Game compatibility database. OSD warning if missing."

  - name: cheats_ws.zip
    path: pcsx2/resources/cheats_ws.zip
    required: false
    mode: libretro
    source_ref: "pcsx2/VMManager.cpp:348-361"
    note: "Widescreen patches archive."

  - name: cheats_ni.zip
    path: pcsx2/resources/cheats_ni.zip
    required: false
    mode: libretro
    source_ref: "pcsx2/VMManager.cpp:383-396"
    note: "No-interlacing patches archive."
