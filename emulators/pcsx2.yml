notes: |
  Filename-agnostic BIOS detection. Scans bios/ for any file between 4-8 MB
  with valid romdir structure (RESET + ROMVER entries). No hash validation.
  Companion files (.rom1, .rom2, .nvm, .mec) derive their names from the selected BIOS.
  ROM1 (DVD player) and ROM2 (Chinese extension) silently skipped if missing.
  NVM and MEC auto-created with defaults if missing.

files:
  - name: ps2-0230a-20080220.bin
    found_by: content
    aliases: [ps2-0250j-20100415.bin]
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size, romdir]
    romdir:
      reset_compare: 10
      missing_reset: ends_walk
      terminated_names: true
      extinfo: true
      unreadable_romver: ends_walk
      truncated_walk: ends_walk
    source_ref: "pcsx2/ps2/BiosTools.cpp:16-17,80-197,258-283,317-370"
    note: "Accepts any file 4-8 MB with valid romdir (RESET + ROMVER). Naming convention ps2-VVVVr-YYYYMMDD.bin (version, region, date)."

  - name: ps3_ps2_emu_bios.bin
    found_by: content
    required: false
    size: 4194304
    sha1: "2dc921be6eb8d17e276cd4bbfde86343452073e0"
    md5: "ca27dd917b4be56a229dd1fabb0c07da"
    source_ref: "pcsx2/ps2/BiosTools.cpp:16-17,80-197,258-283,317-370"
    note: >
      ROMVER 0220JD20121227, the PS2 BIOS the PS3's ps2_emu carries. Cut from
      dev_flash/ps2emu/ps2_emu.self of PS3 system software 4.90, decrypted by
      RPCS3, from 0x12F bytes before "compatible mode" to 0x262 bytes after
      "Parity error" and padded to 4 MiB, as firmware_bios_claim release 2
      does. Accepted like any image with a valid romdir.

