notes: |
  Commercial fantasy console by Lexaloffle Games LLP, sold as ZIP archives
  per platform. Nothing in the program checks a hash of its own files: the
  hashes below are those of the files in the official 0.2.7 archives.
  Voxatron, the same publisher's other program, is profiled apart
  (voxatron.yml).

  The program finds its own folder through /proc/self/exe and reads its
  .dat beside itself. The paths below are the layout of the archives, whose
  top folder is pico-8/: a launcher that runs one of these files from a
  folder places the program folder there.

  PICO-8 0.2.7 ships five archives. pico-8_0.2.7_amd64.zip holds pico8
  (x86_64, SDL2 linked in) and pico8_dyn (x86_64, system libSDL2).
  pico-8_0.2.7_raspi.zip holds pico8 (armhf, SDL2 linked in, needs the
  Raspberry Pi libbcm_host.so), pico8_dyn (armhf, system libSDL2), pico8_gpio
  (armhf, needs libbcm_host.so and libwiringPi.so) and pico8_64 (aarch64,
  system libSDL2). pico-8_0.2.7_i386.zip holds pico8_32bit and
  pico8_32bit_dyn, pico-8_0.2.7_windows.zip holds pico8.exe and
  pico-8_0.2.7_osx.zip holds PICO-8.app. Each binary opens pico8.dat from its
  own folder and quits when it is absent, and pico8.dat is the same file in
  every archive of one version. The binaries name no other file of the
  archive: which binary runs, and from which folder, is the launcher's choice.
  The amd64 and raspi archives carry pico8.dat 10b39730, byte for byte.

  Launchers by platform, each read at the revision the platform file pins:
  - Batocera lexaloffleGenerator.py runs bios/pico-8/pico8 and raises when it
    is missing or not executable, with LD_LIBRARY_PATH set to bios/pico-8.
    The name is fixed for every board: an x86_64 board needs the amd64 pico8,
    a Raspberry Pi 32-bit board the raspi pico8, an aarch64 board pico8_64
    renamed.
  - KNULLI knulli-install-pico8 unzips the raspi archive from roms/pico8,
    stops when pico8_64, pico8_dyn, pico8_gpio or pico8.dat is missing, moves
    pico8_64 to bios/pico-8/pico8 and the other three beside it. Its
    lexaloffleGenerator.py runs bios/pico-8/pico8 with no LD_LIBRARY_PATH.
    The RG35XX simplermenu launcher runs pico8_dyn.
  - Recalbox pico8Generator.py moves bios/pico-8 to /overlay/emulator/pico-8
    and renames pico8_64 to pico8 there, then runs it.
  - ROCKNIX start_pico8.sh runs roms/pico-8/pico8_64 on aarch64 and
    roms/pico-8/pico8_dyn on any other HW_ARCH, from roms/pico-8/<HW_ARCH>/
    when that folder exists. ROCKNIX reads nothing from bios/.
  - AmberELEC pico-8.sh runs roms/pico-8/pico8_64 and shows "Missing Pico-8
    binaries!" when pico8_64 or pico8.dat is absent.
  - EmuELEC pico8.sh copies roms/bios/pico-8/* to /emuelec/bin/pico-8 on the
    next start and runs pico8_dyn from there, with no existence check.
  - RetroDECK component_launcher.sh executes bios/pico-8/pico8, and its
    component_manifest.json lists pico8, pico8.dat and pico8_dyn as required.
  - RetroBat Pico8.Generator.cs runs pico8.exe from the folder its config
    names pico8 and returns nothing when pico8.exe is absent. That folder is
    an emulator install, outside the BIOS tree.
  - ArkOS (dArkOS pico8/pico8.sh) prefers roms/pico-8/pico8_64, then
    roms/pico-8/pico8_dyn, then extracts pico8_64 and pico8.dat from a
    *raspi.zip in that folder, and starts Fake08 when the binary or
    pico8.dat is still missing.
  - ES-DE es_find_rules.xml looks for pico8_64 under ~/Applications/pico-8
    and three other home folders on linuxarm, pico8 on linux and unix, and
    pico8.exe on Windows.

