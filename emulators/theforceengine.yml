  - name: "TEXTURES.GOB"
    category: game_data
    system: dark-forces
    description: "Dark Forces texture archive"
    required: true
    source_ref: "TheForceEngine/TFE_DarkForces/darkForcesMain.cpp:76 (c_gobFileNames[2])"

  - name: "SPRITES.GOB"
