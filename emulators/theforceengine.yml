  - name: "enhanced.gob"
    category: game_data
    system: dark-forces
    description: "Optional enhanced HD asset pack"
    required: false
    source_ref: "TheForceEngine/TFE_DarkForces/darkForcesMain.cpp:80-83, 1360-1372"

  - name: "Outlaws.lab"
    category: game_data
