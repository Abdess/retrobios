mode: standalone

notes: |
  DuckStation fork that runs the PlayStation based arcade boards. The RetroBat
  beta package is dev build D0014 of 4a9313c, whose tree is the one the 0.6.5
  release R0006 builds from f74a43c, and its resources/arcadedb.yaml is byte for
  byte the one of the release archive arcadeduck-windows-x64-release.zip, the
  source file with CRLF line ends. The source names the version 0.6.5-dev.
  ref: source src/scmversion/arcadeduck_version.h:12

  A game is a MAME style set identified by its archive name, .zip or .7z,
  through resources/arcadedb.yaml, read from the resources folder beside the
  executable. Without that file no archive is recognised and nothing boots.
  A clone reads the ROMs it lacks from the archives of its parents in the same
  folder, so split and merged sets load as well as non-merged ones. A Taito
  G-Net game also starts from its CHD image, identified through the same
  database.
  ref: source src/core/arcade/arcade_database.cpp:34, 1207-1224, 1404-1423,
       source src/core/arcade/arcade_database.cpp:1551-1596,
       source src/core/system.cpp:1624-1678

  Arcade boots skip the PlayStation BIOS scan: each board handler loads and
  checks its own BIOS. The PS1 BIOS search inherited from DuckStation only runs
  for a standard boot, which the RetroBat launcher never requests since it
  refuses anything but a .zip set.
  ref: source src/core/system.cpp:1837-1838, emulatorLauncher Generators/ArcadeDuck.Generator.cs:46-48

  Board firmware is read from the BIOS directory (EmuFolders::Bios, the
  [BIOS] SearchDirectory setting). RetroBat points it at the folder of the game
  when the firmware archive sits there, else at the RetroBat bios folder.
  ref: source src/core/settings.cpp:1794, source src/core/arcade/arcade_machine_handler.cpp:152-153,
       emulatorLauncher Generators/ArcadeDuck.Generator.cs:104-128

  A member of a firmware archive is found by name, case insensitive, with the
  size listed in arcadedb.yaml and its CRC32, or by size and CRC32 under any
  name. Its data must then match the CRC32 and, when one is listed, the SHA-1.
  Any mismatch stops the boot.
  ref: source src/core/arcade/systems/sony/zn/sony_zn.cpp:1203-1210,
       source src/core/arcade/systems/namco/system11/namco_system11.cpp:188-195,
       source src/core/arcade/arcade_rom_loader.cpp:258-293, 356-444

  Konami GV uses a fixed archive name and member, hardcoded in bios.cpp rather
  than read from the database: konamigv.zip, else konamigv.7z, in the BIOS
  directory. Konami GQ takes its BIOS member 420b03.27p from the game archive
  or the archive of a parent, so no separate file is read for it.
  ref: source src/core/bios.cpp:168-172, 221-263, 265-285,
       source src/core/arcade/arcade_machine_handler.cpp:36-44, 82-88

  arcadedb.yaml also declares sys573.zip (Konami System 573) and gq863.zip
  (Konami Twinkle), but no machine handler exists for those boards at this
  revision, so their sets never get to the point of opening a firmware archive.
  ref: source src/core/arcade/arcade_machine_handler.cpp:1102-1132

  Only the members a handler reads are listed under each archive: the 512 KiB
  main BIOS and the motherboard CAT702 security key for the ZN boards, c76.bin
  for Namco System 11. The Taito G-Net handler also reads the U30 flash and the
  second CAT702 key, and on COH-3002T the F35 EPROM, the COH-1002T socket being
  left empty and filled with FF. The uPD78081 MCU ROM of the ZN boards is undumped and
  emulated without it.
  ref: source src/core/arcade/systems/sony/zn/sony_zn.cpp:641

