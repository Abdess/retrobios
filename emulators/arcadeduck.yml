pin_frozen: "RetroBat, the only platform that ships it, packages this build: the ArcadeDuck.exe of its beta arcadeduck.7z (repo/win64/beta, 7 November 2026) reports 0.6.5-dev-buildD0014-g4a9313cac, the bump its changelog records (RetroBat CHANGELOG.md:7). The stable 8.3.1 package carries 0.5.3 build R0004 (26caf9cd). Later commits are not part of that package."
upstream_commit: "526b4a128827ecaef037134095cd95f431b52d06"
profiled_date: "2026-10-26"
core_version: "0.6.5-dev"
version_basis:
  kind: file
  path: "src/scmversion/arcadeduck_version.h"
  pattern: '#define\s+ARCADEDUCK_SEMANTIC_VERSION\s+"([^"]+)"'
display_name: "Arcade - Sony ZN-1, Namco System 11, Konami GV/GQ (ArcadeDuck)"
