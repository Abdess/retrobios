  # -- OpenH264 2.7.0 decoder, one build per OS and architecture --
  # The player fetches the build for its host into <cache>/ruffle/video/ the
  # first time a movie loads, with no prompt, so none needs to be supplied.

  - name: libopenh264-2.7.0-linux64.8.so
    path: "video/libopenh264-2.7.0-linux64.8.so"
    system: flash
    required: false
    bundled: true
    description: "OpenH264 2.7.0 decoder library, Linux x86_64"
    sha256: "1522f873a482923c5ec018a4415e1866898197528828c50f90fd300c94620df3"
    validation: [sha256]
    source_ref: "video/external/src/decoder/openh264.rs:65-68, 108-150, 177-195"

