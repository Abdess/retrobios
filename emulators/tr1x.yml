notes: |
  Enhanced engine for Tomb Raider 1 (1996), part of the TRX monorepo
  that also hosts TR2X and TR3X. Loads retail .phd level files, music
  tracks and FMV cutscenes from a Steam, GOG or disc install of TR1.

  Path resolution (src/trx/game/paths.c):
    levels   %mod_dir%/levels/<file>        GAME_DYNAMIC_PATH_LEVEL_FILE
    fmv      %mod_dir%/fmv/<file><ext>      GAME_DYNAMIC_PATH_FMV_FILE
    music    %mod_dir%/music/<name><ext>    GAME_DYNAMIC_PATH_MUSIC_DIR
  with %mod_dir% = games/tr1 under the TRX root. The game-flow file,
  the catalog_*.csv tables, string tables, injections, images and
  shaders ship inside the TRX zip (data/trx/ship/) and are not user
  files.

  FMV extension probing (src/trx/game/paths.c:76-79):
    .mp4 .mkv .mpeg .avi .webm .ogv .rpl .fmv .bik
  The retail Core/Eidos cutscenes are .rpl. The gameflow still names
  them .avi, resolution picks whichever extension exists.

  Music backend (src/trx/game/music/backend_files.c:33-36, 108-134):
    extensions .flac .ogg .mp3 .wav .wma
    file name  trackNN.<ext> (two-digit) or N.<ext>
    each name is tried in music/<language>/ for the audio language,
    then in music/ (src/trx/game/locale/chain.h:15-21)
  Retail TR1 CD rips yield track02..track60.

  TR1 keeps every sample inlined in the .phd level files, so no
  main.sfx accompanies the levels.

