notes: |
  Shared Retro Engine v4 decompilation driving the 2013 Christian Whitehead
  mobile ports of Sonic the Hedgehog and Sonic the Hedgehog 2. One binary
  per build; the game identity is derived from the GameConfig.bin inside
  the loaded data pack (gameWindowText "Sonic 1" or "Sonic 2").
  ref: RSDKv4/RetroEngine.cpp:423, RSDKv4/ModAPI.cpp:428

  CheckRSDKFile opens the data pack and compares its first six bytes to
  the "RSDKvB" signature; there is no checksum test. The engine falls
  back to a loose Data/ + Bytecode/ tree if the pack is absent. When
  GameConfig.bin cannot be loaded either way it writes a usage.txt that
  asks for a pack named Engine.dataFile[0] (default "Data.rsdk").
  ref: RSDKv4/Reader.cpp:25-102, RSDKv4/RetroEngine.cpp:296-331,
       RSDKv4/Userdata.cpp:251-263, RSDKv4/RetroEngine.cpp:483-520

  Up to four packs can be mounted (DataFile, DataFile2..4 in the Dev
  section of settings.ini); the extras default to Data2.rsdk, Data3.rsdk,
  Data4.rsdk once declared.
  ref: RSDKv4/Reader.hpp:38, RSDKv4/RetroEngine.cpp:324-331,
       RSDKv4/Userdata.cpp:396-408

