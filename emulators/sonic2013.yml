notes: |
  Shared Retro Engine v4 decompilation driving the 2013 Christian Whitehead
  mobile ports of Sonic the Hedgehog and Sonic the Hedgehog 2. One binary
  per build; the game identity is derived from the GameConfig.bin inside
  the loaded data pack (gameWindowText "Sonic 1" or "Sonic 2").
  ref: RSDKv4/RetroEngine.cpp:423, RSDKv4/ModAPI.cpp:428

  CheckRSDKFile just fopen()s the data pack; there is no signature or
  checksum test. The engine falls back to a loose Data/ + Bytecode/ tree
  if the pack is absent, and writes a usage.txt that asks for a pack named
  Engine.dataFile[0] (default "Data.rsdk").
  ref: RSDKv4/RetroEngine.cpp:296-331, RSDKv4/Userdata.cpp:251-263,
       RSDKv4/RetroEngine.cpp:484-521

  Up to four packs can be mounted (DataFile, DataFile2..4 in the Dev
  section of settings.ini); the extras default to Data2.rsdk, Data3.rsdk,
  Data4.rsdk once declared.
  ref: RSDKv4/RetroEngine.hpp:373, RSDKv4/Userdata.cpp:396-408

