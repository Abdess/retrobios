    md5: "303449713237a451424cf23c9e8c09fc"
    size: 153596
    source_ref: "src/hiscore.c:18,103,223-225, src/cpuexec.c:316-318"
    note: >-
      High score definitions, selected by misc_hiscorefile
      (advance/osd/glue.c:742,2873,2947). Absent, hs_open finds no entry and
      no high score is restored or saved. The hash is that of
      support/hiscore.dat in the release tarball.

  - name: history.dat
    bundled: true
    required: false
    category: game_data
    system: arcade
    sha1: "5206c85cad323acb885e28e1109b8e842919b7dd"
    md5: "ef258890848afdac0c07f016c2ac9294"
    size: 4208286
    source_ref: "src/datafile.c:331,585-599"
    note: >-
      Game history text, selected by misc_historyfile
      (advance/osd/glue.c:741,2878,2948) and read when the history menu is
      opened (src/usrintrf.c:2938-2962). Absent, the menu shows the
      history missing message. support/history.dat, installed by
      advance/advance.mak:31.

  - name: mameinfo.dat
    required: false
    category: game_data
    system: arcade
    source_ref: "src/datafile.c:331,625-629"
    note: >-
      Driver information text, selected by misc_infofile
      (advance/osd/glue.c:743,2886,2949). load_driver_history appends its
      entry to the history text (src/datafile.c:585-656). The release ships
      none.

  - name: cheat.dat
    required: false
    category: game_data
    system: arcade
    source_ref: "src/cheat.c:8442,8619-8622"
    note: >-
      Cheat definitions, selected by misc_cheatfile
      (advance/osd/glue.c:740,2871,2935) and read only when misc_cheat is on,
      which it is not by default (advance/osd/glue.c:608,2869). Absent, the
      cheat menu reads "cheat database not found" (src/cheat.c:2482).

  - name: event.dat
    bundled: true
    required: false
    category: game_data
    system: arcade
    sha1: "8c34c85f92bc6771d789e880953a1cc43341485e"
