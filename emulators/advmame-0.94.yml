notes: |
  AdvanceMAME 0.94.0, the MAME 0.94 core (src/version.c:1) under the Advance
  video, input and sound layer. The source is the release tarball that
  RetroPie builds (RetroPie scriptmodules/emulators/advmame-0.94.sh:16,
  sha1 3fc69e03c653981217018561b918f84ebf5f30b3). The amadvance/advancemame tag
  advancemame-0_94_0 (c4f96090a417c642ac168a14e83ed403c57949c4) carries the
  Advance layer alone, the MAME tree under src/ exists only in the tarball.
  The RetroPie patches rename the configuration file to advmame-0.94.rc,
  adjust the Pi framebuffer output and add extern qualifiers
  (RetroPie scriptmodules/emulators/advmame-0.94.sh:25-30,
  RetroPie scriptmodules/emulators/advmame-1.4.sh:25-44). None of them
  changes what is read.

  In this release a BIOS root set is a GAME entry flagged NOT_A_DRIVER
  (src/driver.h:487). The root sets are not listed in src/driver.c: they are
  reached through the clone_of pointer of the games that name them as
  parent. Twenty-five such sets have registered children and are listed
  below. taitogn is flagged NOT_A_DRIVER and registered
  (src/drivers/zn.c:4422, src/driver.c:2560), but no game names it as
  parent, so no load reaches its ROMs.

  ROM archives are searched under dir_rom, $home/rom:$data/rom by default
  (advance/osd/fileio.c:74, advance/linux/file.c:249-256), in the forms
  DIR/GAME/ROM, then DIR/GAME.zip/ROM (src/fileio.c:922-941,1025-1028). $home
  is $ADVANCE, or $HOME/.advance when that variable is unset
  (advance/linux/file.c:83-99). RetroPie sets dir_rom to
  $romdir/mame-advmame:$romdir/arcade
  (RetroPie scriptmodules/emulators/advmame.sh:100), so the BIOS archives
  sit beside the games, not in the BIOS directory. Each ROM is looked up
  along the parent chain (src/common.c:1193-1195), so a child game reads its
  BIOS from the root set's own archive. Inside an archive a member is
  matched by name, then by its printable CRC32 (src/fileio.c:1080-1091).

  No BIOS ROM carries ROM_OPTIONAL or a no-good-dump marker, so a missing one
  counts as an error and the load stops with "required files are missing,
  the game cannot be run" (src/common.c:940-962,1081-1084). A wrong length
  or checksum is only a warning (src/common.c:1018-1060).

  Where a system offers several BIOS revisions, SYSTEM_BIOS_ADD names them
  and misc_bios selects one by number or short name, "default" selecting
  entry 0 (advance/osd/glue.c:653-655,2881, src/common.c:859-895). Only ROMs
  of the selected revision are read (src/common.c:1459). Neo Geo lists MVS
  revisions alone, the Universe, debug and AES entries being commented out
  (src/drivers/neogeo.c:1540-1543,1559-1562).

  The support files are read from $home, then $data
  (advance/osd/fileio.c:82,88-90, advance/linux/file.c:204-235,249-256). make
  install copies event.dat and history.dat into $data
  (advance/advance.mak:29-32). support/hiscore.dat ships in the tarball but
  is not installed. A language file is opened under the name misc_languagefile
  carries, english.lng by default (advance/osd/glue.c:657-658,2870). The
  release ships none, and without one the built-in English strings are used
  (src/ui_text.c:259). No controller file is read, options.controller being
  pinned to zero (advance/osd/glue.c:650). blitmax.h, startup.h and help.dat
  are compiled into the binary (advance/osd/video.c:1293,1301,
  advance/osd/ui.c:1392). Samples and artwork are per-game archives under
  dir_sample and dir_artwork, named after the driver
  (src/sound/samples.c:191-193, src/artwork.c:1986-1987,2092).

files:
