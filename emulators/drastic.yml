exclusion_note: >
  fonts/orbitron.ttf and keymaps/Shield.dkm ship in the Android package and
  nothing opens them: neither string appears in the classes dex of the official
  apk nor in any of the native libraries, and the menus draw from a font
  compiled into the binary. Left out with them are the files DraStic authors
  itself and reads back, which are emulator state rather than system files:
  drastic.cfg and the per-directory drastic.cf2, the config/<name>.cfg profiles,
  savestates/<name>_<slot>.dss, the backup/<name>.dsv and .sav in-game saves,
  input_record/<name>.ir, the icon and file info caches, unzip_cache and
  unzipped_rom.nds, crash_dump.txt, the profiler dumps under profiles, and the
  drastic_mapped_memory.dat and drastic_mapped_memory_vram.dat scratch files of
  the memory mapper.
  ref: official apk classes dex, libdrastic_arm64.so r2.6.0.4a,
