emulator: Jazz² Resurrection
type: standalone + libretro
core_classification: game_engine
source: "https://github.com/deathkiller/jazz2-native"
upstream: "https://github.com/deathkiller/jazz2-native"
profiled_date: "2026-10-04"
source_commit: "cc06bdac1b957a069e1d05761c7437cd59886552"
core_version: "3.8.0"
display_name: "Jazz Jackrabbit 2 (Jazz² Resurrection)"
cores: [jazz2]
systems: [jazz-jackrabbit-2]

notes: |
  Open-source reimplementation of Jazz Jackrabbit 2 by Dan R. The engine
  ships its own Content/ tree (animations, metadata, translations) that
  sits next to the executable in a portable copy, or under
  <prefix>/share/<package>/ once installed.
  ref: Sources/Jazz2/ContentResolver.cpp:187-238 (GetContentPath per
       platform), Sources/Jazz2/ContentResolver.cpp:409-485 (Unix layouts)

  Original Jazz Jackrabbit 2 data is read from Source/ and converted
  on first launch into the engine's own formats under Cache/: Anims.j2a
  and Data.j2d into a package, then every .j2e, .j2l and the tilesets
  the levels name. Music and cinematics are read from Source/ as they
  are.
  ref: Sources/Jazz2/ContentResolver.cpp:279-309 (GetSourcePath),
       Sources/Main.cpp:2224-2288 (RefreshCache),
       Sources/Jazz2/Compatibility/AssetConverter.cpp:152-168,
       Sources/Jazz2/Compatibility/AssetConverter.cpp:400-516

  Content/ is the engine runtime, shipped with the release package.
  Source/ holds the user's own copy of the 1998 game data. Without
  Anims.j2a (or the shareware AnimsSw.j2a) and without an existing
  cache the engine starts but is not playable.

  The libretro build looks for Content/ next to the loaded file, in the
  core assets directory or in <system>/jazz2/, and for the original
  files in Source/ beside it, in the system directory itself or in
  <system>/jazz2/Source/.
  ref: Sources/Main.cpp:267-355

files:
  # ================================================================
  # Content/ (bundled runtime data, shipped with each release)
  # ================================================================

  - name: "Animations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Animations/"
    standalone_path: "Content/Animations/"
    bundled: true
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:1093, 1223, 2734-2735"
    note: "Native graphics, sounds and the UI fonts, opened through OpenContentFile."

  - name: "Metadata/"
    type: directory
    category: game_data
    path: "jazz2/Content/Metadata/"
    standalone_path: "Content/Metadata/"
    bundled: true
    required: true
    source_ref: "Sources/Jazz2/ContentResolver.cpp:839"
    note: "Actor .res descriptors (Common, Enemy, Player, UI, Boss, ...)."

  - name: "Translations/"
    type: directory
    category: game_data
    path: "jazz2/Content/Translations/"
    standalone_path: "Content/Translations/"
    bundled: true
    required: false
    source_ref: "Sources/Main.cpp:2019-2025, Sources/Jazz2/UI/Menu/LanguageSelectSection.cpp:82-88"
    note: "Language .mo bundles, searched in Cache/Translations/ first. Built-in English is used when none is loaded."

  # ================================================================
