  # Converted into Cache/ on first launch.
  # ================================================================

  - name: "Anims.j2a"
    category: game_data
    system: jazz-jackrabbit-2
    path: "jazz2/Source/Anims.j2a"
    standalone_path: "Source/Anims.j2a"
    required: true
    source_ref: "Sources/Main.cpp:2224-2240, Sources/Jazz2/Compatibility/AssetConverter.cpp:156-159"
    note: "Main animation archive. The cache cannot be created without it and the game is not flagged playable."

  - name: "AnimsSw.j2a"
    category: game_data
    system: jazz-jackrabbit-2
    path: "jazz2/Source/AnimsSw.j2a"
    standalone_path: "Source/AnimsSw.j2a"
    required: false
    source_ref: "Sources/Main.cpp:2227-2229"
    note: "Animation archive of the shareware demo, read when Anims.j2a is absent."

  - name: "Data.j2d"
