emulator: Jazz² Resurrection
type: standalone + libretro
core_classification: game_engine
source: "https://github.com/deathkiller/jazz2-native"
upstream: "https://github.com/deathkiller/jazz2-native"
profiled_date: "2026-10-04"
source_commit: "d436ec62052339527887909a6e0fa2db405749d8"
core_version: "3.9.0"
version_basis:
  kind: file
  path: "CMakeLists.txt"
  pattern: 'set\(NCINE_VERSION\s+"([^"]+)"\)'
display_name: "Jazz Jackrabbit 2 (Jazz² Resurrection)"
cores: [jazz2]
systems: [jazz-jackrabbit-2]

data_root:
  android:
    path: "Android/data/jazz2.resurrection/files"
    source_ref: "Sources/Jazz2/ContentResolver.cpp:506-557, Sources/Shared/IO/AndroidAssetStream.cpp:213-216, CMakeLists.txt:35, Sources/nCine/Backends/Android/Bridge/app/build.gradle.in:11"
    note: "with all-files access, the first of Games/Jazz² Resurrection, Games/Jazz2 Resurrection, Download/Jazz² Resurrection and Download/Jazz2 Resurrection on shared storage that holds Source, else the first one"
  ios:
    path: "Documents"
    source_ref: "Sources/Jazz2/ContentResolver.cpp:565-569, Sources/Jazz2/ContentResolver.cpp:837-838"
  windows:
    path: "<folder of Jazz2.exe>"
    source_ref: "Sources/nCine/MainApplication.cpp:696-715, Sources/Jazz2/ContentResolver.cpp:244-245, Sources/Jazz2/ContentResolver.cpp:469-470"
  macos:
    path: "~/Library/Application Support/Jazz² Resurrection"
    source_ref: "Sources/Jazz2/ContentResolver.cpp:570-574, Sources/Shared/IO/FileSystem.cpp:1768-1793, Sources/Shared/IO/FileSystem.cpp:1725-1732"
  linux:
    path: "$XDG_DATA_HOME/jazz2, else ~/.local/share/jazz2"
    source_ref: "Sources/Jazz2/ContentResolver.cpp:575-651, Sources/Shared/IO/FileSystem.cpp:1934-1947, CMakeLists.txt:30, cmake/ncine_options.cmake:274-275"
    note: "the folder of the executable for a portable copy with Content beside it. $XDG_DATA_HOME/Jazz² Resurrection when it already holds Cache. The AppImage uses the folder of the .AppImage when its Source holds Anims.j2a"

notes: |
  Open-source reimplementation of Jazz Jackrabbit 2 by Dan R. The engine
  ships its own Content/ tree (animations, metadata, translations) that
  sits next to the executable in a portable copy, or under
  <prefix>/share/<package>/ once installed.
  ref: Sources/Jazz2/ContentResolver.cpp:197-249 (GetContentPath per
       platform), Sources/Jazz2/ContentResolver.cpp:575-651 (Unix layouts)

  Original Jazz Jackrabbit 2 data is read from Source/ and converted
  on first launch into the engine's own formats under Cache/: Anims.j2a
  and Data.j2d into a package, then every .j2e, .j2l and the tilesets
  the levels name. Music and cinematics are read from Source/ as they
  are.
  ref: Sources/Jazz2/ContentResolver.cpp:444-473 (GetSourcePath),
       Sources/Main.cpp:2259-2323 (RefreshCache),
       Sources/Jazz2/Compatibility/AssetConverter.cpp:478-494,
       Sources/Jazz2/Compatibility/AssetConverter.cpp:686-848

  Content/ is the engine runtime, shipped with the release package.
  Source/ holds the user's own copy of the 1998 game data. Without
  Anims.j2a (or the shareware AnimsSw.j2a) and without an existing
  cache the engine starts but is not playable. A Content/ tree prepared
  by the AssetPacker tool carries Prebaked.pak: the conversion is then
  skipped and Source/ is not read.
  ref: Sources/Main.cpp:2171-2177,
       Sources/Jazz2/ContentResolver.cpp:818-826

  On Android, Apple, Unix, UWP, Switch and Vita a Content/ directory
  next to Cache/ (next to Source/ on iOS) is searched before the shipped
  one, its .pak files first.
  ref: Sources/Jazz2/ContentResolver.cpp:828-867,
       Sources/Jazz2/ContentResolver.cpp:933-982

  The libretro build looks for Content/ next to the loaded file, in the
  core assets directory or in <system>/jazz2/, and for the original
  files in Source/ beside it, in the system directory itself or in
  <system>/jazz2/Source/.
  ref: Sources/Main.cpp:294-382

