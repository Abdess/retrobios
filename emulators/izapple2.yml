notes: |
  Apple II emulator written in Go by Ivan Izaguirre. Boards: Apple ][ and ][+
  with 48 KB, Apple IIe and //e enhanced with 128 KB, and two clones, the Copam
  Base 64A and the Basis 108 (setup.go:36-58).

  Every ROM the machine needs is compiled into the binary. The whole resources
  directory is embedded with //go:embed (resources.go:25-26) and the 17 machine
  configs with //go:embed configs/*.cfg (configuration.go:51-52). LoadResource
  routes a name by its prefix: <internal>/ reads the embedded filesystem,
  http:// and https:// fetch over the network, anything else is a path on disk
  (resources.go:55-88). The shipped configs name main ROM, character ROM and
  boot diskette as <internal>/ paths, so the emulator starts into DOS 3.3 with
  no file on disk. The base64a and basis108 configs set rom: <custom>, which
  dispatches to loadMultiPageRom over six embedded PROM dumps each
  (setup.go:189-199, boardBase64a.go:7-16, boardBasis108.go:28-37).

  Two of the 27 registered cards name an image the emulator downloads instead
  of carrying: prodosromdrive and prodosromcard3 (cardBuilder.go:85-86). Both
  read the card slot ROM out of that image, so neither card has a boot ROM
  without it. No shipped model uses either card, they are reached with -sN.
  prodosnvramdrive is left out of the factory (cardBuilder.go:87).

  -rom and -charrom replace the embedded main and character ROM with a file of
  the user's choosing, and every disk, hard disk and cassette parameter takes
  user media and defaults to empty.

  Seven frontends besides the core: a2sdl, a2sdl3, a2fyne, a2ebiten, a2wasm,
  console and headless. ES-DE runs a2sdl, built as izapple2sdl_linux_amd64 or
  izapple2sdl_windows_amd64.exe, and passes the image as a positional argument.
  The libretro core in frontend/a2libretro builds from source only, is absent
  from the buildbot and the RetroArch online updater (doc/libretro.md), and its
  izapple2_libretro.info declares firmware_count = 0. It exposes the machine as
  a model option and no card configuration, so the two card images cannot be
  reached through it.

