    standalone_path: resources/shaders/vulkan/shadeboost.glsl
    required: true
    bundled: true
    description: "Vulkan shade boost shader"
    note: >-
      Compiled by the post-processing pass, which runs unconditionally in the
      device creation chain, so a source that cannot be read fails the device.
    source_ref: "pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:6517, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:6572-6577, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3056-3061"

