  - name: proverb.zip
    standalone_path: arcade/proverb.zip
    mode: standalone
    required: false
    max_size: 67108864
    validation: [size]
    description: "Arcade boot programs"
    note: >-
      The Proverb bootloader release, one zip holding bin/<gameid>/boot.elf for
      every arcade game. The Android application downloads it from the proverb
      nightly release into arcade under its files directory, refuses one over
      64 MB or one holding no boot program, and writes the game's boot.elf out
      of it at each import. The core opens only that boot.elf, at the path the
      game's manifest gives, and an arcade boot stops without it.
    source_ref: "platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:46-47, platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:58, platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:118, platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:131-167, platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:393-400, pcsx2/VMManager.cpp:1719-1726"

