    note: "Shipped in the assets of the 2.9 APK and in the 2.9 Linux AppImage."
    source_ref: "source pcsx2/GameDatabase.cpp:50, source pcsx2/GameDatabase.cpp:1404-1409, source pcsx2/GameDatabase.cpp:1345-1355"

  - name: armsx2_overrides.yaml
    path: pcsx2/resources/armsx2_overrides.yaml
    standalone_path: resources/armsx2_overrides.yaml
    mode: libretro
    required: false
    description: "Mobile GPU game database overlay"
