emulator: ARMSX2
type: standalone + libretro
core_classification: community_fork
bios_mode: agnostic
source: "https://github.com/ARMSX2/ARMSX2"
upstream: "https://github.com/PCSX2/pcsx2"
profiled_date: "2026-10-04"
source_commit: "d383b3636947565d9201f81e32178d0288623d8d"
core_version: "2.8"
display_name: "Sony - PlayStation 2 (ARMSX2)"
cores:
  - armsx2
  - armsx2_libretro
systems:
  - sony-playstation-2

bios_directory: "bios/"
resources_directory: "resources/"

notes: |
  PlayStation 2 emulator, a GPL-3.0 fork of PCSX2 that replaces the x86-64 only
  EE, IOP, VU and vtlb fast memory recompilers with native AArch64 ones. One tree
  builds the Android application com.armsx2, an iOS package, macOS, Windows and
  Linux on arm64, an SDL handheld frontend, and a libretro core.
  ref: README.md:1-24, platforms/android/app/build.gradle.kts:42, platforms/android/app/build.gradle.kts:110-124,
       .github/workflows/build-all.yml:79-85

  A BIOS image is required and boot stops without one: LoadBIOS returning false
  makes VMManager report that a PlayStation 2 BIOS is needed and return a startup
  failure. Only a GS dump replay skips the load. The folder is Bios under the data
  directory, bios by default, and on Android the setup wizard keeps it in
  app-private storage because the native file APIs cannot reliably open a dump off
  a SAF volume.
  ref: pcsx2/ps2/BiosTools.cpp:408-432, pcsx2/VMManager.cpp:2003-2023,
       pcsx2/Pcsx2Config.cpp:2554,
       platforms/android/app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java:80-92

  Detection is by content. The scan lists the BIOS folder, keeps files between 4
  and 8 MB, and accepts an image whose romdir carries a RESET entry followed by a
  readable ROMVER; the fifth ROMVER character gives the zone among Japan, USA,
  Europe, Asia, China, T10K, COH-H, Test and Free, and an EXTINFO entry supplies
  the serial. The console scan passes over a COH-H image. An image named in the
  configuration is opened at its own path, without the size filter. No name and
  no hash is matched anywhere. The image is read into the 4 MB ROM region and
  truncated to it, and one shorter than 2465792 bytes turns off the OSDSys
  parameter HLE. IsBIOSFromFd runs the same romdir test on a file descriptor,
  which is how the Android picker identifies a dump handed over by the storage
  framework.
  ref: pcsx2/ps2/BiosTools.cpp:17-18, pcsx2/ps2/BiosTools.cpp:81-211,
       pcsx2/ps2/BiosTools.cpp:329-385, pcsx2/ps2/BiosTools.cpp:434-457

  An arcade session, opened from an .acgame manifest carrying an NM game id,
  takes a Namco System 246 or 256 board BIOS instead. Filenames/ArcadeBIOS names
  it; when that is empty or is not a COH-H image the BIOS folder is scanned for
  images between 2 and 8 MB whose zone is COH-H, the one with EXTINFO serial
  20040519-145634, the System 256 board, being preferred. Boot stops when none is
  found. The boot ELF, the media image and the SRAM the manifest names are
  per-title content resolved beside it, and its dongle and second card are looked
  up in the memory cards folder.
  ref: pcsx2/ps2/BiosTools.cpp:272-327, pcsx2/ps2/BiosTools.cpp:412-419,
       pcsx2/VMManager.cpp:834-847, pcsx2/VMManager.cpp:1615-1750,
       pcsx2/VMManager.cpp:2006-2013

  Companions derive from the selected image. rom1 and rom2 are appended to the
  full name first, then substituted for the existing extension, so an image at
  ps2-0230a-20080220.bin is followed by ps2-0230a-20080220.bin.rom1 then
  ps2-0230a-20080220.rom1, and the open retries case-insensitively. Both regions
  are 4 MB here. The nvm and the mec are read at the substituted extension only;
  the nvm is rebuilt in memory with region and language defaults when it is
  missing or its config block is blank, and the mec is written back to disk as
  0x00020603, or 0x0104020a in an arcade session, when it cannot be read.
  ref: pcsx2/ps2/BiosTools.cpp:228-255, pcsx2/ps2/BiosTools.cpp:465-481,
       pcsx2/MemoryTypes.h:12-14, pcsx2/CDVD/CDVD.cpp:48-64,
       pcsx2/CDVD/CDVD.cpp:150-221

  The network adapter opens eeprom.dat and flash.dat from the working directory,
  standing in a compiled-in image for the first and a card filled with 0xFF for
  the second. DEV9hdd.raw is the default name of the empty disk image the settings
  page writes, and memory cards, save states and screenshots are likewise produced
  by the emulator rather than read from a distribution.
  ref: pcsx2/DEV9/DEV9.cpp:224-275, pcsx2/DEV9/flash.cpp:8-16,
       pcsx2/DEV9/flash.cpp:62-86, pcsx2/DEV9/DEV9.h:31-33

  An IRX named in the configuration is read into the ROM region at 0x3C0000 once
  the IOP reaches 0x1630. The field is empty by default and names no file of its
  own.
  ref: pcsx2/ps2/BiosTools.cpp:257-270, pcsx2/ps2/BiosTools.cpp:483-484,
       pcsx2/R3000AInterpreter.cpp:223, pcsx2/arm64/iR3000A-arm64.cpp:1283

  Everything under the resources folder is read at its own name from
  EmuFolders::Resources, and GetOverridableResourcePath lets a copy in
  UserResources take precedence. The standalone builds carry the folder with them,
  the Android application unpacks it from its assets and force-refreshes the
  shaders and the two game databases on update because a stale copy no longer
  matches the binary. The libretro core reads the same tree from
  <system>/pcsx2/resources, with the BIOS folder at <system>/pcsx2/bios. Its build
  also compiles in the shaders under shaders/common, shaders/opengl and
  shaders/vulkan, GameIndex.yaml and a patches.zip fetched at configure time; the
  copy in the resources folder wins and the compiled-in one stands in when the
  file is absent.
  ref: pcsx2/Pcsx2Config.cpp:2400-2414, pcsx2/Pcsx2Config.cpp:2563,
       pcsx2/Pcsx2Config.cpp:2637-2651, pcsx2-libretro/Main.cpp:180-181,
       pcsx2-libretro/Main.cpp:1101,
       platforms/android/app/src/main/java/kr/co/iefriends/pcsx2/MainActivity.java:60-61,
       platforms/android/app/src/main/java/kr/co/iefriends/pcsx2/MainActivity.java:370-387,
       pcsx2/CMakeLists.txt:1477-1496, pcsx2/CMakeLists.txt:1531-1533,
       pcsx2/GS/Renderers/Common/GSDevice.cpp:528-540,
       pcsx2/GameDatabase.cpp:1314-1324, pcsx2/Patch.cpp:303-325

  Missing resources are not uniformly survivable. A font that cannot be read is
  logged and skipped, LoadFontData succeeding regardless. A shader source that
  cannot be read fails the pipeline compile and the device with it, but only for
  the backend that reads it, and the renderer setting picks among OpenGL, Vulkan,
  Direct3D 11 and 12 on Windows and Metal on Apple systems. The caught failures
  are the three Vulkan compute pipelines, sharpening, FSR1 and SGSR, which turn
  themselves off. The databases, the patch archive, the controller mappings, the
  sounds and the interface artwork degrade instead.
  ref: pcsx2/ImGui/ImGuiManager.cpp:155-160, pcsx2/ImGui/ImGuiManager.cpp:509-525,
       pcsx2/ImGui/ImGuiManager.cpp:527-570,
       pcsx2/GS/GS.cpp:97-133, pcsx2/GS/GS.cpp:175-194,
       pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3056-3094

  The Qt builds resolve a per-script interface font by filename, first under
  UserResources then under the resources folder, and download the first entry of
  the script table into UserResources/fonts when neither holds it. Only the Latin
  and emoji entries are shipped.
  ref: pcsx2-qt/Translations.cpp:312-370, pcsx2-qt/Translations.cpp:407-424,
       pcsx2-qt/Translations.cpp:541-549

files:
  - name: ps2-0230a-20080220.bin
    path: pcsx2/bios/ps2-0230a-20080220.bin
    standalone_path: bios/ps2-0230a-20080220.bin
    agnostic: true
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and ROMVER is accepted, whatever its
      name. The 4 to 8 MB range gates the folder scan; an image named in the
      configuration skips that range. Read into the 4 MB ROM region and truncated
      to it. Shorter than 2465792 bytes disables the OSDSys parameter HLE. A
      COH-H image is passed over by the console scan.
    source_ref: "pcsx2/ps2/BiosTools.cpp:17-18, pcsx2/ps2/BiosTools.cpp:81-211, pcsx2/ps2/BiosTools.cpp:329-358, pcsx2/ps2/BiosTools.cpp:408-468"

  - name: r27v1602f.8g
    path: pcsx2/bios/r27v1602f.8g
    standalone_path: bios/r27v1602f.8g
    agnostic: true
    required: false
    min_size: 2097152
    max_size: 8388608
    validation: [size]
    config_key: "Filenames/ArcadeBIOS"
    description: "Namco System 256 board BIOS"
    note: >-
      Read by arcade sessions only, which cannot boot without a COH-H image.
      Found by content, whatever its name: the BIOS folder is scanned for images
      between 2 and 8 MB whose ROMVER zone is COH-H, and the scan stops at the
      one whose EXTINFO serial is 20040519-145634, the System 256 board, which
      also runs System 246 games. A configured arcade BIOS that is not COH-H is
      set aside for that scan. The name is the board position the 2 MB chip
      dump carries.
    source_ref: "pcsx2/ps2/BiosTools.cpp:272-327, pcsx2/ps2/BiosTools.cpp:412-432, pcsx2/VMManager.cpp:834-838, pcsx2/VMManager.cpp:2006-2013"

  - name: r27v1602f.7d
    path: pcsx2/bios/r27v1602f.7d
    standalone_path: bios/r27v1602f.7d
    agnostic: true
    required: false
    min_size: 2097152
    max_size: 8388608
    validation: [size]
    config_key: "Filenames/ArcadeBIOS"
    description: "Namco System 246 board BIOS"
    note: >-
      The other COH-H image the same scan accepts, taken when no System 256
      image is in the folder. The System 246 Rack C board carries EXTINFO serial
      20021119-163841.
    source_ref: "pcsx2/ps2/BiosTools.cpp:176-183, pcsx2/ps2/BiosTools.cpp:272-327, pcsx2/ps2/BiosTools.cpp:412-432"

  - name: ps2-0230a-20080220.rom1
    path: pcsx2/bios/ps2-0230a-20080220.rom1
    standalone_path: bios/ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1, with a case-insensitive retry on
      the open. Copied to the ROM1 region and truncated to 4 MB. Logged and
      skipped when absent.
    source_ref: "pcsx2/ps2/BiosTools.cpp:228-255, pcsx2/ps2/BiosTools.cpp:465, pcsx2/ps2/BiosTools.cpp:470-481, pcsx2/MemoryTypes.h:13"

  - name: ps2-0230a-20080220.rom2
    aliases:
      - "SCPH-90006_BIOS_VX_HK _230.ROM2"
    path: pcsx2/bios/ps2-0230a-20080220.rom2
    standalone_path: bios/ps2-0230a-20080220.rom2
    required: false
    max_size: 4194304
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1. Copied to the ROM2 region, which is 4 MB in
      this tree. Only present on Chinese region consoles.
    source_ref: "pcsx2/ps2/BiosTools.cpp:228-255, pcsx2/ps2/BiosTools.cpp:466, pcsx2/ps2/BiosTools.cpp:470-481, pcsx2/MemoryTypes.h:14"

  - name: ps2-0230a-20080220.nvm
    path: pcsx2/bios/ps2-0230a-20080220.nvm
    standalone_path: bios/ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    size: 1024
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm. Carries the
      console id, the iLink id, the MAC, the model number and the OSD
      configuration. A 1024 byte image is built in memory when the file is absent,
      short, or carries a blank config block, zeroed except for a fixed iLink id
      and the language and region defaults of the BIOS region. An arcade session
      skips the blank-block test and fills the built image with 0xFF instead.
    source_ref: "pcsx2/CDVD/CDVD.cpp:48-49, pcsx2/CDVD/CDVD.cpp:150-204"

  - name: ps2-0230a-20080220.mec
    path: pcsx2/bios/ps2-0230a-20080220.mec
    standalone_path: bios/ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    size: 4
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Defaults to
      0x00020603, or 0x0104020a in an arcade session, and is written back at that
      path when it cannot be read.
    source_ref: "pcsx2/CDVD/CDVD.cpp:62-63, pcsx2/CDVD/CDVD.cpp:206-219"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    size: 64
    description: "DEV9 EEPROM"
    note: >-
      Opened from the working directory when the network adapter starts and mapped
      over 64 bytes. A compiled-in image stands in when the file is missing or
      cannot be mapped.
    source_ref: "pcsx2/DEV9/DEV9.cpp:77, pcsx2/DEV9/DEV9.cpp:224-275"

  - name: flash.dat
    required: false
    hle_fallback: true
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened from the working directory at network adapter init and read as 1024
      blocks of 16 pages of 512 bytes plus 16 ECC bytes. The card is filled with
      0xFF when the file is absent, and a short read is logged.
    source_ref: "pcsx2/DEV9/flash.cpp:8-16, pcsx2/DEV9/flash.cpp:62-86"

  - name: "<module>.irx"
    required: false
    config_key: "EmuCore/CurrentIRX"
    unsourceable: "any IOP module the user points at, under no name and no version the code expects"
    description: "IOP module injected at boot"
    note: >-
      Read into the ROM region at 0x3C0000 when the IOP program counter reaches
      0x1630 and the setting is longer than three characters. Empty by default.
    source_ref: "pcsx2/ps2/BiosTools.cpp:257-270, pcsx2/ps2/BiosTools.cpp:483-484, pcsx2/R3000AInterpreter.cpp:223, pcsx2/arm64/iR3000A-arm64.cpp:1283, pcsx2/Config.h:1671"

  - name: GameIndex.yaml
    path: pcsx2/resources/GameIndex.yaml
    standalone_path: resources/GameIndex.yaml
    required: false
    bundled: true
    description: "Game database"
    note: >-
      Read from the resources folder, keyed by serial, carrying the per-game
      fixes, patches and settings overrides. Parsed once on first lookup. The
      libretro build falls back on a compiled-in copy when the file is absent.
    source_ref: "pcsx2/GameDatabase.cpp:47, pcsx2/GameDatabase.cpp:1373-1378, pcsx2/GameDatabase.cpp:1314-1324"

  - name: armsx2_overrides.yaml
    path: pcsx2/resources/armsx2_overrides.yaml
    standalone_path: resources/armsx2_overrides.yaml
    required: false
    bundled: true
    description: "Mobile GPU game database overlay"
    note: >-
      Second pass over the game database, merged onto the entries GameIndex.yaml
      declares. Carries GS and JIT tuning correct on tiler GPUs. Kept outside the
      shipped resources folder and copied in only for arm64 Linux, Android and
      iOS; the loader no-ops where it is absent.
    source_ref: "pcsx2/GameDatabase.cpp:54, pcsx2/GameDatabase.cpp:1379-1382, cmake/BuildParameters.cmake:227-240, pcsx2/CMakeLists.txt:1828-1837, platforms/android/app/build.gradle.kts:73-85"

  - name: RedumpDatabase.yaml
    path: pcsx2/resources/RedumpDatabase.yaml
    standalone_path: resources/RedumpDatabase.yaml
    required: false
    bundled: true
    description: "Disc track hash database"
    note: >-
      Loaded on the first hash lookup and used to tell the user whether a dump
      matches a known good one. Read by the Qt game summary page.
    source_ref: "pcsx2/GameDatabase.cpp:1461, pcsx2/GameDatabase.cpp:1511-1526, pcsx2-qt/Settings/GameSummaryWidget.cpp:325"

  - name: patches.zip
    path: pcsx2/resources/patches.zip
    standalone_path: resources/patches.zip
    required: false
    bundled: true
    description: "Game patch archive"
    note: >-
      Per-game pnach entries matched on serial and disc CRC. The patches and
      cheats folders take precedence over the archive. Fetched from the
      pcsx2_patches releases at build time for the desktop builds and committed
      for Android and iOS. The libretro build compiles in the copy it fetches at
      configure time and opens it when the file is absent.
    source_ref: "pcsx2/Patch.cpp:122, pcsx2/Patch.cpp:294-345, pcsx2/Patch.cpp:452-464, .github/workflows/linux_build_qt.yml:33"

  - name: game_controller_db.txt
    path: pcsx2/resources/game_controller_db.txt
    standalone_path: resources/game_controller_db.txt
    required: false
    bundled: true
    description: "SDL controller mapping database"
    note: >-
      A copy in the data root wins, then the resources folder, and the path is
      handed to SDL as a hint. SDL falls back to its built-in mappings when
      neither exists.
    source_ref: "pcsx2/Input/SDLInputSource.cpp:24, pcsx2/Input/SDLInputSource.cpp:699-713"

