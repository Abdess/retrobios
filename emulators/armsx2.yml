    description: "Soul Calibur II Conquest card"
    note: >-
      The cleared card of SC2MAKER, gzip-packed. Unpacked into the memory cards
      folder as NM00007.conquestcard, 8650752 bytes, when Soul Calibur II
      (NM00007) is set up with no card of its own, and read by the game in
      slot 2. The Android application ships it as an asset, the desktop arcade
      setup reads it through the overridable resource path.
    source_ref: "source pcsx2/Arcade/ArcadeSetup.cpp:593-642, source pcsx2/Arcade/ArcadeSetup.cpp:874-881, source pcsx2/VMManager.cpp:1871-1882, source platforms/android/app/src/main/java/com/armsx2/arcade/Arcade.kt:338-343"

  - name: proverb.zip
    standalone_path: arcade/proverb.zip
    mode: standalone
    required: false
    max_size: 67108864
    validation: [size]
    description: "Arcade boot programs"
    note: >-
      The Proverb bootloader release, one zip holding bin/<gameid>/boot.elf for
      every arcade game. The Android application downloads it from the proverb
      nightly release into arcade under its files directory, refuses one over
      64 MB or one holding no boot program, and writes the game's boot.elf out
      of it at each import. The core opens only that boot.elf, at the path the
      game's manifest gives, and an arcade boot stops without it.
    source_ref: "source platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:33-34, source platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:36, source platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:40, source platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:53-89, source platforms/android/app/src/main/java/com/armsx2/arcade/ArcadeLibrary.kt:135, source pcsx2/VMManager.cpp:1851-1858"

