  - name: tfx.glsl
    path: pcsx2/resources/shaders/vulkan/tfx.glsl
    standalone_path: resources/shaders/vulkan/tfx.glsl
    required: true
    bundled: true
    description: "Vulkan texture function shader"
    note: >-
      Compiled at device creation. A source that cannot be read fails the
      pipeline compile and the Vulkan device with it. The libretro build falls
      back on a compiled-in copy of every shader source.
    source_ref: "pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3031-3036, pcsx2/GS/Renderers/Common/GSDevice.cpp:528-540"

