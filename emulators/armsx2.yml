    bundled: true
    description: "Vulkan FSR1 upscaling shader"
    note: >-
      Read twice, once per pass, with ffx_a_fsr1.h and ffx_fsr1.h substituted
      for its include lines. A failure turns FSR1 upscaling off and device
      creation carries on.
    source_ref: "pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:6672-6676, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3087-3091, pcsx2/GS/Renderers/Common/GSDevice.cpp:1643-1660"

