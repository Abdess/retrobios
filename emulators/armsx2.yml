    standalone_path: resources/shaders/vulkan/cas.glsl
    required: false
    bundled: true
    description: "Vulkan contrast adaptive sharpening shader"
    note: >-
      Includes ffx_a.h and ffx_cas.h. The only shader whose compile failure is
      caught: sharpening is turned off and device creation carries on, because
      older Adreno compilers reject the compute pipeline.
    source_ref: "pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:6623-6625, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3069-3076"

