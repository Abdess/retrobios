    bundled: true
    description: "Vulkan SGSR upscaling shader"
    note: >-
      Read twice, once per edge-direction variant. A failure turns SGSR
      upscaling off and device creation carries on.
    source_ref: "pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:6720-6724, pcsx2/GS/Renderers/Vulkan/GSDeviceVK.cpp:3081-3085"

