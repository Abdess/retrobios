  - name: fxaa.fx
    path: pcsx2/resources/shaders/common/fxaa.fx
    standalone_path: resources/shaders/common/fxaa.fx
    required: true
    bundled: true
    description: "FXAA shader, shared by every backend"
    note: >-
      Compiled by the Vulkan and OpenGL post-processing passes as part of device
      creation, so the device fails without it. The Direct3D backends compile it
      lazily on first use and only lose the effect.
