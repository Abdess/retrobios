emulator: XRoar
type: standalone
core_classification: other
source: "https://www.6809.org.uk/git/xroar.git"
upstream: "https://www.6809.org.uk/xroar/"
version_source:
  url: "https://www.6809.org.uk/xroar/"
  pattern: 'version\s*<strong>([0-9.]+)</strong>, released'
profiled_date: "2026-10-20"
core_version: "1.12.1"
version_basis:
  kind: unverified
  why: host_unsupported
display_name: "Dragon / CoCo / MC-10 (XRoar)"
cores:
  - xroar
  - "xroar-cocous"
  - "xroar-dragon32"
systems:
  - dragon32
  - dragon64
  - coco
  - coco3
  - mc10
standalone_directories:
  - "~/.xroar/roms"
  - "${prefix}/share/xroar/roms"
standalone_pools:
  rompath: ""
  "-rompath": ""

notes: |
  XRoar by Ciaran Anscomb emulates Dragon 32/64, Tandy CoCo 1/2/3,
  MC-10, Alice, and clones (MX-1600, CP-400, Dragon 200-E, Deluxe CoCo).
  A ROM is looked up by name in the directories of rompath, a colon-separated
  list searched in order: the name as given first, then with .rom, .ROM, .dgn
  and .DGN appended, and the first file found is read (src/romlist.c:47-49,
  124-143, src/path.c:158-219). rompath is set in xroar.conf or with
  -rompath (src/xroar.c:3266). A Unix build defaults to
  ~/.xroar/roms:$(datadir)/xroar/roms, $(datadir) being ${prefix}/share
  unless configure is told otherwise (src/Makefile.am:236).

  The romlist mechanism defines fallback filenames per ROM slot. Each machine
  type has a default romlist that tries filenames in priority order. CRC32 is
  computed for loaded ROMs and matched against known-good values for breakpoint
  and feature detection, but mismatches do not prevent loading. A
  ROM metadata table (src/rom.c) maps CRC32 and size to a description, the
  debugger symbol table and, for a file inserted as a cartridge, the cartridge
  type. It names images, it does not accept or reject them.

  Machine selection: Batocera maps system names to default machines via
  xroarGenerator.py (mc10 -> mc10, dragon64 -> dragon64, others -> coco2bus).

files:
  # ---- Dragon 32 ----

  - name: "d32.rom"
    path: "d32.rom"
    system: dragon32
    description: "Dragon 32 BASIC ROM"
    required: true
    size: 16384
    crc32: "e3879310"
    validation: [crc32]
    aliases: [dragon32, d32rom, "Dragon Data Ltd - Dragon 32 - IC17"]
    source_ref: "src/xroar.c:649 (romlist d32), src/dragon/dragon32.c:40 (default @dragon32), src/dragon/dragon32.c:107,110-116,131-132 (load + CRC)"
    note: "Combined 16K ROM. Loaded into a single 16384-byte rombank slot. Romlist d32 tries d32, dragon32, d32rom, Dragon Data Ltd - Dragon 32 - IC17."

  # ---- Dragon 64 ----

  - name: "d64_1.rom"
    path: "d64_1.rom"
    system: dragon64
    description: "Dragon 64 32K mode BASIC ROM"
    required: true
    size: 16384
    crc32: "84f68bf9"
    validation: [crc32]
    aliases: [d64rom1, d64rom1.rom, dragrom, "Dragon Data Ltd - Dragon 64 - IC17", "Dragon Data Ltd - TANO IC18", "Eurohard S.A. - Dragon 200 IC18"]
    source_ref: "src/xroar.c:647 (romlist d64_1), src/xroar.c:653 (romlist dragon64), src/dragon/dragon64.c:151-157,169-171 (load + CRC)"
    note: "IC17 ROM. Required for the machine to start. Romlist d64_1 tries d64_1, d64rom1, Dragon Data Ltd - Dragon 64 - IC17, Dragon Data Ltd - TANO IC18, Eurohard S.A. - Dragon 200 IC18, dragrom."

