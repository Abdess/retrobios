    required: true
    size: 8192
    crc32: "c3dab585"
    validation: [crc32]
    aliases: [alpha_bt_10, "Dragon Data Ltd - Dragon Alpha Boot v1.0 150584"]
    source_ref: "src/xroar.c:660 (romlist dragonpro_boot), src/xroar.c:747 (crclist), src/dragon/dragonpro.c:246 (BOOT bank 8192), src/dragon/dragonpro.c:251-254 (load), src/dragon/dragonpro.c:269 (0xc3dab585 = Dragon Pro BOOT 1.0)"
    note: >-
      Required for Dragon Professional machine. Loaded as extbas_rom into the
      BOOT bank. rombank_verify_crc accepts any member of @dragonpro_boot,
      which also holds 0xd6172b56 for the v0.4 slot.
      Romlist dragonpro_boot tries alpha-boot-v1.0, alpha_bt_10, Dragon Data Ltd - Dragon Alpha Boot v1.0 150584, alpha-boot-v0.4, alpha_bt_04.

  - name: "alpha-boot-v0.4.rom"
    path: "alpha-boot-v0.4.rom"
    system: dragon64
    description: "Dragon Professional (Alpha) boot ROM v0.4"
    required: false
    size: 8192
    crc32: "d6172b56"
    validation: [crc32]
    aliases: [alpha_bt_04]
    source_ref: "src/xroar.c:660 (romlist dragonpro_boot), src/xroar.c:747 (crclist), src/dragon/dragonpro.c:246 (BOOT bank 8192), src/rom.c:93 (0xd6172b56 = Dragon Professional Boot 0.4)"
    note: >-
      Fourth and fifth candidates of the dragonpro_boot romlist, tried when no
      v1.0 image is found. The dragonpro_boot crclist carries 0xd6172b56 next
      to the v1.0 value, and the ROM metadata table names it Dragon
      Professional Boot 0.4.
      Romlist dragonpro_boot tries alpha-boot-v1.0, alpha_bt_10, Dragon Data Ltd - Dragon Alpha Boot v1.0 150584, alpha-boot-v0.4, alpha_bt_04.

  - name: "alpha-basic.rom"
