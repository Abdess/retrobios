notes: |
  PlayStation emulator, closed source and distributed as a binary. Five builds
  are read here. The desktop ones come from the download page: 2.0.18 Windows
  (md5 c1abd8cffcd0bc3dbd9c72b13bfc20e5, UPX packed, cited at the virtual
  addresses of the unpacked image), 2.0.5 Windows (bfa6eb173d9bae9b2e7983b23383c789),
  2.0.5 Linux x64 (52ef10e78aeec86f84105b7b59d375ee), 2.0.5 Linux x86
  (efe6c2c6303d4f7c5251166342bfb002) and 2.0.5 macOS x64
  (c4ca85710fbea827da2a1ce304536973). The Linux x64 build keeps 1771 of its own
  functions in .dynsym although it reports as stripped, so it is cited by
  function name. The Android side is package com.epsxe.ePSXe, versionCode 139
  versionName 2.0.15, apk md5 e18988b825f263bbc961bfbed1c4bc0b, with 2.0.6
  (fce9c60c5cbc4e075cf97a587e64eb78) read alongside it; both verify against the
  epsxe.com signing certificate (CN=epsxeteam, serial 0x4fdaca68), every entry
  digest matches and none is unsigned. Two copies of 2.0.16 circulating on
  archive.org are repackaged, signed CN=A1 and ModYolo, and are not read here.
  ref: epsxe.com/download.php, com.epsxe.ePSXe META-INF/CERT.RSA

  One root holds everything. On Linux and macOS it is $HOME/.epsxe, created at
  startup together with plugins, bios, cheats, sstates, patches, idx, config,
  info, covers, memcards, memcards/games, memcards/net, shaders and configs, and
  the process chdirs into it. On Windows it is the program directory with the
  same names. On Android it is a directory named epsxe at the root of shared
  storage, holding sstates, bios, isos, cheats, config, idx, patches, plugins,
  faqs, shaders, memcards and covers. Paths below are relative to that root.
  ref: ePSXe 2.0.5 Linux x64 create_folders 0x42a727-0x42abcf,
       ePSXe.java:1517, ePSXe.java:1541-1577

  Exactly one BIOS file is ever loaded, and its full path is a setting, not a
  name the code looks for: BiosPath in $HOME/.epsxe/epsxerc on Linux and macOS,
  biosPref in the shared preferences on Android, both defaulting to
  bios/scph1001.bin below the root. load_bios opens it read only, reads one block
  of 0x80000 bytes into the 0x80000-byte psxBIOS object and logs
  " * ePSXe: PSX BIOS loaded [%s]. ". A file that will not open reaches
  emu_mesg_exit_error with " * !Error: PSX BIOS not found [%s]. " and the run
  ends. The HLE branch, taken when the BiosHLE setting is on, skips the read
  entirely and logs " * ePSXe: using HLE BIOS (compatibility limited)", so any
  one of the images below fills the slot and none of them is needed on its own.
  HLE arrived in 1.9.25 and savestates made under it are not interchangeable
  with savestates made under a real image.
  ref: ePSXe 2.0.5 Linux x64 load_bios 0x433540-0x433621,
       ePSXe 2.0.5 Linux x64 bios_name_select 0x4334c0-0x4334f2,
       ePSXe 2.0.5 Linux x64 write_configfiledefault 0x42ae99-0x42aeeb,
       ePSXeReadPreferences.java:20-30, ePSXe.java:445-453,
       docs/ePSXe_en.txt:260-271, docs/ePSXe_en.txt:883-888

  Both consumer families carry a table of the images they recognise, and the two
  tables are built differently and do not hold the same set. Android ships 21
  pairs of label and md5; findBios walks the tree to a depth of ten, skipping
  DCIM, Camera, asec, secure, dev, obb, .lfs and anything under /Android/data,
  keeps files whose lowercased name ends in .bin and whose length is exactly
  524288, md5s each one and on a hit writes biosPref to that path and turns
  BiosHLE off. Windows ships 21 records of a 32-byte name and a 32-bit id, globs
  bios\*.bin, reads each candidate whole and identifies it by a checksum of its
  own: over the 512 KB as big endian 16-bit words, the sum shifted left 16 bits
  or'd with the low 16 bits of the xor. That value is looked up only to name the
  image in the setup wizard. The Linux and macOS builds carry neither table.
  Seventeen dumps are in both tables; four are known to Android alone; two are
  known to Windows alone and both turn out to be dumps TOSEC marks [b].
  ref: ScanBiosTask.java:28, ScanBiosTask.java:145-191, ePSXeNative.java:280,
       ePSXe 2.0.18 Windows 0x5c1090-0x5c1384, ePSXe 2.0.18 Windows 0x5c108c,
       ePSXe 2.0.18 Windows 0x42f264-0x42f2c7,
       ePSXe 2.0.18 Windows 0x42f4b0-0x42f568,
       ePSXe 2.0.18 Windows 0x42f584-0x42f5b4

  No region decides which image is taken. findBios keeps the first md5 that
  answers anywhere in the walk, the Windows ids only pick a label to display, and
  the JP, US and PAL words are part of that label string. Automatic selection of
  a required BIOS per game existed once and was removed because it stopped
  Legend of Dragoon US and Wild Arms 2 US from running.
  ref: ScanBiosTask.java:167-171, ePSXe 2.0.18 Windows 0x42f5aa-0x42f5c2,
       docs/ePSXe_en.txt:1243-1244

  Video, sound, cdrom and input go through the PSEmu Pro plugin interface.
  init_gpu builds plugins/<name> from the configured name, dlopens it and
  resolves GPUinit, GPUopen, GPUdmaChain and the rest of the entry points one by
  one; init_spu_plugins and LoadPadPlugins do the same for their own. Windows
  enumerates gpu*.dll, spu*.dll and cdr*.dll in plugins\. GPUCORE, SPUCORE and
  INPUTCORE are the built-in defaults and are not files. Android has no PSEmu Pro
  loader: its two OpenGL renderers ship inside the package and are only replaced
  when a file of the matching name is found under plugins.
  ref: ePSXe 2.0.5 Linux x64 init_gpu 0x4408a1-0x440bc0,
       ePSXe 2.0.5 Linux x64 LoadPadPlugins 0x51927e,
       ePSXe 2.0.5 Linux x64 write_configfiledefault 0x42ae29-0x42ae6e,
       ePSXe.java:842-977

  Per-title files are looked up beside the running game. ISOtestsubchannel reads
  patches/<name>.SBI, then patches/<name>.sbi, and reports " * Subchannel support
  from .sbi file. " when one answers. initGSCodes reads the cheat file
  cheats/<code>.txt keyed on the game code, on top of the two cheat databases
  load_cheat_dynamic_database opens from cheats. Android downloads the same cheat
  file from epsxe.com into cheats, reads faqs/<code>.txt into its help viewer and
  fills covers from epsxe.com.
  ref: ePSXe 2.0.5 Linux x64 ISOtestsubchannel 0x46f198-0x46f263,
       ePSXe 2.0.5 Linux x64 initGSCodes 0x432ea4-0x432f11,
       ePSXe 2.0.5 Linux x64 load_cheat_dynamic_database 0x431bc7-0x431cac,
       DownloadCheatFileTask.java:49-55, ePSXe.java:1047, ePSXe.java:1896,
       ImageLoader.java:88

  Shaders are directories, not single files. createProgramCustom reads
  <dir>/gpuCore.slv and <dir>/gpuCore.slf and readPropertiesProgramCustom reads
  <dir>/gpuCore.ini beside them, one directory per effect, and a stage that will
  not open logs " (unable to read shader file %s) ". The shaders pack on
  epsxe.com carries these triplets and Android pulls the same set one file at a
  time from an index it downloads first. The integrated Pete OpenGL2 plugin has
  its own set under the configured shader directory, defaulting to SHADERS\.
  ref: ePSXe 2.0.5 Linux x64 createProgramCustom 0x4f7d7e-0x4f7f42,
       ePSXe 2.0.18 Windows 0x4fb220-0x4fb263,
       DownloadShaderPluginTask.java:56-80

