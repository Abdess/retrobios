emulator: "Ymir"
type: standalone + libretro
core_classification: community_fork
source:
  standalone: "https://github.com/ymir-emu/Ymir"
  libretro: "https://github.com/warmenhoven/Emir/tree/libretro"
upstream: "https://github.com/ymir-emu/Ymir"
profiled_date: "2026-10-21"
source_commit:
  standalone: "ff9353790c191752a4d3dc19b9056c666acaf70a"
  libretro: "8174cbbeea4070654841cdd4604361b3eee8fdd1"
core_version:
  standalone: "0.4.2"
  libretro: "0.4.0"
version_basis:
  standalone:
    kind: file
    path: "CMakeLists.txt"
    pattern: '^project\(Ymir VERSION ([0-9][^ )]*)\)'
  libretro:
    kind: file
    path: "CMakeLists.txt"
    pattern: '^project\(Ymir VERSION ([0-9][^ )]*)\)'
display_name: "Sega - Saturn (Ymir)"
cores:
  - ymir
found_by: {standalone: content}
systems:
  - sega-saturn

data_root:
  windows:
    path: "%APPDATA%/StrikerX3/Ymir"
    source_ref: "apps/ymir-sdl3/src/app/profile.cpp:29-34, apps/ymir-sdl3/src/app/app.cpp:342-437, apps/ymir-sdl3/CMakeLists.txt:647-648"
    note: "Portable profile: the current directory, then the folder of the executable, when it holds Ymir.toml. The first launch asks between the two. -p names a folder, -u forces this one"
  macos:
    path: "~/Library/Application Support/StrikerX3/Ymir"
    source_ref: "apps/ymir-sdl3/src/app/profile.cpp:29-34, apps/ymir-sdl3/src/app/app.cpp:342-437, apps/ymir-sdl3/CMakeLists.txt:647-648"
    note: "Portable profile: the folder of the executable when it holds Ymir.toml. The first launch asks between the two. -p names a folder, -u forces this one"
  linux:
    path: "$XDG_DATA_HOME/StrikerX3/Ymir, else ~/.local/share/StrikerX3/Ymir"
    source_ref: "apps/ymir-sdl3/src/app/profile.cpp:29-34, apps/ymir-sdl3/src/app/app.cpp:342-437, apps/ymir-sdl3/CMakeLists.txt:647-648"
    note: "Portable profile: the current directory, then the folder of the executable, when it holds Ymir.toml. The first launch asks between the two. -p names a folder, -u forces this one. Always this folder under Flatpak"

notes: |
  Ymir is a Sega Saturn emulator by StrikerX3. The libretro port by
  warmenhoven wraps the shared ymir-core library on the libretro branch of
  warmenhoven/Emir, which the buildbot builds (include_core_ymir in
  libretro-super). PR #746 was closed unmerged.
  No .info file exists in libretro-core-info.

  Standalone: scans configured directories recursively for files matching
  the expected size. No specific filenames required. Identifies known ROMs
  by XXH128 hash from an internal database (19 IPL variants, 4 CD Block
  versions, 2 ROM carts). Unknown files are accepted if size matches.

  Libretro: reads {system}/sega_101.bin, mpr-17933.bin and saturn_bios.bin,
  each kept when it is exactly 512 KiB. A candidate's region comes from the
  IPL database, else from two hashes the port knows (sega_101.bin Japan,
  mpr-17933.bin North America and Europe). The ymir_region option picks the
  candidate of its region, else the first found, and once the disc is loaded
  a candidate whose region matches the disc's area code replaces it.
  ref: apps/ymir-libretro/src/libretro.cpp:305-309, 584-712,
       apps/ymir-libretro/src/libretro.cpp:1228-1238, 1285-1306

  Batocera standalone: configgen maps IPLROMImages to /userdata/bios,
  CDBlockROMImages to /userdata/roms/saturn/cdb/, ROMCartImages to
  /userdata/roms/saturn.

  No HLE fallback for IPL ROM. CD Block LLE is optional and falls back to
  HLE when disabled or no ROM found. Known CDB versions: 1.04, 1.05, 1.06.

  ROM cartridges: KoF95 and Ultraman shipped with physical ROM carts.
  Auto-detected from game database when loading a disc.

  Addon cartridges: 1M/4M DRAM expansion handled via core option (no files).

  XXH128 hashes used for ROM identification only, not validation.
  All file loading validates size only.

groups:
  ipl:
    required: true

files:
  - name: "sega_101.bin"
    system: sega-saturn
    required: true
    mode: standalone
    size: 524288
    validation: [size]
    description: "Saturn IPL ROM (BIOS). Any region accepted."
    note: "The libretro port reads sega_101.bin, mpr-17933.bin and saturn_bios.bin from its system directory (kBiosFilenames)."
    source_ref:
      standalone: "apps/ymir-sdl3/src/util/rom_loader.cpp:9-22, apps/ymir-sdl3/src/app/rom_manager.cpp:14-53, libs/ymir-core/include/ymir/sys/memory_defs.hpp:9"

  # The libretro build reads three names in its system directory. The md5 of
  # the first two is that of the image whose XXH128 is the kLocalBiosHashes
  # row the port gives a region to.
  - name: "sega_101.bin"
    system: sega-saturn
    region: [japan]
    group: ipl
    priority: 1
    mode: libretro
    size: 524288
    validation: [size]
    md5: "85ec9ca47d8f6807718151cbcca8b964"
    description: "Saturn IPL ROM 1.01 (1994-12-28), Japan."
    note: "First name read. The port gives this image the Japan region, so it is loaded when ymir_region is japan and kept or switched to for a disc whose area code is J. Any other 512 KiB file under this name is read with the region the IPL database gives it, or none."
    source_ref:
      libretro: "apps/ymir-libretro/src/libretro.cpp:305-309, apps/ymir-libretro/src/libretro.cpp:596-606, apps/ymir-libretro/src/libretro.cpp:627-648, apps/ymir-libretro/src/libretro.cpp:651-702, apps/ymir-libretro/src/libretro.cpp:1231-1238, apps/ymir-libretro/src/libretro.cpp:1290-1306"

  - name: "mpr-17933.bin"
    system: sega-saturn
    region: [north-america, europe, asia-ntsc, asia-pal, brazil, latin-america]
    group: ipl
    priority: 2
    mode: libretro
    size: 524288
    validation: [size]
    md5: "3240872c70984b6cbfda1586cab68dbe"
    description: "Saturn IPL ROM 1.01a (1994-11-15), North America and Europe."
    note: "Second name read. The port gives this image the US_EU region, loaded when ymir_region is north_america or europe and for a disc whose area code is any of T, U, B, A, E and L. Area K maps to the KR region, which neither image carries, so a Korean disc keeps the image already loaded."
    source_ref:
      libretro: "apps/ymir-libretro/src/libretro.cpp:305-309, apps/ymir-libretro/src/libretro.cpp:596-606, apps/ymir-libretro/src/libretro.cpp:627-648, apps/ymir-libretro/src/libretro.cpp:651-702, apps/ymir-libretro/src/libretro.cpp:1231-1238, apps/ymir-libretro/src/libretro.cpp:1290-1306, libs/ymir-core/include/ymir/media/media_defs.hpp:17-29"

  - name: "saturn_bios.bin"
    system: sega-saturn
    group: ipl
    priority: 3
    mode: libretro
    size: 524288
    validation: [size]
    description: "Saturn IPL ROM, any revision"
    note: "Third name read. No region comes with the name: the image gets the one the IPL database gives its hash, or none, and is loaded when it is the first candidate found or its region is the one asked for."
    source_ref:
      libretro: "apps/ymir-libretro/src/libretro.cpp:305-309, apps/ymir-libretro/src/libretro.cpp:651-702, apps/ymir-libretro/src/libretro.cpp:1231-1238"

