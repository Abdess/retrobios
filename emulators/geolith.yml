display_name: "SNK - Neo Geo AES/MVS (Geolith)"
cores:
  - geolith
systems:
  - snk-neogeo-mvs
  - snk-neogeo-aes
  - snk-neogeo-cd

notes: |
  Geolith emulates the Neo Geo AES, MVS, CD, and CDZ. Cartridge systems use
  .NEO format ROMs; CD systems use .cue or .chd disc images. System ROMs come
  from MAME-format ZIP archives in the system directory.

  Cartridge content opens aes.zip (System Type = AES, default) or neogeo.zip
  (MVS and Universe BIOS) (libretro/libretro.c:1243-1246). CD content opens
  neocd.zip (Front/Top Loader) or neocdz.zip (CDZ, default, and CD Universe
  BIOS) (libretro/libretro.c:1234-1242); Front/Top Loader additionally reads
  000-lo.lo from neocdz.zip, so neocdz.zip is needed in every CD mode
  (libretro/libretro.c:1253-1260). The Irritating Maze in MVS mode loads
  236-bios.sp1 from irrmaze.zip for trackball support; without it the game
  runs but the trackball does not work (libretro/libretro.c:1312-1323).

  Inside the opened archive, members are extracted by exact filename
  (src/geo.c:174-271). One 68K BIOS is selected by system type and region
  (defaults: System Type AES, Region USA):
    - AES Japan:          neo-po.bin
    - AES other regions:  neo-epo.bin
    - MVS USA:            sp-u2.sp1
    - MVS Japan:          japan-j3.bin
    - MVS Asia:           sp-45.sp1
    - MVS Europe:         sp-s2.sp1
    - Universe BIOS:      uni-bios_4_0.rom
    - CD Front Loader:    front-sp1.bin
    - CD Top Loader:      top-sp1.bin
    - CDZ:                neocd.bin
    - CD Universe BIOS:   uni-bioscd33.rom
  000-lo.lo is required in every mode; only the Front/Top Loader tolerates
  its absence from neocd.zip because it comes from neocdz.zip instead
  (src/geo.c:234-243, 273-285). sfix.sfix and sm1.sm1 are required for MVS
  and Universe BIOS modes only (src/geo.c:245-267).

  The core performs no hash or size validation on System ROMs. CD BIOS family
  detection and the optional CD speed hack patches use byte patterns and
  apply only when the 68K BIOS is at least 512 KiB (src/geo_cd.c:1888-1910,
  1904-1924). Upstream declares the expected archive MD5s through the Jolly
  Good API BIOS list (jg.c:220-231); the md5 fields on the archives below
  are copied from it.

