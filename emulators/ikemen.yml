emulator: Ikemen GO
type: standalone
core_classification: game_engine
source: "https://github.com/ikemen-engine/Ikemen-GO"
upstream: "https://github.com/ikemen-engine/Ikemen-GO"
profiled_date: "2026-10-04"
source_commit: "e8b065f410fa9507dbddc1d6b1abc231de99f8c6"
core_version: ~
display_name: "Ikemen GO"
cores: [ikemen]
systems: []
verification: existence

notes: |
  M.U.G.E.N.-compatible 2D fighting game engine written in Go. It reads the
  .def, .air, .cmd, .cns, .sff and .snd files of M.U.G.E.N. content, plus its
  own .zss state files.

  Every path below is relative to the working directory. The file names come
  from the embedded default configuration, src/resources/defaultConfig.ini,
  which save/config.ini overrides (src/main.go:189-195).

  The repository ships:
    data/: common animations, commands, constants and state files
    external/script/: the Lua scripts that drive menus and game modes
    external/icons/: window icons
    external/shaders/: optional post-processing shaders
    font/: debug.def with Open Sans, and the default-3x5 bitmap fonts

  The default configuration also names files the repository does not hold:
  the motif data/ikemen1/system.def, the effects pack data/gofx/gofx.def and
  the stage stages/stage0-720.def. Release packages copy chars, data, font,
  sound, stages and video from the Ikemen-GO-Screenpack repository next to
  the engine (.github/workflows/releases.yml:585-593).

  Characters and stages are found under chars/ and stages/
  (src/system.go:5364, src/system.go:5590).

files:
  - name: "script"
    path: "external/script"
    category: game_data
    description: "Lua scripts: main.lua and the modules it requires"
    required: true
    bundled: true
    source_ref: "src/resources/defaultConfig.ini:143, src/main.go:213-232"
    note: >
      main.go opens Config.System and panics when it is missing. main.lua
      requires debug, start, options and menu from the same directory.

