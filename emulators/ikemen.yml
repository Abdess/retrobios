    description: "Default motif font (font1)"
    required: false
    bundled: true
    source_ref: "src/resources/defaultMotif.ini:75, src/motif.go:2593-2609"
    note: "A motif font that fails to load is logged and replaced by an empty font."

  - name: "default-3x5.sff"
