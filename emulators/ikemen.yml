    description: "TrueType face named by debug.def"
    required: true
    bundled: true
    source_ref: "font/debug.def:19, src/util_desktop.go:29-40"
    note: >
      When the file is not found, the same name is searched in the system
      font directories; the engine panics when that fails too.

  - name: "default-3x5.def"
    path: "font/default-3x5.def"
