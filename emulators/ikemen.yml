    required: false
    source_ref: "src/system.go:5590, src/resources/defaultConfig.ini:178, external/script/main.lua:1770-1774"
    note: >
      User supplied. Debug.StartStage defaults to stages/stage0-720.def, the
      stage added when select.def lists none.
