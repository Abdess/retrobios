    source_ref: "src/resources/defaultConfig.ini:21, src/fightscreen.go:85-102, src/system.go:6551-6555"
    note: >
      Held by the Ikemen-GO-Screenpack repository and copied into release
      packages. A load failure puts the match loader in its error state.

  - name: "chars"
    path: "chars"
    category: game_data
    description: "Character directory"
    required: false
    source_ref: "src/system.go:5364, src/script.go:3190-3191"
    note: >
      User supplied. A character path that does not resolve as given is
      searched under chars/.

  - name: "stages"
    path: "stages"
