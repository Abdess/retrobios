    note: "One cascade is read at a time, the one the plugin index selects, relative to the plugins\\ working directory."

  # -- Named by the code, absent from both distributions --

  - name: opencv_ffmpeg2410.dll
    system: fpinball
    required: false
    description: "OpenCV 2.4.10 FFmpeg bridge, video files as a camera source"
    source_ref: "BAM.dll 1.5-408 .text:0x102a6013-0x102a605b"
    note: >-
      LoadLibraryA followed by GetProcAddress on cvCreateFileCapture_FFMPEG,
      cvGrabFrame_FFMPEG and the rest. A null handle leaves the entry points
      unbound and only the file source is lost.

  - name: CLEyeMulticam.dll
    system: fpinball
    required: false
    description: "CL-Eye Platform SDK driver interface for the PlayStation Eye"
    source_ref: "HT-PS3Eyes.dll (sha256 eda430e18e445668) import descriptor CLEyeMulticam.dll IAT 0x10108000-0x10108023 (9 functions, loader-resolved), 0x10004962 (CLEyeGetCameraCount), 0x10004a2f (CLEyeCreateCamera), PS3Eye.dll 0x10002480, 0x10002501, DesktopPS3Eye.dll 0x10002200, 0x1000229a (the same two calls)"
    note: "A load time dependency of the three PlayStation Eye plugins. Without it their LoadLibraryA fails and BAM skips them."

  - name: Kinect10.dll
    system: fpinball
    required: false
    description: "Kinect for Windows SDK 1.x runtime"
    source_ref: "Kinect.dll (sha256 3e3225474bfca5ad) import descriptor Kinect10.dll IAT 0x1021e1d8-0x1021e1fb (9 functions by ordinal, loader-resolved), FUN_10006980 0x10006ade (NuiInitialize, ordinal 14), DesktopKinect.dll (sha256 4aa59e24530b739e) FUN_10002e10 0x10002fa1 (NuiInitialize)"
    note: "A load time dependency of the two Kinect 1 plugins. FaceTrackLib.dll does not import it."

  - name: Kinect20.dll
    system: fpinball
    required: false
    description: "Kinect for Windows SDK 2.0 runtime"
    source_ref: "Kinect2.dll (sha256 3038bd37cfb6abff) import descriptor Kinect20.dll IAT 0x1021c1c8 (GetDefaultKinectSensor, loader-resolved), FUN_100036b0 0x100036c5 (GetDefaultKinectSensor)"
    note: "A load time dependency of the Kinect 2 plugin. Without it its LoadLibraryA fails and BAM skips it."

  - name: NPClient.dll
    system: fpinball
    required: false
    description: "NaturalPoint TrackIR client library"
    source_ref: "Future Pinball.exe 1.9.1.20101231 FUN_0045eff0 0x45f01a-0x45f08e (RegOpenKeyExA HKCU Software\\NaturalPoint\\NATURALPOINT\\NPClient Location, RegQueryValueExA Path), FUN_0045f100 0x45f1d9 (LoadLibraryA), TrackIR.dll FUN_100018c0 0x100018c7-0x100018e1 (the detoured LoadLibraryA keeps the handle of a name holding NPClient)"
    note: >-
      Loaded by Future Pinball itself from the TrackIR install directory the
      registry names, and intercepted by the TrackIR plugin. It comes from a
      TrackIR install rather than from any BAM distribution, which is why no
      path is given here.

analysis:
  written_not_read:
    note: >-
      Opened only for writing, so they are output rather than something to
      obtain. All of them sit in the BAM directory.
    entries:
      - what: "cfg\\<table>.cfg and cfg\\<table>.seq, per table settings and camera sequences"
        source_ref: "BAM.dll 1.5-408 .text:0x10025e59, 0x100319b9, 0x10032bdb"
        note: >-
          Built as cfg\\<table> then finished with the extension. Saved from the
          menu and read back on the next launch of the same table.
      - what: "Cache\\<table>-shadows.zip, precomputed shadow maps"
        source_ref: "BAM.dll 1.5-408 .text:0x10105c18-0x1010697f"
        note: >-
          Checked with GetFileAttributesA and rebuilt when absent. Holds
          shadowmaps.txt and one <name>-shadows.tga per light, written through
          the rendering engine.
      - what: "set3points.dat, the three point calibration of the screen corners"
        source_ref: "BAM.dll 1.5-408 .text:0x10077b80-0x10077bd7"
        note: "fopen_s with wb, fwrite, fclose. No read site exists."
      - what: "BAM_debug.log, BAM_CRASH.log and OpenGLdbg.log"
        source_ref: "BAM.dll 1.5-408 .text:0x1007a45b, 0x1007ae0a, 0x100d4318-0x100d4391"
        note: >-
          The crash log is written from the fault handler installed at load
          time, the other two only when the matching switch is on the command
          line.

  shipped_but_not_loaded:
    note: "Present in a distribution with no code path that opens it"
    entries:
      - what: "zlib.dll in BAM-OpenVR.zip"
        source_ref: "BAM.dll, renderingengine.dll and every plugin import directory"
        note: >-
          No shipped binary imports it and neither BAM.dll nor
          renderingengine.dll names it in any string. Both carry their own zlib.
      - what: "License.txt, 3741 bytes"
        source_ref: "bam-setup.exe payload"
        note: "The zlib licence the loader source carries, copied into the install."

  named_but_not_obtainable:
    note: "A literal the code opens that no distribution can provide"
    entries:
      - what: "c:\\games\\ppmm.bin"
        source_ref: "BAM.dll 1.5-408 .text:0x100cff69-0x100cffa5"
        note: >-
          fopen_s with rb then fread, guarded by two globals and reached only
          after glGetFloatv has read the modelview and projection matrices. The
          path is absolute and points at a directory no install creates.

  platform_components:
    note: >-
      Named in import directories but supplied by Windows or by a Microsoft
      redistributable, so they are prerequisites rather than payload.
    entries:
      - what: "MSVCP140.dll, VCRUNTIME140.dll, CONCRT140.dll and the api-ms-win-crt set"
        source_ref: "BAM.dll, renderingengine.dll import directories"
        note: "Visual C++ 2015 or later runtime. Neither distribution carries it."
      - what: "MSVCR100.dll, MSVCR120.dll and MSVCP120.dll"
        source_ref: "PostFX.dll, TrackIR.dll, DesktopKinect.dll, PinballHighScore.dll import directories"
        note: "Visual C++ 2010 and 2013 runtimes, for the older plugins."
      - what: "opengl32, glu32, dinput8, hid, avicap32, avifil32, msvfw32, d3d11, dxgi"
        source_ref: "BAM.dll, renderingengine.dll, plugin import directories"
        note: "Windows components."
