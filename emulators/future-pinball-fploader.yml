    aliases:
      - Keyboard.cfg
    required: false
    size: 316
    description: "Key bindings and screenshot paths, the one text config"
    source_ref: "BAM.dll 1.5-408 .text:0x100c3960-0x100c3a97"
    note: >-
      Keyboard.cfg is the older name and is renamed on sight. 9999 in a key
      slot leaves the function unbound.

  - name: default.cfg
    system: fpinball
    required: false
    size: 3072
    description: "Global camera, lighting, physics and rendering settings"
    source_ref: "BAM.dll 1.5-408 .text:0x100326ba-0x100371bc"
    note: >-
      A binary block of the same shape as a per table cfg. Saving it reports
      "default.cfg saved".

  - name: default.seq
    system: fpinball
    required: false
    bundled: true
    size: 1284
    category: game_data
    description: "Camera animation sequences used when a table brings none"
    source_ref: "BAM.dll 1.5-408 .text:0x10025e40-0x1002608f"
    note: >-
      Read as text. Every line is a comment to Future Pinball's own parser and
      carries a position, a scale, two angles and a duration.

  - name: default.xml
    system: fpinball
    required: false
    description: "Physics values applied when a table specifies none"
    source_ref: "BAM.dll 1.5-408 .text:0x100ae843-0x100ae8a7, 0x10037130-0x100371de"
    note: >-
      Same document shape as the presets under XML\. The save path produces one
      by extracting resource 464 of type XML from Future Pinball, 6264 bytes, so
      no copy ships.

  - name: default.zip
    system: fpinball
    required: false
    category: game_data
    description: "Texture pack applied to every table"
    source_ref: "BAM.dll 1.5-408 .text:0x100ae8ec-0x100ae990"
    note: >-
      Holds BMP/<id>.bmp entries keyed by Future Pinball resource id, the form
