    required: false
    description: "List of physics documents offered in the presets menu"
    source_ref: "BAM.dll 1.5-408 .text:0x100fba6a-0x100fbd8a"
    note: >-
      Read whole and split on "%d: %s" lines. The menu entry Add current XML
