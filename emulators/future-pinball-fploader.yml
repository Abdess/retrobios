    description: "The mod, injected into Future Pinball and holding every feature"
    source_ref: "BAM_FPloader FPLoader.cpp:45, 166-182"
    note: >-
      Taken from the loader's directory, else from C:\Games\Future Pinball\BAM\.
      Neither present ends the loader with a message box.

  - name: renderingengine.dll
    system: fpinball
    required: true
    bundled: true
    size: 8791552
    sha1: "b471bb4affb974e0af9874ee6fe28c4417809926"
    description: "Rendering engine and asset loader behind BAM"
    source_ref: "BAM.dll 1.5-408 import descriptor renderingengine.dll IAT 0x1055ea0c-0x1055eb1f (69 functions, no delay-load directory, so loader-resolved), FUN_1007d650 0x1007dccd (SetModuleWithResources), 0x1007dcd6 (RE::Init), FUN_1002d0d0 0x1002d2b8 (GetZipHandler on a ball zip), BAM_FPloader FPLoader.cpp:249-257"
    note: >-
      Bound statically by BAM.dll, so the injected LoadLibraryA fails without
      it and no BAM code runs. The loader adds its own directory to %PATH% for
      this file alone.

  - name: Future Pinball.exe
    system: fpinball
    required: true
    size: 28547584
    description: "The program BAM starts and modifies"
    source_ref: "BAM_FPloader FPLoader.cpp:41, 46, 184-240"
    note: >-
      Probed with GetFileAttributesA at four locations, /FPEXE first. Absent,
      the loader stops before creating any process. The size is that of
      release 1.9.1.20101231.

