emulator: LinApple
type: standalone
core_classification: community_fork
source: "https://github.com/linappleii/linapple"
upstream: "https://github.com/AppleWin/AppleWin"
profiled_date: "2026-09-04"
source_commit: "be9d1d2f3e26c1ef1f1bdc13455ea02954cd2109"
core_version: "3.0.0"
display_name: "Apple - Apple II (LinApple)"
cores:
  - linapple
systems:
  - apple-ii
mode: standalone

notes: |
  SDL port of AppleWin for Linux. The tree was taken off SourceForge by
  maxolasersquad, forked further by several users, and now sits under the
  linappleii namespace (README.md:8-22). Five frontends build from one core:
  sdl1, sdl2, sdl3, tui and headless (src/frontends/).

  Every ROM is still compiled into the binary, but no longer as a hand-written
  byte array. scripts/generate_roms.sh turns res/roms/*.rom into EmbeddedRoms.h
  and EmbeddedRoms.cpp at build time (CMakeLists.txt:280-297), each image behind
  an ENABLE_ROM_* macro. The relocation preserved the bytes: every hash this
  profile recorded against the old string literals matches the .rom file that
  replaced it.

  What that macro is set to decides whether a machine model runs at all.
  CMakeLists.txt:43-148 leaves the Apple ][, ][+, J-Plus, //e and Enhanced //e
  system ROMs ON, along with the Disk II, Super Serial Card, mouse,
  Mockingboard, printer and clock firmware. The three clone options are OFF:
  ENABLE_ROM_CLONE_BASE64A, ENABLE_ROM_CLONE_PRAVETS and
  ENABLE_ROM_CLONE_TK3000E (CMakeLists.txt:81-83). Selecting one of those
  machine types on a default build reaches mem_initialize with no rom_data,
  which prints the model name and its cmake flag, destroys the context and
  returns -1 (src/apple2/Memory.cpp:1252-1261). The message offers two ways
  out, and the second is a file: -R, --rom <file> loads a system ROM at
  runtime (src/frontends/common/AppArgs.cpp:87).

  A custom ROM takes precedence over anything embedded. mem_initialize accepts
  it at exactly 16384 or 12288 bytes, or larger, taking the trailing 16384 for
  the //e-class types and the trailing 12288 otherwise
  (src/apple2/Memory.cpp:1165-1186). Below 12288 nothing is selected and the
  machine fails to start. No hash or name is checked; the file is whatever the
  user points at.

  Character generators are res/charset40*.png, converted to XPM by CMake and
  included at src/apple2/Video.cpp:37-41. One of five is chosen from the
  machine type and the keyboard language (src/apple2/Video.cpp:1242-1266).
  The status font is an XPM as well (src/core/Asset.cpp:22,44).

  Master.dsk is inserted into slot 6 drive 1 at startup. asset_find_master_disk
  resolves it through Path::find_data_file (src/core/Asset.cpp:80-93), which
  walks the user data and config directories, the executable directory and its
  res/ neighbours, the share and etc prefixes, the compiled-in SOURCE_RES_DIR,
  ASSET_DIR, SYSCONF_DIR and SYS_DIR, then every XDG_CONFIG_DIRS entry
  (src/core/Util_Path.h:86-130). The same search serves icon.bmp.

  The debugger reads its symbol tables through g_state.program_dir, declared at
  src/core/LinAppleCore.h:159 and read in four places without ever being
  assigned, so the names resolve against the working directory.
  g_file_name_symbols lists nine tables (src/Debugger/Debugger_Symbols.cpp:64-74)
  and CmdSymbolsLoad preloads a table when the debugger calls it with no
  arguments (src/Debugger/Debugger_Symbols.cpp:664-681). ParseSymbolTable opens
  the file with fopen and a missing one leaves the debugger running without its
  symbols (src/Debugger/Debugger_Symbols.cpp:524).

  linapple.conf carries preferences only (src/core/Registry.cpp,
  src/frontends/common/AppEnvironment.cpp). Each accessor returns a compiled-in
  default when a key is missing.

files:
  - name: Master.dsk
    required: false
    description: "Boot floppy inserted into slot 6 drive 1 at startup"
    min_size: 143105
    max_size: 143364
    validation: [size]
    source_ref: "src/core/Asset.cpp:25,80-93,96-99"
    note: >
      asset_find_master_disk warns and returns non-zero when no search path
      holds the file, and the emulator starts with an empty drive. No hash or
      content check is performed. LinApple and Batocera ship different images
      under this name, both 143360 bytes.

  - name: icon.bmp
    required: false
    description: "Window icon read from disk by the SDL frontends"
    size: 2102
    md5: be7a389c5aa678f5e6ce4748593b0a29
    sha1: 5aee3a718f3d541122b61b9b8203e8a28db97a34
    source_ref: "src/frontends/sdl2/SDL_Asset.cpp:10-25,34-40"
    note: >
      asset_load_bmp resolves the name through Path::find_data_file, prints a
      warning to stderr when no search path holds it and returns nullptr. The
      sdl1 and sdl2 frontends load it; sdl3 declares the same helper. Absence
      costs the window its icon and nothing else.

  - name: APPLE2E.SYM
    required: false
    description: "Debugger symbol table for the main ROM"
    source_ref: "src/Debugger/Debugger_Symbols.cpp:64-74,664-681"
    note: >
      Preloaded into the Main table when the debugger calls CmdSymbolsLoad with
      no arguments. Parsed as text lines of address and symbol name, with no
      size or hash check.

  - name: A2_BASIC.SYM
    required: false
    description: "Debugger symbol table for Applesoft BASIC"
    source_ref: "src/Debugger/Debugger_Symbols.cpp:64-74,664-681"
    note: >
      Preloaded into the Basic table when the debugger calls CmdSymbolsLoad with
      no arguments. Parsed as text lines of address and symbol name, with no
      size or hash check.

  # System ROMs the default build leaves out. ENABLE_ROM_CLONE_BASE64A,
  # ENABLE_ROM_CLONE_PRAVETS and ENABLE_ROM_CLONE_TK3000E are OFF in
  # CMakeLists.txt:81-83, so these machine types refuse to start unless the
  # user passes the image with --rom. The names are the ones upstream gives
  # the images in res/roms; the option takes a path and checks no name.
  - name: Base64A.rom
    required: false
    description: "Copam Base 64A clone system ROM, supplied with --rom"
    min_size: 12288
    validation: [size]
    size: 49152
    md5: 352fdbcae14c6a8c0398822c7a273309
    sha1: f1c779af480b5bda2bdd03950c1201a5c5143bea
    source_ref: "CMakeLists.txt:81,85-89; src/apple2/Memory.cpp:96-97,1165-1186,1252-1261"
    note: >
      Larger than a system ROM: mem_initialize takes the trailing 12288 bytes
      for this machine type.

  - name: PRAVETS82.ROM
    required: false
    description: "Pravets 82 clone system ROM, supplied with --rom"
    min_size: 12288
    validation: [size]
    size: 12288
    md5: c619b7edfcf021f3b8fd20d9386676ba
    sha1: 8bd7ced83e209a15e9b19a05a5ef4b8e996dc1a5
    source_ref: "CMakeLists.txt:82,91-95; src/apple2/Memory.cpp:98-99,1165-1186,1252-1261"

  - name: PRAVETS8M.ROM
    required: false
    description: "Pravets 8M clone system ROM, supplied with --rom"
    min_size: 12288
    validation: [size]
    size: 12288
    md5: 76c79535f7cf77973e2c711aa977a124
    sha1: f1b4ff018acf95f3355f0d575b66a188d728b687
    source_ref: "CMakeLists.txt:82,91-95; src/apple2/Memory.cpp:100-101,1165-1186,1252-1261"

  - name: PRAVETS8C.ROM
    required: false
    description: "Pravets 8C clone system ROM, supplied with --rom"
    min_size: 12288
    validation: [size]
    size: 16384
    md5: 1896d7b98dd940c89f7c8ea899b71006
    sha1: c976fe56e57706c161f513a82ba3e0d8cda83904
    source_ref: "CMakeLists.txt:82,91-95; src/apple2/Memory.cpp:102-103,1165-1186,1252-1261"
    note: >
      A //e-class type: mem_initialize takes the trailing 16384 bytes when the
      file is larger.

  - name: TK3000e.rom
    required: false
    description: "Microdigital TK-3000 //e clone system ROM, supplied with --rom"
    min_size: 12288
    validation: [size]
    size: 16384
    md5: 8d84b614b545d4eec8799d3f325332cb
    sha1: f163e5753c18ff0e812a448e8da406f102600edf
    source_ref: "CMakeLists.txt:83,97-101; src/apple2/Memory.cpp:104-105,1165-1186,1252-1261"
    note: >
      A //e-class type: mem_initialize takes the trailing 16384 bytes when the
      file is larger.

analysis:
  embedded_roms:
    mechanism: >
      res/roms/*.rom compiled into EmbeddedRoms.cpp by scripts/generate_roms.sh
      at build time, each behind an ENABLE_ROM_* macro
    source_ref: "CMakeLists.txt:43-148,280-297; scripts/generate_roms.sh"
    extraction: "hashes computed from the res/roms images the generator reads"

    system_roms:
      - symbol: g_rom_apple2
        machine: "Apple ]["
        machine_type: A2TYPE_APPLE2
        image: res/roms/Apple2.rom
        cmake_option: ENABLE_ROM_APPLE2
        default: on
        source_ref: "src/apple2/Memory.cpp:1189-1193"
        size: 12288
        md5: 3c406514b9806a7c57ee65fb0b0c39b4
        sha1: 09288be705464b608ff190519ab008d3dfcd1b05

      - symbol: g_rom_apple2_plus
        machine: "Apple ][+"
        machine_type: A2TYPE_APPLE2PLUS
        image: res/roms/Apple2_Plus.rom
        cmake_option: ENABLE_ROM_APPLE2PLUS
        default: on
        source_ref: "src/apple2/Memory.cpp:1195-1199"
        size: 12288
        md5: 572b3005a4fa49bc54917b069b82c1ab
        sha1: 33a24f5489ba9195b44be77d9afb2252594cb5c7

      - symbol: g_rom_apple2_jplus
        machine: "Apple ][ J-Plus"
        machine_type: A2TYPE_APPLE2JPLUS
        image: res/roms/Apple2_JPlus.rom
        cmake_option: ENABLE_ROM_APPLE2_JPLUS
        default: on
        source_ref: "src/apple2/Memory.cpp:1201-1205"
        size: 12288
        md5: f3e8237eca3809bec2a42b984a1332a8
        sha1: ad200b3263d08e7235d0871c8595963a07adc905

      - symbol: g_rom_apple2e
        machine: "Apple //e Unenhanced"
        machine_type: A2TYPE_APPLE2E
        image: res/roms/Apple2e.rom
        cmake_option: ENABLE_ROM_APPLE2E
        default: on
        source_ref: "src/apple2/Memory.cpp:1207-1211"
        size: 16384
        md5: 346bc782c6a08a531c460e33bc03daf4
        sha1: 61fa9254628e5bb7236fb474006116d67684d747
        note: "First 4 KB loaded as internal Cx ROM, remaining 12 KB at $D000"

      - symbol: g_rom_apple2e_enhanced
        machine: "Apple //e Enhanced"
        machine_type: A2TYPE_APPLE2EENHANCED
        image: res/roms/Apple2e_Enhanced.rom
        cmake_option: ENABLE_ROM_APPLE2ENHANCED
        default: on
        source_ref: "src/apple2/Memory.cpp:1213-1217"
        size: 16384
        md5: 38063e08c778503fc03ecebb979769e9
        sha1: b8ea90abe135a0031065e01697c4a3a20d51198b
        note: "First 4 KB loaded as internal Cx ROM, remaining 12 KB at $D000"

    peripheral_firmware:
      - device: "Parallel printer card"
        slot: 1
        image: res/roms/Parallel.rom
        cmake_option: ENABLE_ROM_PRINTER
        default: on
        source_ref: "CMakeLists.txt:134,136-140"
        size: 256
        md5: 5902996f16dc78fc013f6e1db14805b3
        sha1: c75c751589cbcc1ad4ab4f63676af7abadd86f5b

      - device: "Super Serial Card"
        slot: 2
        image: res/roms/SSC.rom
        cmake_option: ENABLE_ROM_SSC
        default: on
        source_ref: "CMakeLists.txt:105,112-116"
        size: 2048
        md5: 67c0d61ab0911183faf05270f881a97e
        sha1: 6dab633470c6bc4cb3e81d09fda46597caf8ee57

      - device: "Mouse interface card"
        slot: 4
        image: res/roms/MouseInterface.rom
        cmake_option: ENABLE_ROM_MOUSE
        default: on
        source_ref: "CMakeLists.txt:119,122-126"
        size: 2048
        md5: 22563ab338024dac7b03510371d49c57
        sha1: 3a9d881a8a8d30f55b9719aceebbcf717f829d6f

      - device: "Disk II controller, 16 sector"
        slot: 6
        image: res/roms/DISK2.rom
        cmake_option: ENABLE_ROM_DISK2
        default: on
        source_ref: "CMakeLists.txt:104,107-111"
        size: 256
        md5: 2020aa1413ff77fe29353f3ee72dc295
        sha1: d4181c9f046aafc3fb326b381baac809d9e38d16

    character_generators:
      mechanism: "PNG converted to XPM by CMake, included at src/apple2/Video.cpp:37-41"
      selection: "machine type, then keyboard language (src/apple2/Video.cpp:1242-1266)"
      accepted_geometry: "128x128, or 128x256 for the Euro ROMs carrying a second language"
      images:
        - filename: charset40.png
          used_for: "Apple //e and Enhanced //e, English (US)"
          size: 2745
          md5: c6029ef4d4fa272083769673bdcf2b6c
          sha1: d79aa8af6446c3637401cb75ffdda92fdf7f3853
        - filename: charset40_IIplus.png
          used_for: "Apple ][ and Apple ][+"
          size: 1956
          md5: 2104f293d5df7137fdd579ea405da847
          sha1: bc9aa5cbadfcffe82b5b20ce954555b9d07fa260
        - filename: charset40_british.png
          used_for: "English (UK)"
          size: 5300
          md5: aa001ec528e3c6c472d02cbb09c5b365
          sha1: ac363e069b40658f86ccd1e2d57438db732dbc84
        - filename: charset40_french.png
          used_for: "French (FR)"
          size: 5330
          md5: f163ec67c91501b604ca349afef93fc3
          sha1: 5b454a2e7194863df3a997cc21e7ea6d61eb61d7
        - filename: charset40_german.png
          used_for: "German (DE)"
          size: 5290
          md5: 4d8ab9d3f15ee19d9e62c1f163df7e48
          sha1: f86bd5238604247e04d616850f244b489daef18d

  symbol_tables:
    source_ref: "src/Debugger/Debugger_Symbols.cpp:64-74"
    lookup: "g_state.program_dir + filename, and g_state.program_dir is never assigned"
    preloaded_at_init:
      - APPLE2E.SYM
      - A2_BASIC.SYM
      - A2_USER1.SYM
    loaded_on_command:
      - A2_ASM.SYM
      - A2_USER2.SYM
      - A2_SRC1.SYM
      - A2_SRC2.SYM
      - A2_DOS33.SYM
      - A2_PRODOS.SYM
    note: >
      Only APPLE2E.SYM and A2_BASIC.SYM are distributed with the emulator, in
      res/. The user slots and the remaining tables have no shipped counterpart.

  generated_files:
    written_only:
      - AppleWin.log
      - Profile.txt
      - Trace.txt
      - AppleWin_Text40.txt
      - AppleWin_Text80.txt
      - "save states"
      - "printer spool file"
      - "FTP directory cache"
    written_and_read_back:
      - LinAppleDebugger.cfg
    note: "Produced by the emulator, none is user-supplied"

  unused_resources:
    - filename: font.bmp
      reason: "shipped in res/ and named by no source file at this revision"
    - filename: fixedsys-excelsior-regular.ttf
      reason: "shipped in res/ and named by no source file at this revision"
