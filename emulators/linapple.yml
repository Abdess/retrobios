emulator: linapple-pie
type: standalone
core_classification: community_fork
source: "https://github.com/dabonetn/linapple-pie"
upstream: "https://sourceforge.net/projects/linapple/"
profiled_date: "2026-11-09"
source_commit: "c22ba0c3ad6c317b4f13486b7ff06a340c831122"
core_version: "2b.1"
version_basis:
  kind: file
  path: "CHANGELOG"
  pattern: '^Linapple-pie v([0-9][\w.]*)'
display_name: "Apple - Apple II (linapple-pie)"
cores:
  - "linapple"
systems:
  - apple-ii
mode: standalone
data_root:
  linux:
    path: "~/.linapple"
    source_ref: "src/Applewin.cpp:816-828, 558-574"
    note: "linapple.conf and Master.dsk are read from the working directory when this folder does not hold them."

notes: |
  SDL 1.2 port of LinApple 2b, itself an SDL port of AppleWin, reworked for
  frontends by Mark Ormond (README.md:1-6, CHANGELOG:11-14). Disks are
  mounted from the command line with -1 and -2, -r boots at once and -f
  starts full screen (src/Applewin.cpp:841-869).

  The four system ROMs are byte arrays in src/resource.h (Apple2_rom,
  Apple2plus_rom, Apple2e_rom, Apple2eEnhanced_rom at lines 5, 778, 1551,
  2581), picked from the machine type (src/Memory.cpp:963-970). The file
  loaders that AppleWin used are commented out (src/Memory.cpp:974-1023).
  The Disk II, Super Serial Card, mouse card, parallel printer and hard disk
  firmware are arrays in their own sources (src/Disk.cpp:50,
  src/SerialComms.cpp:57, src/MouseInterface.cpp:41,
  src/ParallelPrinter.cpp:35, src/Harddisk.cpp:113). Splash screen, font
  and 40 column character set are XPM compiled in (src/Video.cpp:34-35,
  src/stretch.cpp:39). No ROM is read from disk.

  RetroPie installs the binary with linapple.conf and Master.dsk, copies
  both to configs/apple2 when the user has none, links ~/.linapple there
  and starts the emulator from $romdir/apple2 with -1 and the game
  (RetroPie scriptmodules/emulators/linapple.sh:35-45, 51, 56-59, 66-73).

  Save states, the printer output file, FTP downloads and the FTP directory
  cache are written by the emulator. Disk and hard disk images are user
  content.

files:
  - name: "linapple.conf"
    required: false
    bundled: true
    size: 11271
    md5: "37111109ab7ae0a9ce408f8ef6e6307d"
    sha1: "65369dbb1d98332269b50efcc6cda97c3a1b735c"
    description: "Configuration file"
    source_ref: "src/Applewin.cpp:816-828, src/Registry.cpp:179-233"
    note: >
      Opened in append mode from ~/.linapple when that file exists, otherwise
      from the working directory, so a missing file is created empty. Each
      key that is absent keeps its compiled-in default. Shift+F8 rewrites
      the file. No size or hash check.

  - name: "Master.dsk"
    required: false
    bundled: true
    description: "DOS 3.3 boot floppy inserted into slot 6 drive 1 at startup"
    size: 143360
    md5: ecd3af4ea2b3c6d950b9089530525adb
    sha1: 11c4b65136c4abe968cf196c46b682b638f42212
    source_ref: "src/Applewin.cpp:534-576, src/Disk.cpp:496-541, src/DiskImage.cpp:741-791"
    note: >
      Inserted when no -1 disk is given and Slot 6 Autoload is off or -r
      is given,
      from ~/.linapple when the file exists there, otherwise from the
      working directory. A missing file leaves the drive empty. No hash is
      checked. The hashes are those of the copy in the repository, which
      make install copies beside the binary (src/Makefile:24, 54).

  - name: "icon.bmp"
    required: false
    bundled: true
    not_bundled_on: [retropie]
    description: "Window icon"
    size: 2102
    md5: be7a389c5aa678f5e6ce4748593b0a29
    sha1: 5aee3a718f3d541122b61b9b8203e8a28db97a34
    source_ref: "src/Frame.cpp:1207-1212"
    note: >
      Loaded with SDL_LoadBMP from the working directory. A missing file
      costs the window its icon and nothing else. The hashes are those of
      the copy at the root of the repository, where the build copies the
      binary (src/Makefile:37). make install leaves it out
      (src/Makefile:24, 54), and so does the RetroPie scriptmodule.
