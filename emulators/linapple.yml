  symbol_tables:
    source_ref: "src/Debugger/Debugger_Symbols.cpp:37-48"
    lookup: "system_state.program_dir + filename, and system_state.program_dir is never assigned"
    loaded_on_command:
      - APPLE2E.SYM
      - A2_BASIC.SYM
      - A2_ASM.SYM
      - A2_USER1.SYM
      - A2_USER2.SYM
      - A2_SRC1.SYM
      - A2_SRC2.SYM
      - A2_DOS33.SYM
      - A2_PRODOS.SYM
    note: >
      Each table is read by the LOAD parameter of its SYM command; no table is
      loaded when the debugger starts. Only APPLE2E.SYM and A2_BASIC.SYM are
      distributed with the emulator, in res/. The user slots and the remaining
      tables have no shipped counterpart.

  generated_files:
    written_only:
      - linapple.log
      - Profile.txt
      - Trace.txt
      - AppleWin_Text40.txt
      - AppleWin_Text80.txt
      - Printer.txt
      - "save states"
      - "FTP directory cache"
    note: >
      Produced by the emulator, none is user-supplied. CmdConfigSave builds
      the LinAppleDebugger.cfg path and passes it to no open call
      (src/Debugger/Debugger_Cmd_Config.cpp:218-221).

  unused_resources:
    - filename: font.bmp
      reason: "shipped in res/ and named by no source file at this revision"
    - filename: fixedsys-excelsior-regular.ttf
      reason: "shipped in res/ and named by no source file at this revision"
