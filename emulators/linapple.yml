emulator: LinApple
type: standalone
core_classification: community_fork
source: "https://github.com/linappleii/linapple"
upstream: "https://github.com/AppleWin/AppleWin"
profiled_date: "2026-10-04"
source_commit: "02f948d92b0c4df3272ff2ccb0dfcc4daac3e430"
core_version: "3.0.0"
display_name: "Apple - Apple II (LinApple)"
