analysis:
  embedded_roms:
    mechanism: >
      res/roms/*.rom compiled into EmbeddedRoms.cpp by scripts/generate_roms.sh
      at configure and build time, each behind an ENABLE_ROM_* macro
    source_ref: "CMakeLists.txt:57-145,308-346; scripts/generate_roms.sh:97-119"
    extraction: "hashes computed from the res/roms images the generator reads"

    system_roms:
      - symbol: g_rom_apple2
        machine: "Apple ]["
        machine_type: A2TYPE_APPLE2
        image: res/roms/Apple2.rom
        cmake_option: ENABLE_ROM_APPLE2
        default: on
        source_ref: "src/apple2/Memory.cpp:1062-1066"
        size: 12288
        md5: 3c406514b9806a7c57ee65fb0b0c39b4
        sha1: 09288be705464b608ff190519ab008d3dfcd1b05

      - symbol: g_rom_apple2_plus
        machine: "Apple ][+"
        machine_type: A2TYPE_APPLE2PLUS
        image: res/roms/Apple2_Plus.rom
        cmake_option: ENABLE_ROM_APPLE2PLUS
        default: on
        source_ref: "src/apple2/Memory.cpp:1068-1072"
        size: 12288
        md5: 572b3005a4fa49bc54917b069b82c1ab
        sha1: 33a24f5489ba9195b44be77d9afb2252594cb5c7

      - symbol: g_rom_apple2_jplus
