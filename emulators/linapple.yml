  - apple-ii
mode: standalone

notes: |
  SDL port of AppleWin for Linux. The SourceForge project was abandoned and
  its forks were gathered under the linappleii organization
  (README.md:163-170). Five frontends build from one core: sdl1, sdl2, sdl3,
  tui and headless (src/frontends/).

  The ROMs the emulator runs are compiled into the binary.
  scripts/generate_roms.sh turns res/roms/*.rom into EmbeddedRoms.h and
  EmbeddedRoms.cpp, once at configure time and again at build time
  (CMakeLists.txt:308-346), each image behind an ENABLE_ROM_* macro
  (scripts/generate_roms.sh:97-119). Nineteen images go through the generator:
  ten system ROMs, four character generator ROMs and five card ROMs. The
  printer card and the clock card carry their firmware as arrays in their own
  source files (src/apple2/peripherals/printer/Printer.cpp:30,
  src/apple2/peripherals/clock/ClockCard.cpp:20), and the Mockingboard
  registers no ROM.

  What a macro is set to decides whether a machine model runs at all.
  CMakeLists.txt:57-145 leaves the Apple ][, ][+, J-Plus, //e and Enhanced //e
  system ROMs ON, along with the Disk II, Super Serial Card and mouse
  firmware. The three clone options are OFF: ENABLE_ROM_CLONE_BASE64A,
  ENABLE_ROM_CLONE_PRAVETS and ENABLE_ROM_CLONE_TK3000E
  (CMakeLists.txt:95-97). Selecting one of those machine types on a default
  build reaches mem_initialize with no rom_data, which prints the model name
  and its cmake flag, destroys the context and returns -1
  (src/apple2/Memory.cpp:1124-1134). The message offers two ways out, and the
  second is a file: -R, --rom <file> loads a system ROM at runtime
  (src/frontends/common/AppArgs.cpp:77,186).

  A custom ROM takes precedence over anything embedded. load_custom_rom opens
  the path as given, then through Path::find_data_file, and refuses a file
  below 12288 or above 65536 bytes, which stops the start
  (src/frontends/common/AppController.cpp:104-148,228-230). mem_initialize
  accepts the buffer at exactly 16384 or 12288 bytes, or larger, taking the
  trailing 16384 for the //e-class types and the trailing 12288 otherwise
  (src/apple2/Memory.cpp:1038-1059). No hash or name is checked; the file is
  whatever the user points at.

  Character generators are res/charset40*.png, converted to XPM by CMake
  (CMakeLists.txt:277-306) and included at src/apple2/Video.cpp:39-43. One of
  five is chosen from the machine type and the keyboard language
  (src/apple2/Video.cpp:1228-1252). The status font and the splash screen are
  XPM as well (src/core/Asset.cpp:15-16,57,63). The four *_Video.rom images
  are compiled in, and no source file reads their symbols.

  Master.dsk is inserted into slot 6 drive 1 at startup unless the command
  line names a disk or the configuration autoloads one
  (src/frontends/common/AppController.cpp:171-192). asset_find_master_disk
  resolves it through Path::find_data_file (src/core/Asset.cpp:25-39), which
  walks the user data and config directories, the executable directory and its
  res/ neighbours, the share and etc prefixes beside it, the compiled-in
  SOURCE_RES_DIR, /usr/local/share/linapple, /usr/share/linapple, every
  XDG_CONFIG_DIRS entry and /etc/linapple (src/core/Util_Path.h:116-179). The
  same search serves icon.bmp and a --rom path that does not open as given.

  The debugger reads its symbol tables through system_state.program_dir,
  declared at src/core/LinAppleCore.h:103 and read without ever being
  assigned, so the names resolve against the working directory.
  g_file_name_symbols lists nine tables (src/Debugger/Debugger_Symbols.cpp:37-48).
  CmdSymbolsLoad reads a table's default file when it receives no argument
  (src/Debugger/Debugger_Symbols.cpp:636-652); its only caller is the LOAD
  parameter of the SYM commands (src/Debugger/Debugger_Symbols.cpp:817-819),
  and debug_initialize loads no table (src/Debugger/Debug.cpp:29-37).
  ParseSymbolTable opens the file with fopen and a missing one leaves the
  debugger running without its symbols (src/Debugger/Debugger_Symbols.cpp:495).

  Peripheral cards are linked into the executable by default. With
  BUILD_SHARED_PERIPHERALS, OFF at CMakeLists.txt:43, each card builds as a
  shared object, and peripheral_plugins_init opens every *.so found in the
  plugin search paths in either build
  (src/apple2/peripherals/Peripheral_Internal.cpp:192-219,
  src/core/Util_Path.h:102-114).

  linapple.conf carries preferences only (src/core/Registry.cpp,
  src/frontends/common/AppEnvironment.cpp). Each accessor returns a compiled-in
  default when a key is missing.

files:
  - name: Master.dsk
    required: false
    description: "Boot floppy inserted into slot 6 drive 1 at startup"
    min_size: 143105
    max_size: 143364
    validation: [size]
    source_ref: "src/core/Asset.cpp:20,25-39,97-112; src/apple2/peripherals/disk/formats/SectorDiskImage.cpp:65-66,79-82"
    note: >
      asset_find_master_disk warns and returns false when no search path
      holds the file, and the emulator starts with an empty drive. No hash or
      content check is performed. LinApple and Batocera ship different images
      under this name, both 143360 bytes.

  - name: icon.bmp
    required: false
    description: "Window icon read from disk by the SDL frontends"
    size: 2102
    md5: be7a389c5aa678f5e6ce4748593b0a29
    sha1: 5aee3a718f3d541122b61b9b8203e8a28db97a34
    source_ref: "src/frontends/sdl2/SDL_Asset.cpp:18-41,55-69"
    note: >
      sdl_asset_load_bmp resolves the name through Path::find_data_file,
      prints a warning to stderr when no search path holds it and returns
      nullptr. The sdl1, sdl2 and sdl3 frontends each load it when the window
      is created. Absence costs the window its icon and nothing else.

  - name: APPLE2E.SYM
    required: false
    description: "Debugger symbol table for the main ROM"
    source_ref: "src/Debugger/Debugger_Symbols.cpp:37-48,636-652"
    note: >
      Read into the Main table when SYMMAIN LOAD is entered without a file
      name. Parsed as text lines of address and symbol name, with no size or
      hash check.

  - name: A2_BASIC.SYM
    required: false
    description: "Debugger symbol table for Applesoft BASIC"
    source_ref: "src/Debugger/Debugger_Symbols.cpp:37-48,636-652"
    note: >
      Read into the Basic table when SYMBASIC LOAD is entered without a file
      name. Parsed as text lines of address and symbol name, with no size or
      hash check.

