emulator: Hypseus Singe
type: standalone
core_classification: enhanced_fork
source: "https://github.com/DirtBagXon/hypseus-singe"
upstream: "https://github.com/mirror/daphne-emu"
source_commit: "cda87965fe0a031d027b2253c6715d37cca6b56a"
profiled_date: "2026-08-08"
core_version: "v3.0.0"
display_name: "Arcade (Hypseus Singe)"
cores:
  - hypseus-singe
  - hypseus
systems:
  - arcade-laserdisc
mode: standalone

notes: |
  Fork of Matt Ownby's Daphne by DirtBagXon, rebuilt on SDL3, with Singe Lua
  scripting for fan-made American Laser Games conversions. Platforms invoke it
  as hypseus-singe (Batocera, RetroBat, ES-DE find rule HYPSEUS-SINGE) against
  the hypseus.bin binary.

  Each Daphne game loads its own arcade ROM set. game::load_roms() walks the
  driver rom_def table and opens roms/<set>.zip, locating each member by name
  case-insensitively; a member missing from the archive falls back to a loose
  file at roms/<set>/<member> (game.cpp:636-768). The set name is the rom_def
  dir field when set, otherwise the driver shortgamename, so a variant can pull
  members out of another game's archive. roms/ resolves under -romdir when
  given, otherwise under the home directory, with the application directory as
  fallback (homedir.cpp:97-108, 145-157).

  Member size is enforced: load_rom and load_compressed_rom only report success
  when the byte count read equals rom_def.size (game.cpp:857, 906). CRC32 is
  computed and compared but a mismatch only logs a warning (game.cpp:708-726),
  and a driver that passes crc32 0 skips the comparison entirely
  (game.cpp:712-716). A member that cannot be read at all aborts startup with
  "Could not load ROM images! You must supply these." (hypseus.cpp:205-260).
  Hashing is per member, never over the archive.

  The Dragon's Lair Enhancement and Space Ace Enhancement sets carry an extra
  readme member checked by exact CRC32 through verify_required_file(); a
  missing or altered readme calls set_quitflag() and the game does not run
  (game.cpp:773-837, lair.cpp:197-205, 261-275, 373-380).

  Singe games are not covered by rom_def. The Lua script, framefile and video
  arrive with the content and are passed on the command line (-script, -zlua,
  -framefile); singe_utils.cpp:35-42 only exposes the roms path to scripts.

  The emulator asset tree ships in the source distribution and packagers
  install it beside the binary (Batocera copies pics, fonts, sound and the
  doc .ini files to /usr/share/hypseus-singe). It is read from the working
  directory, not from a system directory:
    pics/ - led0.bmp through led17.bmp (LED_RANGE, video.h:71), player1.bmp,
      player2.bmp, lives.bmp, credits.bmp, time.bmp, ldp1450font.bmp, one of
      overlayleds1.bmp or overlayleds2.bmp, cadet.bmp, captain.bmp,
      spaceace.bmp, offcadet.bmp, offcaptain.bmp, offspaceace.bmp, oncadet.bmp,
      oncaptain.bmp, onspaceace.bmp, annunon.png, annunoff.png. load_bmps()
      returns false if any is absent and startup ends on "Video initialization
      failed!" (video.cpp:1020-1074, hypseus.cpp:201). tqkeys.png is read for
      the Thayer's Quest key overlay (video.cpp:632-635). A bezel directory,
      default bezels/, takes precedence for the bmp and png entries.
    fonts/ - default.ttf plus daphne.ttf for legacy overlay and Singe games or
      digital.ttf otherwise; a font that fails to open calls set_quitflag()
      (video.cpp:271-293, splash.cpp:45).
    sound/ - the per-game wav samples named by each driver, plus grumble.wav
      loaded for every game. load_waves() failure fails sound::init() and
      startup ends on "Sound initialization failed!" (sound.cpp:254-307,
      sound.cpp:156-186, hypseus.cpp:202). Under -nosound the branch is
      skipped and init returns true (sound.cpp:143, 193-196).
    doc/ - hypinput.ini, or hypinput_gamepad.ini under -gamepad. An
      unreadable file falls back to the compiled-in keymap (input.cpp:72,
      340-350, 1879).

  midi/soundfont.sf2 ships in the tree but no code path reads it in v3.0.0.
  midi/SOUNDFONTS.txt records that the SDL3 migration dropped the environment
  variable convention the SDL2 build relied on. pics/ConsoleFont.bmp is
  likewise unreferenced. starrider.cpp:99 keeps its ROM table in a
  commented-out load_roms, so the driver loads nothing.

