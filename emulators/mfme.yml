emulator: MFME
type: standalone
core_classification: embedded_hle
source: "https://www.desertislandfruits.com/"
upstream: closed-source
profiled_date: "2026-08-08"
core_version: "20.1"
display_name: "MFME (Fruit Machines)"
cores:
  - mfme
  - mfme-windows
systems:
  - fruitmachine
mode: standalone

notes: |
  Closed-source Delphi emulator for British and European fruit machines, written
  by Chris Wren (Wizard) and distributed as a Windows installer. MFME.exe carries
  FileVersion 20.1.0.0, FileDescription "Multiple Fruit Machine Emulator" and
  copyright "C.J.Wren 1997-2020"; the installer targets Windows 10, defaults to
  C:\MFME\v20 (history.txt:323) and writes HKCU\Software\CJW\MFME. The binary is
  ASPack compressed, imports dinput8, xaudio2_9, d2d1 and d3d11 for input, sound
  and the hardware accelerated scaler added in v19.0 (history.txt:8-9), and holds
  its layout engine in Delphi units around an EasyCompression Library core.
  Development ended with the author's death and Update.exe, reached from File ->
  Check For Updates (history.txt:235), no longer finds a server, leaving 20.1 as
  the last build. ES-DE calls MFME.exe with a .gam path and the working directory
  set to the emulator folder, through find rules MFME and MFME-WINDOWS, and runs
  it under Wine or Proton on Linux; .gam is in the arcade and mame extension
  lists.

  A machine is a folder holding a .gam file, the .fml layout it names and the ROM
  set. The .gam is plain text: a System line naming the tech, DIP switch, reel,
  stake, jackpot, percentage and meter state, a Layout line naming the .fml, a
  Game line, and one ROM line per ROM file. Layouts before v5 used .dat and are
  converted by loading them in v5 or v6 and saving; v20 loads .fml only. The .fml
  is an AACS container whose password is derived from a four byte seed at the end
  of the file through a mixer, hashed with RIPEMD-128 into a Rijndael key, and
  each chunk is zlib compressed; it holds the Delphi layout stream with every
  bitmap embedded, carries no external file path, and text components name a font
  family rather than a font file. MFME.exe takes the .gam path as its only
  argument (history.txt:271).

  ROM sets are per machine and self contained. Barcrest S4 and S5 sets are .LO and
  .HI program files with a .BIN sound ROM, MPU5 sets are .p1 to .p4, and other
  techs use .hex or .rom members named by the .gam. Fruit machine hardware has no
  system BIOS, so nothing is shared between machines, and sound ROMs belong to the
  machine as well: an S4 game whose sound ROMs are absent still runs and reports
  Wrong Snd Err (history.txt:301). v20.0 added an automatic ROM download for DIF
  legacy layouts (history.txt:293). Ctrl-K resets a game with its alternate ROM
  set (tips.txt).

  Effect samples are the mechanical cabinet sounds MFME plays itself, distinct
  from the game audio the sound ROM produces. Each effect has a fixed filename
  resolved in the game folder first, then DefaultSounds\Custom\<tech>\<cabinet
  style>, then DefaultSounds (DefaultSounds/Readme.txt:78-84), and files are
  opened when required rather than at layout load (history.txt:210-211). A
  preference forces the defaults over the ones a layout selects
  (history.txt:219). The distribution ships Custom folders for 40 techs: ACEVIDEO,
  ADDER5, ASTRASYSA1, BLACKBOX, COINMASTER, ELECTROCOIN, EPOCH, IGTS+, IGTS2000,
  IMPACT, INDER, M1AB, M1VIDEO, MACH2000A, MACH2000E, MACH2000S, MMM, MPS2, MPU2,
  MPU3, MPU4, MPU4PLASMA, MPU4VIDEO, MPU5, PCLMAXI, PHOENIX, PHOENIX2, PLUTO5,
  PROCONN, SCORPION1, SCORPION2, SCORPION4, SCORPION5, SRU, SYS1, SYS5, SYS83,
  SYS85, SYSTEM80 and spACE, with cabinet subfolders Eclipse for ADDER5,
  SCORPION4 and SCORPION5, Elegance for EPOCH, and Genesis for MPU4 and MPU5.
  DefaultSounds/Readme.txt:35-37 lists the electronic token mech effects as
  CoinInToken, CoinInTokenSwitch and CoinInTokenRejected; the files that ship and
  the entry that introduced them name them TokenIn, TokenInSwitch and
  TokenInRejected (history.txt:80).

  Three shipped directories are enumerated rather than looked up by name and
  therefore expect no particular filename. DefaultBackdrops and DefaultTiles hold
  the images offered as a backdrop or tiled background in the full screen modes,
  picked at random when the preference is set (history.txt:48, 55-56), and ship
  one wallpaper and six tiles. DefaultSounds/MiscSounds holds alternate payout,
  coin and note recordings that a user copies over an effect name. Fonts is
  scanned for the fonts a layout names, so its contents grow with the layouts
  installed.

files:
  # -- Output hardware library --

  - name: PacDrive32.dll
    system: fruitmachine
    required: true
    bundled: true
    description: "Ultimarc PacDrive, PacLed64 and UltimateIO output library"
    source_ref: "MFME.exe import directory, history.txt:278-279"
    note: >-
      Listed in the MFME.exe import descriptors, so the Windows loader resolves it
      at process start and MFME does not launch when it is absent from the
      application directory. Drives real cabinet lamps, hoppers and meters through
      Ultimarc boards; v20.0 updated the library and added PacLed64 and UltimateIO
      support.

  # -- Fonts, scanned from the Fonts folder beside MFME.exe --

  - name: LITHOGRB.TTF
    system: fruitmachine
    path: "Fonts/"
    required: false
    bundled: true
    category: game_data
    description: "Lithograph Bold, the font layouts name for machine text"
    source_ref: "history.txt:38, 309"
    note: >-
      v19.0 moved font loading from installed system fonts to the Fonts folder
      where MFME is located. Layouts store a font family name, not a file: the
      decoded layout stream names Lithograph. A layout whose font is missing shows
      the name in red in the properties screen and renders with a substitute.

  - name: LITHOGRL.TTF
    system: fruitmachine
    path: "Fonts/"
    required: false
    bundled: true
    category: game_data
    description: "Lithograph Light, the font layouts name for machine text"
    source_ref: "history.txt:38, 309"
    note: "Same mechanism as LITHOGRB.TTF, the light weight of the same family."

  - name: MFME.ttf
    system: fruitmachine
    path: "Fonts/"
    required: false
    bundled: true
    category: game_data
    description: "MFME segment and display font"
    source_ref: "history.txt:38, 168"
    note: "Shipped font used by MFME's own displays, updated in v19.5."

