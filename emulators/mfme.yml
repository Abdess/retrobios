notes: |
  Closed-source C++Builder VCL emulator for fruit machine and slot machine hardware,
  written by Chris Wren (Wizard) and distributed as a Windows installer. MFME.exe
  carries FileVersion 20.1.0.0, FileDescription "Multiple Fruit Machine Emulator" and
  copyright "C.J.Wren 1997-2020". The installer's setup data enables Windows 10
  only (OS.dat), sets InstallDir C:\MFME\v20 (SC.dat) and writes InstallPath and
  Installed under HKCU\Software\CJW\MFME (Registry.dat). MFME.exe keeps its
  settings in a TRegIniFile opened on SOFTWARE\CJW, under the current user root
  (FUN_004e2920 0x4e2e1b-0x4e2e28, key name at 0xae0a2e), section MFME
  (0xae0a24). The binary is ASPack compressed, imports dinput8, xaudio2_9, d2d1
  and d3d11 for input, sound and the hardware accelerated scaler, and holds its
  layout engine in Delphi units around an EasyCompression Library core.
  Addresses in the source_ref fields are virtual addresses of the image the ASPack
  stub unpacks (image base 0x400000, entry 0x402a88), read from MFME.exe sha256
  8b3c873078b4a9d6.
  The File menu item Check For Updates (form resource, OnClick
  CheckForUpdates1Click at 0x5194f4) calls FUN_00515fec, which checks FileExists
  on Update.exe in the MFME folder (0x516006-0x516042) and starts a thread that
  fills a SHELLEXECUTEINFO with verb runas and that path (0x5195ca-0x519657) and
  calls ShellExecuteExW (0x519945).
  ES-DE calls MFME.exe with a .gam path and the working directory set to the
  emulator folder, through find rules MFME and MFME-WINDOWS, and runs it under
  Wine or Proton on Linux. .gam is in the arcade and mame extension
  lists.

  A machine is a folder holding a .gam file, the .fml layout it names and the ROM
  set. The .gam is plain text: a System line naming the tech, DIP switch, reel,
  stake, jackpot, percentage and meter state, a Layout line naming the .fml, a
  Game line, and one ROM line per ROM file. The .fml is an AACS container whose password is derived from a four byte seed at the end
  of the file through a mixer, hashed with RIPEMD-128 into a Rijndael key, and
  each chunk is zlib compressed. It holds the Delphi layout stream with every
  bitmap embedded, carries no external file path, and text components name a font
  family rather than a font file. FUN_00509a68 walks ParamStr 1 to ParamCount
  (0x50a3c7-0x50aac8), takes the switches -g, -x, -y, -w, -h, -i, -mode,
  -nohistory and -slave, and keeps any other argument that FileExists accepts,
  expanded to a full path, as the file to open. Its extension sends a .gam to
  FUN_004e85c0 (0x50ab40-0x50abb4) and a .fml to FUN_004f5a90 (0x50abc1-0x50ac2d).

  ROM sets are per machine and self contained. Barcrest S4 and S5 sets are .LO and
  .HI program files with a .BIN sound ROM, MPU5 sets are .p1 to .p4, and other
  techs use .hex or .rom members named by the .gam. Fruit machine hardware has no
  system BIOS, so nothing is shared between machines, and sound ROMs belong to the
  machine as well. FUN_00625c88 opens a file name starting with http through the
  download path (0x625cc6-0x625d64), opens a local file when FileExists holds
  (0x625d77-0x625d8a), and otherwise, unless the extension is .ram, .fml, .rtc,
  .eep, .wsp or e2p (0x625dac-0x625f6e), prefixes it with
  https://www.desertislandfruits.com/legacy/ (0xae531a, 0x625f7a) and fetches it
  from there.

  Effect samples are the mechanical cabinet sounds MFME plays itself, distinct
  from the game audio the sound ROM produces. The effect table at 0xad7ac8 holds
  55 entries of 12 bytes (file name, label, flags). FUN_005fad6c loads every
  entry through FUN_005faa24, and FUN_005fb284 reloads one entry with the path
  FUN_005158fc builds: the game folder unless the force defaults flag at 0xb915cc
  is set (0x515b61-0x515b9c), then DefaultSounds\Custom\<tech>\<cabinet style>\
  with the style taken from the table at 0xa84cf4 (0x515a87-0x515afd, 0x515c38),
  then DefaultSounds\. Each file goes through FUN_005f9584, which opens it with
  mmio, expects a RIFF WAVE with a PCM fmt chunk and a data chunk, and returns
  nothing otherwise, so a missing or unreadable sample leaves its effect silent.
  The distribution ships Custom folders for 40 techs: ACEVIDEO,
  ADDER5, ASTRASYSA1, BLACKBOX, COINMASTER, ELECTROCOIN, EPOCH, IGTS+, IGTS2000,
  IMPACT, INDER, M1AB, M1VIDEO, MACH2000A, MACH2000E, MACH2000S, MMM, MPS2, MPU2,
  MPU3, MPU4, MPU4PLASMA, MPU4VIDEO, MPU5, PCLMAXI, PHOENIX, PHOENIX2, PLUTO5,
  PROCONN, SCORPION1, SCORPION2, SCORPION4, SCORPION5, SRU, SYS1, SYS5, SYS83,
  SYS85, SYSTEM80 and spACE, with cabinet subfolders Eclipse for ADDER5,
  SCORPION4 and SCORPION5, Elegance for EPOCH, and Genesis for MPU4 and MPU5.
  The table names the electronic token mech effects TokenIn.wav, TokenInSwitch.wav
  and TokenInRejected.wav (0xadb143, 0xadb158, 0xadb17a), the names the
  distribution ships, and holds RelayOn.wav and RelayOff.wav, which the
  distribution does not ship.

  Three shipped directories are enumerated rather than looked up by name and
  therefore expect no particular filename. DefaultBackdrops and DefaultTiles hold
  the images offered as a backdrop or tiled background in the full screen modes.
  FUN_0051336c and FUN_005137dc walk <MFME folder>\DefaultTiles\* and
  \DefaultBackdrops\* with FindFirst and FindNext (0x5133ea-0x51379a,
  0x51385a-0x513c0a), keep .bmp, .jpg and .png names, and add each full path to
  the lists at +0x1f78 and +0x1f7c. FUN_00513c4c and FUN_00513cf4 pick one entry
  with System Random over the list count (0x513c90, 0x513d38). The distribution
  ships one wallpaper and six tiles. DefaultSounds/MiscSounds holds alternate payout,
  coin and note recordings that a user copies over an effect name. Fonts is
  enumerated by FUN_00511f0c, which registers up to 100 font files of any name,
  so its contents grow with the layouts installed.

files:
  # -- Output hardware library --

  - name: PacDrive32.dll
    size: 71168
    sha1: f77e7836ee114947f38bfd854843c0b987399f0e
    system: fruitmachine
    required: true
    bundled: true
    description: "Ultimarc PacDrive, PacLed64 and UltimateIO output library"
    source_ref: "MFME.exe 20.1.0.0 packed PE import descriptor 0xdba03c (pacdrive32.dll, ordinal 11 into IAT 0xdba2c0, loader-resolved), ASPack stub restores IAT 0xc692ac-0xc692d4 (ordinals 11, 12, 6, 27, 20, 25, 26, 23, 2, 5, 3), FUN_0050f998 0x50fa27 (PacInitialize through thunk 0xa42234), 0x50fa55-0x50fa82 (PacGetDeviceType, PacGetDevicePath, PacGetVersionNumber, PacGetProductName, PacGetSerialNumber), 0x50fe21 (PacShutdown)"
    note: >-
      A static import of the packed executable, so the Windows loader maps it before
      any MFME code runs and the process does not start without it. Drives cabinet
      lamps, hoppers and meters through Ultimarc PacDrive, PacLed64 and UltimateIO
      boards.

