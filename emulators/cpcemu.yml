  # The 3.0.2 Windows package ships every ROM below in ROM/. The 2.5 Linux
  # package ships all but XDDOS210.ROM.
  # -- Firmware, lower ROM in block 0 and foreground ROM in block 1 --
  - name: CPC6128.ROM
    path: "ROM/CPC6128.ROM"
    system: amstrad-cpc
    required: true
    bundled: true
    min_size: 32768
    validation: [signature]
    md5: b96280dc6c95a48857b4b8eb931533ae
    sha1: 5977adbad3f7c1e0e082cd02fe76a700d9860c30
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_004407d0 0x440848-0x4408b6 (ROM_PATH + ROM_BLOCK file name per slot, ifstream open), 0x4408d1-0x44093f (open failure: message 0xb8, error count), 0x440959-0x440976 (seek block * 0x4000, FUN_0040a59c reads 0x4000, no length check), FUN_0046ac64 0x46ae22-0x46ae2d and FUN_00481bcc 0x481efa-0x481f54 (count + 2 >= 3 ends startup), FUN_00440bfc 0x440c03-0x440c47 (ROM 0 byte 0 = 0x80, byte 2 = machine), cpcemu0.cfg ROM_BLOCK 255 and 0 under #IFCPC 2, 4 and 5, kept by FUN_00466680 0x466871-0x466879"
    note: >-
      CPC 6128 firmware and BASIC, lower ROM in block 0 and foreground ROM in
      block 1, opened once per block. Loaded for the shipped CPC_TYPE 2 and
      for types 4 and 5. Foreground ROM header 80 01 02 00.

  - name: CPC464.ROM
