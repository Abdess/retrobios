  # -- Disc ROM, slot 7 --
  - name: CPCADOS.ROM
    path: "ROM/CPCADOS.ROM"
    system: amstrad-cpc
    required: true
    bundled: true
    size: 16384
    validation: [signature]
    md5: aa2fb251814bd971b2b9874ab0971b3f
    sha1: 0e247123b9d3204784eeadb4629b9d35b9dfd984
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_004407d0 0x440848-0x4408b6 (ROM_PATH + ROM_BLOCK file name, ifstream open), 0x4408d1-0x44093f (open failure: message 0xb8, error count), 0x440959-0x440976 (read 0x4000, no length check), FUN_0046ac64 0x46ae22-0x46ae2d and FUN_00481bcc 0x481efa-0x481f54 (count + 2 >= 3 ends startup), FUN_00440f10 0x440fae-0x440fbf and FUN_00440cc4 (ROM 7 header 01 00 05 or 01 00 07, else message 0xbb), cpcemu0.cfg ROM_BLOCK 7 under every #IFCPC"
    note: >-
      AMSDOS disc ROM, the 8 KB image zero-padded to 16 KB. Named for every
      machine by the shipped configuration, so startup ends with status 3
      without it. Dropping the ROM_BLOCK line instead boots with "ROM: No
      AMSDOS ROM found." and no disc support.

  # -- M4 board, ROM slot 6 plus the board's own lower ROM --
  - name: M4.ROM
    path: "ROM/M4.ROM"
    system: amstrad-cpc
    required: true
    bundled: true
    size: 16384
    validation: [signature]
    md5: 28a7e368badca8299ba24a15bb4ebe9b
    sha1: 05f9447d307ab17eae9e2100f91c36b0c9560d4b
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_004407d0 0x440848-0x44093f (ROM_PATH + ROM_BLOCK file name, ifstream open, open failure counted), FUN_0046ac64 0x46ae22-0x46ae2d (count + 2 >= 3 ends startup), FUN_0044c6c4 0x44c6fa-0x44c74c (FUN_00440570 finds the ROM_BLOCK entry named \"M4.ROM\", else \"M4 ROM not found.\"), 0x44c751-0x44c7be (8-byte compare with \"M4 BOARD\" at the name table address in ROM bytes 4-5, else \"M4 ROM not valid.\"), routine at 0x449c1c 0x44a4f4-0x44a548 (updater writes ROM_PATH + /M4.ROM, 0x4000 bytes), cpcemu0.cfg ROM_BLOCK 6 outside any #IFCPC"
    note: >-
      M4 board firmware by Duke. Named by the shipped configuration for every
      machine, so startup ends with status 3 without it, whatever M4_ENABLED
      holds. The board is recognised only by the file name M4.ROM in the
      ROM_BLOCK line. A failed lookup or name table check clears M4_ENABLED and
      emulation goes on without the board.

  - name: NMIROM.BIN
    path: "SDCARD/NMIROM.BIN"
    system: amstrad-cpc
    required: false
    description: "M4 board NMI ROM on the emulated SD card"
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_0044c6c4 0x44c966-0x44c9c4 (FUN_0044c238 builds M4_SD_PATH from 0x516cd8 + /NMIROM.BIN, fopen rb, fread 0x4000), called from FUN_0046ac64 0x46ae76"
    note: >-
      Read at every startup once M4.ROM has passed its check, in place of
      HACK.ROM when present. The shipped cpcemu0.cfg sets M4_SD_PATH to
      ./SDCARD/. Up to 0x4000 bytes are read, the length is not checked.

  - name: HACK.ROM
    path: "ROM/HACK.ROM"
    system: amstrad-cpc
    required: false
    bundled: true
    size: 7994
    md5: ffcbcbce32223a152753d30766ad6215
    sha1: 582dd1706391f6f0161ad3486ae75a04fb0f7d5b
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_0044c6c4 0x44c966-0x44c9c4 (FUN_0044c238 builds M4_SD_PATH from 0x516cd8 + /NMIROM.BIN, fopen rb, fread 0x4000), 0x44c9c9-0x44ca3f (ROM_PATH from FUN_00440a5c + /HACK.ROM, fopen rb, fread 0x4000 into the buffer at 0x516210), 0x44ca41-0x44ca6a (\"Unable to load HACK.ROM\", returns 0), called from FUN_0046ac64 0x46ae76, routine at 0x449c1c 0x44a5b7-0x44a60b (updater writes ROM_PATH + /HACK.ROM, 0x4000 bytes)"
    note: >-
      M4 hack ROM, the lower ROM behind the Shift+F1 menu. Opened at every
      startup once M4.ROM has passed its check, and only when M4_SD_PATH +
      NMIROM.BIN is absent. Missing prints "Unable to load HACK.ROM" and
      emulation continues. Up to 0x4000 bytes are read, the length is not
      checked.

