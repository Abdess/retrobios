notes: |
  Amstrad CPC emulator by Marco Vieth and Rainer Loritz, closed-source freeware
  for Windows, macOS, Linux, Android and iOS. Machines are the CPC 464, 664 and
  6128. The firmware identifier and the message catalogue also know the 464+,
  the 6128+ and the KC compact.

  Reversed from cpcemu_portable.exe of the 3.0.2 Windows portable package of
  2025-04-24 (zip sha256 fa2cde7da210b0db, exe sha256 3560e3a9c52095f1, Borland
  C++ PE32). Addresses below are virtual addresses in that executable. The 3.0.2
  Linux archives listed on the download page are absent from the server. The
  2.5 Linux x86-64 package of 2022-08-13 ships the same ROM folder without
  XDDOS210.ROM, and its binary has no National ROM selection.

  Configuration comes from a file given on the command line, then the
  cpcemu.cfg path assembled at 0x570a8c (FUN_00481bcc 0x481c96-0x481ca5) when
  it exists, then the built-in name cpcemu0.cfg (pointer 0x570a84) in the
  working directory, chosen at FUN_00481bcc 0x481d7a-0x481da2 and parsed by
  FUN_00466680. ROM_PATH ("./ROM/" in the shipped cpcemu0.cfg) is stored by
  FUN_00441008, which appends a backslash when the value does not end in one.
  Each ROM_BLOCK line (FUN_004665d0: ROM number, file name, 16 KB block number)
  becomes a node of the list at 0x5151a0. #IFCPC blocks are kept only when
  their number equals the CPC type at 0x564590, set by -t or CPC_TYPE. The
  shipped cpcemu0.cfg names CPC464.ROM for types 0 and 3, CPC664.ROM for type
  1, CPC6128.ROM for types 2, 4 and 5 (ROM 255 block 0, ROM 0 block 1),
  CPCADOS.ROM as ROM 7 for every type, and M4.ROM as ROM 6 outside any #IFCPC.

  FUN_004407d0 loads every listed ROM from slot 0 to 255: ROM_PATH + file name,
  an AMSDOS header skipped when its checksum matches (FUN_004721e4), a seek to
  block * 0x4000 and a read of 0x4000 bytes with no length check
  (FUN_0040a59c). A file that cannot be opened prints message 0xb8 "ROM: Cannot
  open file" and counts one error. FUN_0046ac64 returns the count plus 2, and
  FUN_00481bcc shows "CPCemu Error" and ends with that status for any value of
  3 or more, so a single missing file named by a ROM_BLOCK line stops startup
  with status 3, whatever the slot and whatever device it serves.

  The machine is identified from ROM 0 by FUN_00440bfc: byte 0 has to be 0x80
  (else "ROM: No foreground ROM found.") and byte 2 selects 464 (0), 664 (1),
  6128 (2) or 6128+ (4), anything else giving "ROM: Unknown ROM version.". A
  6128 whose lower ROM has 0x21 at offset 0x5a1 is reported as a KC compact.
  Without an identified machine startup ends on "CPC type not configured or
  ROM for CPC type not available. Unable to continue." ROM 7 is accepted as
  AMSDOS when its header is 01 00 05 or 01 00 07 (FUN_00440cc4), otherwise "ROM:
  No AMSDOS ROM found." and disc support stays off. Types 3, 4 and 5 have no
  dedicated ROM files: the shipped configuration loads the 464 and 6128 files
  for them. There is no cartridge support.

  The M4 board is set up at every startup by FUN_0044c6c4, called from
  FUN_0046ac64 0x46ae76 without reading M4_ENABLED (0x516cd0). It looks for the
  ROM_BLOCK entry whose file name is exactly "M4.ROM" and checks the ROM's name
  table for "M4 BOARD". It then reads M4_SD_PATH + /NMIROM.BIN, and only when
  that file is absent, ROM_PATH + /HACK.ROM, 0x4000 bytes each. The M4 firmware
  updater (routine at 0x449c1c) downloads cpc/M4FIRM.BIN from spinpoint.org and
  rewrites ROM_PATH + /M4.ROM and /HACK.ROM, 0x4000 bytes each.

  Alongside the ROMs the program reads the message catalogue cpcemu.msg (name
  passed at FUN_00481bcc 0x481c86) and the colour and key tables cpcemu.dat
  (built-in name at 0x570a88, passed to FUN_0045f734 at FUN_00481bcc 0x481dd9). The help file and the
  poke database are named only by the HELP_FILE and POKE_DATABASE lines of
  cpcemu0.cfg, "./cpcemu.hlp" and "./cpcemu.dbf". The disc, tape and snapshot folders and the M4 SD card folder hold
  user content.

