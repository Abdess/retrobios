  # -- Expansion ROMs mapped through a user ROM_BLOCK line --
  - name: XDDOS210.ROM
    path: "ROM/XDDOS210.ROM"
    system: amstrad-cpc
    required: false
    bundled: true
    size: 16384
    md5: 1d91a9ef315b302d335cd7e04e8d8d86
    sha1: 2f1bd4d6e2d2e62818b01e6e7a26488362a7a8ee
    source_ref: "cpcemu_portable.exe 3.0.2 FUN_00486fc4 0x487026-0x487113 (expansion ROM picker: file selector FUN_00462fe0 rooted at ROM_PATH, FUN_004405f0 sets the slot), FUN_004665d0 (ROM_BLOCK line parser), FUN_004407d0 0x440848-0x440976 (ROM_PATH + name, open, read 0x4000), cpcemu0.cfg commented ROM_BLOCK 7, no path constant names this file"
    note: >-
      X-DDOS 2.10 by Dobbertin, the disc operating system of the HD20 hard disk
      that DOBBERTIN_HD_ENABLED emulates. Loaded once the user maps it to a ROM
      slot. Its header 01 02 01 is not taken as AMSDOS by FUN_00440cc4, so the
      AMSDOS speedup stays off with it in slot 7. Added in 3.0, not shipped
      with 2.5.

