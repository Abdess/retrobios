emulator: "FinalBurn Neo (Neo Geo)"
type: libretro
core_classification: official_port
source: "https://github.com/libretro/FBNeo"
upstream: "https://github.com/finalburnneo/FBNeo"
profiled_date: "2026-10-23"
source_commit: "77016b4dff6c76beba08d24ea1c61ed2750bc0a7"
upstream_commit: "bc813f4664b5412c8353458bfc7174b71c61a221"
core_version: "v1.0.0.03"
version_basis:
  kind: file
  path: "src/burn/version.h"
  pattern: '#define\s+VER_MAJOR\s+(\d+)\s*\n#define\s+VER_MINOR\s+(\d+)\s*\n#define\s+VER_BETA\s+(\d+)\s*\n#define\s+VER_ALPHA\s+(\d+)'
  format: "v{1}.{2}.{3}.{4:02d}"
display_name: "Arcade (FinalBurn Neo) (Neo-Geo)"
cores:
  - fbneo_neogeo
systems:
  - snk-neogeo-mvs
  - snk-neogeo-aes
  - snk-neogeo-cd
  - arcade

notes: |
  Neo Geo subset of FinalBurn Neo, current codebase (not frozen).
  Built with SUBSET=neogeo, includes only d_neogeo.cpp drivers.
  Exists for platforms that cannot run the full FBNeo core.

  Neo Geo games reference "neogeo" as parent ROM set. The BIOS ZIP
  must be alongside game ZIPs or in system_dir/fbneo/.
  Search order (src/burner/libretro/libretro.cpp:887-972):
    1. {system_dir}/fbneo/romdata/{romName}, only while a RomData file is
       being started with patched romsets enabled
    2. {system_dir}/fbneo/patched/{romName}, with patched romsets enabled
    3. {rom_dir}/{romName}
    4. {system_dir}/fbneo/{romName}
    5. {system_dir}/{romName}

  The per-type subdirectories the core used to try under {rom_dir} and
  {system_dir}/fbneo, arcade and consoles, are gone: a BIOS ZIP has to sit
  directly in one of directories 3 to 5 above.

  neogeo.zip contains multiple selectable 68K BIOS variants (MVS, AES,
  Universe BIOS). One 68K BIOS active at a time (dipswitch). Z80 BIOS,
  fix tiles, and zoom table always required.

  Neo Geo CDZ uses neocdz.zip with parent "neogeo". CD/CDZ BIOS plus
  zoom table.

  hiscore.dat loaded from system_dir/fbneo/ (src/burn/hiscore.cpp:407).

  need_fullpath=false, extensions=zip|7z|cue|ccd, savestate=deterministic.

archive_prefix: fbneo

