emulator: "NanoBoyAdvance"
type: standalone
core_classification: other
source: "https://github.com/nba-emu/NanoBoyAdvance"
profiled_date: "2026-10-17"
source_commit: "3bb6f478f977dbfd3106508536e5fbce90d1898b"
pin_frozen: "ROCKNIX 20261001 builds this revision of the SDL2 frontend (v1.6 plus four commits). Later upstream work is not part of that build."
pin_build:
  - platform: rocknix
    repo: "https://github.com/ROCKNIX/distribution"
    revision: "20261001"
    path: "projects/ROCKNIX/packages/emulators/standalone/nanoboyadvance-sa/package.mk"
    variable: PKG_VERSION
    value: "3bb6f478f977dbfd3106508536e5fbce90d1898b"
core_version: "v1.6-4-g3bb6f47"
version_basis:
  kind: tag
  tag: "v1.6"
  distance: 4
display_name: "Nintendo - Game Boy Advance (NanoBoyAdvance)"
cores:
  - "nanoboyadvance"
  - "nanoboyadvance-sa"
systems:
  - nintendo-gba

config_reads:
  - file: "/storage/.config/nanoboyadvance/config.toml"
    platforms: [rocknix]
    source_ref: "src/platform/sdl/main.cpp:293, src/platform/core/src/config.cpp:16-31"
    keys:
      - key: "[general] bios_path"
        source_ref: "src/platform/core/src/config.cpp:36, src/platform/sdl/main.cpp:177-191, src/platform/core/src/loader/bios.cpp:19-46"

notes: |
  Game Boy Advance emulator. ROCKNIX builds the SDL2 frontend only
  (PLATFORM_SDL2=ON, PLATFORM_QT=OFF).

  The SDL2 frontend changes the working directory to the executable's
  directory, then reads config.toml there. The BIOS path is the general.bios_path
  key of that file, default "bios.bin", overridden by --bios on the command line.
  ref: src/platform/sdl/main.cpp:288-293, src/platform/core/src/config.cpp:36,
       src/platform/core/include/platform/config.hpp:17, src/platform/sdl/main.cpp:98-102

  The BIOS is required. BIOSLoader refuses a missing path, a directory, and any
  size other than 16 KB, and the frontend prints the reason and exits. There is no
  built-in replacement. bios_skip only jumps past the boot screen after the BIOS
  is loaded.
  ref: src/platform/core/src/loader/bios.cpp:17-48, src/platform/sdl/main.cpp:177-192,
       src/nba/src/core.cpp:42-44

files:
  - name: "bios.bin"
    path: "bios.bin"
    system: nintendo-gba
    required: true
    size: 16384
    validation: [size]
    config_key: "general.bios_path"
    description: "Game Boy Advance BIOS"
    note: "Any file name through general.bios_path or --bios, or bios.bin beside the executable when neither is set."
    source_ref: "src/platform/core/src/loader/bios.cpp:17-48, src/platform/core/src/config.cpp:36, src/platform/sdl/main.cpp:177-192"
