emulator: MAME 2000
type: libretro
core_classification: frozen_snapshot
source: "https://github.com/libretro/mame2000-libretro"
upstream: "https://www.mamedev.org"
profiled_date: "2026-03-24"
source_commit: "181b42e5da0d2f0c7a2e59244f23633ed594de2e"
core_version: "0.37b5"
version_basis:
  kind: file
  path: "src/libretro/libretro.c"
  pattern: 'info->library_version\s+=\s+"([^"]+)'
display_name: "Arcade (MAME 2000)"

cores:
  - mame2000
  - imame4all

systems:
  - snk-neogeo-mvs
  - deco-cassette
  - arcade

notes: |
  Frozen snapshot of MAME 0.37b5 via iMAME4All (David Valdeita). Fastest and
  least accurate MAME core. Supports ~2000 arcade games from the 0.37b5 ROM set.

  BIOS handling follows MAME 0.37b5 conventions. Shared BIOS files are packaged
  as parent ROM ZIPs (e.g. neogeo.zip) and placed in the ROM directory alongside
  game ROMs. The core searches only the ROM directory for ROMs and BIOS sets:
  the rom path is IMAMEBASEPATH, the folder of the loaded content
  (src/libretro/libretro.c:1044-1053, 1247, src/libretro/fileio.c:400-424).

  Samples (per-game WAV files) are loaded from system_dir/mame2000/samples/.
  They provide sound effects for certain games and are optional.

  hiscore.dat, history.dat and mameinfo.dat are loaded from the ROM directory.
  cheat.dat is loaded from system_dir/mame2000/cheat/.
  hiscore.dat and cheat.dat are bundled in the core repo (metadata/).

files:
  - name: hiscore.dat
    load_from: content_dir
    required: false
    category: game_data
    system: arcade
    sha1: "21ddda0c61bd4f1cc04fb9d09e16d403d620f9e8"
    md5: "9b262149ec70cbda741a8ba55784f8e1"
    size: 36182
    source_ref: "src/hiscore.c:18,132-146,252-254, src/cpuintrf.c:664-666, src/libretro/fileio.c:1002-1014, src/libretro/libretro.c:1044-1052"
    note: >-
      high score definitions, opened from IMAMEBASEPATH, the directory of the loaded content. metadata/hiscore.dat
      of the core repository. is_mem_range reads only "cpu:addr:len:start:end"
      lines under a "gamename:" header.

  - name: cheat.dat
    path: "mame2000/cheat/cheat.dat"
    required: false
    category: game_data
    system: arcade
    source_ref: "src/cheat.c:210, src/cheat.c:618, src/cheat.c:833"
    note: "cheat definitions, loaded from system_dir/mame2000/cheat/"

  - name: history.dat
    load_from: content_dir
    required: false
    category: game_data
    system: arcade
    source_ref: "src/datafile.c:52,281,541, src/libretro/fileio.c:1002-1014"
    note: "game history database, opened from IMAMEBASEPATH, the directory of the loaded content"

  - name: mameinfo.dat
    load_from: content_dir
    required: false
    category: game_data
    system: arcade
    source_ref: "src/datafile.c:53,281,568, src/libretro/fileio.c:1002-1014"
    note: "game technical info database, opened from IMAMEBASEPATH, the directory of the loaded content"

  - name: neogeo.zip
    required: true
    category: bios_zip
    load_from: content_dir
    system: snk-neogeo-mvs
    source_ref: "src/drivers/neogeo.c:4499-4508"
    contents:
      - name: neo-geo.rom
        description: 68K BIOS
        size: 131072
        crc32: "9036d879"
      - name: ng-sm1.rom
        description: Z80 sound BIOS
        size: 131072
        crc32: "97cf998b"
      - name: ng-sfix.rom
        description: fix layer tiles
        size: 131072
