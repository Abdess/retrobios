exclusion_note: >
  The system ROM is the only file to obtain. The cartridge dump arrives as the
  intent payload and everything else the app touches it writes itself: the save
  states and their PNG thumbnails under states in the external files directory,
  and the dsmile preferences, which also hold the touch layouts as a JSON
  string rather than as files. The Art Studio NVRAM the SPG200 maps over bank 2
  is dead here, the sole SetCart call passing a null pointer for it, so no such
  image exists to name. Oboe and libc++_shared are linked into the package by
  CMake at build time and are never opened as files. The native sources perform
  no file I/O at all.
  ref: EmuActivity.kt:123-145, EmuActivity.kt:246-296, EmuActivity.kt:528-555,
       vsmile.cpp:294, spg200.cpp:204,214, CMakeLists.txt:11,26
