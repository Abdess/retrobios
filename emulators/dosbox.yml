notes: |
  Rebuilt on the dosbox-core tree (DOSBox SVN r4494) with ZIP content and the
  Nuked-SC55 driver. No BIOS. Every file below belongs to a MIDI driver picked
  by the core option; the default driver is "none".
  ref: libretro/src/libretro_core_options.cpp:1684-1702
  A driver that fails to open is replaced by the first handler that opens.
  ref: src/gui/midi.cpp:241-243
  mt32: mt32.romdir is the system directory. The type option (default cm32l)
  picks CM32L_CONTROL.ROM + CM32L_PCM.ROM or MT32_CONTROL.ROM + MT32_PCM.ROM.
  ref: libretro/src/libretro.cpp:720, src/gui/midi_mt32.cpp:51-68
  MUNT identifies each file by size and SHA1 against its full-ROM list, so
  any full control ROM is accepted under either control name and split
  half-ROMs are refused. The PCM ROM must be the size the control ROM expects.
  ref: libretro/deps/munt/mt32emu/src/ROMInfo.cpp:171-179
  ref: libretro/deps/munt/mt32emu/src/c_interface/c_interface.cpp:425
  ref: libretro/deps/munt/mt32emu/src/Synth.cpp:599
  sc55: the driver is given SC-55.zip from the system directory when that
  file exists, the system directory otherwise.
  ref: libretro/src/libretro.cpp:903-913
  In a directory it looks for SC-55/ROM1.BIN, SC-55/rom1.bin, ROM1.BIN then
  rom1.bin, and opens ROM2, ROM2_ST, ROM_SM and WAVEROM1-3 next to it with the
  same capitalization and extension. In a ZIP the members are assigned by
  size, wave ROMs by the last 1, 2 or 3 in their name. No hash is checked.
  ref: src/gui/midi_sc55.h:43-52, src/gui/midi_sc55.h:98-133
  Byte 67 of ROM1 selects the model and the sizes the other ROMs must have:
  SC-55mkII/SC-55st need ROM_SM, a 2 MiB WAVEROM1 and a 1 MiB WAVEROM2;
  SC-55/SC-155 and CM-300/SCC-1 need a 256 KiB ROM2 and three 1 MiB wave
  ROMs; JV-880 needs a 256 KiB ROM2 and two 2 MiB wave ROMs; SCB-55 needs a
  2 MiB WAVEROM1.
  ref: src/gui/midi_sc55.h:151-175
  fluidsynth and bassmidi: the soundfont option lists the files found in
  soundfonts/ under the system directory (.sf2 for both, .sfz for BASSMIDI,
  .sf3/.dls/.gig for FluidSynth). No file name is fixed.
  ref: libretro/src/libretro.cpp:1673-1689
  bassmidi also loads the BASS and BASSMIDI libraries from the system
  directory.
  ref: libretro/src/midi_bassmidi.cpp:230-258
  Keyboard layouts and codepages are compiled in.
  ref: src/dos/dos_keyboard_layout_data.h, src/dos/dos_codepages.h
  DOSBox.conf in the save directory is read as the configuration when the
  content is not a .conf file.
  ref: libretro/src/libretro.cpp:1777-1782

