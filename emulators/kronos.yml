emulator: Kronos
type: libretro
core_classification: official_port
source: "https://github.com/libretro/yabause"
source_branch: kronos
upstream: "https://github.com/FCare/Kronos"
profiled_date: "2026-03-24"
source_commit: "3791ffb2221fda61d70aec5cca376418caf05669"
prose_written_at: "3791ffb2221fda61d70aec5cca376418caf05669"
upstream_commit: "d0384bc33aad06bfa9cf5cd308c4bd7ae6cfc814"
core_version: "2.7.0"
version_basis:
  kind: file
  path: "yabause/src/libretro/Makefile.common"
  pattern: '-DVERSION=\\"([^\\"]+)\\"'
display_name: "Sega - Saturn/ST-V (Kronos)"
cores:
  - kronos
systems:
  - sega-saturn
  - sega-stv

config_reads:
  - file: "kronos.ini"
    platforms: [retrobat]
    revision: "6750417f3d6fef1b7be9adf52e707cc78aa41ee0"
    revision_from: "Kronos 2.7.0 without a commit id in kronos.exe of RetroBat's stable kronos.7z, linked 2024-12-31: the last FCare/Kronos commit before that date, the cited files unchanged from aca9865c to the 2.7.0_official_release tag 58352d6d"
    source_ref: "upstream yabause/src/port/qt/Settings.cpp:50-61, 95-103, upstream yabause/src/port/qt/Settings.h:25-26, upstream yabause/src/CMakeLists.txt:763, upstream yabause/src/port/qt/main.cpp:55-57"
    keys:
      - key: "[1.0] General\\EnableEmulatedBios"
        source_ref: "upstream yabause/src/port/qt/YabauseThread.cpp:392-393"
      - key: "[1.0] General\\Bios"
        source_ref: "upstream yabause/src/port/qt/YabauseThread.cpp:394-395, upstream yabause/src/port/qt/VolatileSettings.cpp:20-27, upstream yabause/src/ctrl/src/yabause.c:497-509, 575-587, 626-630, upstream yabause/src/sys/memory/src/memory.c:1343-1346"
        condition: "General\\EnableEmulatedBios false; an empty path runs the HLE BIOS, a path that fails to load stops init"

notes: |
  Kronos is a Sega Saturn and ST-V arcade emulator by FCare, forked from
  Yabause. Requires OpenGL 4.3 compute shaders.

  Saturn BIOS search order:
    1. {system}/kronos/saturn_bios.bin
    2. {system}/saturn_bios.bin
    3. {system}/sega_101.bin
    4. {system}/mpr-17933.bin
  First file found wins. Real BIOS required (HLE deprecated, only available
  via kronos_force_hle_bios core option for debugging).

  ST-V BIOS: {system}/kronos/stvbios.zip or {system}/stvbios.zip
  MAME-style ZIP containing region-specific EPROMs. Kronos picks the best
  match by game region and kronos_stv_favorite_region core option (EU/US/JP/TW).

  ROM cartridges for KOF95 and Ultraman are auto-detected via game database
  (db.c) and loaded from system_dir when the corresponding game is running.

  BIOS loading: retro_load_game() at yabause/src/libretro/libretro.c:1601-1727.
  STV blob table: BiosList at yabause/src/ctrl/src/stv.c:112-136.
  ROM cartridge DB: yabause/src/utils/src/db.c:43-45.

  Standalone supports MPEG card ROM loading (Video CD card). Disabled in
  libretro port (mpegpath = NULL in yabause/src/libretro/libretro.c:1578).

archive_prefix: kronos

groups:
  saturn-bios:
    required: true
  stv-bios:
    required: true

files:
  # -----------------------------------------------------------
  # Saturn BIOS - primary (any region)
  # -----------------------------------------------------------
  - name: "saturn_bios.bin"
    path: "kronos/saturn_bios.bin"
    system: sega-saturn
    group: saturn-bios
    priority: 1
    size: 524288
    validation: [size]
    note: "Primary Saturn BIOS. Any region accepted. Searched in kronos/ subdir first."
    source_ref: "source yabause/src/libretro/libretro.c:1619-1620"

  - name: "saturn_bios.bin"
    system: sega-saturn
    group: saturn-bios
    priority: 2
    size: 524288
    validation: [size]
    note: "The same name in the system directory, read when kronos/ holds none."
    source_ref: "source yabause/src/libretro/libretro.c:1623-1624"

  # -----------------------------------------------------------
  # Saturn BIOS - Japan v1.01 (fallback)
  # -----------------------------------------------------------
  - name: "sega_101.bin"
    system: sega-saturn
    group: saturn-bios
    priority: 3
    size: 524288
    validation: [size]
    note: "Saturn BIOS v1.01 (Japan). Fallback if saturn_bios.bin missing."
    source_ref: "source yabause/src/libretro/libretro.c:1627"

  # -----------------------------------------------------------
  # Saturn BIOS - NA/EU (fallback)
  # -----------------------------------------------------------
  - name: "mpr-17933.bin"
    system: sega-saturn
    group: saturn-bios
    priority: 4
    size: 524288
    validation: [size]
    note: "Saturn BIOS (NA/EU). Last fallback for Saturn mode."
    source_ref: "source yabause/src/libretro/libretro.c:1631"

  # -----------------------------------------------------------
  # ST-V Arcade BIOS (stvbios.zip) - MAME romset
  # -----------------------------------------------------------
  - name: "stvbios.zip"
    system: sega-stv
    group: stv-bios
    note: "MAME-style ZIP containing ST-V region BIOS EPROMs. Read as kronos/stvbios.zip, else at the root of the system directory, and a ST-V game stops without either (libretro.c:1676-1681)."
    source_ref: "source yabause/src/libretro/libretro.c:1608-1617, source yabause/src/ctrl/src/stv.c:112-136"

