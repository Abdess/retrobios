systems:
  - tomb-raider-2

notes: |
  Enhanced engine for Tomb Raider 2 (1997), part of the TRX monorepo
  that also hosts TR1X and TR3X. Loads retail .tr2 level files, the
  main.sfx soundbank, music tracks and FMV cutscenes from a Steam, GOG
  or disc install of TR2.

  Path resolution (src/trx/game/paths.c):
    levels   %mod_dir%/levels/<file>        GAME_DYNAMIC_PATH_LEVEL_FILE
    sfx      %mod_dir%/<file>               GAME_DYNAMIC_PATH_SFX_FILE
    fmv      %mod_dir%/fmv/<file><ext>      GAME_DYNAMIC_PATH_FMV_FILE
    music    %mod_dir%/music/<name><ext>    GAME_DYNAMIC_PATH_MUSIC_DIR
  with %mod_dir% = games/tr2 under the TRX root. The gameflow.json5,
  the catalog_*.csv tables, string tables, injections, images and
  shaders ship inside the TRX zip (data/trx/ship/) and are not user
  files.

  main.sfx is TR2's sample bank. The gameflow sets sfx_path to it
  (data/trx/ship/games/tr2/gameflow.json5:35) and the level pipeline
  reads it per level (src/trx/game/level/pipeline.c:179).

  FMV extension probing (src/trx/game/paths.c:76-79):
    .mp4 .mkv .mpeg .avi .webm .ogv .rpl .fmv .bik
  The retail Core/Eidos cutscenes are .rpl. The gameflow still names
  them .AVI, resolution picks whichever extension exists.

  Music backend (src/trx/game/music/backend_files.c:33-35, 108-134):
    extensions .flac .ogg .mp3 .wav .wma
    file name  trackNN.<ext> (two-digit) or N.<ext>
  Retail TR2 CD rips yield 2.mp3 through 61.mp3 (bare-number form,
  per docs/trx/INSTALLING.md ship tree).

