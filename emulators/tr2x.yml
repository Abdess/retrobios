  # The Golden Mask expansion
  # Known game tr2-gm, extends tr2 (src/trx/game/shell/mod.c:37-38).
  # Enumerated by data/trx/ship/games/tr2-gm/gameflow.json5 "levels" array.
  # Its FMVs and music fall back to games/tr2.
  - name: "main.sfx"
    path: "games/tr2-gm/main.sfx"
    aliases: ["main_gm.sfx"]
    required: false
    category: game_data
    source_ref: "data/trx/ship/games/tr2-gm/gameflow.json5:34, src/trx/game/game_flow/reader.c:198-219, src/trx/game/paths.c:203-212"
    note: "Sample bank of the expansion. main_gm.sfx is tried first, each name in the expansion directory then in games/tr2."

