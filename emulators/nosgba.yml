    sha1: "6ae880493ddde880827d1e9f08e9cb2c38f9f2ec"
    on_mismatch: warn
    description: "PocketStation BIOS"
    note: >
      Expected checksum pair 0x27e94c07, 0x63beca34, given by the image ending
      in J061. An image ending in J110 is checked against 0xb16ce96c,
      0xbedf0d0f instead, and one with POCKBIOS at 0x40 is not checked.
      Absent, a built-in clone is used.
    source_ref: "NO$GBA.EXE v3.06 0x4730d5-0x4730f4 (slot), 0x436669-0x4366a1 (variant tests), 0x43658e-0x4365af (clone)"
