notes: |
  Freeware gaming build of Martin Korth's Game Boy Advance, Nintendo DS and
  DSi emulator for Windows, closed source. RetroBat installs it as nosgba and
  starts NO$GBA.EXE with the ROM. Everything below is read from the
  NO$GBA.EXE of no$gba-w.zip v3.06, 14 Apr 2025 (224175 bytes, sha1
  a167242d3800ccc0ac7e5b42e8d6f3f150ed6283), after removing its UPX layer.
  Addresses are virtual addresses of the unpacked image (base 0x400000). The
  nosgba package RetroBat installs, stable and beta alike, holds the v3.04
  executable of 23 Mar 2021 (220079 bytes, sha1
  935b857bc1249479124247612755eeb2a247f23c). Its boot ROM table, loader,
  checksum pairs, firmware and wifi reads, DSi image naming and Atheros ROM
  reads are the same instructions at other addresses, and its 236-byte GBA
  stub is the same bytes. The official zip also holds DSI-SD.ZIP, which the
  RetroBat package does not include.

  Every file is opened by bare name. Before each open the program builds its
  own folder from the module path and makes it the current directory
  (0x432515, 0x4324be), so all of them sit next to NO$GBA.EXE.

  The boot ROMs come from one table of six slots (0x472ff5-0x4730f4), loaded
  by one routine (0x436604-0x4366df). For each slot it clears the buffer, then
  tries a list of (file, offset) pairs in order. The first file that opens and
  is longer than its offset gives the bytes, read at that offset for the slot
  size. No size is checked beyond that. The lists:
  GBA, 16 KiB: NO$GBA.ROM at 0, BIOSGBA.ROM at 0, GBA.ROM at 0.
  NDS ARM7, 16 KiB: NO$GBA.ROM at 0x4000, BIOSNDS.ROM at 0, BIOSNDS7.ROM at 0.
  NDS ARM9, 4 KiB: NO$GBA.ROM at 0x8000, BIOSNDS.ROM at 0x4000, BIOSNDS9.ROM at 0.
  DSi ARM7, 64 KiB: BIOSDSI.ROM at 0, BIOSDSI7.ROM at 0.
  DSi ARM9, 64 KiB: BIOSDSI.ROM at 0x10000, BIOSDSI9.ROM at 0.
  PocketStation, 16 KiB: POCKSTAT.ROM at 0.
  NO$GBA.ROM, BIOSNDS.ROM and BIOSDSI.ROM are therefore concatenations of the
  single images, GBA then ARM7 then ARM9.

  After a slot loads, two 32-bit words are computed over it: the sum of its
  dwords, and a value seeded with 0x42494f53 that takes each dword plus the
  count of dwords left, XORs it in and rotates right by one. The GBA, NDS ARM7,
  NDS ARM9 and PocketStation slots carry the expected pair, the DSi slots carry
  none. A mismatch only raises "Incorrect GBA/NDS BIOS version!" and the image
  stays in use (0x4366a8-0x4366d8, 0x43672e-0x43675c). The md5 and sha1 given
  below are those of the dumps that produce the expected pair.

  Without a GBA image the slot receives a 236-byte stub held in the executable
  (0x4365ca-0x436603) and the BIOS calls run as x86 code, the default of the
  "Emulate BIOS Functions" option. Only the BIOS sound functions then stop with
  "Sorry, no$gba needs a copy of the original GBA BIOS". The NDS slots stay
  zero and the calls are emulated the same way. The ARM7 image is what
  decrypts the secure area of an encrypted cartridge dump and CodeBreaker
  codes ("Encrypted Cartridge, requires files BiosNds7.rom and BiosNds9.rom").
  Without a PocketStation image a built-in clone named pockclon is expanded in
  its place (0x43658e-0x4365af). DSi mode needs the DSi images for their RSA
  keys and stops with "Missing DSi BIOS dump (need RSA keys)" without them.

  The DSi eMMC and SD card are files named from the emulated unit number, 1 for
  the first machine: the name is written over a template as "DSi-", the digit,
  then "mmc" or "sd" (0x439a47-0x439a8a). The eMMC image must carry the
  nocash footer with the CID and console ID ("Missing footer in .mmc file").
  The template string itself reads New3DS-#.mmc, from the 3DS mode.

  Written rather than obtained: NO$GBA.INI (generated config), NO$GBA.INP (key
  setup), saves under BATTERY, snapshots under SLOT, QUIKSAVE.SNA, and
  FIRMnnnn.BIN and BIOS dumps the xboo cable tools write. NO$GBA.CHT is a
  cheat list the user writes, help.htm and help.txt are documentation, and
  no$gba.key is the registration file of the debug version.

files:
  - name: BIOSGBA.ROM
    aliases: ["GBA.ROM"]
    system: nintendo-gba
    required: false
    hle_fallback: true
    size: 16384
    md5: "a860e8c0b6d573d191e4ec7db1b1e4f6"
    sha1: "300c20df6731a33952ded8c436f7f186d25d3492"
    on_mismatch: warn
    description: "Game Boy Advance BIOS"
    note: >
      Tried after NO$GBA.ROM and before GBA.ROM. Expected checksum pair
      0xbaae187f, 0xc98cfa1d, which the retail GBA BIOS gives. Needed for the
      BIOS sound functions and the Nintendo logo boot.
    source_ref: "NO$GBA.EXE v3.06 0x472ff5-0x473020 (slot), 0x436604-0x4366d8 (load and checksum), 0x4365ca-0x436603 (stub when absent)"

  - name: BIOSNDS7.ROM
    system: nintendo-ds
    required: false
    hle_fallback: true
    size: 16384
    md5: "df692a80a5b1bc90728bc3dfc76cd948"
    sha1: "24f67bdea115a2c847c8813a262502ee1607b7df"
    on_mismatch: warn
    description: "Nintendo DS ARM7 BIOS"
    note: >
      Tried after NO$GBA.ROM at 0x4000 and BIOSNDS.ROM at 0. Expected checksum
      pair 0xbc180972, 0x36b3e1b2. Carries the key that decrypts encrypted
      cartridge secure areas and CodeBreaker codes.
    source_ref: "NO$GBA.EXE v3.06 0x473025-0x473050 (slot), 0x436604-0x4366d8 (load and checksum)"

  - name: BIOSNDS9.ROM
