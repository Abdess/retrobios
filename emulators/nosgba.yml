    sha1: "bfaac75f101c135e32e2aaf541de6b1be4c8c62d"
    on_mismatch: warn
    description: "Nintendo DS ARM9 BIOS"
    note: >
      Tried after NO$GBA.ROM at 0x8000 and BIOSNDS.ROM at 0x4000. Expected
      checksum pair 0xbb212bf7, 0x1bec1d77.
    source_ref: "NO$GBA.EXE v3.06 0x473055-0x473080 (slot), 0x436604-0x4366d8 (load and checksum)"

  - name: FIRMWARE.BIN
    system: nintendo-ds
    required: false
    hle_fallback: true
    max_size: 524288
    description: "Nintendo DS firmware flash"
    note: >
      Read whole into a buffer of 256 KiB, or 512 KiB when the file is larger.
      A file over 512 KiB stops the program with "Unexpected Error". Absent, a
      256 KiB buffer stands in. No hash is checked.
    source_ref: "NO$GBA.EXE v3.06 0x4364e6-0x436526 (load), 0x4366e0-0x436711 (buffer size), 0x435777 (error)"

  - name: BIOSDSI7.ROM
    system: nintendo-dsi
    required: false
    size: 65536
    description: "Nintendo DSi ARM7 BIOS"
    note: >
      Tried after BIOSDSI.ROM at 0. No checksum. DSi mode stops without it
      since it holds the RSA keys.
    source_ref: "NO$GBA.EXE v3.06 0x473085-0x4730ac (slot), 0x436604-0x436640 (load)"

  - name: BIOSDSI9.ROM
    system: nintendo-dsi
    required: false
    size: 65536
    description: "Nintendo DSi ARM9 BIOS"
    note: "Tried after BIOSDSI.ROM at 0x10000. No checksum."
    source_ref: "NO$GBA.EXE v3.06 0x4730ad-0x4730d4 (slot), 0x436604-0x436640 (load)"

