notes: |
  NUON emulator written by Mike Perry (2002-2007) and continued as
  NuanceResurrection by Carsten Waechter from the source archive released
  after the author's death. The Linux and libretro ports were merged into the
  upstream tree in 2026 (pull request 75), so the port and the upstream share
  the same revision.

  The three BIOS files are not firmware dumps. bios.cof, minibios.cof and
  minibiosX.cof are Aries assembly implementations of BIOS routines,
  assembled from bios.s, minibios.s and minibiosX.s in the source tree; every
  other BIOS call is handled in C++ through BiosJumpTable (src/bios.cpp:395-547).
  The entries left to the assembly code are the comm bus calls, TimeToSleep,
  MPEWait and BiosGetInfo.

  retro_load_game looks for <system>/nuance/bios.cof and changes the working
  directory to <system>/nuance when it exists, else to the directory of the
  core library when bios.cof sits beside it (src/libretro.cpp:313-352). Every
  data file is then opened by bare name from the working directory. InitBios
  loads bios.cof into MPE3 and MediaInitMPE loads minibios.cof into MPE0
  (minibiosX.cof on MPEs 1 to 3). A failed load prints "Missing File!" and
  emulation continues without the routines. LoadCoffFile checks the COFF magic
  0x0120 and copies the sections to their physical addresses; no size or hash
  is checked (src/coff.cpp:47-176).

  Two builds of bios.cof exist. The source tree carries the NuanceExperimental
  build (23938 bytes, 12 sections, with commrecv_vars and commrecv_queues);
  the 0.6.6 and 0.6.7 release archives ship the 2007 build (19410 bytes, 10
  sections). Both carry the same biosvars, haltab, biosinfo, halstub,
  biosdata, halts and controllerdata sections and the C++ side references
  neither extra section.

  nuance.cfg is read from the working directory, then from the directory of
  the running executable (src/NuonEnvironment.cpp:533-549); without it the
  values set in NuonEnvironment::Init apply. The GLSL shaders are opened from
  the working directory and fall back to the copies compiled into the binary
  (src/ShaderProgram.cpp:85-135, src/embedded_shaders.h). FlashEEPROM.bin is
  read by the FlashEEPROM constructor and written by the destructor, both
  relative to the process working directory at load and unload of the core
  (src/FlashEEPROM.h:36-51). Game data (nuon.run, nuon.dat) is read from the
  loaded disc image or directory; no other fixed file is opened.

