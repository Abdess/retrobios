emulator: mkxp-z
type: libretro
core_classification: game_engine
source: "https://github.com/white-axe/mkxp-z"
source_branch: libretro
source_ref: "PR #255 to mkxp-z/mkxp-z"
upstream: "https://github.com/mkxp-z/mkxp-z"
profiled_date: "2026-03-24"
source_commit: "650cb0888a07d0b5044e131160ddfa53feaf595b"
core_version: "f4bc5aa"
display_name: "RPG Maker XP/VX/VX Ace (mkxp-z)"
cores:
  - mkxp-z
systems:
  - rpgmaker

notes: |
  Game engine implementing RGSS 1/2/3 (Ruby Game Scripting System) for
  RPG Maker XP, VX and VX Ace. Fork of Ancurio/mkxp. Libretro port by
  white-axe, not yet merged upstream.

  All entries are directories, not individual files. No hashable BIOS.
  RTPs are shared asset packages needed only when a game references stock
  assets instead of bundling its own. MIDI soundfont (GMGSx.sf2) is
  embedded in the binary.

files:
  - name: "Standard"
    type: directory
    description: "RPG Maker XP Run-Time Package"
    category: game_data
    path: "mkxp-z/RTP/Standard/"
    required: false
    source_ref: "src/core.cpp:1081-1124, src/core.cpp:1126-1197"

  - name: "RPGVX"
    type: directory
    description: "RPG Maker VX Run-Time Package"
    category: game_data
    path: "mkxp-z/RTP/RPGVX/"
    required: false
    source_ref: "src/core.cpp:1081-1124, src/core.cpp:1126-1197"

  - name: "RPGVXAce"
    type: directory
    description: "RPG Maker VX Ace Run-Time Package"
    category: game_data
    path: "mkxp-z/RTP/RPGVXAce/"
    required: false
    source_ref: "src/core.cpp:1081-1124, src/core.cpp:1126-1197"

  - name: "Fonts"
    type: directory
    description: "Fallback font directory (.otf/.ttf)"
    category: game_data
    path: "mkxp-z/Fonts/"
    required: false
    unsourceable: "the core creates this directory empty and mounts it for fonts the user adds; the fallback font is compiled into the binary"
    source_ref: "src/core.cpp:1199-1211, src/display/font.cpp:61-90"

  - name: "Preload"
    type: directory
    description: "Ruby scripts loaded before game scripts"
    category: game_data
    path: "mkxp-z/Scripts/Preload/"
    required: false
    unsourceable: "the core creates this directory empty for the user's own scripts; its default preload scripts are mounted from memory"
    source_ref: "src/core.cpp:891-934"

  - name: "Postload"
    type: directory
    description: "Ruby scripts loaded after game scripts (RGSS3 only)"
    category: game_data
    path: "mkxp-z/Scripts/Postload/"
    required: false
    unsourceable: "the core creates this directory empty for the user's own scripts"
    source_ref: "src/core.cpp:901-956"
