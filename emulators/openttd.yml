  macos:
    path: "~/Documents/OpenTTD"
    source_ref: "src/fileio.cpp:879-896, cmake/Options.cmake:8-9"
  linux:
    path: "$XDG_DATA_HOME/openttd"
    source_ref: "src/fileio.cpp:851-877, src/fileio.cpp:1005-1058, src/stdafx.h:275-278"
    note: "~/.local/share/openttd when XDG_DATA_HOME is unset. the folder of an openttd.cfg already found on a search path, ~/.openttd among them, takes precedence"

notes: |
  Open source reimplementation of Transport Tycoon Deluxe. RetroPie
  installs the distribution's openttd package (14.1 on Debian trixie,
  13.0 on bookworm), whose recommends pull in the OpenGFX, OpenSFX and
  OpenMSX base sets, and moves the user's openttd folders under
  ~/.config, ~/.local/share and ~/.local into its ports configuration.
  This profile reads the 14.1 tag.

  Graphics, sounds and music come from base sets. Each set is a .obg,
  .obs or .obm description found in the baseset folder of any search
  path, naming its files and their MD5. A file is looked up in the
  baseset folders under the path the description gives, with a lowercase
  retry. A set missing any file is neither listed nor picked
  automatically. A file whose MD5 differs keeps the set usable and is
  reported as corrupt at start. For a GRF the MD5 covers the data
  section, which is the whole file in the original container format.
  ref: src/base_media_func.h:84-158, src/base_media_func.h:345-372,
       src/gfxinit.cpp:475-495,
       src/fileio.cpp:215-230, src/gfxinit.cpp:125-136,
       src/newgrf_config.cpp:255-277

  The descriptions of the original game's files ship with OpenTTD in
  media/baseset: orig_dos.obg, orig_dos_de.obg and orig_win.obg for the
  graphics, orig_dos.obs and orig_win.obs for SAMPLE.CAT, orig_dos.obm,
  orig_win.obm and orig_tto.obm for the music. ORIG_EXTRA.GRF, also named
  by the graphics sets, is built and installed with OpenTTD. The MD5
  values below are the ones those descriptions carry.

  Without any usable graphics set OpenTTD offers to download OpenGFX from
  its content service, and fails with no network. A missing sound or music
  set falls back to no_sound.obs and no_music.obm, which ship with it.
  ref: src/openttd.cpp:717-745, src/openttd.cpp:781-812,
       src/bootstrap_gui.cpp:362-371

  Paths below are relative to an OpenTTD search path, the personal data
  folder named in data_root being the usual one. Base set files sit in its
  baseset folder.
  ref: src/fileio.cpp:48

