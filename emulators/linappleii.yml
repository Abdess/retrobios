analysis:
  embedded_roms:
    mechanism: >
      res/roms/*.rom compiled into EmbeddedRoms.cpp by scripts/generate_roms.sh
      at configure and build time, each behind an ENABLE_ROM_* macro
    source_ref: "CMakeLists.txt:59-126, CMakeLists.txt:295-331, scripts/generate_roms.sh:97-117"
    extraction: "hashes computed from the res/roms images the generator reads"

    system_roms:
      - symbol: rom_apple2
        machine: "Apple ]["
        machine_type: A2TYPE_APPLE2
        image: res/roms/Apple2.rom
        cmake_option: ENABLE_ROM_APPLE2
        default: on
        source_ref: "source src/apple2/Memory.cpp:1106-1111"
        size: 12288
        md5: 3c406514b9806a7c57ee65fb0b0c39b4
        sha1: 09288be705464b608ff190519ab008d3dfcd1b05

      - symbol: rom_apple2_plus
