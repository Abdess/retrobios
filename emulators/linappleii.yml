    peripheral_firmware:
      - device: "Disk II controller, 16 sector boot ROM"
        slot: 6
        symbol: rom_disk2
        image: res/roms/DISK2.rom
        cmake_option: ENABLE_ROM_DISK2
        default: on
        source_ref: "source CMakeLists.txt:120, CMakeLists.txt:122-126, source scripts/generate_roms.sh:115, source src/apple2/peripherals/disk/Disk.cpp:1129-1131"
        size: 256
        md5: 2020aa1413ff77fe29353f3ee72dc295
        sha1: d4181c9f046aafc3fb326b381baac809d9e38d16

      - device: "Disk II controller, P6 sequencer PROM"
        slot: 6
        symbol: rom_disk2_p6
        image: res/roms/DISK2-P6.rom
        cmake_option: ENABLE_ROM_DISK2
        default: on
        source_ref: "source scripts/generate_roms.sh:117, source src/apple2/peripherals/disk/Disk.cpp:621-627, source CMakeLists.txt:1041-1056"
        size: 256
        md5: 5f1be0c1cdff26f5956eef9643911886
        sha1: bc39fbd5b9a8d2287ac5d0a42e639fc4d3c2f9d4
        note: >
          The controller state machine reads its opcodes from this image. A
          build test pins its SHA-1 and its size. Without ENABLE_ROM_DISK2 the
          sequencer returns a constant and the data register never moves.

      - device: "Disk II controller, 13 sector boot ROM"
        symbol: rom_disk2_13sector
        image: res/roms/DISK2-13sector.rom
        cmake_option: ENABLE_ROM_DISK2
        default: on
        source_ref: "source scripts/generate_roms.sh:116"
        size: 256
        md5: 4f80448507cf43ab40c17ac08d89e278
        sha1: afd060e6f35faf3bb0146fa889fc787adf56330a
        note: "Compiled in. Nothing under src/ reads the symbol"

      - device: "Super Serial Card"
        slot: 2
        symbol: super_serial_rom
        image: res/roms/SSC.rom
        source_ref: "source src/apple2/peripherals/super_serial_card/SuperSerialRom.h:8-16, source src/apple2/peripherals/super_serial_card/SuperSerial.cpp:356-358, source CMakeLists.txt:940-944"
        size: 2048
        md5: 67c0d61ab0911183faf05270f881a97e
        sha1: 6dab633470c6bc4cb3e81d09fda46597caf8ee57
        note: >
          Not generated and behind no ROM option: the card carries the 2048
          bytes as an array in SuperSerialRom.h, the last page mapped at $Cn00
          and the whole image at $C800. The generator does not read
          res/roms/SSC.rom. A build test pins its SHA-1 as the reference of
          that transcription.

      - device: "Mouse interface card"
        slot: 4
        symbol: mouse_rom
        image: res/roms/MouseInterface.rom
        cmake_option: ENABLE_PERIPHERAL_MOUSE
        default: on
        source_ref: "source src/apple2/peripherals/mouse/MouseRom.h:8-19, source src/apple2/peripherals/mouse/Mouse.cpp:261-267, source CMakeLists.txt:543, CMakeLists.txt:666, CMakeLists.txt:987-991"
        size: 2048
        md5: 22563ab338024dac7b03510371d49c57
        sha1: 3a9d881a8a8d30f55b9719aceebbcf717f829d6f
        note: >
          Not generated and behind no ROM option: the card carries the 2048
          bytes as an array in MouseRom.h and maps one 256-byte bank at $Cn00,
          chosen by PIA port B bits 1-3. ENABLE_PERIPHERAL_MOUSE builds the
          card and its firmware together. The generator does not read
          res/roms/MouseInterface.rom. A build test pins its SHA-1 as the
          reference of that transcription.

      - device: "Parallel printer card"
        slot: 1
        symbol: printer_rom
        image: res/roms/Parallel.rom
        source_ref: "source src/apple2/peripherals/printer/Printer.cpp:30-55, 217, source CMakeLists.txt:921-927"
        size: 256
        md5: 5902996f16dc78fc013f6e1db14805b3
        sha1: c75c751589cbcc1ad4ab4f63676af7abadd86f5b
        note: >
          Not generated and behind no ROM option: the card carries the 256
          bytes as an array in Printer.cpp. The generator does not read
          res/roms/Parallel.rom. A build test pins its SHA-1 as the reference
          of that transcription.

      - device: "Clock card"
        symbol: clock_rom
        source_ref: "src/apple2/peripherals/clock/ClockCard.cpp:19-20, 34-45, 174-176"
        note: >
          A 256-byte page written in ClockCard.cpp that answers the ProDOS
          ThunderClock identification and read entry points. Each card patches
          its slot into the operand at $0D. No image under res/roms backs it.

      - device: "ProDOS block device controller"
        symbol: harddisk_rom
        source_ref: "src/apple2/peripherals/harddisk/Harddisk.cpp:73-76, 250-275, 739-742"
        note: >
          A 256-byte page written in Harddisk.cpp from the ProDOS 8 Technical
          Reference Manual, serving two volumes. Each card patches its slot
          page into the operand at $09. No image under res/roms backs it.

