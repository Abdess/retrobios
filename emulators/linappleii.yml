notes: |
  SDL port of AppleWin for Linux. The SourceForge project was abandoned and
  its forks were gathered under the linappleii organization
  (README.md:202-209). Five frontends build from one core: sdl1, sdl2, sdl3,
  tui and headless (src/frontends/).

  The ROMs the emulator runs are compiled into the binary.
  scripts/generate_roms.sh turns res/roms/*.rom into EmbeddedRoms.h and
  EmbeddedRoms.cpp, once at configure time and again at build time
  (CMakeLists.txt:295-331), each image behind an ENABLE_ROM_* macro
  (scripts/generate_roms.sh:97-117). Seventeen images go through the
  generator: ten system ROMs, four character generator ROMs and the three
  Disk II ROMs. The mouse card, the printer card, the Super Serial Card, the
  clock card and the hard disk controller carry their firmware as arrays in
  their own source files (src/apple2/peripherals/mouse/MouseRom.h:19,
  src/apple2/peripherals/printer/Printer.cpp:30,
  src/apple2/peripherals/super_serial_card/SuperSerialRom.h:16,
  src/apple2/peripherals/clock/ClockCard.cpp:34,
  src/apple2/peripherals/harddisk/Harddisk.cpp:250), and the Mockingboard
  registers no ROM.

  What a macro is set to decides whether a machine model runs at all.
  CMakeLists.txt:59-126 leaves the Apple ][, ][+, J-Plus, //e and Enhanced //e
  system ROMs ON, along with the Disk II firmware. The three clone options are
  OFF: ENABLE_ROM_CLONE_BASE64A, ENABLE_ROM_CLONE_PRAVETS and
  ENABLE_ROM_CLONE_TK3000E (CMakeLists.txt:97-99). Selecting one of those
  machine types on a default build reaches mem_initialize with no rom_data,
  which prints the model name and its cmake flag, destroys the context and
  returns -1 (src/apple2/Memory.cpp:1168-1178). The message offers two ways
  out, and the second is a file: -R, --rom <file> loads a system ROM at
  runtime (src/frontends/common/AppArgs.cpp:77,188-189).

  A custom ROM takes precedence over anything embedded. load_custom_rom opens
  the path as given, then through Path::find_data_file, and refuses a file
  below 12288 or above 65536 bytes, which stops the start
  (src/frontends/common/AppController.cpp:142-185,265-267). mem_initialize
  accepts the buffer at exactly 16384 or 12288 bytes, or larger, taking the
  trailing 16384 for the //e-class types and the trailing 12288 otherwise
  (src/apple2/Memory.cpp:1082-1103). No hash or name is checked: the file is
  whatever the user points at.

  Character generators are res/charset40*.png, converted to XPM by CMake
  (CMakeLists.txt:264-293) and included at src/apple2/Video.cpp:35-39. One of
  five is chosen from the machine type and the keyboard language
  (src/apple2/Video.cpp:1255-1279). The status font and the splash screen are
  XPM as well (src/core/Asset.cpp:15-16,57,63). The four *_Video.rom images
  are compiled in, and nothing under src/ reads their symbols.

  Master.dsk is inserted into slot 6 drive 1 at startup unless the command
  line names a disk or the configuration autoloads one
  (src/frontends/common/AppController.cpp:210-231). asset_find_master_disk
  resolves it through Path::find_data_file (src/core/Asset.cpp:25-39), which
  walks the user data and config directories, the executable directory and its
  res/ neighbours, the share and etc prefixes beside it, the compiled-in
  SOURCE_RES_DIR, /usr/local/share/linapple, /usr/share/linapple, every
  XDG_CONFIG_DIRS entry or /etc/xdg/linapple when that variable is unset, and
  /etc/linapple (src/core/Util_Path.h:116-179). The same search serves
  icon.bmp and a --rom path that does not open as given.

  The debugger reads its symbol tables through system_state.program_dir,
  declared at src/core/LinAppleCore.h:102 and read without ever being
  assigned, so the names resolve against the working directory.
  file_name_symbols lists nine tables (src/Debugger/Debugger_Symbols.cpp:37-49).
  CmdSymbolsLoad reads a table's default file when it receives no argument
  (src/Debugger/Debugger_Symbols.cpp:644-660). Its only caller is the LOAD
  parameter of the SYM commands (src/Debugger/Debugger_Symbols.cpp:823-825),
  and debug_initialize loads no table (src/Debugger/Debug.cpp:29-39).
  ParseSymbolTable opens the file with fopen and a missing one leaves the
  debugger running without its symbols (src/Debugger/Debugger_Symbols.cpp:497).

  Peripheral cards are linked into the executable by default. Each card has
  an ENABLE_PERIPHERAL_* option, ON (CMakeLists.txt:543). With
  BUILD_SHARED_PERIPHERALS, OFF at CMakeLists.txt:45, each card that
  add_peripheral does not force built-in builds as a shared object
  (CMakeLists.txt:550-552,655,665-671), and peripheral_plugins_init opens
  every *.so found in the plugin search paths in either build
  (src/apple2/peripherals/Peripheral_Internal.cpp:352-437,
  src/core/Util_Path.h:102-114).

  linapple.conf carries preferences only (src/core/Registry.cpp,
  src/frontends/common/AppEnvironment.cpp). Each accessor returns a compiled-in
  default when a key is missing.

files:
  - name: Master.dsk
    required: false
    bundled: true
    description: "Boot floppy inserted into slot 6 drive 1 at startup"
    min_size: 143105
    max_size: 143364
    validation: [size]
    size: 143360
    md5: ee44560f34033efa3bb47b3e0aac1772
    sha1: 7b03befac4fbcef8c649048fa3ff5d095fd48dd3
    source_ref: "source src/core/Asset.cpp:20, 25-39, 97-112, source src/apple2/peripherals/disk/formats/SectorDiskImage.cpp:57-60, 71-74, source CMakeLists.txt:1325-1337"
    note: >
      asset_find_master_disk warns and returns false when no search path
      holds the file, and the emulator starts with an empty drive. The sector
      image driver also takes 143403 and 143488 bytes. No hash or content
      check is performed at run time. The hashes are those of res/Master.dsk,
      which a build test pins. LinApple and Batocera ship different images
      under this name, both 143360 bytes.
      Shipped in share/linapple/ of the v3.0-beta-3 archives and .deb.

  - name: icon.bmp
    required: false
    bundled: true
    description: "Window icon read from disk by the SDL frontends"
    size: 2102
    md5: be7a389c5aa678f5e6ce4748593b0a29
    sha1: 5aee3a718f3d541122b61b9b8203e8a28db97a34
    source_ref: "source src/frontends/sdl2/SDL_Asset.cpp:18-41, 55-69"
    note: >
      sdl_asset_load_bmp resolves the name through Path::find_data_file,
      prints a warning to stderr when no search path holds it and returns
      nullptr. The sdl1, sdl2 and sdl3 frontends each load it when the window
      is created. Absence costs the window its icon and nothing else.
      Shipped in share/linapple/ of the v3.0-beta-3 archives.

  - name: APPLE2E.SYM
    required: false
    description: "Debugger symbol table for the main ROM"
    source_ref: "source src/Debugger/Debugger_Symbols.cpp:37-49, 644-660"
    note: >
      Read into the Main table when SYMMAIN LOAD is entered without a file
      name. Parsed as text lines of address and symbol name, with no size or
      hash check.

  - name: A2_BASIC.SYM
    required: false
    description: "Debugger symbol table for Applesoft BASIC"
    source_ref: "source src/Debugger/Debugger_Symbols.cpp:37-49, 644-660"
    note: >
      Read into the Basic table when SYMBASIC LOAD is entered without a file
      name. Parsed as text lines of address and symbol name, with no size or
      hash check.

