notes: |
  PlayStation 2 emulator for Android, package xyz.aethersx2.android, activity
  xyz.aethersx2.android.EmulationActivity. The project is a patcher rather than
  a source tree: it rewrites the AetherSX2 application package, replaces its
  data assets and signs the result with its own key. Two lines are published,
  one on the AetherSX2 v1.5-4248 package and one on v1.5-3668, and both name
  themselves NetherSX2 and keep the same package id. Every statement below was
  read from the shipped arm64 library lib/arm64-v8a/libemucore.so, which is
  stripped, and confirmed against the unpatched AetherSX2 packages the project
  distributes for its own build step.
  ref: decomp/Extract.bat:1, old/scripts/patch-apk.sh:24-33,
       nethersx2 v2.1-4248 AndroidManifest.xml

  The patch touches three instructions in the 4248 library. Two turn the
  compare-and-branch that follows a certificate comparison into a plain branch,
  which is what lets the package be resigned. The third replaces the test that
  gates BIOS acceptance. Everything reached by the file loading paths is
  byte for byte the AetherSX2 build, so the file set below is that build's,
  read from the 4248 library rather than carried over from another release.
  ref: decomp/Hackify.bat:24-28,
       nethersx2 v2.1-4248 libemucore.so 0x838560,
       nethersx2 v2.1-4248 libemucore.so 0x83b324

  A BIOS image is required and boot stops without one, the application saying
  it needs a PS2 BIOS in the bios folder of the data directory. The data
  directory is getExternalFilesDir(null) with getDataDir() behind it, and the
  folder names under it come from the Folders section, Bios defaulting to bios.
  A script in the repository moves that root to /storage/emulated/0/NetherSX2
  once all-files access is granted, and patches out the library check that
  requires the package name in the path; the published packages do not carry it.
  ref: nethersx2 v2.1-4248 libemucore.so 0xf70a9,
       nethersx2 v2.1-4248 libemucore.so 0x7ea914-0x7eaa8c,
       xyz/aethersx2/android/NativeLibrary.smali initializeOnce,
       patches/patch_root_storage.py:14-35, patches/patch_root_storage.py:261-351

  Detection is by content. The scan lists the BIOS folder with a * mask, keeps
  files between 4194304 and 8388608 bytes, and accepts an image whose romdir
  carries a RESET entry followed by a readable ROMVER; the fifth ROMVER
  character gives the zone, A for USA, C for China, E for Europe, H for Asia,
  J for Japan, P for Free, T for T10K and X for Test, any other character
  standing for itself, and an EXTINFO entry is read along the way. Stock 4248
  also required
  the sixth character to differ from D, which turned away development images;
  the patch forces that result to true, and the 3668 line never carried the
  test. An image named in the configuration is combined with the BIOS folder and
  opened at that path when it exists, without the size filter and without the
  romdir test. No name and no hash is matched anywhere. The image is read into
  the 4 MB ROM region and truncated to it, and one shorter than 2465792 bytes
  turns off the OSDSys parameter HLE.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:27-28,
       aethersx2/pcsx2/ps2/BiosTools.cpp:62-175,
       aethersx2/pcsx2/ps2/BiosTools.cpp:235-260,
       aethersx2/pcsx2/ps2/BiosTools.cpp:272-332,
       nethersx2 v2.1-4248 libemucore.so 0x828d80-0x828f10,
       nethersx2 v2.1-4248 libemucore.so 0x829020-0x8292c0,
       nethersx2 v2.1-4248 libemucore.so 0x829244-0x829248

  Companions derive from the selected image. rom1 and rom2 are appended to the
  full name first, then substituted for the existing extension, so an image at
  ps2-0230a-20080220.bin is followed by ps2-0230a-20080220.bin.rom1 then
  ps2-0230a-20080220.rom1. The nvm and the mec are read at the substituted
  extension only, and both are written with defaults when they are absent or
  too short. No erom is loaded on this code line.
  ref: aethersx2/pcsx2/ps2/BiosTools.cpp:193-218,
       aethersx2/pcsx2/CDVD/CDVD.cpp:120-144,
       aethersx2/pcsx2/CDVD/CDVD.cpp:180-214,
       nethersx2 v2.1-4248 libemucore.so 0x8288b0-0x828b90

  The network adapter opens eeprom.dat and flash.dat by bare name, so they
  resolve against the process working directory, which the application never
  sets. A compiled-in image stands in for the first and a card filled with 0xFF
  for the second. DEV9hdd.raw is the default name of the empty disk image its
  settings page writes. An IRX named in the configuration is read into the ROM
  region at 0x3C0000 at boot; the field is empty by default and names no file of
  its own.
  ref: aethersx2/pcsx2/DEV9/DEV9.cpp:146-161,
       aethersx2/pcsx2/DEV9/flash.cpp:76-104,
       aethersx2/pcsx2/ps2/BiosTools.cpp:220-233,
       nethersx2 v2.1-4248 libemucore.so 0x7c5bec-0x7c5ca0,
       nethersx2 v2.1-4248 libemucore.so 0x828bc0-0x828ca0

  Resources are read out of the package itself. The library has no asset
  manager of its own and calls back into readPackageFile, readPackageFileToString
  and playSoundAsync, each taking an asset-relative name, so the game database,
  the patch archives, the interface fonts, the shader sources every backend
  compiles at startup and the achievement sounds are versioned with the build
  and never looked for on disk. The game list draws its region flags and rating
  stars from the same assets. The project ships its own game database, patch
  archives and help pages, and adds two files the 4248 package does not carry,
  placeholder.png, which the library names outright, and the Polish flag the
  game list can ask for.
  ref: nethersx2 v2.1-4248 libemucore.so 0x8348d0,
       nethersx2 v2.1-4248 libemucore.so 0x834bb0,
       xyz/aethersx2/android/NativeLibrary.smali readPackageFile,
       xyz/aethersx2/android/NativeLibrary.smali playSoundAsync

files:
  - name: ps2-0230a-20080220.bin
    path: bios/ps2-0230a-20080220.bin
    required: true
    min_size: 4194304
    max_size: 8388608
    validation: [size]
    description: "PS2 BIOS image"
    note: >-
      Any image whose romdir holds RESET and a readable ROMVER is accepted,
      whatever its name. The 4 to 8 MB range gates the folder scan; an image
      named in the configuration skips both that range and the romdir test. The
      sixth ROMVER character is not examined here, the patch having replaced the
      test that rejected images carrying D.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:27-28, aethersx2/pcsx2/ps2/BiosTools.cpp:235-260, nethersx2 v2.1-4248 libemucore.so 0x828d80-0x828f10, nethersx2 v2.1-4248 libemucore.so 0x829244-0x829248"

  - name: ps2-0230a-20080220.rom1
    path: bios/ps2-0230a-20080220.rom1
    required: false
    max_size: 4194304
    description: "DVD player ROM"
    note: >-
      Tried as {bios}.rom1 then {biosbase}.rom1. Read at 0x2404000 of the EE
      memory block and truncated to 4 MB. Logged and skipped when absent.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-218, nethersx2 v2.1-4248 libemucore.so 0x8288b0-0x828a24"

  - name: ps2-0230a-20080220.rom2
    aliases:
      - "SCPH-90006_BIOS_VX_HK _230.ROM2"
    path: bios/ps2-0230a-20080220.rom2
    required: false
    max_size: 524288
    description: "Chinese ROM extension"
    note: >-
      Same two-step naming as rom1. Read at 0x2804000 of the EE memory block and
      truncated to 512 KB. Only present on Chinese region consoles.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:193-218, nethersx2 v2.1-4248 libemucore.so 0x828a34-0x828b90"

  - name: ps2-0230a-20080220.nvm
    path: bios/ps2-0230a-20080220.nvm
    required: false
    hle_fallback: true
    min_size: 1024
    validation: [size]
    description: "Console NVRAM"
    note: >-
      Read at the BIOS path with the extension replaced by nvm, opened r+b.
      Carries the console id, the iLink id, the language and the OSD
      configuration. A 1024 byte image is written when the file is missing or
      shorter, zeroed except for a fixed iLink id and the language defaults of
      the BIOS region, and it is rewritten when the language block reads back
      blank.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:158-214, nethersx2 v2.1-4248 libemucore.so 0x79b930-0x79bb90, nethersx2 v2.1-4248 libemucore.so 0x79bce0"

  - name: ps2-0230a-20080220.mec
    path: bios/ps2-0230a-20080220.mec
    required: false
    hle_fallback: true
    min_size: 4
    validation: [size]
    description: "Mechacon version"
    note: >-
      Read at the BIOS path with the extension replaced by mec. Written as
      03 06 02 00 when the file is missing or shorter than 4 bytes.
    source_ref: "aethersx2/pcsx2/CDVD/CDVD.cpp:120-144, nethersx2 v2.1-4248 libemucore.so 0x79cbc0-0x79cdc4"

  - name: eeprom.dat
    required: false
    hle_fallback: true
    size: 64
    description: "DEV9 EEPROM"
    note: >-
      Opened O_RDWR by bare name when the network adapter starts and mapped over
      64 bytes. A compiled-in image stands in when the file is missing or cannot
      be mapped.
    source_ref: "aethersx2/pcsx2/DEV9/DEV9.cpp:146-161, nethersx2 v2.1-4248 libemucore.so 0x7c5c40-0x7c5ca0"

  - name: flash.dat
    required: false
    hle_fallback: true
    max_size: 8650752
    description: "DEV9 SmartMedia flash image"
    note: >-
      Opened rb by bare name at network adapter init and read as 1024 blocks of
      16 pages of 512 bytes plus 16 ECC bytes. The card is filled with 0xFF when
      the file is absent.
    source_ref: "aethersx2/pcsx2/DEV9/flash.cpp:76-104, nethersx2 v2.1-4248 libemucore.so 0x7c5bec-0x7c5c40"

  - name: "<module>.irx"
    required: false
    unsourceable: "any IOP module the user points at, under no name the code expects"
    description: "IOP module injected at boot"
    note: >-
      Opened at the path the configuration holds once it is longer than three
      characters, and read into the ROM region at 0x3C0000, capped at 0x40000
      bytes. The field is empty by default and names no file of its own.
    source_ref: "aethersx2/pcsx2/ps2/BiosTools.cpp:220-233, aethersx2/pcsx2/ps2/BiosTools.cpp:327-328, nethersx2 v2.1-4248 libemucore.so 0x828bc0-0x828ca0"

