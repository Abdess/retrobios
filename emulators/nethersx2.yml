exclusion_note: >
  Left out are the assets the package carries that no code path on this platform
  opens. game_controller_db.txt is the largest of them: the desktop AetherSX2
  hands it to SDL, the Android library links no SDL at all and takes pad input
  through handleControllerButtonEvent and handleControllerAxisEvent, and the
  name appears in neither the library nor the dex of the 3668 and 4248 packages,
  stock or patched. The same holds for the seven Direct3D shader sources under
  shaders/dx11, for icons/AppIconLarge.png and cover-placeholder.png, for
  fonts/Roboto-Regular-copyright and sounds/achievements/README.txt, which are
  licence and credit texts, and for dexopt/baseline.prof and baseline.profm,
  which the Android runtime consumes rather than the application. Also left out
  is everything the emulator produces for itself under the data directory:
  memory cards as Mcd<nnn>.ps2, DEV9hdd.raw for the internal disk, save states,
  screenshots, covers, texture dumps, logs, per-game settings, input profiles
  and the gamedb and pipeline caches. The two branches the patch turns into
  plain branches sit behind certificate comparisons and touch no file.
  ref: nethersx2 v2.1-4248 libemucore.so 0x7ea914-0x7eaa8c,
