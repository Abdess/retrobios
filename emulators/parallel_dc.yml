emulator: "ParaLLEl DC"
type: libretro
core_classification: enhanced_fork
source: "https://github.com/libretro/parallel-dc"
upstream: "https://github.com/flyinghead/flycast"
profiled_date: "2026-11-09"
source_commit: "6f315dd55a66cb2299dd2282b24d2fd84fe7f390"
core_version: "0.1"
version_basis:
  kind: file
  path: "core/libretro/libretro.cpp"
  pattern: 'info->library_version\s+=\s+"([^"]+)'
display_name: "Sega - Dreamcast/Naomi (ParaLLEl DC)"
cores:
  - "parallel_dc"
systems:
  - sega-dreamcast
  - sega-naomi
  - sega-naomi2
  - sega-atomiswave
  - sega-systemsp

notes: |
  The libretro/flycast tree, renamed libretro/parallel-dc. Its master
  descends from the April 2022 libretro merge base 4c293f30 and has been
  developed on its own since December 2025, with fixes from flyinghead's
  Flycast brought over by hand. The library is parallel_dc_libretro.so.
  ref: source core/libretro/libretro.cpp:3490-3494

  Every system file lives in <system>/dc/. The core creates <system>/dc/data,
  where it writes shader and pipeline caches and texture dumps. Nothing is
  read from it.
  ref: source core/libretro/libretro.cpp:2917-2921, source core/libretro/libretro.cpp:3047-3055,
       source core/stdclass.cpp:15-25

  Dreamcast: the "Use Real BIOS" core option (use_real_bios) defaults to
  enabled. The boot ROM is then looked for as dc_boot.bin, dc_boot.bin.bin,
  dc_bios.bin, dc_bios.bin.bin, the first that yields a full 2 MB read wins.
  With the option off, or no boot ROM found, the HLE BIOS (reios) boots the
  disc. Booting to the BIOS menu, or starting without a disc, needs the real
  boot ROM and fails with -3 without it. Eight product ids and every MIL-CD
  are switched to the real boot ROM when it is there, and fall back to reios
  when it is not.
  ref: source core/libretro/libretro_core_options.h:134-146, source core/libretro/libretro.cpp:1056-1064,
       source core/hw/holly/sb_mem.cpp:69-105, source core/hw/holly/sb_mem.cpp:255-273,
       source core/hw/flashrom/flashrom.h:57-70, source core/hw/flashrom/flashrom.h:87-118,
       source core/nullDC.cpp:356-397, source core/nullDC.cpp:592-605, source core/nullDC.cpp:643-658

  NAOMI, NAOMI 2, Atomiswave and System SP: a BIOS archive is opened as
  <system>/dc/<name>, then with .zip, .ZIP, .7z, .7Z, .rar and .RAR appended,
  and recognised by its signature. Each member is looked for in the game
  archive, its parent, then the BIOS archive, by the CRC32 the table gives
  and then by name. The newest revision held for the configured region is
  loaded, else the first held of any region. Romsets name their BIOS in the
  game table, and a game that names none reads naomi. Flat .bin and .dat
  images read naomi, or naomi2 when the header starts with Naomi2.
  ref: source core/archive/archive.c:736-753, source core/hw/naomi/naomi_cart.cpp:147-170,
       source core/hw/naomi/naomi_cart.cpp:418-584, source core/hw/naomi/naomi_cart.cpp:658-670,
       source core/hw/naomi/naomi_cart.cpp:1018-1045, source core/hw/naomi/naomi_cart.cpp:1048-1088

  A NAOMI or NAOMI 2 game whose BIOS archive is absent, or with Use Real
  BIOS disabled, starts on reios, which hands over to the game as the BIOS
  does. Atomiswave and System SP games refuse to start without theirs.
  ref: source core/hw/naomi/naomi_cart.cpp:671-713, source core/nullDC.cpp:628-634

  Seven archive names are reachable from the game table: naomi, naomi2,
  awbios, f355bios, f355dlx, hod2bios and segasp, plus naomi-jp-d, which is
  kept in naomi.zip. airlbios, naomigd, naomidev and naomi-ko-h have table
  entries but no game names them, so airlbios.zip and naomigd.zip are never
  opened.
  ref: source core/hw/naomi/naomi_roms.h:62-301, source core/hw/naomi/naomi_roms.h:2630

  LoadRomFiles also reads naomi_boot.bin, naomi_boot.bin.bin,
  naomi_bios.bin, naomi_bios.bin.bin and epr-21576d.bin for NAOMI and the
  naomi2_ names for NAOMI 2, but naomi_cart_Close clears bios_loaded before
  the cartridge loads, and reios then replaces that ROM.
  ref: source core/hw/holly/sb_mem.cpp:87-105, source core/nullDC.cpp:608,
       source core/hw/naomi/naomi_cart.cpp:1159, source core/hw/naomi/naomi_cart.cpp:1176

files:
  - name: "dc_boot.bin"
    path: "dc/dc_boot.bin"
    aliases: ["dc_boot.bin.bin", "dc_bios.bin", "dc_bios.bin.bin"]
    system: sega-dreamcast
    required: false
    hle_fallback: true
    min_size: 2097152
    validation: [size]
    description: "Dreamcast boot ROM"
    note: "Read as 2 MB into the system ROM, and a shorter file is rejected. Needed to boot to the BIOS menu or without a disc, and used for every game while Use Real BIOS is on."
    source_ref: "source core/hw/holly/sb_mem.cpp:69-105, source core/hw/holly/sb_mem.cpp:255-273, source core/hw/flashrom/flashrom.h:57-70, source core/nullDC.cpp:465-473, source core/nullDC.cpp:592-605"

  - name: "dc_nvmem.bin"
    path: "dc/dc_nvmem.bin"
    aliases: ["dc_flash_wb.bin", "dc_flash.bin", "dc_flash.bin.bin"]
    system: sega-dreamcast
    required: false
    min_size: 131072
    validation: [size]
    description: "Dreamcast flash ROM"
    note: "Loaded with the boot ROM and by the HLE path. A missing file leaves the flash blank, factory settings are written into it and the core runs. Written back as dc_nvmem.bin."
    source_ref: "source core/hw/holly/sb_mem.cpp:237-253, source core/hw/holly/sb_mem.cpp:269, source core/hw/holly/sb_mem.cpp:276-283, source core/hw/holly/sb_mem.cpp:295-303, source core/nullDC.cpp:465-473"

  - name: "font.bin"
    path: "dc/font.bin"
    system: sega-dreamcast
    required: false
    description: "Dreamcast system font for the HLE BIOS"
    note: "Read into the font table of the reios ROM image, at most 536496 bytes. Absent, a built-in font is copied there."
    source_ref: "source core/reios/reios.cpp:2066-2088"

