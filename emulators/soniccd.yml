notes: |
  Retro Engine v3 decompilation of Sonic CD (2011 Christian Whitehead
  mobile/Steam port). Single binary; one data pack per install.

  CheckRSDKFile only fopen()s the pack; there is no signature test. If
  the file is absent the engine falls back to a loose Data/ + Bytecode/
  tree and, on first run, writes usage.txt describing the layout it
  wants.
  ref: RSDKv3/Reader.cpp:26-87 (CheckRSDKFile), RSDKv3/RetroEngine.cpp:280-321,
       RSDKv3/RetroEngine.cpp:328-363

  settings.ini key Dev:DataFile overrides the default "Data.rsdk".
  ref: RSDKv3/Userdata.cpp:352-353,467-468, RSDKv3/RetroEngine.hpp:437

  Bytecode detection probes two layouts in order after the pack opens:
  Data/Scripts/ByteCode/GlobalCode.bin (BYTECODE_MOBILE) or GS000.bin
  (BYTECODE_PC). Either lives inside Data.rsdk when the official pack
  is present.
  ref: RSDKv3/Reader.cpp:54-82

files:
  - name: "Data.rsdk"
    category: game_data
    system: soniccd
    required: true
    source_ref: "RSDKv3/RetroEngine.cpp:305 (CheckRSDKFile(dest)), RSDKv3/Userdata.cpp:352"
    note: |
      Sonic CD assets (RSDK v3 container). Shipped with the official
      Sonic CD release (Steam, iOS, Android, Sonic Origins). The engine
      opens the file with fopen(); content is validated by trying to
      load Data/Scripts/ByteCode/GlobalCode.bin or GS000.bin from
      inside, not by hashing the pack.
