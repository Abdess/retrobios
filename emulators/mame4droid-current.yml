note: |
  Android port of MAME by David Valdeita (Seleuco), application id
  com.seleuco.mame4d2024, release 1.38.1
  (android-MAME4droid/app/build.gradle:20,24) on MAME 0.289 (README.md:4).

  The app shipped as MAME4droid 2024 from its first release on 2023-12-17 to
  1.19 on MAME 0.272. Release 1.20 moved to MAME 0.273 and renamed it
  MAME4droid (Current)
  (android-MAME4droid/app/src/main/assets/changelog.htm:74,55,54), the name
  android-MAME4droid/app/src/main/res/values/strings.xml:4 carries. The
  repository was renamed with it: seleuco/MAME4droid-2024 resolves to
  seleuco/MAME4droid-Current.

  build.gradle declares no product flavor and the repository has a single
  branch, so both names are the same package. The tree holds the Android OSD
  and the patches applied over a stock MAME source tree (howtobuild.txt), so
  the ROM sets are those of MAME 0.289. Files are mame4droid-2024's, pinned
  to the same commit.

