notes: |
  Multi-system emulator by Near (byuu), successor to higan/bsnes. Focuses on
  accuracy and preservation. 40 emulators registered at this pin
  (desktop-ui/emulator/emulators.cpp).

  Firmware identification uses SHA256 hashes. Filenames are user-defined: ares
  scans a configured directory and matches by hash.
  ref: desktop-ui/settings/firmware.cpp:116-136

  Firmware path resolution: settings.paths.firmware (user override) or
  {userData}/ares/Firmware/ (default). Per-system firmware assigned in
  Settings > Firmware dialog or via scan-by-hash.
  ref: desktop-ui/settings/settings.hpp:89-101, desktop-ui/desktop-ui.cpp:68-75

  Systems with fully embedded firmware (no user files needed):
  Game Boy (boot.rom), Game Boy Color (boot.rom), Mega Drive (TMSS),
  Sega 32X (TMSS + vector + SH2 boot M/S), Nintendo 64 (PIF NTSC/PAL/SM5 +
  CIC 6101/6102/6105/7101), Super Famicom (IPL + all coprocessor firmware:
  DSP1-4, CX4, ST010, ST011, ST018, SGB1/2 boot ROMs), WonderSwan (boot.rom),
  WonderSwan Color (boot.rom), Pocket Challenge V2 (boot.rom),
  ZX Spectrum (BIOS), ZX Spectrum 128 (BIOS + sub ROM).
  ref: mia/resource/resource.bml, mia/Firmware/

  SFC coprocessor firmware auto-injected if missing from ROM image.
  ref: mia/medium/super-famicom.cpp:42-62

  Neo Geo BIOS is not a firmware slot. Neo Geo AES reads aes.zip and the
  Arcade emulator, which runs the Neo Geo MVS games, reads neogeo.zip, both
  beside the game: in the game's folder, or its parent when that folder is
  named neogeo, then in a neogeo/ subfolder of it. A missing archive or
  member stops the load with the member and the path it tried. The member is
  the BIOS chosen in Settings > Cores, neo-po.bin for the AES and
  vs-bios.rom for the MVS by default, among the bios entries the aes and
  neogeo sets carry in Database/Arcade.bml. It is byte-swapped on load and no
  hash is checked.
  ref: desktop-ui/emulator/emulator.cpp:86-94,
       desktop-ui/emulator/neo-geo-aes.cpp:43-49,
       desktop-ui/emulator/arcade.cpp:456-464,
       desktop-ui/settings/settings.hpp:142-146,
       desktop-ui/settings/cores.cpp:170-204,
       mia/system/neo-geo-aes.cpp:12-32, mia/system/neo-geo-mvs.cpp:12-32

  SFC base cartridges (Super Game Boy, Satellaview BS-X, Sufami Turbo) are
  games, not firmware: the file opened as the Super Famicom game is the base
  cartridge, and the cartridge it describes then asks for the Game Boy, BS
  Memory or Sufami Turbo medium through its slot. Each medium comes from the
  load queue, then the command line, then a file dialog, so ares names none of
  these files. mia identifies the base cartridge by the SHA-256 of its ROM in
  the Super Famicom database, else by its header: the BANDAI SFC-ADX
  signature makes a Sufami Turbo board, serial ZBSJ a BS-X board, serial 042J
  or cartridge type 0xE3 a Super Game Boy board.
  ref: desktop-ui/emulator/super-famicom.cpp:158-217,
       desktop-ui/emulator/emulator.cpp:216-247,
       mia/medium/super-famicom.cpp:88-95, mia/medium/super-famicom.cpp:570-602

  Systems with no firmware: Arcade (Neo Geo MVS games aside), Atari 2600,
  Famicom, MyVision, PC Engine, SuperGrafx, SG-1000, SC-3000.

