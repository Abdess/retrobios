  # --- SFC subsystem ROMs (loaded as game cartridges, not firmware) ---
  - name: SGB1.sfc
    system: nintendo-snes
    required: false
    category: game_data
    description: "Super Game Boy cartridge ROM, opened as the Super Famicom game. The SGB1 boot ROM is embedded and appended when the image lacks it."
    note: >-
      Without its own boot ROM the image gets the embedded SGB1 boot ROM appended before hashing, so the database SHA-256 (4d7fc331, SYS-SGB-2) is that of the 256 KiB ROM followed by the 256-byte boot ROM.
    source_ref: "desktop-ui/emulator/super-famicom.cpp:179-187, mia/medium/super-famicom.cpp:42-62, mia/medium/super-famicom.cpp:88-95, mia/medium/super-famicom.cpp:891-895"

  - name: SGB2.sfc
    system: nintendo-snes
    required: false
    category: game_data
    description: "Super Game Boy 2 cartridge ROM, opened as the Super Famicom game. The SGB2 boot ROM is embedded and appended when the image lacks it."
    note: >-
      Identified by serial 042J or the label Super GAMEBOY2. Without its own boot ROM the image gets the embedded SGB2 boot ROM appended before hashing, so the database SHA-256 (e1db895a, SYS-SGB2-10) is that of the 512 KiB ROM followed by the 256-byte boot ROM, and the board carries its own 20971520 Hz oscillator.
    source_ref: "desktop-ui/emulator/super-famicom.cpp:179-187, mia/medium/super-famicom.cpp:42-62, mia/medium/super-famicom.cpp:88-95, mia/medium/super-famicom.cpp:590-592, mia/medium/super-famicom.cpp:891-895"

  - name: STBIOS.bin
    system: nintendo-snes
    required: false
    category: game_data
    description: "Sufami Turbo base cartridge ROM, opened as the Super Famicom game. Its two slots then ask for Sufami Turbo cartridges."
    note: >-
      Identified by the BANDAI SFC-ADX signature at offset 0, since another game shares its serial A9PJ. The database lists the 256 KiB ROM as SHVC-A9PJ-0 (SHA-256 edacb453).
    source_ref: "desktop-ui/emulator/super-famicom.cpp:199-217, mia/medium/super-famicom.cpp:570-576"

  - name: BS-X.bin
    system: nintendo-snes
    required: false
    category: game_data
    description: "Satellaview BS-X cartridge ROM, opened as the Super Famicom game. Its slot then asks for a BS Memory pack."
    note: >-
      Identified by serial ZBSJ, which gives the BS-MCC board. The database lists the 1 MiB ROM as SHVC-ZBSJ-1 (SHA-256 3ce32149).
    source_ref: "desktop-ui/emulator/super-famicom.cpp:189-197, mia/medium/super-famicom.cpp:587-589"
