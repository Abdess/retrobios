data_root:
  windows:
    path: "%USERPROFILE%/Amiberry"
    source_ref: "src/osdep/amiberry.cpp:9348-9357, src/osdep/amiberry.cpp:9405-9428, src/osdep/amiberry.cpp:13540-13577, src/osdep/amiberry.cpp:4960-4963, src/osdep/amiberry.cpp:13622"
    note: "AMIBERRY_HOME_DIR overrides it. An amiberry.portable file beside the executable makes its folder the root. rom_path and base_content_path in amiberry.conf move ROMs"
  macos:
    path: "~/Documents/Amiberry"
    source_ref: "src/osdep/amiberry.cpp:9337-9346, src/osdep/amiberry.cpp:9429-9446, src/osdep/amiberry.cpp:13540-13577, src/osdep/amiberry.cpp:4960-4963, src/osdep/amiberry.cpp:13622"
    note: "AMIBERRY_HOME_DIR overrides it. rom_path and base_content_path in amiberry.conf move ROMs"
  linux:
    path: "~/Amiberry"
    source_ref: "src/osdep/amiberry.cpp:9359-9366, src/osdep/amiberry.cpp:9447-9475, src/osdep/amiberry.cpp:13540-13613, src/osdep/amiberry.cpp:4960-4963, src/osdep/amiberry.cpp:13622"
    note: "AMIBERRY_HOME_DIR overrides it, and an amiberry.portable file beside the executable makes its folder the root. Outside portable mode WHDBoot sits in $XDG_DATA_HOME/amiberry, else ~/.local/share/amiberry. rom_path and base_content_path in amiberry.conf move ROMs"
  android:
    path: "Android/data/com.blitterstudio.amiberry/files"
    source_ref: "src/osdep/amiberry.cpp:9397-9404, src/osdep/amiberry.cpp:13540-13577, src/osdep/amiberry.cpp:4960-4963, src/osdep/amiberry.cpp:13622, android/app/build.gradle:118"
