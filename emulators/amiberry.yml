version_basis:
  kind: file
  path: "CMakeLists.txt"
  pattern: 'project\(amiberry\s+VERSION\s+([0-9][0-9.]*)'
display_name: "Commodore - Amiga (Amiberry)"
cores: [amiberry, "AMIBERRY"]
