notes: |
  Amiberry is an Amiga emulator based on WinUAE, available as both standalone
  and libretro core. No built-in kickstart: requires a real Kickstart ROM or
  external AROS replacement files (aros-ext.bin + aros-rom.bin).

  Libretro core option "amiberry_kickstart" overrides ROM selection: auto,
  kick.rom, kick13.rom, kick20.rom, kick31.rom, kick205.rom, kick40068.A1200,
  kick40068.A4000, cd32.rom, cdtv.rom. "auto" selects per model.
  ref: libretro/libretro.cpp:695,762-781

  Libretro Kickstart directory detection (in order): save_dir/Kickstarts,
  save_dir/whdboot/save-data/Kickstarts, system_dir/Kickstarts,
  system_dir/whdboot/save-data/Kickstarts,
  system_dir/amiberry/whdboot/save-data/Kickstarts,
  system_dir/save-data/Kickstarts, else system_dir. system_dir stays first
  in the ROM multipath, the detected directory follows it.
  ref: libretro/libretro.cpp:4550-4588

  Standalone ROM path: the "rom_path" setting of amiberry.conf, by default
  ROMs below the content root (~/Amiberry, or $AMIBERRY_HOME_DIR). The ROM
  scan reads the files directly in it and does not descend into its
  folders, rom.key is read beside the Kickstart and the MT-32 ROMs from its
  mt32-roms folder. The scan identifies a Kickstart by content: the
  kick*.rom, cd32 and cdtv names are the libretro build's, which looks them
  up in the system directory, and the standalone build reads the same
  images under the entries of its ROM database.
  ref: src/osdep/amiberry.cpp:8485, 13622, 4960-4963, 9359-9366,
       src/osdep/amiberry_gui.cpp:431-462, 489-490, 505-531,
       src/memory.cpp:2181, src/midiemu.cpp:119-125
  kickstart_rom_file and kickstart_ext_rom_file are opened as given, with
  no hash check. When the main ROM is not found there, the fallback order
  is {home_dir}/roms/kick.rom, {home_dir}/kick.rom, ../shared/rom/kick.rom,
  ../System/rom/kick.rom, then ROM database guess.
  ref: src/cfgfile.cpp:6742-6743, src/memory.cpp:1842-1865,
       src/memory.cpp:2115-2157

  ROM identification uses SHA1 against the WinUAE ROM database but does
  not reject unknown ROMs. Cloanto encrypted ROMs supported with rom.key.
  ref: src/rommgr.cpp:122-1110,1743-1816

  WITH_CPUBOARD is always defined, so expansion boards, freezer cartridges
  and CPU boards read their ROMs from the same database. A CPU board whose
  ROM is missing does not start, and the quickstart configs that select one
  (A1200 configs 2-5, A4000 config 2) count as not installed without it.
  ref: src/osdep/sysconfig.h:198-199, src/cpuboard.cpp:2927-2984,
  src/cfgfile.cpp:10132-10142, src/cfgfile.cpp:10379-10466,
  src/osdep/settings/settings_presets.cpp:402-419

  Munt MT-32/CM-32L emulation compiled in (WITH_MIDIEMU). ROMs loaded from
  mt32-roms/ subdirectory of the ROM path. Split ROM pairs supported
  (e.g. pcm_mt32_l.rom + pcm_mt32_h.rom).
  ref: src/midiemu.cpp:82-165

  Keyboard MCU emulation (keyboard_mode setting) loads MCU ROMs via ROM
  database scanning. Three MCU types supported: 6570-036 (A500/A600/A1000),
  68HC05 (A1200), D8039HLC (A2000).
  ref: src/kbmcu/keyboard_mcu_6500_1.cpp:385, src/kbmcu/keyboard_mcu_6805.cpp:544,
  src/kbmcu/keyboard_mcu_d8039hlc.cpp:250

  WHDLoad autoboot reads the whdboot/ directory: boot-data.zip (or a
  boot-data directory), WHDLoad or JST, host-quit, the skick346 RTB files,
  optional Amiga libraries in Libs/ and game-data/whdload_db.json with
  game-data/whdload_db.xml as fallback. The standalone build ships
  boot-data.zip, host-quit, the database and the A1000 RTB file, and
  downloads WHDLoad, JST, the skick346 RTB files and the libraries (the XPK
  set, MMULib's 68040.library, explode.library, medplayer.library) on
  request. The libretro core downloads nothing and names the missing tool in
  a message.
  ref: src/osdep/amiberry_whdbooter.cpp:1740-1742,1909-1928,1970-2025,
  src/osdep/amiberry.cpp:12383-12394, src/osdep/amiberry.cpp:12441-12529

