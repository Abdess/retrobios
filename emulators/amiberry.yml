  # --- WHDLoad booter files ---
  # Read from the WHDBoot directory when an .lha or .lzh archive is launched.
  # Amiberry carries host-quit, boot-data.zip, the game database and
  # kick31034.A1000.RTB. WHDLoad, JST, the skick346 RTB files and the Libs/
  # libraries are not in the repository: the standalone build downloads them
  # on request (Paths panel, App Settings in the native apps,
  # --download-whdboot), WHDLoad from whdload.de, the others from Aminet, and
  # refuses a skick346.lha, xpk_User.lha, explode-7.lha or OctV5_Tut4.lha whose
  # SHA-256 is not the pinned one. The libretro core downloads nothing.
  # Libretro: on first start the core copies a whdboot tree into
  # <save>/WHDBoot, taking it from system/whdboot, system/amiberry/whdboot,
  # system/Amiberry/whdboot or system itself. A candidate is used only when it
  # holds host-quit, boot-data.zip or boot-data/, the game database and
  # kick31034.A1000.RTB.
  # Standalone: the Linux, macOS and Windows installs ship the tree, and it is
  # copied into the user WHDBoot directory the same way.
  # Both builds then replace game-data/whdload_db.json with the one at the
  # first candidate when its "generated" field is later, keeping the old file
  # as a backup.
  # ref: src/osdep/amiberry.cpp:12184-12209, 13236-13267, 13293-13308,
  #      src/osdep/amiberry.cpp:13310-13376, 13378-13474,
  #      src/osdep/amiberry.cpp:12383-12394, 12956-13206,
  #      libretro/libretro.cpp:1471-1487, cmake/linux/install.cmake:196-198

  # Optional Amiga libraries for WHDLoad and its slaves, read from the
  # WHDBoot folder's Libs drawer by both builds.
  - name: "xpkmaster.library"
    path: "whdboot/Libs/xpkmaster.library"
    system: commodore-amiga
    required: false
    note: >
      XPK master library, opened by slaves that read XPK-packed data. When any file is present in whdboot/Libs, the booter mounts that
      folder as DH4: and adds it to LIBS:. The standalone download step
      extracts it from Aminet's xpk_User.lha, refused unless its SHA-256 is the pinned one (xpk_User/Libs/xpkmaster.library) while it is missing and never
      overwrites it. The libretro core downloads nothing.
    source_ref: "source src/osdep/amiberry_whdbooter.cpp:1580-1606, source src/osdep/amiberry_whdbooter.cpp:1616-1627, source src/osdep/amiberry_whdbooter.cpp:1754-1770, source src/osdep/amiberry.cpp:12451-12453, source src/osdep/amiberry.cpp:12467-12478, source src/osdep/amiberry.cpp:12894-12925, source src/osdep/amiberry.cpp:13131-13150"

  - name: "Compressors/xpkCBR0.library"
    path: "whdboot/Libs/Compressors/xpkCBR0.library"
    system: commodore-amiga
    required: false
    note: >
