notes: |
  Closed source Amstrad CPC and PLUS emulator for Windows. The build read here
  is the one RetroBat installs, capriceforever.7z sha256
  54c9f7f3df96011bdbd09e72413fed798a395c241e8c2d05eb6af075a15b79b4, release
  26.4 of 1 April 2026 (History.txt, version resource 26.4.0.0). Caprice.exe
  md5 a33e841c80e9fd9067a1c373492cd53b is a 32-bit C++Builder (RAD Studio
  28.0) VCL program, cited by virtual address. Functions are named by their
  address, or by the published method table entry for form event handlers.

  The machine ROMs are RT_RCDATA resources of the executable, byte for byte
  equal to the usual dumps: ROMCPC464_UK, ROMCPC664_UK and ROMCPC6128_UK (OS
  then BASIC, 32 KiB each), French and Spanish 464 and 6128 images,
  ROMAmsdos, ROMSiliconDisk13, ROMDKSpeech, and ROMMultiface2 (the first 8 KiB
  of MF2.rom). A slot left blank in a device file takes the built-in image,
  and the names "Default OS", "Default BASIC", "Default AMSDOS", "Default
  Multiface Two", "Default Silicon Disc 1.3" and "Default DK'Tronics Speech"
  select them explicitly.
  ref: Caprice.exe 26.4.0.0 FUN_006fa870 0x6faff6-0x6fb036 (TResourceStream
       of ROMCPC464_UK, type 0xa), 0x6fba6e-0x6fbaa9 (ROMAmsdos),
       0x6fc0fc-0x6fc109 (ROMSiliconDisk13), 0x6fc168-0x6fc18f (ROMDKSpeech),
       FUN_006fd4c0 0x6feae9-0x6feb6a (LowerROM compared to Default OS),
       0x6fde23-0x6fde70 (Default Silicon Disc, DK'Tronics, Empty and
       AMSDOS names taken for the upper slot loop), 0x6fe839-0x6fe8b7 and 0x6fef2f-0x6fef65
       (Default Multiface Two, TResourceStream of ROMMultiface2),
       FUN_0074ebe4 0x74f95c-0x74fab5 (Default OS, BASIC and AMSDOS as the
       initial slot values)

  RetroBat writes Device.ini on every launch: CPC_6128_UK, or PLUS_6128_UK for
  the gx4000 system, LowerROM and UpperROM0 blank, UpperROM7 "Default
  AMSDOS", UpperROM1 a built-in Silicon Disc or DK'Tronics image or Empty, and
  CartridgeFilename the launched .cpr. No slot it writes names a file, so
  nothing outside the program is read for a RetroBat launch.
  ref: emulatorLauncher Generators/CapriceForever.Generator.cs:277-405

  Files of 1 to 16512 bytes in RomsDirectory (Roms\ by default) are offered
  by name for the lower and upper ROM slots. A slot file whose first 128
  bytes are an AMSDOS header with a valid checksum is read from offset 128
  for its declared length, at most 16 KiB, and any other file is used as is.
  A missing file is skipped and nothing is copied into the slot. The cartridge is
  chosen through an open dialog filtered on *.cpr, and a CartridgeFilename
  without a directory is looked up in CartridgesDirectory (Cartridges\ by
  default). A RIFF AMS! file is split by its cb chunks into 16 KiB banks,
  any other file into consecutive 16 KiB banks. The package ships four ROMs
  and three PLUS system cartridges there. Only the bundled device template
  "PLUS 6128 UK.ini" names one of them (the UK cartridge), and RetroBat
  replaces that choice with the launched game.
  ref: Caprice.exe 26.4.0.0 FUN_0074ebe4 0x74f621 (Roms\ default),
       FUN_0072483c 0x740f0f-0x740f35 (Roms\ when the configured folder is
       missing), 0x73e0b5 (RomsDirectory key), 0x73e481 (CartridgesDirectory
       key), FUN_0059fc34 0x5a0e55-0x5a0ef5 (size filter),
       FUN_007000f8 0x7001e6-0x700274 (AMSDOS header),
       FUN_0071c58c 0x71ca9d-0x71cb48 (cartridge parsing)

