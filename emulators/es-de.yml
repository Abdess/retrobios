notes: |
  Game browsing frontend. Reads es_systems.xml and es_find_rules.xml from its
  bundled resources (SystemData.cpp:1346-1359, SystemData.cpp:53-72) to locate
  installed emulators and build launch commands, then runs them as subprocesses.
  All other reads are bundled resources (fonts, graphics, shaders, sounds,
  MAME name lists in MameNames.cpp:56-80, TLS bundle in HttpReq.cpp:74),
  app-generated data (es_settings.xml, es_input.xml, gamelists, scraped media,
  themes fetched by the built-in downloader) or optional user-authored config
  (custom_systems/, scripts/). Performs no BIOS handling; the only BIOS-related
  code filters MAME BIOS set names out of gamelists (FileData.cpp:572-580).
  RetroDECK ships it as its frontend component, built from the RetroDECK/ES-DE
  fork and repackaged from the AppImage.

