notes: |
  The core of libretro/mame2015-libretro as it stood before the repository
  and the core were renamed MAME 2015 (commit 3e77b40c, 2019-01-19). RetroBat
  ships mame2014_libretro.dll from its own core repository, a build that
  reports library_version "0.160 c8fe6c7" and library_name "MAME 2014", so
  this profile reads the tree at c8fe6c7.

  Same MAME 0.159 code as mame2015 (version.c): between c8fe6c7 and the mame2015 pin no
  driver ROM definition, romload.c or hiscore.c changes. What differs is the
  directory name. libretro_shared.h sets core to "mame2014", and
  Set_Path_Option builds samples, artwork, cheat, ini and hash under
  system_dir/mame2014/ (cfg, nvram, hi, input, states, snaps, diff under
  save_dir/mame2014/). The rom path is the content folder only (-rompath
  MgamePath, src/osd/retro/retromain.c:1851-1856, and -rp g_rom_dir for a
  .cmd file, retromain.c:2071-2072), so BIOS root sets sit beside the
  games. 69 BIOS root sets.

  hiscore.dat is opened by emu_file("hiscore", ".dat") with no search path
  (the libretro path code is under #if 0), so it is read from the working
  directory of the frontend.

files:
  # Data files
  - name: hiscore.dat
    load_from: working_directory
    required: false
    category: game_data
    system: arcade
    sha1: "68e94fb579f46f3255ef7c34c0322f3f0f3c8e20"
    md5: "7e31f0b84f6ea6f9ffec0cd968decf9f"
    size: 216250
    source_ref: "source src/emu/hiscore.c:122-138, 330-338, source src/emu/machine.c:346-347"
    note: >-
      high score definitions, external file, not embedded. metadata/hiscore.dat of the core repository. Opened by
      emu_file with no search path, so from the working directory of the frontend. is_mem_range reads only
      "cpu:addr:len:start:end" lines under a "gamename:" header.

