emulator: "Chocolate Doom"
type: standalone
core_classification: game_engine
source: "https://github.com/chocolate-doom/chocolate-doom"
profiled_date: "2026-10-22"
source_commit: "72d9e9318c4ccc61dab29bb9cc30bc8a9a93266d"
pin_frozen: "EmuELEC, the only platform that ships it, builds this revision (EmuELEC packages/sx05re/emuelec-ports/chocolate-doom/package.mk:5). Later commits are not part of that build."
pin_build:
  - platform: emuelec
    repo: "https://github.com/EmuELEC/EmuELEC"
    revision: "v4.8"
    path: "packages/sx05re/emuelec-ports/chocolate-doom/package.mk"
    variable: PKG_VERSION
    value: "72d9e9318c4ccc61dab29bb9cc30bc8a9a93266d"
core_version: "3.0.0"
version_basis:
  kind: file
  path: "configure.ac"
  pattern: 'AC_INIT\(Chocolate\s+Doom,\s+([0-9][\w.+-]*)'
display_name: "Doom (Chocolate Doom)"
cores:
  - "Chocolate-Doom"
  - "chocolate-doom"
systems: [doom, heretic, hexen, strife, chex]

data_root:
  macos:
    path: "~/Library/Application Support/chocolate-doom"
    source_ref: "src/m_config.c:2528-2549"
  linux:
    path: "$XDG_DATA_HOME/chocolate-doom"
    source_ref: "src/m_config.c:2528-2549"
    note: "~/.local/share/chocolate-doom when XDG_DATA_HOME is unset (SDL_GetPrefPath)"

notes: |
  Simon Howard's Doom source port that reproduces the DOS executables. One
  tree builds four programs, chocolate-doom, chocolate-heretic,
  chocolate-hexen and chocolate-strife, each accepting only the IWADs of its
  own game: the Doom program takes Doom, Doom II, Final Doom, Chex Quest and
  Hacx, and every program refuses an IWAD carrying a sprite unique to another
  game. EmuELEC builds this revision, launches chocolate-doom -iwad <file> for
  a .wad, and for a .doom file picks the program from its GAMETYPE key.
  ref: src/d_iwad.h:24-32, src/w_main.c:233-262,
       EmuELEC packages/sx05re/emuelec-ports/chocolate-doom/package.mk:5,
       EmuELEC packages/sx05re/emuelec-ports/chocolate-doom/scripts/chocodoom.sh:29-66

  -iwad is looked for as given, then by name on the search path, and a name
  outside the table leaves the mission undetermined. Without -iwad, each
  directory of the search path is scanned for the names of the table in
  order: the working directory, the executable's directory, $DOOMWADDIR, the
  entries of $DOOMWADPATH, then the XDG data directories and Steam install
  paths. Nothing found stops startup with "Game mode indeterminate". No hash
  of any IWAD is read.
  ref: src/d_iwad.c:34-52, src/d_iwad.c:567-594, src/d_iwad.c:732-783,
       src/d_iwad.c:870-913, src/doom/d_main.c:1488-1496

  The Freedoom IWADs and Hacx carry their own DEHACKED lump. Chex Quest and the
  French Doom II need a separate dehacked patch, looked for beside the IWAD,
  then on the search path. Without it the Doom program stops. Strife loads
  voices.wad from beside the IWAD or the search path when present, and
  disables voices otherwise.
  ref: src/doom/d_main.c:1178-1184, src/doom/d_main.c:1188-1206,
       src/doom/d_main.c:1210-1241, src/doom/d_main.c:1244-1278,
       src/strife/d_main.c:844-885

  Music plays through the OPL emulation by default, which takes its
  instruments from the GENMIDI lump of the IWAD. EmuELEC's configuration
  selects the SDL MIDI device instead and points timidity_cfg_path at
  /storage/.config/timidity/timidity.cfg. gus_patch_path and the music pack
  directory hold user supplied sets with no canonical artifact.
  ref: src/i_sound.c:55, src/i_sound.c:504-506, src/i_sdlmusic.c:56-80,
       EmuELEC packages/sx05re/emuelec-ports/chocolate-doom/config/chocolate-doom.cfg:27-29

  Configuration files and saves go to the data root, the executable's directory
  on Windows. music_pack_path defaults to music-packs in the SDL preference
  folder, the data root outside Windows and %APPDATA%/chocolate-doom on Windows.
  ref: src/m_config.c:2528-2578, src/m_config.c:2588-2611

