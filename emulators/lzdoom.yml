emulator: LZDoom
type: standalone
core_classification: game_engine
source: "https://github.com/drfrag666/lzdoom"
profiled_date: "2026-10-20"
source_commit: "4ce19a12164ebd6802b7fb2f94d700a6e736d0fb"
pin_frozen: "The platforms that ship it run the 3.88 line: RetroPie builds tag 3.88b (RetroPie scriptmodules/ports/lzdoom.sh:15) and AmberELEC a fork of the g3.3mgw branch that still reports 3.88b (AmberELEC packages/games/emulators/lzdoom/package.mk:5). The l4.x releases are a GZDoom 4 based line that no platform ships."
pin_build:
  - platform: retropie
    repo: "https://github.com/RetroPie/RetroPie-Setup"
    revision: "46128cd252cdecae852a4d0bafa2aaf9d03ab563"
    path: "scriptmodules/ports/lzdoom.sh"
    variable: rp_module_repo
    value: "git https://github.com/drfrag666/gzdoom 3.88b"
  - platform: amberelec
    repo: "https://github.com/AmberELEC/AmberELEC"
    revision: "a21975bfb1a3af68f66e07a931b994b523e1e6e2"
    path: "packages/games/emulators/lzdoom/package.mk"
    variable: PKG_VERSION
    value: "8e12e62164ea1ba52625c63bc0f1c9e0076bff4c"
core_version: "3.88b"
version_basis:
  kind: tag
  tag: "3.88b"
  distance: 0
display_name: "LZDoom"
cores: [lzdoom, "LZDoom"]
systems: [doom, heretic, hexen, strife, chex]

data_root:
  linux:
    path: "~/.config/lzdoom"
    source_ref: "src/posix/unix/i_specialpaths.cpp:44-99, src/version.h:100-104"
    note: "created on first run, and the first directory of the default FileSearch and IWADSearch lists"

notes: |
  Legacy branch of GZDoom 3.x maintained by drfrag for older GPUs and
  OpenGL 2 hardware, built as lzdoom. The profiled revision is tag 3.88b,
  the one RetroPie builds. version.h names the engine resources: BASEWAD
  lzdoom.pk3 and OPTIONALWAD game_support.pk3 (src/version.h:90-91).

  Engine resources (built from the wadsrc directories by add_pk3):
    lzdoom.pk3        searched first in the program directory, fatal
                      "Cannot find lzdoom.pk3" when absent
                      ref: src/d_main.cpp:2530-2534, wadsrc/CMakeLists.txt:3
    game_support.pk3  loaded after lzdoom.pk3 when found
                      ref: src/d_main.cpp:2537, src/d_iwad.cpp:757-763
    lights.pk3        autoloadlights, false by default
    brightmaps.pk3    autoloadbrightmaps, false by default
                      ref: src/d_main.cpp:228-229, 2164-2178
  A GAMEINFO lump can switch the last two on. Neither is read for a
  shareware IWAD. game_widescreen_gfx.pk3 and game_conpics_gfx.pk3 are
  looked up too, both on by default (src/d_main.cpp:230-231, 2179-2190),
  but no wadsrc directory of this tree builds them.

  BaseFileSearch tries the program directory first for these files, then
  the name as given, then the FileSearch.Directories of the configuration
  (src/d_main.cpp:1793-1830). On Linux those default to $HOME/.config/lzdoom,
  SHARE_DIR, /usr/local/share/doom, /usr/local/share/games/doom,
  /usr/share/doom, /usr/share/games/doom and $DOOMWADDIR
  (src/gameconfigfile.cpp:153-172).

  Game data is a user-supplied IWAD. iwadinfo.txt declares each known IWAD
  with the lumps it must contain, its file name and the support files it
  loads. Each IWADSearch directory (".", $DOOMWADDIR, $HOME/.config/lzdoom
  and the four share directories on Linux, src/gameconfigfile.cpp:126-149)
  is scanned for the names of the Names block and for any .iwad, .ipk3 or
  .ipk7 file, and each candidate is identified by its lumps, not by its name
  (src/d_iwad.cpp:319-367, 466-499, 509-527). The Names block also lists
  doomu.wad, bfgdoom2.wad, doom2bfg.wad, bfgdoom.wad, doombfg.wad,
  doomxbox.wad, doom2xbox.wad, tntunity.wad, plutoniaunity.wad,
  freedoomu.wad, freedoom.wad, hereticsr.wad, hexendemo.wad, hexdemo.wad,
  strife0.wad, strife.wad and blasphem.wad
  (wadsrc_extra/static/iwadinfo.txt:568-618). -iwad adds the named file,
  trying .wad, .pk3, .iwad, .ipk3 and .ipk7 when it has no extension, and
  the first usable one wins (src/d_iwad.cpp:566-602, 638-650). An IWAD that
  declares Required is dropped unless the IWAD it names was found, and Load
  files are read from the IWAD's own directory (src/d_iwad.cpp:610-635,
  772-788). Startup stops with "Cannot find a game IWAD" when nothing is
  identified (src/d_iwad.cpp:693-696). No hash is read.

  MIDI music goes through FluidSynth with fluid_patchset "lzdoom"
  (src/sound/music/music_config.cpp:118). The soundfont manager reads every
  file of SoundfontSearch.Directories, keeping SF2, WOPL, WOPN and zipped
  GUS patch sets by their header, and falls back to
  $PROGDIR/soundfonts/lzdoom.sf2 when it found none
  (src/gameconfigfile.cpp:175-202, src/sound/music/i_soundfont.cpp:330-380,
  428-431). The OPL and OPN banks are read only with adl_use_custom_bank or
  opn_use_custom_bank, off by default (src/sound/music/music_config.cpp:92-99,
  253-260).

  RetroPie installs lzdoom.pk3, game_support.pk3, lights.pk3, brightmaps.pk3
  and soundfonts/ beside the binary, leaves fm_banks/ out, and launches
  "lzdoom -iwad <file>" with DOOMWADDIR set to its ports/doom directory, into
  which it downloads doom1.wad and the Freedoom 0.13.0 IWADs.

