emulator: Altirra
type: standalone
core_classification: embedded_hle
source: "https://www.virtualdub.org/altirra.html"
upstream: "https://www.virtualdub.org/altirra.html"
profiled_date: "2026-08-11"
core_version: "4.40"
display_name: "Atari - 400/800/1200XL/XL/XE/XEGS/5200 (Altirra)"
cores: [altirra]
systems: [atari-400-800, xegs, atari-5200]

# Altirra emulates the Atari 400/800, 1200XL, 600XL/800XL, 130XE, XEGS and 5200.
# Windows only; ES-DE launches Altirra64.exe or Altirra.exe.
#
# Firmware is identified by content, never by filename. ATUIScanForFirmware
# (uifirmwarescan.cpp:29-113) walks a folder the user picks, keeps every file whose
# size is one of 1024, 2048, 4096, 6144, 8192, 10240, 16384, 32768 or 65536
# (ATFirmwareAutodetectCheckSize, firmwaredetect.cpp:130-150), then matches CRC32
# against kATKnownFirmwares (firmwaredetect.cpp:24-121). A recognised image is
# registered by path under Firmware\Available (ATFirmwareManager::AddFirmware,
# firmwaremanager.cpp:765-781) and read back from that path afterwards. Images the
# table does not know are added by hand with an explicit type from the menu in
# uifirmware.cpp:498-585. No code path opens a firmware file by name, so no entry
# below carries aliases.
#
# Every external image is optional. Altirra links replacement ROMs into the binary
# as resources (ATLoadInternalFirmware, firmwaremanager.cpp:189-295; res/Altirra.rc:4260-4292)
# and GetCompatibleFirmware selects them when nothing is registered
# (firmwaremanager.cpp:502-549). The setup wizard states it: "Altirra has internal
# replacements for all standard ROMs" (uisetupwizard.cpp:134-138). The internal set
# covers the 400/800, XL/XE, 65C816 and 5200 kernels, BASIC, the Ultimate1MB recovery
# BIOS, the Rapidus bootstrap, the 1030 download image and the 1090 charset. NoKernel,
# No5200, NoMIO, NoBlackBox and NoGame are empty placeholders the loader reports as
# unusable (firmwaremanager.cpp:218-233), so those types have no fallback.
#
# Images the detect table does not cover carry max_size rather than size: LoadFirmware
# reads at most the buffer length and leaves the remainder at its fill value
# (firmwaremanager.cpp:674-763), so a shorter dump is accepted.
#
# The 850 relocator and handler load only from internal resources (rs232.cpp:995-996);
# kATFirmwareType_MyIDE and kATFirmwareType_5200Cartridge have no consumer anywhere in
# the tree. None of the three is a user-supplied file.

