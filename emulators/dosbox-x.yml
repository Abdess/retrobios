  # -- PC-98 sound board BIOS --

  - name: "SOUND.ROM"
    description: "PC-9801-26K/86 FM board BIOS"
    required: false
    system: pc-98
    hle_fallback: true
    min_size: 16384
    validation: [size]
    note: >
      16 KB read into CC000h from the working directory only, when
      pc-98 sound bios and pc-98 load sound bios rom file are both set
    source_ref: "src/hardware/pc98_fm.cpp:367-385, src/dosbox.cpp:2399-2406"

  # -- Video BIOS ROM images --
  # Loaded in place of the built-in INT 10h when vga bios use rom image is set.
  # The name comes from vga bios rom image, or from the machine type when that
  # setting is empty.

  - name: "et4000.bin"
    description: "Tseng ET4000 video BIOS"
    required: false
    system: ibm-pc
    min_size: 1024
    max_size: 65536
    validation: [size]
    note: "default file name for machine = svga_et4000"
    source_ref: "src/dosbox.cpp:943-994, src/dosbox.cpp:2766-2777"

  - name: "TRIO64 (Ver. 1.5-07) [VGA] (S3 Incorporated).bin"
    description: "S3 Trio64 video BIOS"
    sha1: "a308b15f93da34961c0141ec95b98c211557e2d5"
    required: false
    system: ibm-pc
    aliases: ["86c764x1.bin"]
    min_size: 1024
    max_size: 65536
    validation: [size]
    note: "default file name for machine = svga_s3"
    source_ref: "src/dosbox.cpp:951-953, src/dosbox.cpp:2766-2777"

  - name: "ibm-vga.bin"
    description: "IBM VGA option ROM of 10/27/86, laid out as mapped at C000:0"
    sha1: "dce6491424f1726203776dfae9a967a98a4ba7b5"
    required: false
    system: ibm-pc
    min_size: 16384
    max_size: 32768
    validation: [size]
    note: >
      read by LOADROM.COM from a mounted local drive, accepted when the file
      starts with 55 AA, byte 3 masked with 0xFC equals 0xE8 and the string IBM
      appears at offset 0x1E, and the machine is EGA or better
    source_ref: "src/dos/dos_programs.cpp:3606-3632, src/dos/dos_programs.cpp:3643-3649"

  # -- IBM ROM BASIC --

  - name: "IBMROMBASIC-F6000h-1982-10-27.ROM"
    description: "IBM 5150 Cassette BASIC ROM"
    aliases: ["ibm-basic-1.10.rom"]
    sha1: "07449ebca18f979b9ab748582b736e402f2bf940"
    required: false
    system: ibm-pc
    min_size: 32768
    max_size: 65536
    validation: [size]
    note: >
      the ibm rom basic setting maps it just below the ROM BIOS and accepts
      32 KB to 64 KB in 4 KB steps. LOADROM.COM maps the same image at F600:0
      when it is exactly 32768 bytes, starts with E9 8F 7E and carries the
      string IBM at offset 0x4CD4
    source_ref: "src/ints/bios.cpp:13243-13263, src/dos/dos_programs.cpp:3633-3637, src/dosbox.cpp:1948-1950"

  # -- PCjr --

  - name: "system.rom"
    description: "IBM PCjr system ROM"
    sha1: "1f5f7013f18c08ff50d7942e76c4fbd782412414"
    required: false
    system: ibm-pcjr
    min_size: 57344
    validation: [size]
    note: >
      read during PCjr cartridge boot, which runs when machine is pcjr, and bytes
      0x3000 to 0xDFFF are copied to physical F3000. A short read leaves the
      region untouched and the cartridge still boots
    source_ref: "src/dos/dos_programs.cpp:2995-2996, src/dos/dos_programs.cpp:3079-3088"

  # -- Whole system BIOS images --

  - name: "System BIOS image"
    description: "PC/AT or PC-98 BIOS ROM image booted by BOOT -bios"
    required: false
    unsourceable: "any BIOS image the user names with BOOT -bios, no canonical file"
    note: >
      loaded at the top of the first megabyte, rounded up to a paragraph and
      truncated to 128 KB, or to 96 KB on PC-98, and a larger image is clamped
      rather than rejected
    source_ref: "src/dos/dos_programs.cpp:2261-2311"

  - name: "ITF.ROM"
    description: "PC-98 Initial Firmware Test BIOS"
    required: false
    system: pc-98
    max_size: 32768
    validation: [size]
    note: >
      served through the port 43Dh bank switch alongside a BOOT -bios image.
      <image>.itf.rom is tried before the bare name so one directory can hold
      several
    source_ref: "src/dos/dos_programs.cpp:2313-2344"
