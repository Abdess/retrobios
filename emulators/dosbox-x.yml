  - name: "SarasaGothicFixed.ttf"
    description: "CJK fixed-width TrueType font"
    required: false
    system: dos
    bundled: true
    sha1: "2a15dfa682df1ff841e2092348aa6a2460e40810"
    md5: "5b5dd2bc68764c7204dc4fe69118f2a4"
    hle_fallback: true
    note: >
      tried by the TTF output on PC-98 and on double-byte code pages when
      ttf.font is unset, and by the printer when the selected typeface file is
      missing. Ships in the resource directory
    source_ref: "src/output/output_ttf.cpp:655-668, src/hardware/parport/printer.cpp:354-380, src/Makefile.am:21"

  - name: "Nouveau_IBM.ttf"
    description: "IBM VGA style TrueType font"
    required: false
    system: dos
    bundled: true
    sha1: "5f91e42aed6cbc7db7197181a378b4e4e2a41b6f"
    md5: "af3bd30eb752a50f47811c699aded99f"
    size: 69540
    hle_fallback: true
    note: >
      read by the TTF output when ttf.font is Nouveau_IBM, the value the Windows
      installer writes when its Nouveau IBM font option is picked. The name is
      tried with .ttf appended, then as given, through the same directories as
      any ttf.font. Without it the built-in font is used. Ships in the resource
      directory
    source_ref: "src/output/output_ttf.cpp:318-386, src/output/output_ttf.cpp:663-668, src/Makefile.am:20, contrib/windows/installer/DOSBox-X-installer.iss:113, contrib/windows/installer/DOSBox-X-installer.iss:907-908"

  # -- Printer typefaces --
