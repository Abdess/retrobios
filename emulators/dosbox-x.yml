  # -- FluidSynth SoundFont --

  - name: "default.sf2"
    description: "General MIDI SoundFont"
    required: false
    aliases:
      - "FluidR3_GM.sf2"
      - "GeneralUser_GS.sf2"
    note: >
      any SF2 or SF3 file loads; fluid.soundfont names it and
      fluid_synth_sfload is the only check
    source_ref: "src/gui/midi_synth.h:346-384, src/gui/midi_synth.h:462-473, src/dosbox.cpp:3710"

  # -- PC-98 character generator --

  - name: "FONT.ROM"
    description: "PC-98 character generator ROM, T98Tools layout"
    required: false
    hle_fallback: true
    size: 288768
    validation: [size]
    note: >
      256 8x8 cells at 0x0, 256 8x16 cells at 0x800, 96 by 92 16x16 cells at
      0x1800; a file of any other length is rejected. Enabled by
      pc-98 try font rom, on by default
    source_ref: "src/ints/int10.cpp:1487-1549, src/dosbox.cpp:2477-2478"

  - name: "ANEX86.BMP"
    description: "PC-98 character generator, Anex86 bitmap"
    required: false
    hle_fallback: true
    note: >
      2048 by 2048 monochrome Windows bitmap, biSize 40, one plane, one bit per
      pixel, no compression, inverse colour scheme; the first row is the 8x16
      single-width set and the rest is 16x16 full-width. Also reachable through
      the pc-98 anex86 font setting, which is tried before FONT.ROM
    source_ref: "src/ints/int10.cpp:1555-1647, src/dosbox.cpp:2481-2484"

  - name: "FREECG98.BMP"
    description: "PC-98 character generator, free generated bitmap"
    required: false
    hle_fallback: true
    note: >
      same bitmap layout as ANEX86.BMP and tried after it; ships in the resource
      directory
    source_ref: "src/ints/int10.cpp:1577-1580, src/Makefile.am:17"

  # -- CJK bitmap fonts --
  # Read when the guest code page is 936, 949, 950 or 951 and a character has no
  # equivalent in the built-in Japanese font. The .pcf form of each name is
  # tried after the .bdf form.

  - name: "wqy_12pt.bdf"
    description: "WenQuanYi 16-pixel bitmap font"
    required: false
    aliases: ["wqy_12pt.pcf"]
    note: "ships in the resource directory"
    source_ref: "src/ints/int_dosv.cpp:1197-1218, src/Makefile.am:19"

  - name: "wqy_11pt.bdf"
    description: "WenQuanYi 14-pixel bitmap font"
    required: false
    aliases: ["wqy_11pt.pcf"]
    note: "ships in the resource directory"
    source_ref: "src/ints/int_dosv.cpp:1296-1316, src/Makefile.am:18"

  - name: "SarasaGothicFixed.ttf"
    description: "CJK fixed-width TrueType font"
    required: false
    hle_fallback: true
    note: >
      tried by the TTF output on PC-98 and on double-byte code pages when
      ttf.font is unset, and by the printer when the selected typeface file is
      missing; ships in the resource directory
    source_ref: "src/output/output_ttf.cpp:655-668, src/hardware/parport/printer.cpp:354-380, src/Makefile.am:21"

  # -- Printer typefaces --
  # Read from the directory named by the printer fontpath setting, default
  # FONTS, then from the configuration, resource and program directories.
  # FT_New_Face is the only check.

  - name: "roman.ttf"
    path: "FONTS/roman.ttf"
    description: "Printer Roman typeface"
    required: false
    note: "also the fallback typeface for any unmapped LQ selection"
    source_ref: "src/hardware/parport/printer.cpp:320-321, src/hardware/parport/printer.cpp:336-337, src/dosbox.cpp:4597"

  - name: "sansserif.ttf"
    path: "FONTS/sansserif.ttf"
    description: "Printer Sans Serif typeface"
    required: false
    source_ref: "src/hardware/parport/printer.cpp:323-324, src/dosbox.cpp:4597"

  - name: "courier.ttf"
    path: "FONTS/courier.ttf"
    description: "Printer Courier typeface"
    required: false
    source_ref: "src/hardware/parport/printer.cpp:326-327, src/dosbox.cpp:4597"

  - name: "script.ttf"
    path: "FONTS/script.ttf"
    description: "Printer Script typeface"
    required: false
    source_ref: "src/hardware/parport/printer.cpp:329-330, src/dosbox.cpp:4597"

  - name: "ocra.ttf"
    path: "FONTS/ocra.ttf"
    description: "Printer OCR-A typeface"
    required: false
    note: "serves both the OCR-A and OCR-B selections"
    source_ref: "src/hardware/parport/printer.cpp:332-334, src/dosbox.cpp:4597"

  # -- PC-98 sound board BIOS --

  - name: "SOUND.ROM"
    description: "PC-9801-26K/86 FM board BIOS"
    required: false
    hle_fallback: true
    min_size: 16384
    validation: [size]
    note: >
      16 KB read into CC000h from the working directory only, when
      pc-98 sound bios and pc-98 load sound bios rom file are both set
    source_ref: "src/hardware/pc98_fm.cpp:367-385, src/dosbox.cpp:2378-2386"

  # -- Video BIOS ROM images --
  # Loaded in place of the built-in INT 10h when vga bios use rom image is set.
  # The name comes from vga bios rom image, or from the machine type when that
  # setting is empty.

  - name: "et4000.bin"
    description: "Tseng ET4000 video BIOS"
    required: false
    min_size: 1024
    max_size: 65536
    validation: [size]
    note: "default file name for machine = svga_et4000"
    source_ref: "src/dosbox.cpp:938-982, src/dosbox.cpp:2745-2757"

  - name: "TRIO64 (Ver. 1.5-07) [VGA] (S3 Incorporated).bin"
    description: "S3 Trio64 video BIOS"
    required: false
    min_size: 1024
    max_size: 65536
    validation: [size]
    note: "default file name for machine = svga_s3"
    source_ref: "src/dosbox.cpp:943-945, src/dosbox.cpp:2745-2757"

  - name: "Video BIOS option ROM"
    description: "Option ROM image mapped at C000:0 and initialised"
    required: false
    min_size: 16384
    max_size: 32768
    validation: [size]
    note: >
      read by LOADROM.COM from a mounted local drive; accepted when the file
      starts with 55 AA, byte 3 masked with 0xFC equals 0xE8 and the string IBM
      appears at offset 0x1E, and the machine is EGA or better
    source_ref: "src/dos/dos_programs.cpp:3523-3549, src/dos/dos_programs.cpp:3560-3565"

  # -- IBM ROM BASIC --

  - name: "IBMROMBASIC-F6000h-1982-10-27.ROM"
    description: "IBM 5150 Cassette BASIC ROM"
    required: false
    min_size: 32768
    max_size: 65536
    validation: [size]
    note: >
      the ibm rom basic setting maps it just below the ROM BIOS and accepts
      32 KB to 64 KB in 4 KB steps; LOADROM.COM maps the same image at F600:0
      when it is exactly 32768 bytes, starts with E9 8F 7E and carries the
      string IBM at offset 0x4CD4
    source_ref: "src/ints/bios.cpp:13074-13094, src/dos/dos_programs.cpp:3550-3554, src/dosbox.cpp:1931-1933"

  # -- PCjr --

  - name: "system.rom"
    description: "IBM PCjr system ROM"
    required: false
    min_size: 57344
    validation: [size]
    note: >
      read during PCjr cartridge boot; bytes 0x3000 to 0xDFFF are copied to
      physical F3000. A short read leaves the region untouched and the cartridge
      still boots
    source_ref: "src/dos/dos_programs.cpp:3061-3070"

  # -- Whole system BIOS images --

  - name: "System BIOS image"
    description: "PC/AT or PC-98 BIOS ROM image booted by BOOT -bios"
    required: false
    note: >
      loaded at the top of the first megabyte, rounded up to a paragraph and
      truncated to 128 KB, or to 96 KB on PC-98; a larger image is clamped
      rather than rejected
    source_ref: "src/dos/dos_programs.cpp:2244-2293"

  - name: "ITF.ROM"
    description: "PC-98 Initial Firmware Test BIOS"
    required: false
    max_size: 32768
    validation: [size]
    note: >
      served through the port 43Dh bank switch alongside a BOOT -bios image;
      <image>.itf.rom is tried before the bare name so one directory can hold
      several
    source_ref: "src/dos/dos_programs.cpp:2295-2326"
