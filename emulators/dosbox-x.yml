    required: false
    system: dos
    bundled: true
    sha1: ["fefcb49cb13ea191d2c87b406c141a957020432c", "2f7b4de77e5d768f979989e2d127b1fded207cf8"]
    md5: ["77b5b2d0c1c3a4200a9cda047f74f957", "fa0dfab6dd87e09060e5d6a44d43fef3"]
    aliases: ["wqy_12pt.pcf"]
    note: "Ships in the resource directory, with CRLF line ends in the Windows zips."
    source_ref: "src/ints/int_dosv.cpp:1197-1218, src/Makefile.am:19"

  - name: "wqy_11pt.bdf"
    description: "WenQuanYi 14-pixel bitmap font"
