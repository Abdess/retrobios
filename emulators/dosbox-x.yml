emulator: DOSBox-X
type: standalone
core_classification: enhanced_fork
source: "https://github.com/joncampbell123/dosbox-x"
upstream: "https://github.com/joncampbell123/dosbox-x"
source_commit: "997f616e0886a835fc3660f2b935688f17f20d42"
profiled_date: "2026-09-17"
core_version: "2026.10.01"
version_basis:
  kind: file
  path: "configure.ac"
  pattern: 'AC_INIT\(dosbox-x,\s*([0-9.]+)'
display_name: "DOS (DOSBox-X)"
cores:
  - dosbox-x
  - dosboxx
systems:
  - dos
  - ibm-pc
  - ibm-pcjr
  - tandy-1000
  - pc-98
mode: standalone

data_root:
  windows:
    path: "%LOCALAPPDATA%/DOSBox-X"
    source_ref: "src/misc/cross.cpp:102-126, 197-230"
  macos:
    path: "~/Library/Preferences"
    source_ref: "src/misc/cross.cpp:197-230"
  linux:
    path: "$XDG_CONFIG_HOME/dosbox-x"
    source_ref: "src/misc/cross.cpp:197-230"
    note: "~/.config/dosbox-x when XDG_CONFIG_HOME is unset or not absolute"

notes: |
  Fork of DOSBox SVN with its own DOS kernel. The machine setting picks the
  emulated hardware: mda, cga and its composite variants, hercules,
  hercules_plus, hercules_incolor, hercules_color, tandy, pcjr, amstrad,
  olivetti/m24/att6300, pc3270, ega, ega200, jega, mcga, vgaonly, the S3,
  Tseng, Paradise and ATI SVGA cards, the vesa variants, and pc98/pc9801/pc9821.
  fm_towns is marked STUB in the same list.
  ref: src/dosbox.cpp:1537-1577

  No system BIOS: the PC BIOS, VGA BIOS, video fonts, keyboard layouts, codepage
  tables, the Z: drive utilities including GLIDE2X.OVL, and the TTF text font are
  compiled in.
  ref: int10_memory.cpp, dos_keyboard_layout_data.h, dos_codepages.h,
       src/builtin/glide2x.cpp:2861, src/output/output_ttf.cpp:664

  Files named without a directory are searched in the working directory, the
  program directory, the user configuration directory and the resource
  directory. On Linux the configuration directory is $XDG_CONFIG_HOME/dosbox-x
  or ~/.config/dosbox-x, and the resource directory is $APPDIR/usr/share/dosbox-x
  inside an AppImage, otherwise $XDG_DATA_HOME/dosbox-x, then
  /usr/local/share/dosbox-x, then /usr/share/dosbox-x. The Windows resource
  directory is C:\DOSBox-X.
  ref: src/ints/int10.cpp:1442-1485, src/misc/cross.cpp:129-194, 197-230

  Configuration: -conf and -userconf name the files to read. Otherwise
  dosbox-x.conf then dosbox.conf is tried in the working directory, then in the
  program directory, then in the configuration directory, which is last tried
  for dosbox-x-<version>.conf. That file is written with the defaults when it
  does not exist.
  ref: src/gui/sdlmain.cpp:8671-8747, src/misc/cross.cpp:233-249

  MT-32: libmt32emu is built from src/libs/mt32. Only four file names are ever
  opened, and each candidate is identified by exact file size then SHA1, so the
  name says nothing about the contents. addROMFile matches against the full
  image list only, which rejects the interleaved chip dumps.
  ref: src/gui/midi_mt32.h:74-109, src/libs/mt32/c_interface/c_interface.cpp:442-462, src/libs/mt32/ROMInfo.cpp:206-215
  mt32.model = auto opens CM32L_CONTROL.ROM then MT32_CONTROL.ROM, and
  CM32L_PCM.ROM then MT32_PCM.ROM. cm32l keeps only the CM32L names, mt32 only
  the MT32 names. The directory is mt32.romdir, then the working directory, then
  the resource directory, then the configuration directory. A missing pair logs
  the accepted file names and disables the device.
  ref: src/gui/midi_mt32.h:246-275, src/dosbox.cpp:3605-3615

  FluidSynth reads fluid.soundfont, and fluid_synth_sfload is the only check.
  Find_SoundFont tries default.sf2, FluidR3_GM.sf2, GeneralUser_GS.sf2 and
  GeneralUser-GS.sf2, after the name fluid.soundfont gives when it has no
  directory, in the working directory, the resource directory, the program
  directory, then C:\soundfonts and C:\DOSBox-X on Windows, /usr/share/soundfonts
  and /usr/share/sounds/sf2 elsewhere, and /Library/Audio/Sounds/Banks and
  ~/Library/Audio/Sounds/Banks on macOS. The first name found in a directory
  is kept, and a later directory holding one replaces it. The synth device
  searches the same way.
  ref: src/gui/midi_synth.h:82-134, 228-242, 383-399, 478-496

  PC-98 character generator, tried in order: FONT.ROM as generated by T98Tools,
  then the FONTX2 files named by pc-98 fontx sbcs and pc-98 fontx dbcs, then the
  file named by pc-98 anex86 font or ANEX86.BMP followed by FREECG98.BMP, then
  the built-in FREECG single-byte font and the built-in Japanese double-byte
  font. Each stage fills only what the previous one left empty.
  ref: src/ints/int10.cpp:1882-1893, 1652-1675

  PC-98 sound board BIOS: with pc-98 sound bios set, SOUND.ROM is read from the
  working directory into CC000h. Without it a callback Sound BIOS is installed
  at CEE0:0000 answering INT D2h.
  ref: src/hardware/pc98_fm.cpp:367-385, 416-434

  DOS/V and CJK text: fontxsbcs, fontxsbcs16, fontxsbcs24, fontxdbcs,
  fontxdbcs14 and fontxdbcs24 name font files. LoadFontxFile reads a FONTX2
  header, otherwise tries BDF and PCF, otherwise accepts a raw bitmap font
  identified by its size, which covers ASC16 and ASCFONT.15 from UCDOS and ETen
  Chinese DOS, ASC24, HZK14, HZK16, HZK24 and STDFONT.15 and STDFONT.24.
  Unset settings fall back to the built-in font data.
  ref: src/ints/int_dosv.cpp:654-749, 1631-1710, src/dosbox.cpp:2554-2587

  BOOT -bios loads a BIOS image at the top of the first megabyte, truncated to
  128 KB, or 96 KB on PC-98 where it also looks for <image>.itf.rom, <image>.ITF.ROM,
  itf.rom and ITF.ROM to serve the bank switched Initial Firmware Test region
  through port 43Dh.
  ref: src/dos/dos_programs.cpp:2227-2228, 2261-2350

  BIOSTEST.COM loads an image of up to 64 KB at F000:0 and restarts the CPU at
  the reset vector. It is compiled only when the debugger is enabled. The
  settings call binary on reset and call binary on boot load blobs of up to
  128 KB into the ROM BIOS area for CPU testing.
  ref: src/dos/dos_programs.cpp:3666-3719, src/ints/bios.cpp:13311-13387

  A build configured with --enable-dosbox_agent reads the key=value file named
  by -agent-config to start the RPC debugger agent. The file names the
  transport and endpoint, nothing else is read from disk.
  ref: configure.ac:1479-1486, src/gui/sdlmain.cpp:8494-8500, src/agent/protocol/agent_protocol.cpp:477-632

  Glide passthrough loads glide2x.dll, libglide2x.so or libglide2x.dylib.
  ref: src/hardware/glide.cpp:353-359, src/dosbox.cpp:3505-3507

  ttf.font, ttf.fontbold, ttf.fontital and ttf.fontboit name a TTF, OTF, FON or
  TTC font resolved through the same search order plus the system font
  directories. Unset, the TTF output uses the built-in font, except on PC-98 or
  a double-byte code page where SarasaGothicFixed.ttf is tried first.
  ref: src/output/output_ttf.cpp:318-473, 653-668

  Shipped in the resource directory: FREECG98.BMP, wqy_11pt.bdf, wqy_12pt.bdf,
  Nouveau_IBM.ttf, SarasaGothicFixed.ttf and the two reference configuration
  files.
  ref: src/Makefile.am:14-22

  Overrides for data that is compiled in: the boot logo PNG, the mapper file,
  the customcodepage translation table, .kl layout files and the KEYBOARD.SYS
  to KEYBRD4.SYS libraries read from a mounted drive, the glshaders directory
  and the .lng translations.
  ref: src/ints/bios.cpp:11479-11488, src/gui/sdlmain.cpp:972-974, 7016-7024,
       src/gui/sdl_mapper.cpp:5731-5787, src/dos/dos.cpp:4414-4449,
       src/dos/dos_keyboard_layout.cpp:300-340, src/gui/render.cpp:1556-1563,
       src/misc/messages.cpp:300-326

