    md5: ["4e10a27e6b3ceac0b3e2df4fadc48bb4", "0f5f6d27dc657538e1f566fe55d507f5"]
    aliases: ["wqy_11pt.pcf"]
    note: "Ships in the resource directory, with CRLF line ends in the Windows zips."
