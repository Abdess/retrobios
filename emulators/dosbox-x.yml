  # -- FluidSynth SoundFont --

  - name: "default.sf2"
    description: "SoundFont the operating system installs as FluidSynth default"
    required: false
    system: dos
    unsourceable: "a link the operating system creates to the SoundFont it installs as default, FluidR3_GM.sf2 on Fedora. No file of this name is distributed, and a same-named file of another program must not stand in"
    note: >
      first name Find_SoundFont tries in each directory when fluid.soundfont
      is empty. The source marks /usr/share/soundfonts as the Red Hat and
      Fedora location, where the name links to FluidR3_GM.sf2, the second
      name. Any SF2 or SF3 file loads: fluid.soundfont names it and
      fluid_synth_sfload is the only check
    source_ref: "src/gui/midi_synth.h:82-134, src/gui/midi_synth.h:383-399, src/gui/midi_synth.h:228-242, src/gui/midi_synth.h:478-489, src/dosbox.cpp:3744-3745"

  - name: "FluidR3_GM.sf2"
    description: "Fluid R3 GM SoundFont by Frank Wen"
    required: false
    system: dos
    note: >
      second name Find_SoundFont tries in each directory when fluid.soundfont
      is empty. Elsewhere the file loads when fluid.soundfont gives its path.
      The synth device searches the same way
    source_ref: "src/gui/midi_synth.h:82-134, src/gui/midi_synth.h:383-399, src/gui/midi_synth.h:228-242, src/gui/midi_synth.h:478-489"

  - name: "GeneralUser_GS.sf2"
    aliases: ["GeneralUser-GS.sf2"]
    description: "GeneralUser GS SoundFont by S. Christian Collins"
    required: false
    system: dos
    note: >
      third name Find_SoundFont tries in each directory when fluid.soundfont
      is empty, GeneralUser-GS.sf2 being the fourth. Elsewhere the file loads
      when fluid.soundfont gives its path, and the setting's help text names
      GeneralUser_GS.sf2 as its example. The synth device searches the same way
    source_ref: "src/gui/midi_synth.h:82-134, src/gui/midi_synth.h:383-399, src/gui/midi_synth.h:228-242, src/gui/midi_synth.h:478-489, src/dosbox.cpp:3745"

  # -- PC-98 character generator --

  - name: "FONT.ROM"
    description: "PC-98 character generator ROM, T98Tools layout"
    required: false
    system: pc-98
    hle_fallback: true
    size: 288768
    validation: [size]
    note: >
      256 8x8 cells at 0x0, 256 8x16 cells at 0x800, 96 by 92 16x16 cells at
      0x1800. A file of any other length is rejected. Enabled by
      pc-98 try font rom, on by default
    source_ref: "src/ints/int10.cpp:1487-1549, src/dosbox.cpp:2498-2499"

  - name: "ANEX86.BMP"
    description: "PC-98 character generator, Anex86 bitmap"
    required: false
    system: pc-98
    hle_fallback: true
    note: >
      2048 by 2048 monochrome Windows bitmap, biSize 40, one plane, one bit per
      pixel, no compression, inverse colour scheme. The first row is the 8x16
      single-width set and the rest is 16x16 full-width. Also reachable through
      the pc-98 anex86 font setting, which is tried before FONT.ROM
    source_ref: "src/ints/int10.cpp:1555-1647, src/dosbox.cpp:2502-2505"

  - name: "FREECG98.BMP"
    description: "PC-98 character generator, free generated bitmap"
    required: false
    system: pc-98
    bundled: true
    sha1: "e00b77cabd5960646abc5dbce5568f121d37ae48"
    md5: "268affbc64edb845b5e4f3c8200629d6"
    hle_fallback: true
    note: >
      same bitmap layout as ANEX86.BMP and tried after it, ships in the resource
      directory
    source_ref: "src/ints/int10.cpp:1577-1580, src/Makefile.am:17"

  # -- CJK bitmap fonts --
  # Read when the guest code page is 936, 949, 950 or 951 and a character has no
