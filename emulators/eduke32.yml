source:
  standalone: "https://voidpoint.io/terminx/eduke32"
  libretro: "https://git.libretro.com/libretro/eduke32-libretro"
upstream: "https://voidpoint.io/terminx/eduke32"
version_source:
  url: "https://dukeworld.com/eduke32/synthesis/latest/"
  pattern: 'eduke32_src_(\d{8}-\d+-[0-9a-f]+)\.tar'
profiled_date: "2026-11-09"
source_commit:
  standalone: "ec5824db81817866f70da326d3811bb0f52b3517"
  libretro: "b5918d5cf3fc698700c86693fce3ce5200c28b96"
core_version:
  standalone: "20260807-10669-ec5824db8"
  libretro: "1.0.0"
version_basis:
  standalone:
    kind: package
    url: "https://dukeworld.com/eduke32/synthesis/20260807-10669-ec5824db8/eduke32_src_20260807-10669-ec5824db8.tar.xz"
    pattern: 'eduke32_src_(\d{8}-\d+-[0-9a-f]+)\.tar'
    artifact: "eduke32_src_20260807-10669-ec5824db8.tar.xz"
  libretro:
    kind: file
    path: "platform/Libretro/core.cpp"
    pattern: 'info->library_version\s*=\s*"([^"]+)"'
display_name: "EDuke32"
cores: [eduke32]
systems: [duke3d, nam, napalm, ww2gi]

notes: |
  Build-engine port by TerminX, Hendricks266, Plagman and others. Covers
  Duke Nukem 3D (and its official addons), NAM, NAPALM, WWII GI and
  Platoon Leader. Startup scans the search path for registered GRPs by
  CRC32 (source/duke3d/src/grpscan.cpp:39-76 internalgrpfiles[]). Each GRP
  carries a game flag (DUKE / NAM / NAPALM / WW2GI) and optional addon
  dependency. EDuke32 picks the user selection, mounts it with
  initgroupfile and loads the DEF / CON / RTS the GRP points to.

  G_DefaultGrpFile (source/duke3d/src/common.cpp:60-73) returns the base
  GRP for the active game flag: DUKE3D.GRP, NAM.GRP, NAPALM.GRP, WW2GI.GRP.
  G_DefaultConFile and G_DefaultRtsFile pick EDUKE.CON / NAM.CON /
  NAPALM.CON / WW2GI.CON and DUKE.RTS / NAM.RTS / NAPALM.RTS / WW2GI.RTS.

  CRCs listed in source/duke3d/src/grpscan.h match the retail GRP byte
  for byte, but the loader only checks CRC32 (not MD5) and only to pick the
  entry, never to refuse an unknown GRP. CON / RTS / addon files are
  referenced from the chosen entry but their contents are not validated.

  The scan checksums every *.grp, *.ssi, *.dat and *.zip file of the
  search path and matches size and CRC32 against the table, and the table
  holds no file name (source/duke3d/src/grpscan.cpp:360-370, 486-492).
  An addon whose dependency is not found is removed from the list
  (source/duke3d/src/grpscan.cpp:503-517).

  The libretro build is the same tree at ec5824db with platform/Libretro/
  added and the file access routed through the frontend VFS. The content
  is a GRP, ZIP, PK3 or PK4 opened by full path
  (platform/Libretro/core.cpp:615-623). It is mounted as the first group,
  and the folder that holds it is the search path the core adds
  (platform/Libretro/core.cpp:652-670). G_AddSearchPaths is never called.
  The scan then runs over that folder and keeps the GRP named DUKE3D.GRP, else the first one it
  recognises, which sets the game type and its CON, DEF and RTS names
  (source/duke3d/src/common.cpp:339-358, 420-443). Every file below is
  therefore read beside the content, never from the system directory.
  Relative paths, the config and the GRP cache among them, resolve below
  the save directory (platform/Libretro/core.cpp:486-489,
  platform/Libretro/vfs_libretro.cpp:31-40).

files:
  # ================================================================
  # Duke Nukem 3D (base game, GAMEFLAG_DUKE)
  # ================================================================

  - name: "DUKE3D.GRP"
    category: game_data
    load_from:
      libretro: content_dir
    system: duke3d
    required: false
    installed_on: [retropie]
    source_ref: "source/duke3d/src/common.cpp:36 (defaultgamegrp GAME_DUKE), source/duke3d/src/grpscan.cpp:41-50 (CRC-indexed variants)"
    note: >
      Any retail variant plays: Atomic Edition / Plus / World Tour
      (DUKE15_CRC 0xFD3DCFF1, 44356548 bytes, grpscan.h:35), v1.3D
      registered (DUKE13_CRC 0xBBC9CE44, 26524524 bytes, grpscan.h:33),
      Shareware v1.3D (DUKESW_CRC 0x983AD923, 11035779 bytes,
      grpscan.h:41), World Tour (DUKEWT_CRC 0x982AFE4A, grpscan.h:37),
      Plutonium Pak (DUKEPP_CRC 0xF514A6AC, grpscan.h:36), South Korean
      censored (DUKEKR_CRC 0xAA4F6A40, grpscan.h:34). CRC32 identifies
      the variant and selects the matching entry in internalgrpfiles[],
      and no MD5 or SHA1 is read.
      The RetroPie package extracts the shareware v1.3D GRP into
      roms/ports/duke3d when no duke3d.grp is there.

  - name: "EDUKE.CON"
    category: game_data
    load_from:
      libretro: content_dir
    system: duke3d
    required: false
    source_ref: "source/duke3d/src/common.cpp:38 (defaultgameconfilename GAME_DUKE)"
    note: "EDuke32 CON script. Shipped inside the GRP by default, external copy only when the user overrides it."

  - name: "DUKE.RTS"
    category: game_data
    load_from:
      libretro: content_dir
    system: duke3d
    required: false
    installed_on: [retropie]
    source_ref: "source/duke3d/src/game.cpp:96 (defaultrtsfilename), source/duke3d/src/game.cpp:126-130 (G_DefaultRtsFile), source/duke3d/src/game.cpp:6873-6874 (RTS_Init), source/duke3d/src/rts.cpp:52-55, 62-68, 105-113"
    note: "Remote Ridicule speech. RTS_Init returns without error when the file cannot be opened, and a file without the IWAD header is skipped with a warning. The RetroPie package extracts the shareware copy beside the shareware GRP."

  # ---- Duke 3D addons ----

  - name: "DUKEDC.GRP"
    category: game_data
    load_from:
      libretro: content_dir
    system: duke3d
    required: false
    source_ref: "source/duke3d/src/grpscan.cpp:56-59 (Duke it out in D.C., GAMEFLAG_ADDON)"

  - name: "VACATION.GRP"
