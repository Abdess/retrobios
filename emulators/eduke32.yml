    required: false
    size: 16169365
    crc32: "f1cae8e4"
    validation: [size, crc32]
    source_ref: "source/duke3d/src/grpscan.cpp:65 (Duke: Nuclear Winter, GAMEFLAG_ADDON), 366 (crc and size compare), source/duke3d/src/grpscan.h:51 (DUKENW_CRC)"

