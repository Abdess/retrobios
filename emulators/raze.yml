emulator: Raze
type: standalone
core_classification: game_engine
source: "https://github.com/ZDoom/Raze"
upstream: "https://github.com/ZDoom/Raze"
profiled_date: "2026-10-04"
source_commit: "76fe82f5eb318fdeb30ba9fb27093a9a10bc3821"
display_name: "Raze"
cores: []
systems: [duke3d, blood, shadow-warrior, powerslave, exhumed, redneck, nam, ww2gi]

notes: |
  Build-engine source port derived from EDuke32 and NBlood, maintained
  by the ZDoom team. Runs Duke Nukem 3D, Blood, Shadow Warrior,
  Powerslave/Exhumed, Redneck Rampage, Nam, Napalm, WWII GI through a
  shared Build renderer.

  Engine resource (built via add_pk3):
    raze.pk3   ENGINERES_FILE, fatal if absent
    ref: source/core/version.h:66, source/core/gamecontrol.cpp:1020-1023,
         source/core/initfs.cpp:335-336, wadsrc/CMakeLists.txt:2

  Game detection reads engine/grpinfo.txt from raze.pk3. Every file of
  the search directories is a candidate, whatever its name: a file is
  identified when its size and CRC32 equal those of a grpinfo block, or
  when it is an archive holding every `mustcontain` entry of a block
  that declares no CRC. A block also carries a game id, flags and
  optional `loadgrp` / `loadart` dependencies.
  ref: source/core/searchpaths.cpp:286-326, source/core/searchpaths.cpp:696-704,
       source/core/searchpaths.cpp:738-870, wadsrc/static/engine/grpinfo.txt:1-45

  The names below are the ones the releases ship. The engine itself
  names DUKE3D.GRP, DUKEDC.GRP, NWINTER.GRP, VACATION.GRP, NAM.GRP,
  NAPALM.GRP, WW2GI.GRP, REDNECK.GRP and BLOOD.RFF, as the defaults of
  its -addon, -nam, -napalm, -ww2gi, -route66 and -cryptic switches.
  ref: source/core/gamecontrol.cpp:328-367

  At least one game's GRP (or equivalent archive) must be present for
  Raze to run. An addon block names the CRC of its base game in
  `dependency`. grpinfo.txt also identifies the Mac demos of Duke Nukem
  3D and Shadow Warrior, the Nuclear Winter demo, Duke!ZONE II,
  Penthouse Paradise, Alien World Order, Platoon Leader, the ProAsm
  build of Wanton Destruction and the SSI build of Cryptic Passage.

