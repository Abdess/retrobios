emulator: "Beetle PCE Fast"
type: libretro
core_classification: community_fork
source: "https://github.com/libretro/beetle-pce-fast-libretro"
upstream: "https://mednafen.github.io/"
profiled_date: "2026-03-24"
source_commit: "4eee99c451f85ebe66d1591de88b892015b23059"
core_version: "v1.31.0.0"
version_basis:
  kind: file
  path: "libretro.c"
  pattern: '#define\s+MEDNAFEN_CORE_VERSION\s+"([^"]+)'
display_name: "NEC - PC Engine / CD (Beetle PCE FAST)"
cores: [mednafen_pce_fast, pce_fast, beetle_pce_fast, "beetle-pce-fast"]
systems: [nec-pc-engine]
verification: existence
notes: >
  Fork of Mednafen's pce_fast module (speed-optimized, no SuperGrafx support).
  Built from mednafen/pce_fast/.
  BIOS loaded via HuCLoadCD() at CD-ROM load time. Core option "pce_fast_cdbios"
  selects which card image to use (default: System Card 3).
  Does not detect Games Express: the card is chosen by the pce_fast_cdbios option.
  No hash or size validation on BIOS load.
  Upstream pce_fast module only has a single pce_fast.cdbios string setting:
  the 6-option dropdown is a libretro addition.

files:
  - name: "syscard3.pce"
    description: "CD-ROM System Card 3.0 (Japan)"
    required: true
    source_ref: "libretro.c:65, libretro.c:1896-1901"
    note: "Default value for pce_fast_cdbios option."

  - name: "syscard2.pce"
    description: "CD-ROM System Card 2.0 (Japan)"
    required: false
    source_ref: "libretro.c:1903"
    note: "pce_fast_cdbios = 'System Card 2'."

  - name: "syscard1.pce"
    description: "CD-ROM System Card 1.0 (Japan)"
    required: false
    source_ref: "libretro.c:1905"
    note: "pce_fast_cdbios = 'System Card 1'."

  - name: "gexpress.pce"
    description: "Games Express CD Card"
    required: false
    source_ref: "libretro.c:1906-1907"
    note: "pce_fast_cdbios = 'Games Express'. For unlicensed Games Express titles."

  - name: "syscard3u.pce"
    description: "CD-ROM System Card 3.0 (US / TurboGrafx-CD)"
    required: false
    source_ref: "libretro.c:1908-1909"
    note: "pce_fast_cdbios = 'System Card 3 US'. Not in .info."

  - name: "syscard2u.pce"
    description: "CD-ROM System Card 2.0 (US / TurboGrafx-CD)"
    required: false
    source_ref: "libretro.c:1910-1911"
    note: "pce_fast_cdbios = 'System Card 2 US'. Not in .info."
