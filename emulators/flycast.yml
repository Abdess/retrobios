data_root:
  android:
    path: "Android/data/com.flycast.emulator/files/data"
    source_ref: "shell/android-studio/flycast/src/main/java/com/flycast/emulator/BaseGLActivity.java:92-97,442-447, shell/android-studio/flycast/src/main/jni/src/Android.cpp:143-159, shell/android-studio/flycast/build.gradle.kts:21"
    note: "data/ under the home directory set in the app settings, getFilesDir() when no external storage is mounted"
  ios:
    path: "Documents"
    source_ref: "shell/apple/emulator-ios/emulator/FlycastViewController.mm:198-201"
    note: "the app's sandbox Documents folder, with no data/ subfolder"
  windows:
    path: "<folder of flycast.exe>/data"
    source_ref: "core/windows/winmain.cpp:59-78"
    note: "the UWP build uses data/ under the app's LocalFolder (core/windows/winmain.cpp:80-89)"
  macos:
    path: "~/Library/Application Support/Flycast/data"
    source_ref: "shell/apple/emulator-osx/emulator-osx/osx-main.mm:78-102"
    note: "~/.flycast/data when ~/.flycast exists. A second running instance appends its number to the folder"
  linux:
    path: "$XDG_DATA_HOME/flycast, else ~/.local/share/flycast"
    source_ref: "core/linux-dist/main.cpp:74-99,247"

notes: |
  The libretro core is built from flyinghead/flycast, the same tree as the
  standalone emulator: the wrapper lives in shell/libretro and is compiled
  with -DLIBRETRO=ON.

  Flycast has a built-in HLE BIOS (reios) for Dreamcast that boots most
  games without a real boot ROM. A short list of product ids forces the
  real BIOS (core/emulator.cpp:277-278) and is told "This game requires a
  real BIOS" when it is absent (core/emulator.cpp:616-621). Without content,
  the core boots the BIOS and fails when none is found
  (core/emulator.cpp:601-605). Arcade systems (NAOMI, NAOMI 2, Atomiswave,
  System SP) load MAME-format BIOS archives.

  The libretro port appends "dc/" to the system directory
  (shell/libretro/libretro.cpp:2252-2253). All files below are relative to
  system_dir/dc/.

  The standalone emulator looks for each file in the BIOS paths the user
  configures, then in its data directory, then in the system data
  directories, then in the content directories, and writes the flash back to
  the data directory (core/oslib/oslib.cpp:118-196,
  core/stdclass.cpp:95-125). The data directory, given per system in
  data_root, is the data/ folder of the configuration directory except on
  Linux and iOS. standalone_path is relative to it. The BIOS paths are the
  Dreamcast.BiosPath setting (core/cfg/option.cpp:144), the system data
  directories take $FLYCAST_BIOS_PATH (core/linux-dist/main.cpp:198-202), and
  find_user_data_dir() returns the data directory
  (core/linux-dist/main.cpp:74, core/linux-dist/main.cpp:247).

  Only the Dreamcast reads flat files. The prefix is dc_ for Dreamcast
  (core/hw/flashrom/nvmem.cpp:35-50), and the boot ROM is searched as
  {prefix}boot.bin then {prefix}bios.bin (core/hw/flashrom/nvmem.cpp:304).
  Flash is {prefix}nvmem.bin and is created when absent
  (core/hw/flashrom/nvmem.cpp:252-256). Arcade platforms return before the
  boot ROM search (core/hw/flashrom/nvmem.cpp:300-302), and their flash is a
  per-game save file. The system font is a resource compiled into the
  binary (core/reios/reios.cpp:761-764).

  Arcade BIOS archives are opened as <name>.zip, then <name>.7z
  (core/hw/naomi/naomi_cart.cpp:75-78), first in system_dir/dc, then in
  the content directory (shell/libretro/oslib.cpp:118-130). Each ROM inside
  is looked up by CRC, then by file name, in the game archive, its parent,
  then the BIOS archive (core/hw/naomi/naomi_cart.cpp:89-106). The blob of
  the configured region is mapped first, any region otherwise, and a game
  whose BIOS cannot be loaded aborts (core/hw/naomi/naomi_cart.cpp:196-207).
  Games whose bios field is naomi2 run as NAOMI 2 and those whose bios
  field is segasp as System SP (core/hw/naomi/naomi_cart.cpp:810-821).

  BIOS[] also declares naomidev and naomigd. No entry of Games[] carries
  either name in its bios field, so neither archive is opened. naomi-jp-d
  and naomi-ko-h read naomi.zip (core/hw/naomi/naomi_roms.cpp:219-242).

files:
  # -------------------------------------------------------
  # Sega Dreamcast
  # -------------------------------------------------------
  - name: "dc_boot.bin"
    path: "dc/dc_boot.bin"
    standalone_path: "dc_boot.bin"
    aliases: ["dc_bios.bin"]
    system: sega-dreamcast
    required: false
    hle_fallback: true
    size: 2097152
    note: "Dreamcast boot ROM. reios is used when it is absent, except for the product ids that force the real BIOS. Searched as dc_boot.bin then dc_bios.bin."
    source_ref: "core/hw/flashrom/nvmem.cpp:298-316, core/emulator.cpp:613-622"

  - name: "dc_nvmem.bin"
    path: "dc/dc_nvmem.bin"
    standalone_path: "dc_nvmem.bin"
    system: sega-dreamcast
    required: false
    hle_fallback: true
    size: 131072
    note: "Dreamcast flash memory. Created with factory settings when absent, written back on exit."
    source_ref: "core/hw/flashrom/nvmem.cpp:252-256, core/hw/flashrom/nvmem.cpp:321-322"

