exclusion_note: >
  ntdll.dll and the XInput libraries tried in turn (xinput1_4, xinput1_3,
  xinput9_1_0) are Windows components, and cxbxr-emu.dll is the emulator's own
  build output. boot.id and default.xbe belong to the title. The Partition0.bin
  to Partition7.bin images under EmuDisk are created and formatted by the
  emulator.
