notes: |
  Cxbx-Reloaded derivative built for the Chihiro light gun games, used by
  RetroBat as its "chihiro-gun" emulator from emulators\chihiro-ds and paired
  with DemulShooter. No source is published. The build read here is the one
  RetroBat installs, chihiro-ds.7z sha256
  d20a9ffc6822c719f25d9b46c66249bf7efc9729cfddd10bda4f8629c96d48a5, whose
  binaries carry "Chihiro-DS 1.0 (Mar 14 2025)". cxbxr-ldr.exe md5
  d3675f7bb270072f33d9106497dd9bbc is the print DemulShooter lists for
  "Chihiro-DS 1.0". cxbxr-emu.dll (md5 62f492f14b2af4bef7329ef269355a78) is
  cited by virtual address. The package ships its cxbxr-emu.pdb (GUID
  7511A6DE-EA63-4F50-9FB8-AC9B37A49568, age 2, the values the DLL's debug
  directory names), which gives the function names below. cxbx.exe is md5
  7f59a0156a426fd4dfec6ee4e556648c with its matching cxbx.pdb.
  ref: emulatorLauncher Generators/Cxbx.Generator.cs:104-110, 202-214,
       emulatorLauncher Installer.cs:46

  Every file name, path and error message in cxbxr-emu.dll that concerns a
  file matches Cxbx-Reloaded develop with CHIHIRO_WORK enabled, as it stood
  between CI-6f32d89 (6f32d89545cf0ad5a7d44ecedaf963005d7f84dc, December
  2024) and CI-ec9934a (April 2025), which agree on every file loading path. That source is cited below with the CI-6f32d89
  prefix as the reading of the logic the strings belong to. The only file the
  fork adds is wm2_loader.dll.

  Every path below is relative to the data directory. RetroBat's settings.ini
  template sets DataStorageToggle to 1, the folder holding cxbx.exe. EmuDisk
  and EmuMu are created there at startup, and the Chihiro files live in
  EmuDisk\Chihiro (this build predates the EmuMediaBoard folder).
  ref: CI-6f32d89 src/common/Settings.cpp:880-915,
       CI-6f32d89 src/common/FilePaths.cpp:82-109,
       cxbxr-emu.dll Chihiro-DS 1.0 (Mar 14 2025) CxbxrInitFilePaths 0x100cde5d-0x100cdf57 (data path
       plus EmuDisk, filesystem::exists, created when absent),
       JVS_Init 0x102c128a (data path plus EmuDisk Chihiro folder)

  A title is Chihiro when its XBE type says so or a boot.id sits beside it.
  Launched directly with a boot.id beside its XBE, a title needs the media
  board ROM: a missing file, an unreadable one or one that is not 2 MB ends
  the run. When either SEGABOOT
  file is missing both are rewritten from the two 1 MB halves of the ROM, then
  SEGABOOT_MBROM1.XBE is launched and boots the title. boot.id is read again by
  the media board for the region flags, and its absence ends the run.
  ref: CI-6f32d89 src/core/kernel/init/CxbxKrnl.cpp:517-586,
       CI-6f32d89 src/devices/chihiro/MediaBoard.cpp:46-57,
       cxbxr-emu.dll Chihiro-DS 1.0 (Mar 14 2025) CxbxrKrnlXbeSystemSelector 0x103e0fe9-0x103e105b (boot
       flags zero and boot.id beside the XBE), 0x103e178f-0x103e1855 (XbeType
       gives system 2, 4 or 8, filesystem::exists of xbeDirectory / boot.id
       sets 8), 0x103e14c6-0x103e14cc
       (CxbxLaunchNewXbe of SEGABOOT_MBROM1.XBE), MediaBoard::SetMountPath
       0x1041a468-0x1041a490 (fopen of the title path plus /boot.id),
       0x1041a56d (CxbxrAbortEx Could not open Chihiro boot.id)

  The four JVS base board images are memory mapped read/write when the
  system is Chihiro. Byte 0x1F00 of the QC firmware holds the board region and
  is rewritten in place to one the title's boot.id accepts, which is why the
  copy the package ships differs from the dump by that byte.
  ref: CI-6f32d89 src/core/hle/JVS/JVS.cpp:127-142,
       CI-6f32d89 src/core/hle/JVS/JVS.cpp:169-210,
       CI-6f32d89 src/core/hle/JVS/JVS.cpp:246-262,
       cxbxr-emu.dll Chihiro-DS 1.0 (Mar 14 2025) CxbxrKrnlInit 0x103e44cf-0x103e44d8 (JVS_Init called
       when g_bIsChihiro is set), JVS_Init 0x102c2049-0x102c2081 (byte
       0x1F00 of the QC firmware tested against the boot.id region flags,
       set to 2, 3 or 1)

  The package ships every file below except xboxdash.xbe and keys.bin. It
  also carries chihiro_xbox_bios.bin, ver1305.bin, 315-6215.bin,
  sp5001.bin, sp5001-b.bin and sp5002-a.bin in EmuDisk\chihiro, plus a
  "chihiro (old)" copy of the folder. No string in the binaries names any of
  them and nothing opens them.

