emulator: Aleph One
type: standalone
core_classification: game_engine
source: "https://github.com/Aleph-One-Marathon/alephone"
upstream: "https://github.com/Aleph-One-Marathon/alephone"
profiled_date: "2026-10-20"
source_commit: "07a9c36aff403d143a0608815f725631a01e382c"
pin_frozen: "RetroPie, the only platform that ships it, builds the release-20250829 tag at this commit (scriptmodules/ports/alephone.sh, _get_branch_alephone). Debian 10 and older get release-20250302."
pin_build:
  - platform: retropie
    repo: "https://github.com/RetroPie/RetroPie-Setup"
    revision: "46128cd252cdecae852a4d0bafa2aaf9d03ab563"
    path: "scriptmodules/ports/alephone.sh"
    variable: version
    value: "20250829"
core_version: "release-20250829"
version_basis:
  kind: tag
  tag: "release-20250829"
  distance: 0
display_name: "Marathon (Aleph One)"
cores:
  - alephone
systems: [marathon, marathon-2, marathon-infinity]
mode: standalone

notes: |
  Engine of Bungie's Marathon trilogy, developed from the Marathon 2 source
  release. Profiled at tag release-20250829 (A1_DATE_VERSION,
  Source_Files/Misc/alephversion.h:27-29), the release RetroPie builds on
  Debian 11 and later. Older systems get release-20250302
  (scriptmodules/ports/alephone.sh, _get_version_alephone). RetroPie
  downloads the three scenario archives of the same release into
  $romdir/ports/alephone and starts `alephone <scenario folder>`.

  The folder given on the command line goes on the data search path
  (Source_Files/shell.cpp:405-411). Every MML file under its Scripts/ is
  parsed at start (Source_Files/shell.cpp:1600-1610), and string set 129
  there renames the data files the engine looks up. Without it the engine
  searches for files literally named Map, Shapes, Sounds and Images
  (Source_Files/Misc/DefaultStringSets.cpp:86-101). A scenario counts as
  present when Map, Shapes, and Images or the external resources file are
  found. Otherwise the engine asks for another folder
  (Source_Files/Files/preprocess_map_sdl.cpp:68-74,
  Source_Files/shell.cpp:463-480). A missing Sounds or Physics file is
  ignored (Source_Files/Files/preprocess_map_sdl.cpp:87-103).

  Music/NN.ogg holds the level music of the Marathon 1 data, played when a
  level names a song index (Source_Files/Sound/Music.cpp:260-275). Plugins/
  carries HUD plugins listed in the plugin menu
  (Source_Files/XML/Plugins.cpp:509-512). Demos/*.filA are replays played
  from the title screen (Source_Files/Misc/vbl.cpp:1380-1395). Fonts,
  the base MML and the default theme are installed with the engine from its
  own data/ folder. No file is hashed.

  The files below are the release-20250829 scenario archives
  (Marathon-20250829-Data.zip, Marathon2-20250829-Data.zip,
  MarathonInfinity-20250829-Data.zip), distributed freely by the Aleph One
  project. The engine archive AlephOne-20250829-Win.zip carries none of
  them. RetroPie's package downloads them at install.

