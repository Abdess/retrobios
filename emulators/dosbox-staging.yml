  # -- FluidSynth SoundFont --

  - name: "default.sf2"
    path: "soundfonts/default.sf2"
    description: "General MIDI SoundFont"
    required: false
    aliases:
      - "GeneralUser-GS.sf2"
      - "FluidR3_GM.sf2"
      - "Fluid_R3_GM_GS.sf2"
      - "4gmgsmt-sf2_04-compat.sf2"
      - "4GMGSMT.SF2"
      - "synthgs-sf2_04-compat.sf2"
    note: >
      any SoundFont loads; GeneralUser GS, Fluid R3, the AWE32 4MB GM/GS/MT
      bank and the Trevor0402 SC-55 SoundFont are recognised by filename or
      RIFF INFO name and get their own reverb, chorus and filter presets
    source_ref: "fluidsynth.cpp:672-689, fluidsynth.cpp:816-883, fluidsynth.cpp:1229-1242"

  # -- PCjr system ROM --

  - name: "system.rom"
    description: "IBM PCjr system ROM"
    required: false
    min_size: 57344
    validation: [size]
    note: >
      read during PCjr cartridge boot from the current DOS drive, then from
      the host working directory; bytes 0x3000 to 0xDFFF are copied to
      physical F3000. A short read leaves the region untouched and the
      cartridge still boots
    source_ref: "boot.cpp:379-397, boot.cpp:83-124"

  # -- LOADROM images --
  # Read from the mounted DOS drive under the name given on the command line
  # and identified by their contents.

  - name: "IBM PC Cassette BASIC ROM"
    description: "IBM BASIC ROM image mapped at F600:0"
    required: false
    size: 32768
    validation: [size]
    note: >
      accepted when the file is exactly 32768 bytes, starts with E9 8F 7E and
      carries the string IBM at offset 0x4CD4
    source_ref: "loadrom.cpp:56-80, loadrom.cpp:95"

  - name: "Video BIOS ROM"
    description: "Option ROM image mapped at C000:0 and initialised"
    required: false
    min_size: 16384
    max_size: 32768
    validation: [size]
    note: >
      accepted when the file is 16384 bytes or larger, starts with 55 AA,
      has byte 3 masked to E8 and carries the string IBM at offset 0x1E;
      needs an EGA or better machine type
    source_ref: "loadrom.cpp:56-75, loadrom.cpp:88-93"
