emulator: "Amiberry 8.0.0 (facaaeb, Batocera)"
type: standalone
core_classification: frozen_snapshot
source: "https://github.com/BlitterStudio/amiberry"
upstream: "https://github.com/tonioni/WinUAE"
profiled_date: "2026-11-09"
source_commit: "facaaeb13d996e8fa4e5f391c767a07183ab19e3"
pin_frozen: "Batocera, the only platform that ships it, builds this revision, 332 commits after v7.1.1\
  \ (Batocera package/batocera/emulators/amiberry/amiberry.mk:7 at batocera-43.1). Later commits are not\
  \ part of that build."
pin_build:
- platform: batocera
  repo: "https://github.com/batocera-linux/batocera.linux"
  revision: "batocera-43.1"
  path: "package/batocera/emulators/amiberry/amiberry.mk"
  variable: AMIBERRY_VERSION
  value: "facaaeb13d996e8fa4e5f391c767a07183ab19e3"
core_version: "8.0.0"
version_basis:
  kind: file
  path: "CMakeLists.txt"
  pattern: "project\\(amiberry\\s+VERSION\\s+([0-9][0-9.]*)"
display_name: "Commodore - Amiga (Amiberry 8.0.0, facaaeb for Batocera)"
cores:
- "amiberry"
- "AMIBERRY"
built_by:
- "batocera"
systems:
- "commodore-amiga"
- "commodore-cd32"
- "commodore-cdtv"
standalone_directories:
- "rom_path"
- "AMIBERRY_HOME_DIR/roms"
- "~/Amiberry/roms"
- "whdboot_path = whdboot"
notes: |
  Amiberry 8.0.0 (CMakeLists.txt:3-4). The ROM path is rom_path in
  amiberry.conf, else roms/ below the home directory: $AMIBERRY_HOME_DIR,
  else ~/Amiberry, else the working directory, which an amiberry.portable
  file there makes the home directory. The WHDLoad booter reads whdboot/
  below $XDG_DATA_HOME/amiberry, or below the home directory in portable
  mode (src/osdep/amiberry.cpp:4513-4552, 5011-5110, 5524-5526,
  4126).

  The ROM scan reads the files of the ROM path root and names each one by
  the ROM database (src/rommgr.cpp roms[]). The American Laser Games and
  Picmatic arcade ROMs of the database are game content and left out.
  A Kickstart the configuration names is opened as given, then kick.rom below
  the home directory's roms/ is tried (src/memory.cpp:2030-2065).
