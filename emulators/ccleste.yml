notes: |
  A C translation of the PICO-8 Celeste Classic by lemon32767: the game logic
  is compiled in, and an SDL front end draws and plays it. No game file is
  loaded. EmuELEC builds this revision, installs the repository's data
  directory under /emuelec/configs/ccleste and runs ccleste from there.
  ref: README.md:5-11,
       EmuELEC packages/sx05re/emuelec-ports/ccleste/package.mk:4-5,24-28,
       EmuELEC packages/sx05re/emuelec-ports/sources/ports.yaml:113-125

  At start the front end reads, from data/ under the working directory,
  gfx.bmp and font.bmp, 23 sound effects snd<N>.wav and 5 music tracks
  mus<N>.ogg. All of them ship with the source and are installed with the
  binary. A missing bitmap leaves its surface empty and nothing is drawn from
  it, a missing sound or track is logged and stays silent.
  ref: sdl12main.c:83-96, sdl12main.c:121-150, sdl12main.c:155-192, sdl12main.c:352

  Optional: ccleste-input-cfg.txt (or $CCLESTE_INPUT_CFG_PATH) for the
  gamepad mapping, written with defaults when absent, gamecontrollerdb.txt,
  and ccleste-start-fullscreen.txt, whose presence alone starts in full
  screen.
  ref: sdl12main.c:278, sdl12main.c:372, sdl12main.c:1006-1042

