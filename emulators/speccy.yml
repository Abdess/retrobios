notes: |
  Sinclair emulator by Marat Fayzullin, covering ZX Spectrum 16kB, 48kB and
  128kB, Spectrum +2, +2A and +3, Timex TC2048 and TS2068, the Slovak Didaktik
  Gama, the Russian Pentagon and Scorpion clones, and the Sam Coupe. The build
  read here is the free Android package com.fms.speccy, versionName 5.9.11
  versionCode 5911, taken as the Play app bundle drop, xapk sha256
  a93f2fd474234291d2c0dee57885204ffb12a22c94602fdfcdfbf084ed7cb354, base apk
  sha256 7163451489ac59b8c63ca49976571ad284cffa11b54d615c1693c909dd6bf768. Its
  META-INF/BNDLTOOL.RSA is the author's own key, CN=Marat Fayzullin O=Garage
  Research issued 2011, fingerprint
  d09469e9b550cbc9005d3bd089f3df5f0ba89cba71cdd3b33736a0382d6f9848, beside a
  Play distribution source stamp in the signing block. The paid package
  com.fms.speccy.deluxe, last published as 5.9.3 versionCode 5903 in December
  2021, is carried by no mirror that answers: the author's site links only to
  Play for it, apkcombo bounces its download page back to the app page, apkpure
  redirects to its generic downloader, apkvision holds no copy and archive.org
  none either. The native libraries keep their symbol tables, so the readings
  below cite libmain.so offsets in the x86_64 slice; the arm64-v8a slice carries
  the same nineteen ROM names. The free Speccy 5.9 builds for Windows and Ubuntu
  were read beside it and open the same names with the same lengths and the same
  order. No source has ever been published: every download on the site, from 1.7
  for MSDOS through 5.9, is a binary package, while ColEm and fMSX on the same
  site ship source archives.
  ref: com.fms.speccy.apk META-INF/BNDLTOOL.RSA, https://fms.komkon.org/Speccy/,
       Speccy59-Windows-bin.zip, Speccy59-Ubuntu-x86-bin.tgz

  One directory holds everything. MainActivity hands the home directory to
  jniStart, which copies it into the buffer GetHomeDir returns and passes that
  same buffer to SetPrivateDir, and Application stores what GetHomeDir returns as
  the directory LoadBIOS changes into before it opens the first ROM and back out
  of when it is done. That directory is external storage
  joined with the application label up to its first space, so /sdcard/Speccy for
  the package read here, falling back to getExternalFilesDirs(null) when it is
  not a writable directory; the author's own instructions give the same
  placement. Every open goes through mopen, which calls OpenRealFile first: the
  name is tried as given, and again as <PrivateDir>/<basename>, keeping the
  larger of the two when both open. mopen then layers gzdopen over the
  descriptor, so any of these files also opens gzipped, and a content:// name is
  routed to the Android storage framework. The desktop builds have no home
  directory of their own and open every name where they stand, which -home
  changes for the system ROMs alone.
  ref: MainActivity.java:2561-2573, EMULib.java:750, 812,
       libmain.so jniStart 0x32dd0-0x33530 (0x332af-0x332c1, 0x33312),
       GetHomeDir 0x30a90, SetPrivateDir 0x571d0,
       Application 0x602f0-0x60324, OpenRealFile 0x57440-0x5766c,
       mopen 0x57680-0x57800, LoadBIOS 0x6436d-0x6439a, 0x6466b-0x6467b,
       Speccy59-Ubuntu-x86-bin speccy 0x3dae5-0x3db17, Speccy.html
       "-home <dirname>", EmuAndroid "System ROMs"

  LoadBIOS drives the whole set from one word of hardware flags, calling
  TryLoadROM once per name in a fixed order with the length to read and the bit
  that asks for it. TryLoadROM does nothing when the bit is clear, and clears
  the bit when mopen fails, which is the only check the emulator makes: the
  count mread returns is compared against the requested length solely to pick
  the word it logs, OK or FAILED, and a short read leaves the bit set. Nothing
  else about a file is examined and no hash is compared. A machine ROM that
  loads clears every other machine bit and a peripheral ROM that loads clears
  every other peripheral bit, so one machine and one disk interface stand at a
  time. StartZXS gives up when no machine bit survives, logging FAILED TO LOAD
  SYSTEM ROM! and returning zero without starting the emulation, which makes the
  ROM of the selected model the one file the emulator cannot run without.
  ref: libmain.so LoadBIOS 0x64350-0x646cd, TryLoadROM 0x659b0-0x65aa4
       (mopen 0x659d4, mread 0x65a3c, bit cleared 0x65a1c, masks
       0x65a7d-0x65a94), StartZXS 0x64040-0x6434c (LoadBIOS 0x6416d, mask
       0x64172, message 0x64315), Speccy59-Ubuntu-x86-bin speccy
       0x3dac0-0x3ddaa, 0x3d970-0x3da04, 0x3f43c-0x3f469, 0x3f640

  Two names are reached only through another. ZXS128TR.ROM is tried in place of
  ZXS128.ROM when the 128kB model and the TR-DOS interface are both asked for,
  and ZXS128.ROM is loaded after it when it fails. The Multiface bit picks its
  image from the machine already loaded, MFPLUS3.ROM behind a +2A or +3,
  MF128.ROM behind a 128kB or +2 and MF1.ROM behind a 16kB or 48kB, and the 8192
  bytes at offset 8192 of what it read are copied into the page below the machine
  ROM.
  ref: libmain.so LoadBIOS 0x64564-0x6458b, 0x645d9-0x645f5, 0x645c2-0x64651,
       Speccy59-Ubuntu-x86-bin speccy 0x3dc79-0x3dca1, 0x3ddf0-0x3de10,
       0x3dcd9-0x3dd64, Speccy.html "Now trying to load ZXS128TR.ROM BIOS file"

  Thirteen of the nineteen ROMs ship inside the Android package. MainActivity
  reads assets/memfs.mp3 whole and jniStart mounts it through SetMemoryFS as an
  in-memory filesystem, which mopen consults only after OpenRealFile has failed,
  so a copy in the home directory is served ahead of the packaged one. The
  directory is a run of 32 byte entries, a length then a name, closed by an entry
  with an empty name whose first word is the key: rotated left by three times the
  entry count, XORed sixteen bits at a time into each length and rotated right by
  three after each, it yields the thirteen lengths, which run consecutively from
  the end of the directory and account for the file exactly. Eleven of the
  thirteen are the same bytes the Windows and Ubuntu distributions ship, and
  TC2048.ROM and TS2068.ROM appear in no distribution at all.
  ref: MainActivity.java:2561-2573, libmain.so jniStart 0x32f72-0x32f98,
       InitMemoryFS 0x57180, SetMemoryFS 0x57200-0x57422 (key 0x572a0-0x572c1,
       lengths 0x572e0-0x57305), mopen 0x57749-0x577e4

  Companion files come from the loaded program's path. LoadFile derives .sta,
  .pok, .cht and .pal from it and reads each when it is there, and the startup
  palette is a name of its own, <HomeDir>/Speccy.pal on Android and Speccy.pal
  beside the binary on the desktop, which -palette redirects.
  ref: libmain.so LoadFile 0x65482, 0x65569, 0x65590, 0x655b7,
       Application 0x60436-0x60484, StartZXS 0x641c5-0x641d4,
       LoadPAL 0x648d0, Speccy59-Ubuntu-x86-bin speccy 0x3f4ac-0x3f4bd,
       0x3e450-0x3e494, Speccy.html "-palette <filename>"

