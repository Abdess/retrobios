exclusion_note: >
  Left out are the files Speccy writes and reads back itself, which are emulator
  state rather than anything a user obtains: <game>.sta holding saved emulation
  state, which LoadFile restores ahead of everything else it derives from the
  program path, LOG.MID holding the MIDI soundtrack the recorder writes,
  <HomeDir>/PrinterOutput.txt holding what the ZX and Timex printers print, and
  the replay files of the instant replay recorder. Snapshots, tapes, disk images
  and screens are the user's own content: .z80, .sna, .szx, .scs, .tap, .tzx,
  .trd, .scl, .fdi, .dsk, .mgt, .sad and .scr all reach LoadFile, and the
  emulator writes most of them back. DEFAULT.Z80 is only the name the desktop builds
  fall back to when they are started with no file at all. names.dat is left out
  because the path is dead in this build: FileInfo opens assets/names.dat and
  <HomeDir>/names.dat inside one try block, and no split of the package carries
  that asset, so the failed asset read takes the home directory copy down with
  it. changelog.html is left out as the release history shown from the menu, read
  from the package assets and from nowhere else. The Android audio and graphics
  libraries the loader opens by name are provided by the system.
