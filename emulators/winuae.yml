notes: |
  Amiga emulator for Windows by Toni Wilen. The Kickstart is the file named by
  kickstart_rom_file in the configuration. When it is absent the loader tries
  roms/kick.rom, kick.rom, ../shared/rom/kick.rom and ../System/rom/kick.rom
  under the data path, then guesses from the scanned ROM list
  (memory.cpp:2038-2071). When nothing loads it reports the missing ROM and
  boots the built-in AROS replacement (memory.cpp:3058-3063). Loaded ROMs are
  matched against the ROM table only to name them and check the CPU they need.
  An unknown ROM is still used (memory.cpp:3064-3101).

  The ROM list is built by scanning KickstartPath and the default ROM paths
  when no DetectedROMs list exists yet. Every file below 10000000 bytes
  whose extension is rom, bin, adf, key, a500, a600, a1200, a3000, a4000,
  cd32 or U followed by a digit is identified against the ROM table, whatever
  the rest of its name (od-win32/win32.cpp:5188-5207,
  od-win32/win32gui.cpp:1915-1953, od-win32/win32gui.cpp:1994-2065,
  rommgr.cpp:3025-3055). The guess step takes a scanned ROM whose
  file name matches the configured one (rommgr.cpp:2429-2462). The Kickstart entries below are named after other
  profiles' names for the same dumps: the code opens none of those names.
  kickstart_ext_rom_file is opened as given, and a missing extended ROM
  only raises a notice (memory.cpp:1833-1849). The machine then starts on
  the Kickstart alone with nothing mapped in place of the extended ROM, and
  the AROS replacement is used only when the Kickstart itself is missing
  (memory.cpp:3055-3063). The CD drivers and CD boot code are resident
  modules of the extended ROMs: cdstrap, cd.device and cdfs.library in the
  CD32 ROM, cdtv.device, cdfs.library and cdstrap in the CDTV ROM. The CD32
  and CDTV Kickstarts carry none. The CD32 quickstart model and the base
  CDTV model have no floppy drive (cfgfile.cpp:9345-9349, 9375-9376), and
  both ask for the extended ROM (cfgfile.cpp:9360-9365, 9384-9393), so
  without it no CD is read or booted.

  CDTV and A600/A1200 internal devices are enabled with :ENABLED, which needs
  no ROM file. Cloanto encrypted ROMs are decoded with rom.key, searched in the
  configured key path, the ROM path, roms/, the data path, ../shared/rom/ and
  next to the Kickstart file (rommgr.cpp:1460-1536). Without it an encrypted
  ROM fails to load (rommgr.cpp:1725-1733). A rom.key met during the ROM
  scan is added to the keyring and the scan starts again
  (rommgr.cpp:3078-3102,3127-3136).

