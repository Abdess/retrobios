emulator: Caprice32
type: standalone + libretro
core_classification: community_fork
source: "https://github.com/libretro/libretro-cap32"
upstream: "https://github.com/ColinPitrat/caprice32"
profiled_date: "2026-10-06"
source_commit: "c23855092f5f49981a5096f4d39033ff573ebca7"
upstream_commit: "6c12c4c92360065cdc229ac9ada7551f941436b8"
core_version: "v4.2.0"
display_name: "Amstrad - CPC/GX4000 (Caprice32)"
cores:
  - cap32
  - caprice32
systems:
  - amstrad-cpc

notes: |
  Caprice32 is an Amstrad CPC emulator ported to libretro. Supports CPC 464,
  CPC 464 with DDI-1 disc interface, CPC 664, CPC 6128, and CPC+ (Plus) models.

  All system ROMs are compiled directly into the core binary as C header
  arrays in cap32/rom/*.h. No external BIOS files are required.

  Embedded ROMs (cap32/cap32.c:345-349, cap32/slots.c:33):
    - cap32/rom/464.h:    OS464_BASIC10[32768]  - CPC 464 OS + BASIC 1.0
    - cap32/rom/664.h:    OS664_BASIC664[32768] - CPC 664 OS + BASIC 1.1
    - cap32/rom/6128.h:   OS_BASIC11[32768]     - CPC 6128 OS + BASIC 1.1
    - cap32/rom/amsdos.h: AMSDOS[16384]         - AMSDOS disc ROM
    - cap32/rom/6128p.h:  OS_6128P[65580]       - CPC+ system cartridge
    - cap32/rom/cpm.h:    CPM, CPM_SYS          - CP/M boot memory dumps

  ROM selection in emulator_select_ROM() (cap32/cap32.c:1082-1114):
    - CPC 464:     OS464_BASIC10
    - CPC 464DDI:  OS464_BASIC10 + AMSDOS in slot 7
    - CPC 664:     OS664_BASIC664 + AMSDOS in slot 7
    - CPC 6128:    OS_BASIC11 + AMSDOS in slot 7
    - CPC+:        OS_6128P loaded as system cartridge via cpr_load()

  Core option "cap32_model" accepts "464DDI" (libretro/libretro-core.c:501,
  libretro/libretro-core.c:1035). A 464 loading disc content is switched to
  464DDI (libretro/libretro-core.c:1364-1368).

  The array chROMFile names "cpc464.rom", "cpc664.rom", "cpc6128.rom"
  (cap32/cap32.c:353-357) and loadConfiguration() parses the rom_path,
  slotNN and rom_mf2 keys of ./cap32.cfg (cap32/cap32.c:1846-1863), but no
  code opens these files. The system directory is resolved in
  libretro/libretro-core.c:1617-1636 under a "TODO: future use to load
  custom bios" comment and no ROM is read from it.

  Keyboard layout patches are applied to the ROM in memory for French
  and Spanish layouts via rom_mods.h (cap32/cap32.c:1116-1141).

  CP/M support assembles a 128KB snapshot from the CPM and CPM_SYS arrays
  and loads it via snapshot_load_mem() in cap32/slots.c:71-90.

