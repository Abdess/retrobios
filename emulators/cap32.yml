platform_details:
  bios_mapping:
    source_ref: "source cap32/cap32.c:1136-1166, source cap32/cap32.c:345-349"
    note: |
      All ROMs are embedded. emulator_select_ROM() copies the ROM array for
      CPC.model into pbROM. No filesystem lookup occurs in the libretro
      port. retro_system_bios_directory is set in
      libretro/libretro-core.c:1640-1659 and no ROM is read from it.

  embedded_roms:
    source_ref: "source cap32/rom/464.h, source cap32/rom/664.h, source cap32/rom/6128.h, source cap32/rom/amsdos.h, source cap32/rom/6128p.h, source cap32/rom/cpm.h"
    note: |
      6 headers embedded as C arrays:
      OS464_BASIC10 (32KB)  - CPC 464 OS + BASIC 1.0, sha1 56d39c463da60968d93e58b4ba0e675829412a20
      OS664_BASIC664 (32KB) - CPC 664 OS + BASIC 1.1, sha1 073a7665527b5bd8a148747a3947dbd3328682c8
      OS_BASIC11 (32KB)     - CPC 6128 OS + BASIC 1.1, sha1 5977adbad3f7c1e0e082cd02fe76a700d9860c30
      AMSDOS (16KB)         - disc ROM mapped to slot 7, sha1 39102c8e9cb55fcc0b9b62098780ed4a3cb6a4bb
      OS_6128P (65580 B)    - CPC+ system cartridge
      CPM, CPM_SYS          - CP/M memory dumps assembled into a 128KB snapshot

  model_rom_map:
    source_ref: "source cap32/cap32.c:1136-1166"
    note: |
      CPC 464:     OS464_BASIC10, AMSDOS in ROM slot 7 when the content is a disc
      CPC 664:     OS664_BASIC664 + AMSDOS in ROM slot 7
      CPC 6128:    OS_BASIC11 + AMSDOS in ROM slot 7
      CPC+:        6128P system cartridge (or user-provided .cpr file)
