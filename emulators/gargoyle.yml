source: "https://github.com/garglk/garglk"
upstream: "https://github.com/garglk/garglk"
profiled_date: "2026-08-08"
source_commit: "520c3cbca2d8956d9f4b7e4e9ca2a92dce59778d"
core_version: "2026.1"
display_name: "Interactive Fiction (Gargoyle)"
cores:
  - gargoyle
systems:
  - adrift
  - advsys
  - agt
  - alan
  - glulx
  - hugo
