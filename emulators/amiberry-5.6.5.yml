emulator: "Amiberry 5.6.5"
type: standalone
core_classification: frozen_snapshot
source: "https://github.com/BlitterStudio/amiberry"
upstream: "https://github.com/tonioni/WinUAE"
profiled_date: "2026-11-09"
source_commit: "5c54536997c0039aaa72bb0552cefdc3c967ad8d"
pin_frozen: "ROCKNIX, the only platform that ships it, builds this revision (ROCKNIX projects/ROCKNIX/packages/emulators/standalone/amiberry/package.mk:5\
  \ at 20261101). Later commits are not part of that build."
pin_build:
- platform: rocknix
  repo: "https://github.com/ROCKNIX/distribution"
  revision: "20261101"
  path: "projects/ROCKNIX/packages/emulators/standalone/amiberry/package.mk"
  variable: PKG_VERSION
  value: "5c54536997c0039aaa72bb0552cefdc3c967ad8d"
core_version: "5.6.5"
version_basis:
  kind: file
  path: "src/osdep/target.h"
  pattern: "AMIBERRYVERSION _T\\(\"Amiberry v([0-9][0-9.]*)"
display_name: "Commodore - Amiga (Amiberry 5.6.5)"
cores:
- "amiberry"
- "AMIBERRY"
built_by:
- "rocknix"
systems:
- "commodore-amiga"
- "commodore-cd32"
- "commodore-cdtv"
standalone_directories:
- "getcwd"
- "rom_path = kickstarts"
notes: |
  Amiberry 5.6.5 (src/osdep/target.h:27). Every folder it reads is below
  its start path: $EXTERNAL_FILES_DIR or $XDG_DATA_HOME when either holds a
  data folder, else the working directory. The ROM path is kickstarts/ below
  it unless rom_path in conf/amiberry.conf names another folder, and the
  WHDLoad booter reads whdboot/ (src/osdep/amiberry.cpp:3592-3638,
  3798-3812, 3351).

  The ROM scan reads the files of the ROM path and of the folders directly
  below it and names each one by the ROM database (src/rommgr.cpp roms[]).
  The American Laser Games and Picmatic arcade ROMs of the database are game
  content and left out.
  A Kickstart the configuration names is opened as given, then below the start
  path: the fallbacks there join the start path and roms/kick.rom with no
  separator, so they name no folder of it (src/memory.cpp:1864-1895).
