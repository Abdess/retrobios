data_root:
  windows:
    path: "<working directory>"
    source_ref: "Src/OSD/Windows/FileSystemPath.cpp:28-51"
    note: "Config/, Assets/, NVRAM/, Saves/ and ROMs/ are relative names, so the folder the release archive is extracted to when started from it"
  macos:
    path: "<working directory>"
    source_ref: "Src/OSD/OSX/FileSystemPath.cpp:28-49"
    note: "relative names, as on Windows"
  linux:
    path: "~/.local/share/supermodel, else $XDG_DATA_HOME/supermodel"
    source_ref: "Src/OSD/Unix/FileSystemPath.cpp:51-160"
    note: "~/.supermodel when it exists, and the working directory when Config/ is there or no home directory resolves. Config sits apart, in ~/.config/supermodel/Config or $XDG_CONFIG_HOME/supermodel/Config"

notes: |
  Open-source Sega Model 3 arcade emulator by Bart Trzynadlowski (trzy) and
  contributors, under GPL-3.0. Emulates all three Model 3 steppings (1.0, 1.5,
  2.0/2.1) including Real3D graphics, SCSP sound, DSB1/DSB2 MPEG music boards,
  drive boards, and net board. Cross-platform (Windows, Linux, macOS). The
  standalone build also emulates Sega Model 1 and Sega Model 2 (steppings 2,
  2A, 2B and 2C). Games.xml declares their games as ROM sets like the Model 3
  ones, and no system file is read for either board.
  ref: Src/GameLoader.cpp:274-335, Src/OSD/SDL/Main.cpp:2616-2626

  The libretro core is Libretro-Supermodel, developed by sgiannop on top of
  the 2019 libretro attempt and now held under the libretro organisation on
  GitHub, mirrored at the same revision on git.libretro.com where the buildbot
  pipeline lives (.gitlab-ci.yml). It carries the whole Supermodel tree with
  its own OSD under Src/OSD/libretro and reports v0.3a-libretro. The older
  libretro/supermodel repository on GitHub keeps the full trzy history and
  received the same feature branch as its PR #2, but has no CI file and is
  not what the buildbot publishes.
  ref: Src/OSD/libretro/libretro.cpp:937-938, Docs/README.md:5-12

  Uses MAME-compatible ROM sets loaded from ZIP archives. GameLoader identifies
  games by CRC32 checksums defined in Games.xml. Parent/child ROM set
  relationships exist between regional variants of the same game, not as shared
  BIOS sets. No standalone BIOS or firmware files are loaded outside of game ZIPs.
  The core routes the ZIP reads through the libretro VFS.
  ref: Src/OSD/libretro/LibretroWrapper.cpp:828-832, Src/OSD/libretro/vfs_ioapi.cpp

  Standalone: four data files of its own are read from the install tree, Config/
  and Assets/ relative to the working directory on Windows and macOS. On Linux
  the same relative directories are used when Config/ exists in the working
  directory, otherwise ~/.supermodel/ when present, otherwise the XDG data and
  config homes. Supermodel.ini is written from a compiled-in default when it is
  absent and rewritten after interactive input configuration and when the
  GUI saves its settings. NVRAM/<game>.nv and Saves/<game>.st<slot> are
  written by the emulator itself.
  ref: Src/OSD/Windows/FileSystemPath.cpp:28-51, Src/OSD/OSX/FileSystemPath.cpp:28-50,
       Src/OSD/Unix/FileSystemPath.cpp:51-160, Src/OSD/SDL/Main.cpp:1467-1486,
       Src/OSD/SDL/Main.cpp:1518, Src/OSD/SDL/Gui.cpp:1536,
       Src/OSD/SDL/Main.cpp:2364

  The standalone also emulates the Real3D Pro-1000. Games.xml declares it as
  the set pro1000 with platform Real3D Pro-1000, and its firmware (p1_p4.bin,
  p2.bin) is a ROM set loaded like any game, not a system file. Programs for
  the Pro-1000 reach the emulated board through wnaspi32.dll, which the
  project builds for the folder of those programs and Supermodel never opens.
  ref: Config/Games.xml:10030-10054, Src/GameLoader.cpp:274-335,
       Src/OSD/Windows/wnaspi32/wnaspi32.cpp:3-15

  Libretro: retro_init joins "supermodel" to the frontend system directory and
  the core creates that directory through the VFS. Supermodel.ini, Games.xml and
  Music.xml are looked up flat in it first, then under a Config/ subdirectory
  kept for the initial port's layout. Games.xml and Supermodel.ini are also
  compiled into the binary from the repository copies, and when neither layout
  holds the file the embedded bytes are written to the flat path on first run.
  An external file is read in preference to the embedded one and never updated
  afterwards. Music.xml has no embedded copy.
  ref: Src/OSD/libretro/libretro.cpp:855-863, Src/OSD/libretro/libretro.cpp:889-894,
       Src/OSD/libretro/libretro.cpp:1113, Src/OSD/libretro/LibretroWrapper.cpp:166-206,
       Src/OSD/libretro/LibretroWrapper.cpp:208-228, Makefile:699-712, Makefile:718-720

  Libretro NVRAM is the frontend .srm through the memory API. On the first frame
  a <game>.nv written by the standalone build is imported from the save directory
  when the .srm is empty. It is never written back. Save states are serialised in
  memory, and a state file on disk is loaded only when InitStateFile names one,
  which the core option layer leaves empty.
  ref: Src/OSD/libretro/libretro.cpp:766-781, Src/OSD/libretro/libretro.cpp:1380-1409,
       Src/OSD/libretro/libretro.cpp:1685-1690, Src/OSD/libretro/LibretroWrapper.cpp:479,
       Src/OSD/libretro/LibretroWrapper.cpp:544-545, Src/OSD/libretro/LibretroConfigProvider.h:15

  The Legacy3D renderer compiles its shaders from built-in strings and reads a
  file only when VertexShader or FragmentShader names one, and both default to an
  empty string in either build.
  ref: Src/Graphics/Shader.cpp:52-63, Src/Graphics/Shader.cpp:100-108,
       Src/OSD/libretro/LibretroConfigProvider.h:22-23

  EmuDeck installs the Flatpak package (com.supermodel3.Supermodel). Config
  stored in ~/.supermodel/Config/. No checkBIOS entry in EmuDeck.

files:
  - name: Games.xml
    standalone_path: "Config/Games.xml"
    mode: standalone
    required: true
    bundled: true
    size: 498173
    sha1: "0c7ee725d44f5fbc67700f86fcff7961cefaad60"
    md5: "38cf442c8df6e8e24f8cf6af36eded54"
    description: "ROM set definitions"
    note: "Parsed at startup into the game database. Every ROM region, file name and CRC32 the loader matches against comes from here, so an unreadable file leaves no set to resolve and the launch returns before the emulator is built. The path is a config key, so -game-xml-file moves it. Nothing about the file is verified beyond parsing. The hash is that of the copy the pinned revision ships."
    source_ref: "Src/OSD/SDL/Main.cpp:125, 1579, 2071, 2450-2460, Src/GameLoader.cpp:658-668, 1166-1169"

  - name: Games.xml
    path: "supermodel/Games.xml"
    mode: libretro
    required: false
    bundled: true
    has_builtin: true
    size: [148364, 148362]
    sha1:
      - "fa334ab5ba6366bd28168860c913e6365b9fec96"
      - "57500ad35b883acb5e7766c04f5b42e65185715c"
    md5:
      - "2d16307ceb658636a05d34c7ba935b48"
      - "29fd5bc40cea222e040c1a1cfd60ea2e"
    description: "ROM set definitions, libretro copy"
    note: "Read through the VFS from {system}/supermodel/Games.xml, or Config/Games.xml under it, and parsed from memory. When neither path holds a file the core writes its embedded copy to supermodel/Games.xml at startup, and when the read still yields nothing the compiled-in bytes are parsed instead, so the core identifies every set without a file supplied, but a file that is present takes precedence. The second hash is the embedded array, which predates the indentation cleanup of the repository copy by one tab."
    source_ref: "Src/OSD/libretro/LibretroWrapper.cpp:187-206, Src/OSD/libretro/LibretroWrapper.cpp:221-222, Src/OSD/libretro/LibretroWrapper.cpp:822, Src/OSD/libretro/LibretroWrapper.cpp:834-859, Src/GameLoader.cpp:1019-1030, Makefile:710-712"

