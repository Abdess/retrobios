notes: |
  Multi-system emulator by the Mednafen Team, the upstream of the beetle_* and
  mednafen_* libretro cores, which are forks of individual modules. A module is
  picked automatically from the file, or forced with -force_module <name>.

  Every firmware file resolves to <base>/<filesys.path_firmware>/<name>, with
  filesys.path_firmware defaulting to "firmware" and the base directory being
  ~/.mednafen on Unix. An absolute path in either the setting or the per-file
  path setting bypasses that. A file placed directly in the base directory is
  still found, as a pre-0.9.0 compatibility fallback.
  ref: general.cpp:277-300, mednafen.cpp:124

  Modules compiled by default that load no external file: gb, snes, snes_faust,
  vb, wswan, ngp, sms, gg. The snes module (bsnes 0.059) has every coprocessor
  ROM compiled in; snes_faust synthesises the DSP-1 and CX4 data ROMs
  (cart/dsp1-datarom-synth.h, cart/cx4.cpp:58); ngp installs a reverse
  engineered HLE BIOS (ngp/bios.cpp:182-239).

  The nes_new module is declared but never built: configure.ac:392-393 keeps
  both the AC_DEFINE and the AM_CONDITIONAL commented out.

  cdplay (audio CD), ssfplay (Saturn SSF) and sasplay (Sega Model 2/3 SCSP
  sound) are player modules, not system emulation. sasplay reads the board's
  sound ROM set from the directory of the loaded file, never from the firmware
  directory (sasplay.cpp:869-886), so those ROMs are game content.

  Two settings name an external file that is not firmware data. wswan.excomm.path
  ("wonderfence") is an executable forked and execlp'd for link comms
  (comm.cpp:56-65). Custom palettes resolve to <gamebase>.pal,
  <gamebase>.<md5>.pal or <shortname>.pal (general.cpp:303-322) and are
  user-authored.

  ES-DE invokes the binary as %EMULATOR_MEDNAFEN% -force_module <module> %ROM%
  and declares no BIOS of its own.

files:
  # --- apple2 ---
  # apple2.model defaults to "ii_ii+" (apple2.cpp:3137). Under that model the
  # system firmware is Applesoft and the ROM card is Integer (apple2.cpp:1868-1870),
  # but the ROM card is skipped while the language card is active, which 64 KiB
  # of RAM enables (apple2.cpp:2238, 2362). Loading a DOS 3.2 disk forces RAM to
  # 48 KiB and the Disk II firmware to 13-sector (apple2.cpp:2000-2006), which
  # brings both the ROM card and the 13-sector pair into play with no user action.

  - name: "apple2-asoft-auto.rom"
    system: apple-ii
    description: "Apple II+ AppleSoft BASIC and Autostart system ROMs, concatenated (341-0011, 341-0012, 341-0013, 341-0014, 341-0015, 341-0020)"
    required: true
    min_size: 12288
    sha256: "fc3e9d41e9428534a883df5aa10eb55b73ea53d2fcbb3ee4f39bed1b07a82905"
    validation: [size]
    source_ref: "apple2/apple2.cpp:1342-1350, 1869, 2282, 1473-1476"
    note: "System firmware for model ii+, ROM card for model ii. Read as 0x3000 bytes at $D000. The hash is in the ROMDB table and only labels the dump in the startup log; nothing rejects a mismatch."

  - name: "apple2-int-auto.rom"
    system: apple-ii
    description: "Apple II Integer BASIC and Autostart system ROMs, concatenated (341-0001, 341-0002, 341-0003, 341-0020)"
    required: true
    min_size: 8192
    sha256: "cb52b212a62f808c2f59600b2823491ee12bd91cab8e0260fe34b5f14c47552f"
    validation: [size]
    source_ref: "apple2/apple2.cpp:1352-1363, 1860, 2284, 2392, 1468-1471"
    note: "System firmware for model ii, ROM card for model ii+. Read as 0x2000 bytes at $E000, the $D000-$DFFF window stays unmapped. Reached under the default model when a DOS 3.2 disk drops RAM to 48 KiB."

  - name: "apple2e.rom"
    system: apple-iie
    description: "Apple IIe BASIC and system ROMs, concatenated (342-0135-A, 342-0134-A)"
    required: true
    min_size: 16384
    sha256: "1fb812584c6633fa16b77b20915986ed1178d1e6fc07a647f7ee8d4e6ab9d40b"
    validation: [size]
    source_ref: "apple2/apple2.cpp:1320-1325, 2266, 1478-1481"
    note: "Loaded unconditionally when apple2.model is iie. Read as 0x4000 bytes at $C000."

  - name: "apple2e-video.rom"
    system: apple-iie
    description: "Apple IIe video (character generator) ROM, 342-0133-A"
    required: true
    min_size: 4096
    sha256: "ed5bdd4afa509134e85f1d020685af7ff50e279226eb869a17825b471cc1634c"
    validation: [size]
    source_ref: "apple2/apple2.cpp:2299-2324, 1488-1491"
    note: "Loading aborts on sha256 0d54ff735c060c55d54b8a22d0112af78a6465ce9c9aae4a865d207e5c8ff1e7, a known bad dump (apple2.cpp:2319-2320). No positive hash check."

  - name: "apple2e-kb.rom"
    system: apple-iie
    description: "Apple IIe keyboard ASCII mapping ROM, 342-0132-B"
    required: true
    min_size: 2048
    sha256:
      - "68198ae95923926b0307893d03ec286f00822c93a0b6dabfca565f6718dd5a56"
      - "fbb9620e01f4f728e5a8ba86544900978d7803f6a7d577d384e288dfed9a4907"
