    source_ref: "apple2/apple2.cpp:2331-2351, 1498-1506"
    note: "The first hash is 342-0132-B, the second the revised IIe dump 342-0132-C; both are recognised at this filename and neither is checked. Read as 0x800 bytes."

  - name: "apple2e-enh.rom"
