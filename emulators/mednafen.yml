    source_ref: "psx/psx.cpp:1764-1769, 1773-1781, 2374, 252"
    note: "Default of psx.bios_na. The BIOS table carries 24 recognised dumps in total, two of them flagged bad (psx.cpp:228-268)."

  - name: "scph5502.bin"
