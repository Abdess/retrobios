  # five hashes below are checked three ways: a file carrying one of these
  # names must hash to the matching digest, a recognised hash must belong to
  # the area being emulated, and a Saturn hash is refused for ST-V and the
  # reverse (ss.cpp:1447-1492).

  - name: "sega_101.bin"
