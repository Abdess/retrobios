  # --- md ---

  - name: "us_scd1_9210.bin"
    system: sega-megacd
    description: "Sega CD BIOS"
    required: true
    size: 131072
    validation: [size]
    source_ref: "md/cd/cd.cpp:894-915, 971-989, md/system.cpp:630-641, 801, 755"
    note: "Default of md.cdbios. LoadCD is wired into the module and reaches MDCD_Init, which throws unless the file is exactly 131072 bytes. The setting's own help text states that Sega CD emulation is currently nonfunctional."

  # --- gba ---

  - name: "gba_bios.bin"
    system: nintendo-gba
    description: "Game Boy Advance BIOS"
    required: false
    hle_fallback: true
    size: 16384
    validation: [size]
    source_ref: "gba/GBA.cpp:2470-2494, 3278, 772"
    note: "Path comes from gba.bios, which defaults to the empty string and is skipped for the values 0, none and the empty string, so Mednafen names no default file; the name here is the one the dump circulates under, to point the setting at. When set, the file must be exactly 16384 bytes. Otherwise the built-in HLE BIOS myROM is used, and the setting is ignored outright for GSF playback."
