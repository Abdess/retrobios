exclusion_note: >
  XeniOS emulates the Xbox 360 by high-level emulation: the kernel, XAM and
  XBDM are compiled-in modules, the XEX AES keys are constant arrays and XConfig
  is synthesised, so no BIOS, NAND image, flash dump or keyvault is read. The
  one system file it takes is an optional USB system update, installed into
  its storage root for the dashboard, the system fonts and XNA indie games.
  Its own data (UI fonts, icons, locale catalogues, SDL controller mappings,
  game patches, compatibility lists) is compressed into the executable through
  xe_embed_binary_assets and xe_embed_compressed_bundle, so none of it exists
  as a file beside the binary. libmetalirconverter.dylib is linked at build
  time and resolved by the loader through @rpath, no code path names it, and
  it comes with the download that provides the executable.
