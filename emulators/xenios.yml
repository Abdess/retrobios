exclusion_note: >
  XeniOS emulates the Xbox 360 by high-level emulation and reads no BIOS,
  firmware, NAND image, flash dump or keyvault at any point: the kernel, XAM
  and XBDM are compiled-in modules, the XEX AES keys are constant arrays and
  XConfig is synthesised. Its own data (UI font, icons, locale catalogues, SDL
  controller mappings, game patches, compatibility lists) is compressed into
  the executable through xe_embed_binary_assets and xe_embed_compressed_bundle,
  so none of it exists as a file beside the binary. The three cvars that accept
  a path default to empty and fall back to those embedded copies. The two
  dylibs under Contents/Frameworks, libmetalirconverter.dylib and
  libdxilconv.dylib, are shader translation components linked at build time and
  resolved by the loader through @rpath; no code path names them, and they are
  obtained by the same download that provides the executable.
