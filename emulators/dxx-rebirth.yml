notes: |
  DXX-Rebirth is a dual-engine source port of Descent 1 and Descent 2
  built from the Parallax-released sources. The repository builds two
  executables, d1x-rebirth and d2x-rebirth, sharing the similar/ tree
  guarded by DXX_BUILD_DESCENT = 1 or 2.

  Each build mounts its data via PhysFS. The game folder (defaulted to
  the executable directory on Windows/macOS, DXX_SHAREPATH or
  ~/.d1x-rebirth / ~/.d2x-rebirth on Unix) is searched for the HOG and
  PIG files; -hogdir on the command line adds another search path. On
  startup similar/main/inferno.cpp mounts descent.hog (D1) or
  descent2.hog / d2demo.hog (D2) via make_PHYSFSX_ComputedPathMount at
  lines 472-479. If neither hog is found the engine aborts with
  UserError "Could not find a valid hog file".

  The size of the HOG picks the data edition (common/main/mission.h:58):
    6856701 / 6856183 / 7261423 bytes = PC Descent 1 retail v1.4-v1.5 / v1.0
    4492107 / 4494862 bytes          = PC Descent 1 OEM v1.4a / v1.0
    2339773 / 2365676 bytes          = PC Descent 1 shareware v1.4 / v1.0
    7456179 / 3370339 bytes          = Mac Descent 1 retail / shareware
    2292566 bytes                    = d2demo.hog v1.0 (D2 PC shareware)
    4292746 bytes                    = D2 Mac shareware
    6132957 bytes                    = D2 PC OEM v1.1
    7595079 / 7107354 bytes          = D2 PC full v1.1-1.2 / v1.0
    7110007 bytes                    = D2 Mac full v1.1-1.2

  For Descent 2 the engine also expects descent2.ham (binary tables) and
  one of the PIG graphics families (groupa.pig / alien1.pig / alien2.pig
  / fire.pig / ice.pig / water.pig for retail, d2demo.pig for shareware)
  plus the sampled sound bank (descent2.s11 for 11 kHz or descent2.s22
  for 22 kHz; piggy.cpp:79). Mac shareware additionally bundles exit.ham.
  d2x.hog is the Descent 2: Vertigo expansion mission, probed in the
  MISSION_DIR by inferno.cpp:542 to toggle the "Vertigo Enhanced" title.
  Movies (intro-h.mvl, robots-h.mvl, other-h.mvl or their -l low-res
  counterparts) are optional; the game plays without them.

  Only the free PC shareware pair (desc14sw.tar.gz = descent.hog +
  descent.pig; d2shar10.tar.gz = d2demo.hog/pig/ham) is redistributable;
  the retail archives listed below are commercial GOG files.

