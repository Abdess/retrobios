  # ------ Add-on archives ------
  # add_archives_to_search_path() mounts every *.dxa found at the root of
  # the search path; the code names the extension, not the files. The names
  # below are the add-ons the project publishes. Each build has its own data
  # directory (d1x-rebirth, d2x-rebirth), so an archive is seen by one game.
  - name: "d1xr-hires.dxa"
