notes: |
  EmuHawk, the BizHawk front end, at release 2.11.1. RetroBat's bizhawk.7z
  holds the earlier 2.11 release, whose assemblies carry the informational
  version "2.11+427556b5ef3ac437eba754d90c5e7e9096c9a8df" (EmuHawk.exe,
  dll/BizHawk.Common.dll), and an empty Firmware folder. Against 2.11, the
  2.11.1 firmware table rates one option Ideal in the A78 NTSC, Apple II,
  GBA, Mega CD (each region), NDS firmware, PC-FX SCSI ROM, SMS and TI-83
  slots, adds the TI-83 v1.10 ROM and the Doom 2 IWAD slot, and rates every
  TI-83 Plus ROM Unacceptable for the TI-83 slot.

  Every firmware the cores can ask for is declared in FirmwareDatabase.cs as a
  slot (system and id, for example PSX+U) with one or more options, each a
  file of fixed size and SHA-1 with a status. At startup and on each load the
  firmware folder is walked recursively, every file whose length matches a
  known firmware size is hashed, and each slot takes the present option of
  best status. Only Ideal and Acceptable options are taken this way.
  Unacceptable and Bad options, and slots whose only option has a placeholder
  hash (3DS keys, DSi firmware and NAND), are never found by the scan. The
  file name plays no part.
  ref: src/BizHawk.Client.Common/fwmanager/FirmwareManager.cs:143-174,
       src/BizHawk.Emulation.Common/Database/FirmwareOption.cs:15-16,
       src/BizHawk.Emulation.Common/Database/FirmwareDatabase.cs:35-71

  A user specification (FirmwareUserSpecifications, keyed "System+Id") then
  overrides the scan for its slot with a named file, whatever its hash. A
  known file bound to another slot is flagged, an unknown one is used as is.
  ref: src/BizHawk.Client.Common/fwmanager/FirmwareManager.cs:176-222,
       src/BizHawk.Emulation.Common/Database/FirmwareID.cs:11

  Each entry is named by the recommended name FirmwareDatabase.cs gives its
  file. The name is a label: the scan finds the file anywhere under the
  firmware folder by hash, and a user specification can name any file.
  Unacceptable and Bad options, and slots with a placeholder hash, are
  reached only through a user specification. The six DSi NAND slots
  (NDS+NAND_JPN, EUR, USA, AUS, CHN, KOR) are of that kind. In DSi mode
  (the UseDSi setting, or DSiWare content) the core takes the first of
  them that is set, in the order JPN, USA, EUR, AUS, CHN, KOR, and for a
  DSi-enhanced title only the regions its header flags allow. With none it
  stops the load.
  ref: src/BizHawk.Emulation.Common/Database/FirmwareDatabase.cs:35-71,
       src/BizHawk.Emulation.Common/Database/FirmwareDatabase.cs:405-410,
       src/BizHawk.Emulation.Cores/Consoles/Nintendo/NDS/MelonDS.cs:114, 304, 684-706

  required follows what the core does on a default configuration for that
  system's content. GetFirmwareOrThrow stops the load, GetFirmware lets the
  core continue. Slots picked by a setting (3DO and Amiga models other than
  the defaults, Channel F II, N64DD dev and USA IPLs, MSX Japan), add-on
  chips and cartridges (SNES coprocessors, Satellaview, Saturn KOF95 and
  Ultraman carts, ST-V), boot ROMs the cores replace by default (Game Boy
  family, GBA, NDS with melonDS's built-in BIOS) and the Doom 2 IWAD, read
  only when the loaded WADs carry no IWAD, are optional. Every slot with a
  real hash rates one option Ideal, and the scan prefers it. Only that
  option of a required slot is marked required, the others are
  alternatives. GEN+Boot, MSX+bios_test_ext, O2+BIOS-C52, PCFX+SCSIROM and
  SAT+E are declared but requested by no core at this revision.

  FirmwareDatabase.cs also declares three Game Boy boot ROM patch pairs.
  When a slot's option is missing but its base is present, EmuHawk writes the
  patched file next to the base and uses it, so those targets need no copy.
  ref: src/BizHawk.Emulation.Common/Database/FirmwareDatabase.cs:73-78, 218-249,
       src/BizHawk.Client.Common/fwmanager/FirmwareManager.cs:19-70

