emulator: Opera (4DO)
type: libretro
core_classification: community_fork
core: opera_libretro
cores: [opera]
source: "https://github.com/libretro/opera-libretro"
upstream: "https://sourceforge.net/projects/freedo/"
profiled_date: "2026-10-18"
source_commit: "595fd1db7d5bf0d3ca63d2292854d587ddcfa94b"
core_version: "1.0.0"
version_basis:
  kind: file
  path: "libretro.c"
  pattern: 'info_->library_version\s+=\s+"([^"]+)'
display_name: "The 3DO Company - 3DO (Opera)"
systems:
  - 3do

notes: |
  Opera is the libretro port of the 4DO/FreeDO 3DO Interactive Multiplayer emulator.
  The system ROM (rom1) is chosen by the opera_bios core option. Its default is
  Opera Boot, an open boot ROM (trapexit/opera-boot) compiled into the core as a
  zlib stream and inflated at load, so the core starts with no file at all. The
  option lists the built-in ROM first, then each BIOS file physically present in
  the system directory. A file is read with read_file_from_system_directory()
  and byteswapped on little-endian hosts.

  opera-boot.bin is the same Opera Boot image read from the system directory
  ("Opera Boot (System)"), for a newer build than the one compiled in.

  Kanji font ROMs (rom2) are optional and only needed for Japanese text rendering.
  They are loaded via opera_lr_opts_set_font() and selected via opera_font core option.

  All BIOS files are exactly 1 MB (1048576 bytes) except opera-boot.bin (128 KB),
  3do_arcade_saot.bin (512 KB) and panafz1-kanji.bin (933636 bytes).

  BIOS definitions: BIOSES[] at libopera/opera_bios.c:9-164, built-in inflate
  opera_bios_load_builtin() at libopera/opera_bios.c:234-273.
  BIOS selection and loading: opera_lr_opts.c:276-359 (get_bios, _load_bios_rom,
  set_bios). Font loading: opera_lr_opts.c:361-415.
  Core option: libretro_core_options.c:752-783 (set_bios_values) lists the
  built-in ROM and the files present.

