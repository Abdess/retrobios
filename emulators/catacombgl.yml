verification: existence

notes: |
  OpenGL source port of the Catacomb 3-D games. Seven releases are accepted,
  each with its own file table mapping a file name to an exact byte size
  (src/System/Finder.cpp:35-44):
    Catacomb Abyss v1.12, v1.13, v1.24   (src/Abyss/GameDetectionAbyss.h:28-76)
    Catacomb Armageddon v1.02            (src/Armageddon/GameDetectionArmageddon.h:27-46)
    Catacomb Apocalypse v1.01            (src/Apocalypse/GameDetectionApocalypse.h:27-46)
    Catacomb 3-D v1.00, v1.22            (src/Catacomb3D/GameDetectionCatacomb3D.h:27-39)

  Detection is per release and all-or-nothing. GetDetectionReport
  (src/Engine/GameDetection.cpp:38-73) walks one table against one folder and
  adds 2 to the score for a missing file and 1 for a file whose size differs
  from the table. A release is detected only at score 0, so every file of its
  table must be present with the listed size. A game whose score is not 0
  cannot start: the launch ends in a fatal error naming the offending files
  (src/System/CatacombGL.cpp:416-451). No hash is computed.

  Folders tried for each release, until one scores 0: the working directory
  (src/System/Finder.cpp:139-143), the folder stored in the configuration for
  that release (src/System/Finder.cpp:176-185), then for the four Catacombs
  Pack releases the GOG install folder plus Abyss, Armageddon, Apocalypse or
  Cat3D (src/System/Finder.cpp:46-52, 145-163). The selection menu can also
  browse to a folder. File names are joined to the folder as written in the
  tables, upper case.

  The selection menu groups the releases as "Catacombs Pack (GOG)" (3-D v1.22,
  Abyss v1.24, Armageddon, Apocalypse), "Shareware" (Abyss v1.12 and v1.13)
  and "Catacomb 3-D Big Box" (3-D v1.00) (src/Engine/GameSelection.cpp:71-73,
  src/System/CatacombGL.cpp:252-280). Abyss v1.12 is scanned like the others
  but its menu entry and key are compiled only when CATABYSSV112 is defined;
  the build files do not define it (src/System/CatacombGL.cpp:266-271, 313-318).

  Once a game starts, EGAGRAPH, GAMEMAPS and AUDIO are read through the
  static tables of each game and a failed open or short read is fatal
  (src/Engine/EgaGraph.cpp:50-70, src/Engine/AudioRepository.cpp:43-58). The
  SHP files are the intro pictures (src/Abyss/IntroViewAbyss.cpp:48-90,
  src/Armageddon/IntroViewArmageddon.cpp:27-76,
  src/Apocalypse/IntroViewApocalypse.cpp:27-76); Abyss v1.12 uses SDLOGO,
  TITLE, CREDITS, BEGIN and FINALE instead (src/Abyss/IntroViewAbyss.cpp:28-45,
  src/Abyss/GameAbyss.cpp:53-58). SHP10.ABS, SHP13.ARM and SHP13.APC are
  never opened but belong to the detection tables.

  Catacomb 3-D also reads CONFIG.C3D (474 bytes, written by the DOS game) from
  the game folder to import its high scores when the port has none of its own
  (src/Catacomb3D/GameCatacomb3D.cpp:52-57, src/Engine/HighScores.cpp:57-72).
  Builds defining SAVEDGAMESINDOSFORMAT also import DOS saved games from the
  game folder (src/Engine/EngineCore.cpp:123-148). Both are user state.

