notes: |
  OpenGL source port by Arno Ansems of id Software's Catacomb Adventure series:
    - Catacomb 3-D: The Descent (.C3D)
    - Catacomb Abyss (.ABS) — three releases v1.12 / v1.13 / v1.24
    - Catacomb Armageddon (.ARM)
    - Catacomb Apocalypse (.APC)

  The engine detects which game a search path points at by matching every
  filename and byte-size against a hardcoded map in src/<game>/GameDetection
  <game>.h. GameDetectionAbyss.h, GameDetectionArmageddon.h,
  GameDetectionApocalypse.h and GameDetectionCatacomb3D.h declare the
  <game>Files* std::map<std::string, uint32_t> tables used by
  src/Engine/GameDetection.cpp.

  Files are matched by exact byte size at this layer; the loaders downstream
  then open each by name through src/Engine/EngineCore.cpp. Catacomb Abyss has
  three distinct file sets (v1.12, v1.13, v1.24), and Catacomb 3-D has v1.00
  and v1.22.

  Each supported game sits in its own directory, picked by the user through
  the game selection menu (src/Engine/GameSelection.cpp). No separate BIOS is
  needed — the retail / shareware DOS data files are the only requirement.

  The Catacomb Adventure Series releases (Abyss shareware, Armageddon,
  Apocalypse) were made freeware by Flat Rock Software and are distributed by
  3D Realms. Catacomb 3-D was released as shareware; the registered v1.22 data
  is commercial.

