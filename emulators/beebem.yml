  - bbc-master-128
  - bbc-master-et

notes: |
  BBC Micro and Master Series emulator for Windows. Started by Dave Gilbert on
  Unix in 1994, ported to Windows. Five machine models: Model B, Model B with
  Integra-B board, Model B Plus, Master 128, Master ET.
  ref: Src/Model.h:24-32

  Two file roots. GetUserDataPath() defaults to <Documents>\BeebEm and falls back
  to <app>\UserData; it holds BeebFile/ and the .cfg and .kmap files. GetAppPath()
  is the program directory and holds Teletext.fnt and the sound samples.
  ref: Src/BeebWin.cpp:5813-5851

  ROM slots are read from Roms.cfg: one OS ROM plus 16 paged banks per model,
  each line naming a file under BeebFile/, or EMPTY, or RAM. Paths in the profile
  are the shipped default configuration, which matches the DefaultRoms table
  compiled into the binary.
  ref: Src/RomConfigFile.cpp:39-141
  ref: Src/BeebMem.cpp:1277-1356

  A missing Roms.cfg is not covered by DefaultRoms: Load() returns at the open
  failure, before the backfill loop, and RomConfigFile has no constructor and no
  Reset() caller, so every slot stays an empty string and no ROM loads.
  ref: Src/RomConfigFile.cpp:158-219

  Roms_Torch.cfg is the alternate configuration for the Torch Z80 co-processor,
  selected with `BeebEm.exe -Roms Roms_Torch.cfg` by the shipped BeebEmTorch.vbs.
  It adds the MCP host-tube ROMs and swaps the Integra-B slots.
  ref: UserData/Roms_Torch.cfg, BeebEmTorch.vbs:3

  ReadRom derives a .map path from every ROM file name and hands it to the
  debugger symbol loader. Only BBC/OS12.map ships.
  ref: Src/BeebMem.cpp:1252-1254, 1311-1313

  No hash is verified anywhere. The code checks sizes only, per entry below.
  Hashes here identify the dumps the emulator ships.

  BeebFile/ also carries an application ROM library (word processors, drawing
  packages, language ROMs) and DiscIms/ carries the disc images supplied with the
  Master 512, ARM and Z80 co-processors. No code path names them; they load only
  through the file browser in Edit ROM Configuration, the same way a disc image
  does.
  ref: Src/RomConfigDialog.cpp:179-215

  Alternate dumps ship under their own names for slots already listed here:
  BeebFile/M128-MOS3.5/ holds the MOS 3.50 set for the M128 slots, and
  BeebFile/Z80-1.20.rom is the Acorn v1.20 Z80 ROM. Both are used by renaming
  them onto the listed paths, so they are variants of those entries.
  ref: Help/roms.html, Help/z80copro.html

exclusion_note: >
  The TMS5220 speech generator is compiled out. Speech.cpp:57-1621 wraps the whole
  implementation, including the SpeechInit() that reads Phroms.cfg and the PHROM
  files, in #if ENABLE_SPEECH, and all four build configurations in
  Src/BeebEm.vcxproj define ENABLE_SPEECH=0. Every call site is guarded the same
  way. UserData/Phroms.cfg and the seven files in UserData/Phroms/ (PHROMA,
  PHROMUS, VM61002-5.bin, VM71003A.bin) ship but no released binary opens them.
  ref: Src/BeebEm.vcxproj:98,117,134,157 - Src/Speech.cpp:57,1621 - Help/speech.html

