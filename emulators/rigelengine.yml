pin_frozen: "EmuELEC, the only platform that ships it, builds this revision (EmuELEC packages/sx05re/emuelec-ports/rigelengine/package.mk:5 at v4.8). Later commits are not part of that build."
pin_build:
  - platform: emuelec
    repo: "https://github.com/EmuELEC/EmuELEC"
    revision: "v4.8"
