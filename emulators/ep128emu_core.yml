emulator: "ep128emu"
type: libretro
core_classification: community_fork
display_name: "Enterprise - 64/128 (ep128emu)"
source: https://github.com/libretro/ep128emu-core
upstream: https://github.com/istvan-v/ep128emu
profiled_date: "2026-03-30"
source_commit: "6af5d03de220e6effcd0ffcd99e0fb8e8c77cc9e"
core_version: "v1.2.13"
version_basis:
  kind: file
  path: "core/main.cpp"
  pattern: 'library_version\s*=\s*"([^"]+)"'

cores:
  - ep128emu_core
  - ep128emu-core
  - ep128emu

systems:
  - enterprise-64
  - enterprise-128
  - videoton-tvc
  - amstrad-cpc
  - zx-spectrum

notes: >-
  Emulates Enterprise 64/128, Videoton TVC, Amstrad CPC 464/664/6128,
  and ZX Spectrum 16/48/128. ROMs are read from <system_dir>/ep128emu/roms/
  (core/core.cpp:59). The content type is detected from the extension and
  header (core/main.cpp) and selects the machine and the ROM layout
  (core/core.cpp:195-412). For each ROM slot the core opens the file by
  name, then the alternative names of rom_names_ep128emu_tosec
  (core/core.hpp:81-119, TOSEC names and split OS/BASIC halves for the
  CPC), then the copy compiled into roms/roms.hpp under "_default_<name>"
  (core/core.cpp:513-548). Every ROM has a built-in copy except
  ide12.rom. The md5 values are those of the built-in copies. Custom ROM
  mappings are possible via .ep128cfg config files placed in
  ep128emu/config/ or next to content. The .info declares epd19hft.rom
  and zt19hfnt.rom, and no code path in the core opens either file. The
  .info does not list epdos16f.rom and exdos14isdos10uk.rom, which the
  code loads. SDEXT, ReSID, and MIDI port features are compile-disabled
  in the libretro build.

