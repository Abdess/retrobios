notes: |
  Full RSDKv5 decompilation of Sonic Mania (Christian Whitehead / Headcannon,
  2017). Links against the shared RSDKv5-Decompilation engine; game code
  lives in SonicMania/ and the engine in dependencies/RSDKv5.

  LoadDataPack reads an RSDK v5 container with a 4-byte "RSDK" signature,
  then a version byte and a 16-bit file count followed by MD5+offset+size
  per entry. The signature is the only validation; the engine never hashes
  the full pack.
  ref: dependencies/RSDKv5/RSDKv5/RSDK/Core/Reader.cpp:107-164 (LoadDataPack)

  Settings.ini key Game:dataFile overrides the default "Data.rsdk". If
  the ini is absent the engine still calls LoadDataPack("Data.rsdk").
  ref: dependencies/RSDKv5/RSDKv5/RSDK/User/Core/UserCore.cpp:313,557

files:
