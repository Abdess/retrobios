    note: |
      Sonic Mania game assets (RSDK v5 container, "RSDK" signature). Shipped
      inside the official Sonic Mania release (Steam, Epic, consoles). The
      engine aborts gameplay if the pack cannot be opened; without it only
      the dev-menu error path runs.
