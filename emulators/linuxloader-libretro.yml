notes: |
  The buildbot's linuxloader core: Linux Loader v3.0.14 with a libretro
  frontend that runs the loader as a process of its own and trades input,
  frames and audio with it through shared memory
  (src/libretro/linuxloader_libretro.c:1-11, src/loader/libretro/libretroBridge.c).
  The loader comes from <system>/linuxloader (linuxloader_libretro.c:1155):
  its AppDir, run through AppRun on x86_64 and through FEX-Emu with an i386
  root file system on aarch64, or linuxloader.exe and ll-deps/ on Windows
  (linuxloader_libretro.c:964-1100). The buildbot builds the core with
  SYSTEM_ZIP, so it carries that folder and writes it there when it is from
  another build or missing (.gitlab-ci.yml:1-15, 51-68,
  Makefile.libretro:31-35, linuxloader_libretro.c:821-900): the runtime
  libraries below come with the core.

  The loader starts in the game folder (chdir before AppRun,
  linuxloader_libretro.c:1061), so the files it opens by a relative
  name are read there. The core starts it with the game's ELF and, in test
  mode, -t, never -s: segaboot is not run unless it is the content. The
  Zink path for Primeval Hunt is compiled out (src/loader/mainW.cpp:144-150),
  and the Windows loader takes the system's opengl32.dll.

