notes: |
  trngaje's package around the closed-source 64-bit Linux DraStic. The
  repository carries the DraStic binary itself, md5 59a7711eff41c640b8861b4d869c747d
  (sha256 6e11511907f21888), stripped, which draws "Version r2.5.2.0" in its
  menu, together with its system, config, resources and microphone
  directories, game_database.xml and usrcheat.dat. launch.sh puts libs/ under
  its own directory on LD_LIBRARY_PATH, changes to that directory and runs
  ./drastic on the content, so that directory is the root every path below is
  joined to.
  ref: launch.sh:1-9,
       drastic r2.5.2.0 FUN_93140 0x931b4-0x931cc (draws the version string)

  KNULLI builds this revision, installs the whole tree under
  /usr/share/advanced_drastic, copies it to
  /userdata/system/configs/advanced_drastic on first launch or after a board
  change, then starts launch.sh from there. The copy includes the Nintendo
  BIOS and firmware images the repository ships, so the platform installs
  them with the emulator.
  ref: KNULLI package/emulators/advanced_drastic/advanced_drastic.mk:7-14,
       KNULLI package/system/knulli-configgen/configgen/configgen/generators/advanced_drastic/advanced_drasticGenerator.py:30-50,156-158

  The binary names the same system files as DraStic r2.5.2.2: each BIOS slot
  takes the Nintendo image, then the free DraStic one ("Can't find Nintendo
  ARM9 BIOS. Trying free DraStic ARM9 BIOS."), the firmware is
  nds_firmware.bin alone, a file of the wrong length is refused with "System
  file %s is the wrong size", and an empty slot ends in "FATAL: Could not load
  system files." It carries neither the firmware editor's
  nds_firmware_modified.bin nor game_database_user.xml. The root also serves
  game_database.xml, usrcheat.dat, microphone/<game>.wav then
  microphone/microphone.wav, scripts/<game>.lua then scripts/default.lua,
  cheats/<game>.cht, slot2/<game>.gba, drastic_dldi.img for homebrew and the
  drastic_logo_<n>.raw splash. The functions are unnamed and are matched to
  their r2.5.2.2 names by the strings and calls they share: FUN_fbd0 is
  load_system_file, FUN_1e7e0 initialize_memory, FUN_10920 initialize_system,
  FUN_84640 initialize_gamecard, FUN_86cf0 initialize_game_database, FUN_94650
  load_cheat_directory, FUN_81720 reset_spu, FUN_839d0 load_nds, FUN_951e0
  load_custom_cheats, FUN_82c50 gamecard_load_gba, FUN_82480
  gamecard_initialize_homebrew and FUN_93360 load_logo.
  ref: drastic r2.5.2.0 FUN_fbd0 0xfc18-0xfd04, drastic r2.5.2.0 FUN_1e7e0 0x1ed78-0x1ef6c,
       drastic r2.5.2.0 FUN_10920 0x10ab8-0x10b84, drastic r2.5.2.0 FUN_84640 0x84678-0x846d0,
       drastic r2.5.2.0 FUN_81720 0x819c8-0x81a78, drastic r2.5.2.0 FUN_839d0 0x83c30-0x83cd0,
       drastic r2.5.2.0 FUN_951e0 0x952a4-0x952c4, drastic r2.5.2.0 FUN_82c50 0x82c98-0x82cdc,
       drastic r2.5.2.0 FUN_82480 0x824f4-0x825ac, drastic r2.5.2.0 FUN_93360 0x933b8-0x93400

