notes: |
  Lua 2D game framework at tag 0.10.2, kept by RetroPie beside the 11.x
  package for games written against the 0.10 API
  (scriptmodules/ports/love-0.10.2.sh). RetroPie runs `love %ROM%` with a
  .love archive or a game directory.

  boot.lua first tries the executable itself as a fused archive, then the
  path given on the command line (src/scripts/boot.lua:275-296), and stops
  with "No code to run" when neither holds main.lua
  (src/scripts/boot.lua:500-506). conf.lua and every asset come from the
  game. boot.lua and nogame.lua are compiled in as headers, and the default
  font is Vera.ttf compiled in (src/modules/font/Font.cpp:34-41). Nothing
  is read from a BIOS or system directory.

