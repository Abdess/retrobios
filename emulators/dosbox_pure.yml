notes: |
  No BIOS required. MT-32, Sound Canvas and SoundFont support is optional for
  MIDI music.

  ROM scanning (both modes):
    Recursive scan of system directory for *_CONTROL.ROM and *.SF2/*.SF3.
    ref: dosbox_pure_libretro.cpp:1387-1404
    MT-32 requires matched pair: *_CONTROL.ROM + *_PCM.ROM (PCM name derived
    from CONTROL name by replacing CONTROL with PCM, preserving case).
    ref: src/gui/midi_mt32.h:189-199
    ZIP archives also supported, scanned for files by size (65536/131072 =
    control, 524288/1048576 = PCM), not by name.
    ref: src/gui/midi_mt32.h:160-166
    Files can also be on mounted C: drive (DOSBOX.SF2, MT32_CONTROL.ROM,
    ROM1.BIN).
    ref: dosbox_pure_libretro.cpp:2804-2811
    Cache file DOSBoxPureMidiCache.txt written when scan >2s (libretro build
    only).
    ref: dosbox_pure_libretro.cpp:1417-1440,1445-1464

  Sound Canvas: the scan also lists every file whose name ends in ROM1.BIN,
  WAVEROM1.BIN excepted, as "Sound Canvas SC-55". Selected, the Nuked-SC55
  driver opens it at exactly 32768 bytes, then ROM2, ROM2_ST, ROM_SM,
  WAVEROM1, WAVEROM2 and WAVEROM3 beside it, spelled with the capitalization
  and extension of ROM1.BIN. Each file fills the slot its size names. Byte 67
  of ROM1 selects the model, SC-55mkII/SC-55st, SC-55/SC-155, CM-300/SCC-1,
  JV-880 or SCB-55, and the sizes the other ROMs must have. The driver does
  not open without ROM1 and ROM2.
  ref: dosbox_pure_libretro.cpp:1399, src/gui/midi_sc55.h:38-47,
       src/gui/midi_sc55.h:71-95, src/gui/midi_sc55.h:97-134

  Bundled MUNT (header-only mt32emu.h) for MT-32 emulation.
  SHA1+size validation at load: unrecognized ROMs rejected (Synth::open fails).
  ref: src/gui/mt32emu.h:2982-2988,3016-3019,5183-5187
  12 full control ROMs + 2 PCM ROMs supported (no split ROMs in this MUNT).
  TinySoundFont (tsf.h) for SF2/SF3 playback.
  No firmware entries in .info file, all MIDI files optional.

  DBP_STANDALONE build mode exists with the same scan and MIDI drivers. Its
  MIDI option offers the system MIDI driver in place of the frontend one and
  no scan cache.
  ref: dosbox_pure_libretro.cpp:81,1587,2137-2145,2306

