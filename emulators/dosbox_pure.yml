    validation: [size]
    source_ref: "source src/gui/midi_sc55.h:41, source src/gui/midi_sc55.h:78-93, source src/gui/midi_sc55.h:95"
    note: "The driver does not open without ROM1 and ROM2. ROM2_ST fills the same slot when ROM2 did not."

