  # -- Roland SC-55 family ROMs (Nuked-SC55 driver) --
  # Each selectable set is the ROM1.BIN the user picks plus the companions the
  # driver names from it, so every model is its own group of files.

  - name: "ROM1.BIN"
    path: "SC-55/ROM1.BIN"
    aliases: ["rom1.bin"]
    description: "SC-55mkII program ROM 1"
    required: false
    size: 32768
    validation: [size]
    source_ref: "source dosbox_pure_libretro.cpp:1399, source src/gui/midi_sc55.h:71-75, source src/gui/midi_sc55.h:97-101"
    note: >-
      Any name ending in ROM1.BIN anywhere under the system directory is
      listed. Byte 67 selects the emulated model, 0x12 for SC-55mkII/SC-55st.
      This set's companions are named without a prefix.

  - name: "ROM2.BIN"
    path: "SC-55/ROM2.BIN"
    aliases: ["rom2.bin", "ROM2_ST.BIN", "rom2_st.bin"]
