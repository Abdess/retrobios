notes: |
  FS-UAE 3.1.64 by Frode Solheim, the build published in the stable
  repository of the author's openSUSE Build Service project for Debian 11
  and 12 and Ubuntu 20.04 to 25.04 (BASEVERSION.FS:1). RetroPie installs
  that package rather than building the source.

  A kickstart_file other than "internal" is expanded, resolved against the
  ROM search paths and handed to UAE as kickstart_rom_file, and
  kickstart_ext_file the same way as the extended ROM
  (src/fs-uae/config.c:80-101). Unless kickstart_file is "internal", the
  Kickstarts directory and AmigaForever/Amiga Files/Shared/rom under the base
  directory are scanned for .rom and .bin files, so that a model chosen
  without a kickstart_file finds its ROM there (src/fs-uae/config.c:121-140,
  src/fs-uae/main.c:431-470).

  load_kickstart opens the named file and falls back to roms/kick.rom,
  kick.rom, ../shared/rom/kick.rom and ../System/rom/kick.rom under the data
  path, then to a guess from the ROM list (src/memory.cpp:1583-1612). A ROM
  that is not in the table still loads, a known one is only logged by name
  (src/memory.cpp:2374-2385). With no ROM at all the error is logged and the
  built-in AROS replacement is loaded instead (src/memory.cpp:2374-2379,
  1512-1581), whose ext and rom halves come from share/fs-uae in the
  installed package.

  rom.key is looked for next to the kickstart file and in each scanned
  directory, to decrypt Cloanto ROMs (src/rommgr.cpp:803-819,
  src/fs-uae/main.c:443-461).

