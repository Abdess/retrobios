emulator: "shadPS4"
type: standalone
source: "https://github.com/shadps4-emu/shadPS4"
upstream: "https://github.com/shadps4-emu/shadPS4"
profiled_date: "2026-03-26"
source_commit: "3eecea94ddaca360b19f4b800523b609a8b2ffcc"
core_version: "0.20.1 WIP"
version_basis:
  kind: file
  path: "CMakeLists.txt"
  pattern: 'set\(EMULATOR_VERSION_MAJOR "(\d+)"\)\s*\nset\(EMULATOR_VERSION_MINOR "(\d+)"\)\s*\nset\(EMULATOR_VERSION_PATCH "(\d+)"\)[\s\S]*?set\(APP_VERSION "\$\{APP_VERSION_NUM\} ?([^"]*)"\)'
  format: "{1}.{2}.{3} {4}"
display_name: "shadPS4 (PlayStation 4)"
cores:
  - shadps4
  - "shadps4-gui"
systems:
  - ps4
mode: standalone
standalone_directories:
  - "getcwd/user"
  - "PORTABLE_DIR"
  - "$XDG_DATA_HOME/shadPS4"
  - "$HOME/.local/share/shadPS4"
analysis_date: "2026-08-10"
analysis_commit: "891612c8"

notes: |
  shadPS4 is a standalone PlayStation 4 emulator. Most PS4 system libraries
  are reimplemented in HLE. For better game compatibility, real firmware
  modules (.sprx) can be loaded in LLE mode from the sys_modules/ directory.

  Modules are loaded by sysmodule_internal.cpp via loadModuleInternal().
  If a module exists in sys_modules/, it is loaded as LLE. If absent and
  an HLE implementation exists, the emulator falls back to HLE. If neither,
  the module is stubbed and games needing it may fail.

  Game-specific overrides are supported: sys_modules/{CUSA_ID}/ takes
  priority over the global sys_modules/ directory.

  System fonts are mounted from fonts/font/ (/preinst/common/font on real
  PS4) and fonts/font2/ (/system/common/font2 on real PS4)
  (src/emulator.cpp:639-661). The font library opens each by its dumped name
  or its PS4 name in fonts/, then fonts/font/, then fonts/font2/
  (src/core/libraries/font/font_internal.cpp:391-468), and falls back to the
  Noto fonts it embeds (font_internal.cpp:119-127). Each entry sits in the
  folder the console keeps it in: the two mounts serve them as is to games
  and to the LLE libSceFont, and the library finds both. The font2 copies of
  the SSTArabic family are a later revision than the font/ ones, which the
  library reaches first. These are SST
  (Sony Standard Text) typeface files in OTF format. The emulator mounts
  the directories wholesale, and games load individual fonts by name. Without
  fonts, the emulator warns "No dumped system fonts, expect missing text
  or instability."

  All firmware files are extracted from a real PS4 via FTP:
  - .sprx modules from /system/common/lib/
  - font/ from /preinst/common/font/
  - font2/ from /system/common/font2/

  The paths below are relative to the user folder: user/ in the working
  directory when it exists, else $XDG_DATA_HOME/shadPS4 or
  ~/.local/share/shadPS4 on Linux and %APPDATA%/shadPS4 on Windows
  (src/common/path_util.cpp:88-110). sys_modules/ is below it
  (path_util.cpp:124) unless sysModulesPath in the config names another
  folder (src/core/emulator_settings.cpp:190-195, 535).

