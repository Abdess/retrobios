notes: |
  Final Burn Alpha v0.2.97.44 as left in libretro/fbalpha, the repository the
  libretro project froze when development moved to FinalBurn Neo. The makefile
  builds fbalpha_libretro.so, and ROCKNIX installs it as fbalpha2019_libretro.so.
  ref: src/burner/libretro/libretro.cpp:19

  Each archive the driver names is looked for in three places, the first that
  opens wins: the content directory, <system>/fba/, then <system>/. A missing
  archive is only logged.
  ref: src/burner/libretro/libretro.cpp:560-587

  The archives come from BurnDrvGetZipName: the game, its board ROM set
  (szBoardROM of the BurnDriver), then its parents. ColecoVision, MSX and
  Spectrum drivers have their own GetZipName that strips the system prefix, so
  cv_coleco opens coleco.zip, msx_msx opens msx.zip, spec_spectrum opens
  spectrum.zip and spec_spec128 opens spec128.zip. The PGM single board sets
  thegladpcb, dmnfrntpcb and svgpcb also open pgm.zip.
  ref: src/burn/burn.cpp:94-133, src/burn/drv/coleco/d_coleco.cpp:638-670,
       src/burn/drv/msx/d_msx.cpp:1680-1712, src/burn/drv/spectrum/d_spectrum.cpp:202-235,
       src/burner/libretro/libretro.cpp:603-617

  Every ROM is matched by CRC32 across all opened archives first, then by name.
  A board ROM set is appended to the game's list at index 0x80, so its entries
  are checked like the game's own: any entry without BRF_OPT that is found in
  no archive aborts the load. The one exception is the Neo Geo MVS BIOS
  sp-s3.sp1, skipped when another MVS, AES or Universe BIOS was found.
  ref: src/burn/stdfunc.h:13-28, src/burner/libretro/libretro.cpp:635-657,
       src/burner/libretro/libretro.cpp:733-748, src/burner/libretro/retro_common.cpp:4-47

  Four Midway MCR games (kickman, kickc, wacko, nflfoot) name "ssio" as their
  board ROM set instead of "midssio", so they open ssio.zip.
  ref: src/burn/drv/pre90s/d_mcr.cpp:1782, src/burn/drv/pre90s/d_mcr.cpp:1820,
       src/burn/drv/pre90s/d_mcr.cpp:2298, src/burn/drv/pre90s/d_mcr.cpp:3174

  Neo Geo CD content runs the neocdz driver, whose board ROM set is neogeo: it
  opens neocdz.zip then neogeo.zip.
  ref: src/burner/libretro/libretro.cpp:1316-1317, src/burn/drv/neogeo/d_neogeo.cpp:1283-1299

  Samples are read from <system>/fba/samples/<set>.zip and the high score
  table from <system>/fba/hiscore.dat (core option fba-hiscores, enabled by
  default).
  ref: src/burner/libretro/libretro.cpp:1158-1161, src/burn/hiscore.cpp:408,
       src/burner/libretro/retro_common.cpp:85

