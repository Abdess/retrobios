notes: |
  MAME build reduced to the PlayStation based arcade boards, with the ZiNc
  GPU and SPU plugins added. RetroBat installs it for its zinc system. The
  mame.exe in that package announces itself as "pSxMAME 20090903" and no
  source tree for that build is published, so this profile reads the
  binary and checks it against MAME 0.133, the release whose ROM
  definitions it carries: every BIOS root set below sits in the binary with
  the same names and the same "c:<crc32>#s:<sha1>#" hash strings, those of
  the mame0133 tag.

  The binary keeps 12 of the 36 BIOS root sets of that release: the nine of
  zn.c, plus taitogn.c, ksys573.c and konamigv.c. emulatorlauncher runs
  `mame.exe -skip_gameinfo -rompath <bios>/psxmame/bios;<game folder>
  ... <set>` (emulatorLauncher Generators/PSXMame.Generator.cs:20-110).
  Each directory of the semicolon-separated rompath is tried in turn and a
  set is read at its top (src/emu/emuopts.c:36, src/emu/fileio.c:245-249,
  816-835).

  A ROM missing from its set is fatal unless it is optional or has no good
  dump (src/emu/romload.c:427-449, src/emu/romload.c:594). Of a set with
  BIOS options only the selected option is read, the first one by default
  (src/emu/romload.c:330-380, src/emu/romload.c:933). The archive is never
  hashed, its members are, so the hashes sit in contents.

