source_commit: "51893cab7e8a3d1298734848f4fd616f2e1831fb"
upstream_commit: "75bd90d16a2e4eb16026bf615685ee2a02dfc0d6"
core_version: "1.7"
display_name: "Apple - Apple II (Mariani)"
cores:
  - mariani
systems:
  - apple-ii
mode: standalone

notes: |
  Cocoa frontend for AppleWin, macOS only, shipped as Mariani.app and carrying
  AppleWin 1.31.0.5 (resource/version.h). ES-DE launches it with --d1 for the
  floppy in slot 6 drive 1.

  Resources are files inside the application bundle instead of Win32 resources
  linked into the binary. MarianiFrame::GetResourceData maps each AppleWin
  resource id to a file name, NSBundle resolves it against Contents/Resources,
  and the file is read with open() then kept in a map for later requests
  (source/frontends/mariani/MarianiFrame.cpp:156-232, source/frontends/mariani/AppDelegate.mm:1465-1469). LinuxFrame::GetResource
  throws when the file it gets back does not have the size the call site asked
  for (source/linux/linuxframe.cpp:133-145), so each entry below carries the size the code
  demands. A name that resolves to nothing raises a "Resource not found" alert
  and returns a null pointer.

  Machine types offered in preferences: Apple II, II Plus, II J-Plus, //e,
  enhanced //e, Pravets 82, Pravets 8M, Pravets 8A, TK3000 //e and Base64A
  (source/frontends/mariani/preferences/PreferencesViewController.mm:191-193, 741-751). MemInitializeROM picks the
  system ROM from that setting (source/Memory.cpp:2052-2069). Default slots are the
  printer card in 1, Super Serial Card in 2, Mockingboard in 4 and Disk II in 6
  (source/CardManager.cpp:325-334); the hard disk and mouse cards are chosen by the
  user.

  Two names in the resource map have no file in the bundle: the Resources build
  phase lists 49 items and neither appears (Mariani.xcodeproj/project.pbxproj).
  Hddrvr-v2.bin is requested when a save state written with hard disk card
  version 4 is loaded (source/Harddisk.cpp:228, 1439-1443), and
  Freezes_Non-autostart_F8_Rom.rom when the configuration value "The Freeze's
  F8 Rom" is set on an Apple II (source/Memory.cpp:2163-2168, source/Utilities.cpp:188-189,
  source/Common.h:94). Contents/Resources is the only directory searched, so that is
  where the two belong.

  The debugger comes up with the emulator, not with its window
  (source/linux/context.cpp:116). CmdDebugStartup preloads four symbol tables
  (source/Debugger/Debug.cpp:9488-9516), each read first from
  ~/Library/Application Support/<bundle id>/ and then from the bundle
  (source/Debugger/Debugger_Symbols.cpp:774, 814-817, source/frontends/mariani/MarianiFrame.cpp:36-37,
  source/frontends/mariani/AppDelegate.mm:1471-1491).

  --rom and --f8rom install a 12k/16k and a 2k image from any path over the ROM
  already loaded (source/frontends/common2/argparser.cpp:205-206, source/frontends/common2/programoptions.cpp:82-102,
  source/Memory.cpp:2120-2213). AppleWin's -videorom and its hard disk firmware
  switches are unreachable here: ParseCmdLine has no caller in this tree, and
  UseHdcFirmwareV1/V2 are called only from source/Windows/AppleWin.cpp:783-785, which
  the Xcode project does not compile.

