# Eden is a community fork of yuzu, started by Camille LaVey.
# Key files loaded from <data_dir>/keys/ (src/common/fs/fs_paths.h:20, src/common/fs/path_util.cpp:158).
# On Linux: $XDG_DATA_HOME/eden/keys/
# On Windows: %APPDATA%/eden/keys/
# Firmware NCAs are installed via UI (Tools > Install Firmware), not placed as files.
# HLE fallbacks exist for fonts, timezone, system version, mii model, ng word lists.

files:
  - name: "prod.keys"
    required: true
    path: "keys/prod.keys"
    note: "Production keys for NCA decryption (master, key area, header, titlekek)"
    source_ref: "src/core/crypto/key_manager.cpp:574-575, 853"

  - name: "dev.keys"
    required: false
    path: "keys/dev.keys"
    note: "Development-unit keys, read instead of prod.keys when use_dev_keys is set"
    source_ref: "src/core/crypto/key_manager.cpp:570-571, 852"

  - name: "title.keys"
    required: false
    path: "keys/title.keys"
    note: "Per-title encryption keys (rights_id to titlekey mappings)"
    source_ref: "src/core/crypto/key_manager.cpp:577-578, 850"

  - name: "console.keys"
    required: false
    path: "keys/console.keys"
    note: "Console-specific keys (BIS, SD seed)"
    source_ref: "src/core/crypto/key_manager.cpp:579-580"

  - name: "key_retail.bin"
    required: false
    path: "keys/key_retail.bin"
    size: 160
    note: "Amiibo decryption keys (two InternalKey structs, 0x50 bytes each)"
    source_ref: "src/core/hle/service/nfc/common/amiibo_crypto.cpp:281-302"

standalone_directories:
  - "$XDG_DATA_HOME/eden"
  - "$HOME/.local/share/eden"
  - "PORTABLE_DIR"
data_root:
  windows:
    path: "%APPDATA%/eden"
    source_ref: "src/common/fs/path_util.cpp:115-118"
    note: "A user folder beside eden.exe is used instead when it exists."
  linux:
    path: "$XDG_DATA_HOME/eden, else ~/.local/share/eden"
    source_ref: "src/common/fs/path_util.cpp:135-139, 368-377"
    note: "A user folder in the working directory is used instead when it exists."
  macos:
    path: "$XDG_DATA_HOME/eden, else ~/.local/share/eden"
    source_ref: "src/common/fs/path_util.cpp:135-139, 368-377"
    note: "A user folder in the working directory is used instead when it exists."
  android:
    path: "Android/data/dev.eden.eden_emulator/files"
    source_ref: "src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/DirectoryInitialization.kt:42-43, src/common/fs/path_util.cpp:130-131"
    note: "Nightly, relWithDebInfo and debug builds append .nightly, .relWithDebInfo or .debug to the package name."

notes: |
  Eden is a standalone Nintendo Switch emulator, community fork of yuzu by Camille LaVey.
  Firmware (system NCAs) must be installed through Eden's UI from a firmware ZIP or NCA folder.
  Required for commercial games. Homebrew (.nro, .nso) can run without keys or firmware.
