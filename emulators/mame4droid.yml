notes: |
  Android port of MAME 0.139u1 by David Valdeita (Seleuco), package
  com.seleuco.mame4droid. The Java app (seleuco/MAME4droid-0.139u1-,
  version 1.16.9) loads a prebuilt libMAME4droid.so built from the native
  tree profiled here. src/version.c reads 0.139u1; the 0139u2 and 0139u3
  diffs ship in the repository unapplied. Romset is 0.139 only.

  8846 drivers in mamedriv.c, 51 BIOS root sets. ZN-based boards keep their
  0.139 set names (cpzn1, cpzn2, acpsx, atpsx, atluspsx, vspsx, psarc95,
  tps, taitofx1); later MAME renamed them to coh####.

  setGlobalPath chdirs into the installation directory, /sdcard/MAME4droid
  or /sdcard/Android/data/com.seleuco.mame4droid/files, so every relative
  path resolves there. Defaults from emuopts.c: roms, samples, artwork,
  ctrlr, cheat, crosshair, hi, and fontpath at the root.

  open_rom_file walks the parent chain building <drivername>/<romname> and
  fopen_attempt_zipped rewrites the last directory component to
  <drivername>.zip, so BIOS sets are plain MAME archives under the ROMs
  path. Storage Access Framework serves that path on Android 10+. The BIOS
  setting passes -bios, selecting a ROM_SYSTEM_BIOS revision within a set.
  A missing ROM is fatal unless it is ROM_OPTIONAL or NO_DUMP.

  The MKCHAMP hiscore engine (src/emu/hiscore.c) and the Category.ini
  reader in uimenu.c are additions over stock 0.139. Hiscore support is
  behind a setting, off by default on Android.

  res/raw/files.zip seeds the installation on first run with hiscore.dat,
  cheat.zip, Category.ini, four ctrlr definitions (hotrod, hotrodse,
  slikstik, xarcade) and 30 overlay PNGs. samples, artwork, ctrlr and
  overlays are directories whose contents the code discovers: sample names
  come from each driver's samples_interface, layout names from the game
  name, ctrlr from the option value, overlays from a directory listing.
  The keymaps and cheat.txt in files.zip have no reader in this build, the
  SDL OSD being excluded by OSD=droid-ios and cheat.txt being the
  debugger's cheatlist output name.

files:
  # Data files loaded from the installation directory
  - name: hiscore.dat
    path: hiscore.dat
    required: false
    bundled: true
    size: 219154
    sha1: "c686635c5470e4711dbf817e8196dcb169fdc68d"
    category: game_data
    description: "high score memory ranges per game"
    note: "Opened from the installation root with an empty search path, once per session, when the hiscore setting is on. That setting is off by default on Android. Seeded from the package assets on first run; the hash identifies that drop, the engine reads the file without checking it. Definitions are keyed to the 0.139 driver names, so another MAME generation's file is a different one."
    source_ref: "src/emu/hiscore.c:29,365, src/emu/machine.c:379-382, src/osd/droid-ios/osd-droid.c:89,345"

  - name: cheat.zip
    path: cheat.zip
    required: false
    bundled: true
    size: 24981772
    sha1: "a737e925e3b86374da57496e3261d0303889977f"
    category: game_data
    description: "per-game XML cheat files"
    note: "cheat_list_load opens cheat/<gamename>.xml and fopen_attempt_zipped rewrites the directory component to cheat.zip. Loaded when the cheat setting is on. Seeded from the package assets on first run; the hash identifies that drop, the engine reads members without checking the container."
    source_ref: "src/emu/cheat.c:428,1026-1027, src/emu/fileio.c:276-352, src/emu/emuopts.c:48, src/osd/droid-ios/osdmain.c:317"

  - name: Category.ini
    path: Category.ini
    required: false
    bundled: true
    size: 86983
    sha1: "75d31d949614b7d4e79de676c8a4b1c68b571f0a"
    category: game_data
    description: "game name to category map for the ROM list filter"
    note: "Read from the installation root with a plain fopen the first time the category filter is used, then sorted for binary search. Seeded from the package assets on first run; the hash identifies that drop, the reader checks nothing."
    source_ref: "src/emu/uimenu.c:4600-4648"

  - name: ui.bdf
    path: ui.bdf
    required: false
    category: game_data
    description: "BDF font for the MAME menu overlay"
    note: "Opened from fontpath, which defaults to the installation root. A miss falls back to the font compiled into the binary. A successful load writes a ui.bdc cache next to it."
    source_ref: "src/emu/ui.c:245, src/emu/rendfont.c:139-163,430,453, src/emu/emuopts.c:47"

