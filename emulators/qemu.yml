    size: 131072
    required: false
    note: >
      SeaBIOS for the ISA PC machine, and for a PC machine whose firmware
      option is cleared. The pc and q35 machines load bios-256k.bin.
    source_ref: "source hw/i386/pc_sysfw.c:222, 243, source hw/i386/x86-common.c:993-994"

