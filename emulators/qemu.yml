notes:
  bios_directory: >
    All files go in {retroarch_system_dir}/qemu/. The libretro core adds
    this path via qemu_add_data_dir() in ui/libretro.c:659-660.
  default_usage: >
    For typical x86/x86_64 usage (loading .iso/.img/.qcow files directly),
    the default pc machine needs bios-256k.bin and the VGA BIOS of its
    display. Other VGA BIOS variants are loaded depending on the emulated GPU.
    A NIC reads its default romfile. The pxe-*.rom images and efi-eepro100.rom
    are read only when a romfile= option names them (hw/pci/pci.c:2362-2363).
  multi_arch: >
    The libretro build targets 17 architectures. Non-x86 firmware
    is only needed when using .qemu_cmd_line files that invoke a different
    qemu-system-* binary (e.g. qemu-system-ppc for MacOS 9).
  edk2: >
    EDK2 UEFI firmware is shipped as bz2-compressed blobs in pc-bios/. These
    provide UEFI boot for x86, ARM, and RISC-V machine types. No machine
    names them: a .qemu_cmd_line names a code image with -bios, which is
    looked up in the data directory. pflash drives, the variable store
    templates included, are opened by path from the content folder
    (ui/libretro.c:697). The ARM and AArch64 code images boot through
    -bios on the virt machine. The x86 images are 3653632 bytes, not a
    multiple of 64 KiB, so x86_bios_rom_init refuses them
    (hw/i386/x86-common.c:1000-1002), and the RISC-V image is S-mode code
    for pflash0 that -bios does not start: those are read only as pflash
    drives, never from the system directory.
  experimental: "This core is marked is_experimental=true in its .info file."
  version: "Based on QEMU 9.0.50 (io12/qemu-libretro)"
