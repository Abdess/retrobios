emulator: FreeJ2ME
type: libretro
core_classification: official_port
source: "https://github.com/hex007/freej2me"
upstream: "https://github.com/hex007/freej2me"
profiled_date: "2026-03-23"
source_commit: "eb4ac87e9a0b212ba701691eb67ee4892b2b1173"
core_version: "1.0.0"
version_basis:
  kind: file
  path: "META-INF/freej2me-build.version"
  pattern: '^build\.version=(\S+)'
display_name: "Mobile - J2ME (FreeJ2ME)"
cores:
  - freej2me
systems:
  - j2me

notes: |
  The native core is a C bridge that spawns a Java process running
  freej2me-lr.jar, which handles all J2ME emulation. Communication
  happens over pipes (Linux) or named pipes (Windows). A Java runtime
  (JRE/JDK 8+) must be installed on the host. The jar is built from
  source via Apache Ant (build.xml). Same repo hosts standalone AWT
  and SDL2 frontends alongside the libretro frontend.

files:
  - name: "freej2me-lr.jar"
    system: j2me
    description: "FreeJ2ME libretro Java application"
    required: true
    installed_on: [retrobat, rocknix]
    source_ref: "src/libretro/freej2me_libretro.c:487-490 (GET_SYSTEM_DIRECTORY + fill_pathname_join + java -jar)"
    note: "Not a BIOS dump. Java emulator the native core joins to the system directory as freej2me-lr.jar and starts via execvp('java', '-jar', path). Built from source via 'ant'. Must be in the system directory root. ROCKNIX builds the core and the jar from freej2me-plus 1.52, which keeps the freej2me-lr.jar name, and copies the jar into its BIOS folder before each launch when it is missing."
