# Which BIOS region a core opens for a game, beyond what the profiles say.
#
# The files of each region come from the profiles' `region:` fields
# (scripts/region.py build_region_index), never from this file. What is
# recorded here is what the code does around them: the game regions it
# sends to another region's file (`routes`), the region it falls back to
# when the game names none it knows (`default_region`), the order it picks
# from a multi-region disc (`preference`), the files it opens whatever the
# region (`region_free`), whether a missing region file is replaced by
# another region's (`fallback_across_regions`), and the cases where even a
# proven game region does not settle the file (`keep_all_regions`).
#
# Only cores whose region code was read at the profile's pin are listed.
# Every source_ref names the profile's own pin.

cases:
  user-region-option:
    title: A core option forces the console region
    reason: The forced region decides the file, and the option is device state the installer does not read.
  psx-override-bios:
    title: Region-free override BIOS
    reason: An option swaps in a region-free image for every region.
  duckstation-custom-region:
    title: Per-game custom region
    reason: A region the user set for one game in the game list replaces the region read from the disc.
  cross-region-fallback:
    title: Missing region file replaced by another region's image
    reason: The game still starts without the precise file, on another region's BIOS with a warning.
  first-disc-region:
    title: Only the first disc sets the region
    reason: For a multi-disc game the region is read from disc 1 alone.
  multi-area-disc:
    title: Disc listing several areas
    reason: The core picks among the disc's areas by its own preference order.
  saturn-kr-ipl:
    title: Asia NTSC and Korea discs ask for an undeclared IPL
    reason: The KR IPL is not declared by the profile, so the core falls back to a region-free image, then a mismatched one.
  saturn-disc-database:
    title: A disc or cartridge database overrides the header
    reason: The core's own database decides the area, so a header read is not enough without that table.
  sms-crc-list:
    title: CRC32 list overrides the cartridge header
    reason: A list of whole-ROM CRC32s forces Europe or Japan before the header is read.
  megacd-region-list:
    title: Mega CD region from the disc's region list
    reason: The file follows the disc's list of regions and the preferred-region option, not one header byte.
  gamecube-unknown-region:
    title: GameCube disc with an unknown region field
    reason: An unknown value at 0x458 falls back to the host locale, which differs per device.
  naomi-one-archive:
    title: One BIOS archive serves every region
    reason: The region filters blobs inside one archive, so the archive is the unit.
  nds-header-decides:
    title: NDS BIOS decided by header bytes, not region
    reason: An encrypted secure area or a DSi unit code decides the files, not the game region.
  optional-pif:
    title: Optional boot image
    reason: The core runs HLE without the file, and dropping it saves under 4 KB.

systems:
  sony-playstation:
    beetle_psx:
      routes:
        south-korea: japan
      default_region: north-america
      region_free: [psxonpsp660.bin, ps1_rom.bin, openbios.bin]
      fallback_across_regions: false
      source_ref: "libretro/beetle-psx-libretro@7fea57a5 libretro.c:2426-2446, libretro.c:2497-2540, libretro.c:768-821, libretro.c:3425-3458, mednafen/settings.c:42"
      keep_all_regions:
        - case: psx-override-bios
          condition: option
          option: beetle_psx_override_bios
          default: disabled
          keeps: region-free-files
          files: [psxonpsp660.bin, ps1_rom.bin, openbios.bin]
          source_ref: "libretro/beetle-psx-libretro@7fea57a5 libretro.c:694-765, libretro_core_options.h:259-274"
        - case: first-disc-region
          condition: disc
          when: multi-disc game (.m3u)
          keeps: first-disc
          source_ref: "libretro/beetle-psx-libretro@7fea57a5 libretro.c:2426-2446"
    swanstation:
      default_region: north-america
      region_free: [psxonpsp660.bin, ps1_rom.bin]
      fallback_across_regions: true
      source_ref: "libretro/swanstation@631f0fb3 src/core/system.cpp:400-456, src/core/system.cpp:621-640, src/core/host_interface.cpp:100-196, src/core/bios.cpp:28-71"
      keep_all_regions:
        - case: user-region-option
          condition: option
          option: swanstation_Console_Region
          default: Auto
          keeps: all-regions
          source_ref: "libretro/swanstation@631f0fb3 src/libretro/libretro_core_options.h:82-136"
        - case: cross-region-fallback
          condition: always
          keeps: precise
          source_ref: "libretro/swanstation@631f0fb3 src/core/host_interface.cpp:100-196"
    duckstation:
      default_region: north-america
      region_free: [openbios.bin]
      fallback_across_regions: true
      source_ref: "stenzek/duckstation@c9dc2254 src/core/system.cpp:1002-1072, src/core/system.cpp:706-722, src/core/bios.cpp:34-139, src/core/bios.cpp:397-460"
      keep_all_regions:
        - case: user-region-option
          condition: option
          option: Console/Region
          default: Auto
          keeps: all-regions
          source_ref: "stenzek/duckstation@c9dc2254 src/core/system.cpp:1803-1835, src/core/settings.h:622"
        - case: duckstation-custom-region
          condition: user-state
          when: the user set a custom region for the game in the game list
          keeps: all-regions
          source_ref: "stenzek/duckstation@c9dc2254 src/core/bios.cpp:397-460"
    pcsx_rearmed:
      default_region: north-america
      fallback_across_regions: true
      source_ref: "libretro/pcsx_rearmed@c8816799 libpcsxcore/misc.c:415-455, frontend/libretro.c:3604-3680, frontend/libretro.c:3864-3885, libpcsxcore/psxmem.c:291-327"
      keep_all_regions:
        - case: cross-region-fallback
          condition: always
          keeps: precise
          source_ref: "libretro/pcsx_rearmed@c8816799 libpcsxcore/psxmem.c:291-327"

