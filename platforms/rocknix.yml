launchers:
- emulator: retroarch
  build: libretro
  kind: passes_path
  names: []
  search_dir: ~/roms/bios
  passes_to: retroarch.cfg system_directory = "~/roms/bios", systemfiles_in_content_dir
    = "false"
  fails_when_missing: false
  installs:
    path: /storage/.config/retroarch/retroarch.cfg
    source_ref: "projects/ROCKNIX/packages/sysutils/systemd/scripts/userconfig-setup:13"
  kept_if_present: true
  overrides: []
  source_ref: "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/AMD64/retroarch.cfg:3395-3396,\
    \ projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/H700/retroarch.cfg:711-712,\
    \ projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3326/retroarch.cfg:716-717,\
