# Manual target overrides.
# This file is NEVER overwritten by scrapers.
# Use it to add aliases, add/remove cores per target.
#
# Format:
#   platform_name:
#     targets:
#       _default:                    # applies to every target
#         remove_cores: [...]
#       target-name:
#         aliases: [alias1, alias2]
#         add_cores: [core_to_add]
#         remove_cores: [core_to_remove]

# Batocera: the scraper runs Config.in's selects from each board's flags, so
# the Wine-gated emulators (demul, model2emu, xenia) resolve on their own.
# citron and ryujinx stay out: Config.in gates both on
# BATOCERA_CORES_STILL_COMMERCIALIZED, which no board turns on.
batocera:
  targets:
    _default:
      # Amiga machine variants (A500, CD32, etc.) are selectors passed to
      # fsuae/amiberry, not emulators of their own. batocera-es-system
      # groups them under the emulator's node in es_systems.yml.
      # odcommander is OpenDingux's file manager, and flatpak/steam/wine-tkg/sh
      # are runtime launchers. wine is the Windows system's launcher and
      # mugen the MUGEN system's, both running the user's Windows program
      # on wine-tkg (configgen-defaults.yml). N64 video plugins (gliden64,
      # glide64mk2, rice) are backends to mupen64plus, not emulators.
      remove_cores:
        - A500
        - "A500+"
        - A600
        - A1000
        - A1200
        - A3000
        - A4000
        - CD32
        - CDTV
        - flatpak
        - odcommander
        - sh
        - steam
        - wine-tkg
        - wine
        - mugen
        - gliden64
        - glide64mk2
        - rice
    # Boards are named by SoC. The Raspberry Pi models a user knows map here
    # (Batocera's Config.in comments: "rpi2/rpi3", "rpi4 only", "rpi5 only").
    bcm2835:
      aliases: [rpi1, rpi-zero]
    bcm2836:
      aliases: [rpi2]
    bcm2837:
      aliases: [rpi3, rpi-zero2]
    bcm2711:
      aliases: [rpi4, rpi400, cm4]
    bcm2712:
      aliases: [rpi5, rpi500, cm5]

retrobat:
  targets:
    _default:
      # Launchers and the shell, not emulators.
      remove_cores:
        - flatpak
        - odcommander
        - sh
        - steam
        - wine-tkg
        - glide64mk2
        - gliden64
        - rice
        - windows # ExeLauncherGenerator: starts .exe, .lnk and store .url shortcuts
        - zaccariapinball # starts the Zaccaria Pinball game, Steam app 444930 or ZaccariaPinball.exe
        - pinballfx # starts the Pinball FX game, Steam app 2328760 or PinballFX.exe, with -Table <id>
        - quiverlauncher # starts the PC port a .lnk shortcut points to, or the QuiverLauncher front end
        - powerbomberman # the Power Bomberman fan game, its data ships inside the install
        - exodos # runs the eXoDOS collection's own game shortcut, which starts the DOSBox shipped inside the collection
        - amigaforever # starts Cloanto's AmigaForever.exe player on an RP9 package, with the emulator and ROMs of that paid install
        - mugen # ExeLauncherGenerator: runs the mugen.exe each M.U.G.E.N game folder ships, RetroBat installs no engine

retroarch:
  targets:
    # The buildbot publishes a 6 KB placeholder named "na" on two Android
    # targets. Its retro_get_system_info name is "Not Available": it emulates
    # nothing and no profile can describe it.
    android-armeabi-v7a:
      remove_cores: [na]
    android-x86_64:
      remove_cores: [na]
    nintendo-switch:
      aliases: [switch, nx]
    linux-x86_64:
      aliases: [pc, linux, x86_64, desktop]
    # Raspberry Pi OS 64-bit, ARM single-board computers, Asahi Linux.
    linux-aarch64:
      aliases: [linux-arm64, arm64]
    linux-x86:
      aliases: [linux-i686, i686]
    playstation-ps2:
      aliases: [ps2]
    playstation-psp:
      aliases: [psp]
    # OpenDingux (RG350 and kin), RetroFW, MiyooCFW and LG webOS TVs.
    opendingux-mips32:
      aliases: [opendingux, dingux]
    retrofw-mips32:
      aliases: [retrofw]
    miyoo-arm32:
      aliases: [miyoo, miyoocfw]
    webos-armv7a:
      aliases: [webos]

retrodeck:
  targets:
    _default:
      # RetroDECK ships RetroArch itself as a component, and its target list
      # includes the frontend name alongside the actual cores.
      remove_cores: [retroarch]

emudeck:
  targets:
    _default:
      # EmuDeck's EmuScripts tree carries a template.sh placeholder used
      # to scaffold new installers. It is not an emulator.
      remove_cores: [template]

lakka:
  targets:
    generic:
      aliases: [x86_64, pc]
    rpi:
      aliases: [rpi1]

retropie:
  targets:
    _default:
      # Games that read only what their package installs, and programs that
      # emulate nothing. The libretro cores still resolve through `retroarch`
      # in the platform's own cores list, which this file does not touch.
      remove_cores:
        - superflappybirds # homebrew game
        - kodi # Kodi media center, installed from apt (ports/kodi.sh)
        - steamlink # Valve's game streaming client, installed from apt (ports/steamlink.sh)
        - retroarch # the frontend the lr-* packages run in (emulators/retroarch.sh)
        - smw # Super Mario War, a game whose own data/ tree is installed with it (ports/smw.sh)
        - supertux # platform game installed from apt with its data package (ports/supertux.sh)
        - giana # Giana's Return, a prebuilt freeware game unpacked whole (ports/giana.sh)
        - lincity-ng # city building game installed from apt (ports/lincity-ng.sh)
        - micropolis # city building game installed from apt (ports/micropolis.sh)
        - minecraft # Minecraft Pi Edition, installed from apt as minecraft-pi (ports/minecraft.sh)
        - mysticmine # rail game whose data its setup.py installs (ports/mysticmine.sh)
        - openblok # falling block game whose data make install puts beside it (ports/openblok.sh)
        - openpht # OpenPHT media center, a Plex Home Theater fork installed from a .deb (ports/openpht.sh)

rocknix:
  targets:
    _default:
      # Runtimes and launchers the emulators metapackage installs beside the
      # emulators: x86 translation (box64, box86), Windows (wine), the Steam
      # and Heroic clients, and PortMaster, which installs ports.
      remove_cores:
        - box64
        - box86
        - heroic
        - portmaster
        - steam
        - wine
    amd64:
      aliases: [x86_64, pc]

# KNULLI's platform scraper reads Batocera's list above, plus this one. The
# target list reads this one alone, so it repeats Batocera's names, all of
# which KNULLI's es_systems.yml carries under the same nodes. vaixterm is a
# terminal, filed as the VaixTerm system's emulator
# (configgen-defaults.yml:669-671).
knulli:
  targets:
    _default:
      remove_cores:
        - A500
        - "A500+"
        - A600
        - A1000
        - A1200
        - A3000
        - A4000
        - CD32
        - CDTV
        - flatpak
        - odcommander
        - sh
        - steam
        - wine-tkg
        - wine
        - mugen
        - gliden64
        - glide64mk2
        - rice
        - vaixterm

# EmuELEC and AmberELEC have no target file: the scrapers read these lists.
# mpv and ffplay play the Media Player system's videos (EmuELEC
# emuelecRunEmu.sh:301-303, AmberELEC runemu.py:122). gmloader runs a
# GameMaker game's own Android library (emuelecRunEmu.sh:331-334). Ports
# that start the user's own game binary name its runtime or the game as
# port_exe: mono for Celeste and TMNTSR, the game for Shovel Knight, which
# shovelknight.sh starts through box64 (ports.yaml, emuelec-ports).
emuelec:
  targets:
    _default:
      remove_cores:
        - ffplay
        - gmloader
        - mono
        - mpv
        - ShovelKnight

amberelec:
  targets:
    _default:
      remove_cores:
        - mpv

recalbox:
  targets:
    _default:
      # system.ini names a mupen64plus video plugin as the core of the
      # mupen64plus emulator. mupenGenerator.py loads it with --gfx
      # mupen64plus-video-<core>.so. Plugins, not emulators.
      remove_cores:
        - glide64mk2 # mupen64plus-video-glide64mk2
        - gliden64 # GLideN64 video plugin
        - n64_gles2 # mupen64plus-video-gles2n64
        - rice # mupen64plus-video-rice
        - rice_gles2 # mupen64plus-video-gles2rice
    # Recalbox names its boards by defconfig (configs/recalbox-<board>_defconfig).
    rpi3:
      aliases: [rpi3b]
    rpi4_64:
      aliases: [rpi4, rpi400]
    rpi5_64:
      aliases: [rpi5]
    rpizero2:
      aliases: [rpi-zero2]
    x86_64:
      aliases: [pc]
