setup: myminui
name: MyMinUI
platform: myminui
sources:
  os:
    repo: "https://github.com/Turro75/MyMinUI"
    commit: 72ed4f3dd80d96646c11bf9363242565320d9566
roms_root:
  path: <SD>/Roms
  from_bios: ../../Roms
  source_ref: "os workspace/all/common/defines.h:13"
case_sensitive: null
case_ref: "os workspace/all/common/utils.c:130-157"
hidden:
- pattern: .*
  source_ref: "os workspace/all/common/utils.c:30-35"
- pattern: '*.disabled'
  source_ref: "os workspace/all/common/utils.c:30-35"
- name: map.txt
  source_ref: "os workspace/all/common/utils.c:30-35"
- name: Imgs
  source_ref: "os workspace/all/common/utils.c:30-35"
notes:
- "MyMinUI has no extension filter. Every file of a Roms folder that is not hidden is listed as a game\
  \ (os workspace/all/minui/minui.c:660-667), so the rows carry no extensions."
- "A Roms folder starts the pak named by the text inside its last parentheses, or by its whole name without\
  \ parentheses (getEmuName, os workspace/all/common/utils.c:130-157)."
- BIOS sits in Bios/<TAG>/, two levels under the card root, so the roms root is ../../Roms from it.
