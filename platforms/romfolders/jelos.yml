  extensions:
  - .bin
  - .chd
  - .cue
  - .iso
  core: opera
  emulator: retroarch
  source_ref: "os config/emulators/3do.conf:6,7; os packages/virtual/emulators/package.mk:125; os packages/virtual/emulators/package.mk:124"
