notes:
- "RetroArch alone defines no rom folder. rgui_browser_directory starts empty and only a platform default\
  \ fills it, which no desktop driver sets (os configuration.c:3126,3295-3298). The path none says so."
- "Content reaches a core through playlists built by scanning against the content databases (os tasks/task_database.c),\
  \ or from the file browser with a core the user picks. The system can only come from the game itself\
  \ or from a folder the user names."
