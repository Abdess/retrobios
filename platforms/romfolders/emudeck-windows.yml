setup: emudeck-windows
name: "EmuDeck (Windows)"
platform: emudeck
sources:
  os:
    repo: "https://github.com/EmuDeck/emudeck-we"
    commit: 037460efc88c1ab70256ab0833f8f10e7f2904b2
  esde:
    repo: "https://gitlab.com/es-de/emulationstation-de"
    commit: 50e4b600ae533d772bae3ff880d11a09b05dbe84
    tag: v3.5.0
    note: EmuDeck installs the newest ES-DE release at run time. The list is read at this tag
roms_root:
  path: "<drive>:\\Emulation\\roms"
  from_bios: ../roms
  source_ref: "os functions/JSONtoPS1.ps1:173,175,195,197"
case_sensitive: false
hidden:
- pattern: .*
  source_ref: "esde es-app/src/SystemData.cpp:657"
notes:
- Windows folders are case-insensitive.
- "ES-DE matches the extension as written (esde es-app/src/SystemData.cpp:666): its lists carry both cases,\
  \ kept here lowercased."
- "A system folder holding noload.txt is not loaded (esde es-app/src/SystemData.cpp:629-631)."
- "Default emulator: the alternativeEmulator label written for the system, else the first <command>."
- "Some alternative emulators are set only when the standalone is installed (os functions/ToolScripts/emuDeckESDE.ps1:306-309)."
folders:
- folder: 3do
  extensions:
  - .7z
  - .bin
  - .chd
  - .cue
  - .iso
  - .zip
  core: opera
  emulator: retroarch
  source_ref: "esde resources/systems/windows/es_systems.xml:5"
