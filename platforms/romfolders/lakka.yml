setup: lakka
name: Lakka
platform: lakka
sources:
  os:
    repo: "https://github.com/libretro/Lakka-LibreELEC"
    commit: ad1a27aac8e37e0cf810b243b2bdf9f798e45dd4
    tag: v6.1
roms_root:
  path: /storage/roms
  from_bios: ../roms
  source_ref: "os packages/lakka/retroarch_base/retroarch/tmpfiles.d/retroarch-userdirs.conf:12; os packages/lakka/retroarch_base/retroarch/config/retroarch.cfg:3143"
case_sensitive: null
notes:
- "Lakka keeps no folder per system. Games reach the menu through RetroArch playlists built by scanning\
  \ against the content databases (os packages/lakka/retroarch_base/retroarch/config/retroarch.cfg:98,3085),\
  \ so a folder name says nothing about the system and the game itself has to."
- "/storage/roms is the file browser's start, with hidden files not shown (os packages/lakka/retroarch_base/retroarch/config/retroarch.cfg:3143,3202).\
  \ /storage/roms/downloads holds core assets (os packages/lakka/retroarch_base/retroarch/tmpfiles.d/retroarch-userdirs.conf:13)."
folders: []
