setup: unofficialos
name: UnofficialOS
platform: retroarch
sources:
  os:
    repo: "https://github.com/RetroGFX/UnofficialOS"
    commit: 226357964978ec6092c0759b8bac67d5ff24442b
  es:
    repo: "https://github.com/RetroGFX/emulationstation"
    commit: f439343ecfa5e85448fca96db9a3b64a8d685397
    note: EmulationStation pinned by the ui/emulationstation package.mk PKG_VERSION
roms_root:
  path: /storage/roms
  from_bios: ..
  source_ref: "os packages/virtual/emulators/package.mk:104"
case_sensitive: null
skip:
- name: bios
  reason: created by the emulators package, holds no game
  source_ref: "os packages/virtual/emulators/package.mk:104"
- name: music
  reason: created by the emulators package, holds no game
  source_ref: "os packages/virtual/emulators/package.mk:107"
- name: savestates
  reason: created by the emulators package, holds no game
  source_ref: "os packages/virtual/emulators/package.mk:110"
hidden:
- pattern: .*
  source_ref: "es es-app/src/SystemData.cpp:225"
media:
- name: media
  source_ref: "es es-app/src/SystemData.cpp:272"
- name: medias
  source_ref: "es es-app/src/SystemData.cpp:272"
- name: images
  source_ref: "es es-app/src/SystemData.cpp:272"
- name: manuals
  source_ref: "es es-app/src/SystemData.cpp:272"
- name: videos
  source_ref: "es es-app/src/SystemData.cpp:272"
- name: assets
  source_ref: "es es-app/src/SystemData.cpp:272"
- pattern: downloaded_*
  source_ref: "es es-app/src/SystemData.cpp:272"
notes:
- "The BIOS folder is /storage/roms/bios, inside the roms root: the scan skips it."
- "A file is a game only when its lowercased extension is in the folder's list (es es-app/src/SystemData.cpp:236)."
- Each folder comes from SYSTEM_PATH of config/emulators/<system>.conf, written by add_es_system for every
  system the emulators package adds.
folders:
- folder: 3do
  extensions:
  - .bin
  - .chd
  - .cue
  - .iso
  core: opera
  emulator: retroarch
  source_ref: "os config/emulators/3do.conf:6,7; os packages/virtual/emulators/package.mk:121; os packages/virtual/emulators/package.mk:120"
