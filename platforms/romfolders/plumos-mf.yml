setup: plumos-mf
name: "plumOS (MF build)"
platform: retroarch
sources:
  os:
    repo: "https://github.com/game-de-it/plumOS-MF"
    commit: 0095017c39226ad1c22bf8df852202673075936d
roms_root:
  path: /mnt/SDCARD/Roms
  from_bios: ../Roms
  source_ref: "os package/frontend-mf/plumos/bin/plumos-retroarch-launch:12-15"
case_sensitive: null
notes:
- Each system lists its folders in directory_aliases by priority, upper case Miyoo spellings and lower
  case ROCKNIX ones. The frontend that resolves them is built from a separate component this repository
  does not hold, so its case and hidden-file rules are unread.
- "A folder marked shared serves several systems (FC for NES and FDS). The row goes to the first system,\
  \ the later ones list it among their aliases."
