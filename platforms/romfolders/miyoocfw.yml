setup: miyoocfw
name: MiyooCFW
platform: retroarch
sources:
  os:
    repo: "https://github.com/MiyooCFW/buildroot"
    commit: d5912eeb7b636810bafaa34eb0517fd599a0fc71
  gpsp:
    repo: "https://github.com/Apaczer/gpsp"
    commit: df382f476ffea69f2ff57376b27eac11b15dcf81
    tag: 1.2.3
    note: the gpsp.ipk release package/miyoo/ipk-gpsp/ipk-gpsp.mk installs
roms_root:
  path: /roms
  from_bios: null
  source_ref: "os board/miyoo/rootfs/etc/inittab:24-25; os board/miyoo/rootfs/etc/main:4-5"
case_sensitive: true
case_ref: "os board/miyoo/scripts/genimage.sh:94-98"
notes:
- "The ROMS partition (mmcblk0p5) mounts on /roms and is built as ext4, where folder case matters. etc/main\
  \ also accepts a FAT32 ROMS partition (os board/miyoo/rootfs/etc/main:181-186)."
- The bundled emulator links point at /mnt/roms/<SYS> while the partition mounts on /roms. Nothing in
  the buildroot tree joins the two.
- "The image installs seven emulator packages as release .ipk files (os package/miyoo/ipk-drpocketsnes/ipk-drpocketsnes.mk:1-3\
  \ and the six beside it). Their gmenu2x links live inside those packages. Only the gpSP link is also\
  \ kept in its source repository, the other folders are the ones the image ships."
- BIOS sits in /mnt/.retroarch/system on the main partition, another partition than the games, so no relative
  path joins them.
folders:
- folder: GB
  source_ref: os board/miyoo/roms/GB
  note: folder the image ships. Its emulator link lives in a release package no repository holds
- folder: GBA
  extensions:
  - .gba
  - .zip
  core: gpsp
  emulator: standalone
  source_ref: "gpsp miyoo/opkg_assets/gpsp.lnk:4"
  note: gmenu2x link of the gpsp package
- folder: GBC
  source_ref: os board/miyoo/roms/GBC
  note: folder the image ships. Its emulator link lives in a release package no repository holds
- folder: NES
  source_ref: os board/miyoo/roms/NES
  note: folder the image ships. Its emulator link lives in a release package no repository holds
