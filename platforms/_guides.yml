              RGB30, RGB20 Pro, Odroid Go Advance, Odroid Go Super]
    devices_source: https://github.com/RetroGFX/UnofficialOS/wiki

guides:
  retroarch:
    summary: >-
      An app that runs many consoles. It uses a different **core**, a small emulator,
      for each one.
    folders:
    - where: Windows
      path: '`system\` next to `retroarch.exe`'
    - where: macOS
      path: '`~/Documents/RetroArch/system/`'
    - where: Linux
      path: '`~/.config/retroarch/system/`'
    - where: Steam Deck and Linux Flatpak
      path: '`~/.var/app/org.libretro.RetroArch/config/retroarch/system/`'
    - where: Android
      path: '`RetroArch/system/` on the internal storage'
    - where: Nintendo Switch
      path: '`retroarch/cores/system/` on the SD card'
    more_folders:
    - where: Windows, Microsoft Store build
      path: '`%LOCALAPPDATA%\Packages\1e4cf179-f3c2-404f-b9f3-cb2070a5aad8_*\LocalState\system\`'
    - where: macOS, Steam or portable build
      path: '`~/Library/Application Support/RetroArch/system/`'
    more_folders_title: 'Other builds: Microsoft Store, Mac Steam, handhelds'
    # Adds a row for each named system the registry detects this platform on.
    more_folders_detected: true
    more_folders_note: LaunchBox and other launchers use the folder RetroArch reads.
    run: [windows, macos, linux, steamdeck, android]
    lead: >-
      **Not sure?** In RetroArch, open **Settings > Directory > System/BIOS**. It shows
      the folder.
    reference_notes:
    - >-
      RetroArch reads its BIOS folder from the `system_directory` line of `retroarch.cfg`,
      the value **Settings > Directory > System/BIOS** shows.
    - >-
      On Windows, `retroarch.cfg` is read next to `retroarch.exe` first, then from `%APPDATA%\RetroArch\`.
      A `system_directory` left at its default is the `system` folder next to `retroarch.exe`
      (`:\system` in RetroArch's `frontend/drivers/platform_win32.c`, where `:` stands
      for the folder of the program).
    pack_manual: |
      Option B: Manual (PC)
      ---------------------
      1. Find the RetroArch system directory:
         - RetroArch > Settings > Directory > System/BIOS
         - Default: retroarch/system/
      2. Extract all files from this archive directly into the system directory
      3. Overwrite if asked

      Option C: Manual (handheld / SD card)
      -------------------------------------
      1. Connect the SD card to a PC
      2. Find the BIOS folder in the list below
      3. Extract all files from this archive directly into that folder
      4. Eject the SD card and reboot the device

      Folders by device:
        {folders}
    logo_owner: libretro
    logo_licence: repository licence GPL-3.0
  batocera:
    summary: A system that starts straight into a game menu, on a PC, a Raspberry Pi or a handheld.
    # batocera.org/download: x86-64 desktop PC and laptop, Raspberry, Steam Deck OLED,
    # Anbernic and AYN handhelds.
    runs_on: PCs, Raspberry Pi, Steam Deck, handhelds
    # wiki.batocera.org/access_the_batocera_via_ssh: root@batocera.local, password
    # linux, SSH on by default. wiki.batocera.org (file manager): xterm in the
    # Applications menu of the F1 file manager, Xorg builds (x86_64) only.
    terminal: >-
      On a PC, press **F1** on the system list, then open **xterm** in the Applications
      menu. From a computer, open a terminal over the network with `ssh
      root@batocera.local`, password `linux`. Paste the line. Press Enter.
    folders:
    - where: On Batocera
    - where: From Windows, over the home network
      path: '`\\BATOCERA\share\bios\`'
    - where: From a Mac or Linux, over the home network
      path: '`smb://batocera/share/bios/`'
    run: [device]
    download_hint: From a computer, use the network folder above.
    pack_manual: |
      The terminal is xterm, in the Applications menu of the F1 file
      manager (PC only), or SSH: ssh root@batocera.local, password linux.

      Option B: Manual (network share)
      --------------------------------
      1. On a PC, open the Batocera network share:
         - Windows: \\BATOCERA\share\bios\
         - Mac/Linux: smb://batocera/share/bios/
      2. Extract all files from this archive directly into the share
      3. Overwrite if asked

      Option C: Manual (SD card)
      --------------------------
      1. Put the SD card in a PC
      2. Open the bios folder at the root of the SHARE drive
         (Batocera itself names it /userdata/bios/)
      3. Extract all files from this archive directly into that folder

      NOTE: Dreamcast flash memory is named dc_nvmem.bin
      (if the setup asks for dc_flash.bin, same file).
    logo_owner: Batocera
    logo_licence: repository licence MIT
  recalbox:
    summary: A system that starts straight into a game menu, on a board, a PC or a handheld.
    # recalbox.com: "TV, PC or handheld?", 13 supported boards and consoles.
    runs_on: Boards, PCs, handhelds
    # wiki.recalbox.com/en/tutorials/system/access/root-access-terminal-cli: Alt+F2 with
    # a keyboard. SSH user root, password recalboxroot or the one set when flashing 10.0+.
    terminal: >-
      With a keyboard, press **Alt+F2**. From a computer, open a terminal over the network
      with `ssh root@recalbox`, password `recalboxroot` or the one set when flashing. Paste the line.
      Press Enter.
    folders:
    - where: On Recalbox
    - where: From Windows, over the home network
      path: '`\\RECALBOX\share\bios\`'
    run: [device]
    download_hint: From a computer, use the network folder below.
    pack_manual: |
      Option B: Manual (network share)
      --------------------------------
      1. On a PC, open the Recalbox network share:
         - Windows: \\RECALBOX\share\bios\
      2. Extract all files from this archive directly into the share

      Option C: Manual (SD card)
      --------------------------
      1. Put the SD card in a PC
      2. Open the bios folder at the root of the SHARE drive
         (Recalbox itself names it /recalbox/share/bios/)
      3. Extract all files from this archive directly into that folder
    logo_owner: Recalbox
    logo_licence: file from homarr-labs/dashboard-icons, Apache-2.0
  retrobat:
    summary: >-
      A game menu for Windows. It comes with RetroArch and other emulators.
    folders:
    - where: Inside the RetroBat folder
      path: '`bios\`'
    - where: Default install
      path: '`C:\RetroBat\bios\`'
    run: [windows]
    notes:
    - The command finds RetroBat wherever it is installed.
    reference_notes:
    - >-
      RetroBat records its own folder each time it starts, and the installer reads it
      there.
    pack_manual: |
      Option B: Manual
      ----------------
      1. Open the RetroBat installation folder
      2. Navigate to the bios\ subfolder
         (default: C:\RetroBat\bios\)
      3. Extract all files from this archive directly into the bios\ folder
      4. Overwrite if asked
    logo_owner: RetroBat
    logo_licence: repository states no licence
  emudeck:
    summary: Installs emulators and adds the games to Steam.
    folders:
    - where: Steam Deck and Linux
    # EmuDeck functions/helperFunctions.sh:89-99 (getSDPath, the card's mount point)
    # and functions/jsonToBashVars.sh:128-132 (biosPath "$globPath/Emulation/bios"),
    # dragoonDorise/EmuDeck dddb3022.
    - where: Steam Deck, installed on the SD card
      path: '`Emulation/bios/` on the card, under `/run/media/`'
    - where: Windows, by default
      path: '`C:\Emulation\bios\`'
    - where: macOS
    run: [steamdeck, linux, windows, macos]
    notes:
    - >-
      The `bios` folder is inside the Emulation folder chosen in EmuDeck.
    # emudeck-electron src/renderer/translations/en.json:416-418 (b06bfcf5): the
    # "Bios files checker".
    finish: >-
      EmuDeck's **Bios files checker** shows the files too. Return to Gaming Mode and start
      a game.
    reference_notes:
    - >-
      The installer reads the Emulation folder from EmuDeck's settings (`emulationPath`
      in `~/.config/EmuDeck/settings.sh`).
    pack_manual: |
      Option B: Manual
      ----------------
      Extract all files from this archive directly into EmuDeck's bios
      folder, inside the Emulation folder chosen in EmuDeck:
        Steam Deck, Linux and macOS: ~/Emulation/bios/ by default
        Windows: C:\Emulation\bios\ by default
    logo_owner: EmuDeck
    logo_licence: repository licence GPL-3.0
  lakka:
    summary: A system that starts straight into RetroArch, on a Raspberry Pi or a small PC.
    # lakka.tv: "transforms a small computer", "a Raspberry Pi".
    runs_on: Raspberry Pi, small computers
    folders:
    - where: On Lakka
    # lakka.tv/doc/Accessing-Lakka-filesystem: Samba in Settings > Services, share System.
    - where: From Windows, over the home network
      path: '`\\LAKKA\System\`'
    run: [device]
    notes:
    - >-
      For the network folder, turn on **Samba** in Lakka's **Settings > Services**.
    # lakka.tv/doc/Accessing-Lakka-command-line-interface: SSH in Settings > Services,
    # user root, password root.
    terminal: >-
      Turn on **SSH**, a terminal over the network, in Lakka's **Settings > Services**. From
      a computer, connect with `ssh root@lakka`, password `root`. Paste the line. Press
      Enter.
    # /storage is the card's ext4 partition, the other one FAT32 (Lakka-LibreELEC
    # 4696b48f, scripts/mkimage:71-72 and 95): from a computer, only Linux opens it.
    card_run: [linux]
    reference_notes:
    - The folder is reachable over SSH and over the network share.
    pack_manual: |
      Lakka reads its BIOS files from /storage/system/.

      Option B: Via network share
      --------------------------
      1. On Lakka: Settings > Services > Samba Enable
      2. On a PC, open the System share: \\LAKKA\System\
      3. Extract all files from this archive directly into that share

      Option C: Via SSH
      -----------------
      1. On Lakka: Settings > Services > SSH Enable
      2. Copy the files to /storage/system/ (scp -r * root@lakka:/storage/system/)
    logo_owner: Lakka (libretro)
    logo_licence: file from libretro/retroarch-assets, CC-BY-4.0
  retrodeck:
    summary: >-
      One app with its emulators inside. Install it from Flathub or Discover.
    folders:
    - where: Steam Deck and Linux
      path: '`~/retrodeck/bios/`'
    - where: Installed on a microSD card
      path: 'for example `/run/media/mmcblk0p1/retrodeck/bios/`'
    run: [steamdeck, linux]
    pack_manual: |
      Option B: Manual
      ----------------
      1. Open Dolphin file manager
      2. Show hidden files (Ctrl+H)
      3. Navigate to ~/retrodeck/
      4. Extract all files from this archive directly into ~/retrodeck/
