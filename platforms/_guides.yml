    folder_source: https://github.com/spruceUI/spruceOS/wiki/10.-Adding-BIOS
    devices: [Miyoo A30, Miyoo Flip, Miyoo Mini, Miyoo Mini Plus, Miyoo Mini Flip,
              TrimUI Smart Pro, TrimUI Brick, RG35XX Plus, RG40XX H, RGB30]
    devices_source: https://github.com/spruceUI/spruceOS/wiki/Supported-Devices
  - name: Allium
    folder: '`BIOS` at the root of the card'
    folder_source: https://github.com/goweiwen/Allium/tree/ee0dda979bc02649fdda48b277eaa60938273465/static/BIOS
    devices: [Miyoo Mini, Miyoo Mini Plus, Miyoo Mini Flip]
    devices_source: https://github.com/goweiwen/Allium
  - name: Anbernic stock firmware
