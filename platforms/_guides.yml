    folder: '`bios` on the **EASYROMS** part of the card'
    folder_source: https://github.com/christianhaitian/dArkOS/wiki/dArkOS-Emulators-and-Ports-information
    devices: [RG353M, RG353V, RG503, RGB30, RGB20 Pro, RK2023, RG351MP, RGB10, G350,
              Odroid Go Advance, A10 Mini, Miniloong Pocket 1]
    devices_source: https://github.com/christianhaitian/dArkOS/releases/tag/v08272026
  - name: muOS
    folder: '`MUOS/bios` on the card'
    folder_source: https://github.com/MustardOS/internal/blob/main/share/web/tools/bios-checker.html
