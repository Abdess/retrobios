# What each platform page and pack README tell someone holding the device:
# the folder, where the command runs, what to know. Read by
# scripts/siteguides.py, which checks it on load: every platform in
# _registry.yml has a guide here, and every guide a registered platform.
#
# Values are Markdown. A folder row with no `path` is the registry's
# `extract_to` for that platform, the one place that folder is written.
# `run` names the terminals below, in the order the page shows them.
# `pack_manual` is the manual part of the README inside the pack, plain text.
# `{folders}` in it is the folder list of the page.
# `runs_on` names the hardware in the project's own words, cited beside it.
# `terminal` is how this system opens a terminal, from its own documentation.
# `card_run` names the computers that open the device's card, when not all do.
# `lead` comes before the folder table, `finish` closes the guide.
# `logo_owner` and `logo_licence` credit the logo the registry links: it is
# shown only to name the platform, with the licence of the repository the
# file was taken from when that repository states one.
#
# The registry keeps what tools read (device_group, extract_to, install);
# this file keeps what people read.

# The site serving the one-line bootstraps (scripts/sitebootstrap.py).
install_base: https://abdess.github.io/retrobios

# Is it safe: shown on the home page and under every command on a guide page.
# Where it writes follows install.py: the BIOS folder, the frontend's save
# folder for the entries a manifest files under `root: save`
# (place_save_entries), and retrobios-backup beside the folder written to.
trust_items:
- It checks each file before saving it.
- It writes in the BIOS folder. For some emulators it also adds files to the save folder.
- It never changes or deletes a game or save file.
- >-
  It keeps any file it replaces in a `retrobios-backup` folder, next to the BIOS folder.
  `--restore` puts it back.

# Order of the groups on the picker, in the navigation and on the home page.
# `anchor` is the section id on the device picker: two keep the ids the page
# had before it was grouped by device, which links outside the site may use.
# `also_runs` are setups that are not platforms of their own: they run one,
# and use its pack.
device_groups:
  computer:
    label: Computers (Windows, Mac, Linux) and Steam Deck
    description: An emulator app on a computer or a Steam Deck.
    anchor: computers-and-steam-deck
    also_runs:
    - setup: LaunchBox
      summary: >-
        A game library and launcher. It starts RetroArch or standalone emulators.
      uses: retroarch
      runs_on: Windows
      folder: The folder of the RetroArch it starts
  gaming-os:
    label: Raspberry Pi and mini PCs
    description: A system that starts straight into a game menu.
    anchor: game-systems
  handheld:
    label: Handhelds and TV boxes (Anbernic, Retroid, Miyoo)
    description: The system a handheld or TV box starts.
    anchor: handhelds
    also_runs:
    - setup: Android (Retroid Pocket, AYN Odin and others)
      summary: RetroArch for Android.
      uses: retroarch
      runs_on: Android
      folder: '`RetroArch/system/` on the internal storage'
    # Kinds of handheld that run a setup of their own: a tile each beside the
    # setups of the group, leading to where their folder is written.
    tiles:
    - name: Android
      # goretroid.com/products/retroid-pocket-5-handheld: "OS: Android 13".
      # ayntec.com/products/ayn-odin-3: "Android 15".
      text: Retroid, AYN Odin and other Android handhelds
      link: platforms/retroarch.md#where-the-files-go
      logo: https://raw.githubusercontent.com/simple-icons/simple-icons/7185d367013b99211c2728d5007833a922ec12c7/icons/android.svg
      logo_owner: Google
      logo_licence: Android robot, file from simple-icons, CC0-1.0
    - name: Linux handhelds
      text: dArkOS, muOS, Onion, spruceOS
      link: platforms/linux-handhelds.md
      logo: https://raw.githubusercontent.com/simple-icons/simple-icons/521c96fd04b0ea93034db8715eda5a4de27a58bb/icons/linux.svg
      logo_owner: Larry Ewing
      logo_licence: Tux, file from simple-icons, CC0-1.0
    # No terminal runs there: the files are copied in, each app its own way
    # (which-pack.md, section iPhone and iPad, each step cited).
    - name: iPhone and iPad
      text: RetroArch, Delta, Provenance
      link: which-pack.md#iphone-and-ipad
      # A phone and a tablet, no brand: Apple's guidelines allow no use of its logo.
      logo: https://raw.githubusercontent.com/lucide-icons/lucide/a1b2ce5b7b6a09da2f2f61f682b299f69effb057/icons/tablet-smartphone.svg
      logo_owner: Lucide
      logo_licence: icon from lucide-icons, ISC
  fpga:
    label: MiSTer FPGA
    description: >-
      A board that recreates old consoles in hardware, not in software.
    anchor: fpga
  server:
    label: Self-hosted game library
    description: A RomM server. It plays games in the web browser.
    anchor: self-hosted

# Ways to run the installer: the tab label, how to open a terminal there, and
# the shell the command is written for.
terminals:
  windows:
    label: Windows
    how: >-
      Open Start. Type **PowerShell**, press Enter. Click Copy. Right-click to paste. Press
      Enter.
    shell: powershell
  macos:
    label: macOS
    how: >-
      Press Cmd+Space. Type **Terminal**, press Return. Click Copy. Press Cmd+V. Press
      Return.
    shell: sh
  linux:
    label: Linux
    how: >-
      Open a terminal, often with Ctrl+Alt+T. Click Copy. Press Ctrl+Shift+V. Press Enter.
    shell: sh
  steamdeck:
    label: Steam Deck
    how: >-
      Hold power, pick **Switch to Desktop**. Open **Konsole**. Click Copy. Press
      Ctrl+Shift+V. Press Enter.
    shell: sh
  android:
    label: Android (Termux)
    how: >-
      Install **Termux**, a terminal app. Paste the line. Press Enter. Accept the Python
      install and allow the storage access Android asks for.
    shell: sh
  device:
    label: On the device
    how: >-
      Open a terminal on the device. Or connect from a computer with SSH, a terminal over
      the network. Paste the line. Press Enter.
    shell: sh
  server:
    label: On the server
    how: >-
      Open a terminal on the machine that holds the RomM library. Put the path of its
      `bios` folder after `--dest`.
    shell: sh

# The guide for the handheld systems that run RetroArch, one row for each
# system the installer detects it on (_registry.yml, retroarch install.detect).
# A folder is the one seen on the card from a computer, and a device list the
# one the system's own site, wiki or README gives. Each is written only with
# the first-party page that states it (`*_source`), and left out when no such
# page states it: the row then says where RetroArch shows the folder.
# `linux_only` marks a folder on a part of the card only Linux reads.
handheld_guide:
  page: linux-handhelds
  title: Linux handhelds
  uses: retroarch
  summary: >-
    dArkOS, muOS, Onion, spruceOS and the other systems below run **RetroArch**, an app
    with a small emulator for each console. They use its BIOS files.
  systems:
  # dArkOS replaced ArkOS on 30 December 2025. Its devices are the images of
  # its latest release, and the Odroid Go Advance its wiki names.
