    devices_source: https://github.com/GarlicOS/bootloader_anbernic_rg35xxplus/blob/45b489b41dc3dd1738b14486cda0f2dce66e714f/README.md
  - name: ArchR
    folder: '`/storage/roms/bios`, on a part only Linux can open'
    folder_source: https://arch-r.io/docs/roms/
    linux_only: true
    devices: [R36S, R33S, R36S Soysauce, Odroid Go Advance, Odroid Go Super, RG351V,
              RG351M, GameForce Chi, MagicX XU10, RGB10, RGB10X, K36]
    devices_source: https://github.com/archr-linux/Arch-R
  # Cards made before the end still run it: the row stays, said as ended.
  - name: ArkOS
    ended: no longer updated, replaced by dArkOS
    ended_source: https://github.com/christianhaitian/arkos/wiki
    folder: '`bios` on the **EASYROMS** part of the card'
    folder_source: https://github.com/christianhaitian/arkos/wiki/ArkOS-Emulators-and-Ports-information
    devices: [RG353M, RG353V, RG503, RGB30, RK2023, RG351MP, RG351V, R35S, RGB10]
    devices_source: https://github.com/christianhaitian/arkos/wiki
  - name: CrossMix-OS
    folder: '`BIOS` at the root of the card'
    folder_source: https://github.com/cizia64/CrossMix-OS/wiki/Emulators
    devices: [TrimUI Smart Pro]
    devices_source: https://github.com/cizia64/CrossMix-OS
  - name: JELOS
    ended: no longer updated
    ended_source: https://github.com/JustEnoughLinuxOS/distribution
    folder: '`roms/bios` on the games card'
    folder_source: https://github.com/JustEnoughLinuxOS/distribution/blob/7b2e116ce6996d56e642a0e2a07288c926db926b/packages/emulators/standalone/retroarch/sources/RK3566/retroarch.cfg#L716
    devices: [RG351M, RG351V, RG353M, RG353P, RG353V, RG353VS, RG503, RG552, R33S, R36S,
              GameForce Ace, GameForce Chi, Odroid Go Advance, Odroid Go Super, Odroid Go Ultra,
              MagicX XU10, RGB10, RGB10 Max 3, RGB10 Max 3 Pro, RGB20S, RGB30, RK2023, X55,
              AYANEO Air, AYANEO Air Plus, AYANEO Air Pro, AYANEO 2, AYANEO 2S, AYANEO 2021,
              AYANEO Geek, AYANEO Next, AYN Loki Max, AYN Loki Mini Pro, AYN Loki Zero]
    devices_source: https://github.com/JustEnoughLinuxOS/distribution/tree/7b2e116ce6996d56e642a0e2a07288c926db926b/packages/hardware/quirks/devices
  - name: KOLOS
    folder: '`roms/bios` on the games card'
    folder_source: https://github.com/AnonLinuxOS/KOLOS/blob/7daf5950ae79bb8775f129468164f730dbc32298/packages/emulators/standalone/retroarch/sources/RK3566/retroarch.cfg#L716
    devices: [RG353P, RG353M, RG353V, RG353VS, RG503, RK2023, RGB30, RGB10 Max 3]
    devices_source: https://github.com/AnonLinuxOS/KOLOS
  - name: Koriki
    folder: '`BIOS` at the root of the card'
    folder_source: https://github.com/Rparadise-Team/Koriki/wiki/En:-02.-Content-installation
    devices: [Miyoo Mini]
    devices_source: https://github.com/Rparadise-Team/Koriki
  - name: MiyooCFW
    folder: '`.retroarch/system`, hidden, on the **MAIN** part, which only Linux can open'
    folder_source: https://github.com/MiyooCFW/buildroot/blob/d5912eeb7b636810bafaa34eb0517fd599a0fc71/board/miyoo/rootfs/etc/main#L164-L170
    linux_only: true
    devices: [BittBoy, Pocket Go, PowKiddy Q90, PowKiddy V90, PowKiddy Q20 Mini, Sup M3, XYC Q8]
    devices_source: https://github.com/MiyooCFW/docs/blob/main/docs/index.md
  - name: plumOS
    folder: '`bios` on the **PLUMOS** part of the card'
    folder_source: https://github.com/game-de-it/plumOS-XU20V32/blob/main/docs/developer/storage-and-updates.md
    devices: [MagicX XU20 V32]
    devices_source: https://github.com/game-de-it/plumOS-XU20V32
  # RetroOZ publishes no build source. Its wiki keeps games under /roms and
  # sends BIOS questions to the ArkOS wiki, whose folder is bios in roms. The
  # 0.60 image sets system_directory "/roms/bios" (retroarch32/retroarch.cfg:3046).
  # Written as the device path: no RetroOZ page names the card's parts.
  - name: RetroOZ
    folder: '`/roms/bios`, as the device names it'
    folder_source: https://github.com/southoz/RetroOZ/wiki/Home/4ce4fafb78d647d422e9e468d5bd9cbc63dbe3ea
    devices: [Odroid Go Super, Odroid Go Advance, RGB10 Max, RGB10 Max 2]
    devices_source: https://github.com/southoz/RetroOZ/wiki
  - name: UnofficialOS
    folder: '`roms/bios` on the games card'
