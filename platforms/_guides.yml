    logo_licence: GitHub organisation avatar of knulli-cfw
  retropie:
    summary: Installs RetroArch and other emulators on a Raspberry Pi or a PC.
    # RetroPie docs index.md (175f5b15): Raspberry Pi, PC and Odroid.
    runs_on: Raspberry Pi, PC, Odroid
    folders:
    - where: On the Raspberry Pi
    # RetroPie-Setup scriptmodules/supplementary/samba.sh:49-52 (46128cd2) shares
    # $home/RetroPie/BIOS as "bios", and docs/Transferring-Roms.md:29 names \\RETROPIE.
    - where: From Windows, over the home network
      path: '`\\RETROPIE\bios\`'
    run: [device]
    # RetroPie docs/FAQ.md:193 (F4 in EmulationStation, its game menu), 175f5b15. The computer route
    # is the network folder above.
    terminal: >-
      Press **F4** in the game menu for a terminal. Paste the line. Press Enter.
    # The BIOS folder is on the card's Linux partition (pack_manual below):
    # from a computer, only Linux opens it.
    card_run: [linux]
    notes:
    - >-
      Install with `--platform retropie`, not RetroArch's files. The command does not run on
      RetroPie 4.8: run it on a computer there, with the network folder above after `--dest`.
    reference_notes:
    - >-
      RetroPie also installs standalone emulators (openMSX, PCSX2, XRoar, Amiberry and
      others) whose files only the RetroPie file list carries.
    pack_manual: |
      Option B: Via network share
      --------------------------
      1. On a PC, open: \\RETROPIE\bios\
      2. Extract all files from this archive directly into that folder

      Option C: Via SSH
      -----------------
      1. SSH into the Pi: ssh pi@retropie
      2. Copy files to ~/RetroPie/BIOS/

      NOTE: the BIOS folder is on the card's Linux partition,
      which Windows and macOS cannot open: copying through the
      card works from a Linux computer only
      (<rootfs>/home/pi/RetroPie/BIOS/).
    logo_owner: RetroPie
    logo_licence: GitHub organisation avatar of RetroPie
