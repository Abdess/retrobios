    # check_freshness and refresh_stale move it to the branch head.
    rescrape_args: ["--revision", "master"]
    source_url: https://raw.githubusercontent.com/RetroBat-Official/emulatorlauncher/master/batocera-systems/Resources/batocera-systems.json
    source_format: json
    hash_type: md5
    # Windows: names differing only by case land on one file.
    case_insensitive_fs: true
    # A generator takes an emulator folder from AppConfig.GetFullPath(key):
    # the key in emulatorLauncher.cfg, else the first existing of
    # emulationstation/<key>, emulators/<key>, system/emulators/<key> and
    # system/<key> below the RetroBat folder (EmulatorLauncher.Common/
    # FileFormats/ConfigFile.cs:126-180 at ca486005). emulatorLauncher runs
    # from emulationstation/, its LocalPath (emulatorLauncher/Program.cs:536-537),
    # beside bios/.
    emulators_directory:
      launcher_spelling: '<AppConfig.GetFullPath("{key}")>'
      bios_folder: bios
      searched:
      - "emulationstation/{key}"
      - "emulators/{key}"
      - "system/emulators/{key}"
      - "system/{key}"
      default: "emulators/{key}"
      config: emulationstation/emulatorLauncher.cfg
    # emulatorLauncher hands each libretro core saves\<system> at every
    # launch, saves\ beside bios\ (emulatorLauncher.cfg in retrobat 8.3.1),
    # and sorts saves by core for dolphin alone (CoreSaveSort)
    # (emulatorLauncher/Generators/LibRetro.Generator.cs:1128-1132, 1304-1315
    # and 2707 at 48cdc616). <system> is the ES system name, so a file is
    # placed once below each system es_systems.cfg offers the core for
    # (libretro_systems in retrobat.yml). mame (saves\) and amiberry
    # (saves\<system>\LR-amiberry) differ, and neither profile has a file
    # read below the save directory.
    save_directory:
      folder: saves
      by_core: false
      by_system: true
      by_core_for: [dolphin]
