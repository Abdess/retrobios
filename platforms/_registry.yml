# Shared by every platform below: same files, same destinations.
_standalone_copies: &standalone_copies
  # Switch emulators (keys)
  - file: prod.keys
    targets:
      linux:
      - $HOME/.local/share/yuzu/keys
      - $HOME/.local/share/eden/keys
      - $HOME/.local/share/citron/keys
      - $HOME/.local/share/suyu/keys
      - $HOME/.var/app/dev.eden_emu.eden/data/eden/keys
      - $HOME/.config/Ryujinx/system
      - $HOME/.var/app/io.github.ryubing.Ryujinx/config/Ryujinx/system
      windows:
      - '%APPDATA%\yuzu\keys'
      - '%APPDATA%\eden\keys'
      - '%APPDATA%\citron\keys'
      - '%APPDATA%\suyu\keys'
      - '%APPDATA%\Ryujinx\system'
      darwin:
      - $HOME/Library/Application Support/yuzu/keys
      - $HOME/Library/Application Support/Ryujinx/system
  - file: title.keys
    targets:
      linux:
      - $HOME/.local/share/yuzu/keys
      - $HOME/.local/share/eden/keys
      - $HOME/.local/share/citron/keys
      - $HOME/.local/share/suyu/keys
      - $HOME/.var/app/dev.eden_emu.eden/data/eden/keys
      windows:
      - '%APPDATA%\yuzu\keys'
      - '%APPDATA%\eden\keys'
      - '%APPDATA%\citron\keys'
      - '%APPDATA%\suyu\keys'
      darwin:
      - $HOME/Library/Application Support/yuzu/keys
  # 3DS emulators
  - file: Citra/sysdata/aes_keys.txt
    targets:
      linux:
      - $HOME/.local/share/azahar-emu/sysdata
      - $HOME/.var/app/org.azahar_emu.Azahar/data/azahar-emu/sysdata
      windows:
      - '%APPDATA%\Azahar\sysdata'
      # common_paths.h:36,61 (azahar 987f1840).
      darwin:
      - $HOME/Library/Application Support/Azahar/sysdata
  - file: Citra/sysdata/boot9.bin
    targets:
      linux:
      - $HOME/.local/share/azahar-emu/sysdata
      - $HOME/.var/app/org.azahar_emu.Azahar/data/azahar-emu/sysdata
      windows:
      - '%APPDATA%\Azahar\sysdata'
      # common_paths.h:36,61 (azahar 987f1840).
      darwin:
      - $HOME/Library/Application Support/Azahar/sysdata
  # DuckStation (PS1)
  - pattern: 'scph*.bin'
    targets:
      linux:
      - $HOME/.local/share/duckstation/bios
      - $HOME/.var/app/org.duckstation.DuckStation/config/duckstation/bios
      windows:
      - '%LOCALAPPDATA%\DuckStation\bios'
      - '%USERPROFILE%\Documents\DuckStation\bios'
      darwin:
      - $HOME/Library/Application Support/DuckStation/bios
  # PCSX2 (PS2)
  - pattern: 'ps2-*.bin'
    emulator: pcsx2
    targets:
      linux:
      - $HOME/.config/PCSX2/bios
      - $HOME/.var/app/net.pcsx2.PCSX2/config/PCSX2/bios
      windows:
      - '%USERPROFILE%\Documents\PCSX2\bios'
      darwin:
      - $HOME/Library/Application Support/PCSX2/bios
  # RPCS3 (PS3) - needs menu install
  - note: 'PS3 firmware (PS3UPDAT.PUP) found. Install via RPCS3 > File > Install Firmware.'
    detect:
      linux:
      - $HOME/.config/rpcs3
      - $HOME/.var/app/net.rpcs3.RPCS3/config/rpcs3
      windows:
      - '%APPDATA%\rpcs3'
  # Dolphin (GameCube)
  - file: GC/USA/IPL.bin
    emulator: dolphin
    targets:
      linux:
      - $HOME/.local/share/dolphin-emu/GC/USA
      - $HOME/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/USA
      windows:
      - '%APPDATA%\Dolphin Emulator\GC\USA'
      darwin:
      - $HOME/Library/Application Support/Dolphin/GC/USA
  - file: GC/EUR/IPL.bin
    emulator: dolphin
    targets:
      linux:
      - $HOME/.local/share/dolphin-emu/GC/EUR
      - $HOME/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/EUR
      windows:
      - '%APPDATA%\Dolphin Emulator\GC\EUR'
      darwin:
      - $HOME/Library/Application Support/Dolphin/GC/EUR
  - file: GC/JAP/IPL.bin
    emulator: dolphin
    targets:
      linux:
      - $HOME/.local/share/dolphin-emu/GC/JAP
      - $HOME/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/JAP
      windows:
      - '%APPDATA%\Dolphin Emulator\GC\JAP'
      darwin:
      - $HOME/Library/Application Support/Dolphin/GC/JAP
  # User/GC, then Sys/GC (DSPLLE.cpp:106-113, libretro/dolphin 3aac3f05).
  - file: dsp_rom.bin
    emulator: dolphin
    targets:
      linux:
      - $HOME/.local/share/dolphin-emu/GC
      - $HOME/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC
      windows:
      - '%APPDATA%\Dolphin Emulator\GC'
      darwin:
      - $HOME/Library/Application Support/Dolphin/GC
  # User/GC, then Sys/GC (DSPLLE.cpp:106-113, libretro/dolphin 3aac3f05).
  - file: dsp_coef.bin
    emulator: dolphin
    targets:
      linux:
      - $HOME/.local/share/dolphin-emu/GC
      - $HOME/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC
      windows:
      - '%APPDATA%\Dolphin Emulator\GC'
      darwin:
      - $HOME/Library/Application Support/Dolphin/GC
  # PPSSPP
  - file: PPSSPP/ppge_atlas.zim
    targets:
      linux:
      - $HOME/.config/ppsspp/PSP/SYSTEM
      - $HOME/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SYSTEM
      windows:
      - '%USERPROFILE%\Documents\PPSSPP\PSP\SYSTEM'
      darwin:
      - $HOME/Library/Application Support/PPSSPP/PSP/SYSTEM
  # Flycast (Dreamcast)
  # Linux reads the data folder itself (core/linux-dist/main.cpp:74-97,
  # core/stdclass.cpp:95-107, flycast e88b0ced). Windows reads data\ beside
  # flycast.exe (core/windows/winmain.cpp:56-77), a folder no rule can name.
  - file: dc/dc_boot.bin
    targets:
      linux:
      - $HOME/.local/share/flycast
      - $HOME/.var/app/org.flycast.Flycast/data/flycast
      # shell/apple/emulator-osx/emulator-osx/osx-main.mm:83-101 (flycast 6bb0fc3e).
      darwin:
      - $HOME/Library/Application Support/Flycast/data
      # <home>/data/ (shell/android-studio/flycast/src/main/jni/src/Android.cpp:
      # 143-159, flycast a9bd1c74), writable from Termux up to Android 10.
      android:
      - $EXTERNAL_STORAGE/Android/data/com.flycast.emulator/files/data
  # Linux reads the data folder itself (core/linux-dist/main.cpp:74-97,
  # core/stdclass.cpp:95-107, flycast e88b0ced). Windows reads data\ beside
  # flycast.exe (core/windows/winmain.cpp:56-77), a folder no rule can name.
  - file: dc/dc_nvmem.bin
    targets:
      linux:
      - $HOME/.local/share/flycast
      - $HOME/.var/app/org.flycast.Flycast/data/flycast
      # shell/apple/emulator-osx/emulator-osx/osx-main.mm:83-101 (flycast 6bb0fc3e).
      darwin:
      - $HOME/Library/Application Support/Flycast/data
      # <home>/data/ (shell/android-studio/flycast/src/main/jni/src/Android.cpp:
      # 143-159, flycast a9bd1c74), writable from Termux up to Android 10.
      android:
      - $EXTERNAL_STORAGE/Android/data/com.flycast.emulator/files/data

# release_pack: true marks the platforms a release publishes a ZIP for, the
# ones most people download (download_count of v2026.10.10, part 1 of each
# pack). Every other platform is served by the installer, whose manifest is
# written for all of them. wiki/release-process.md says how to revisit it.
platforms:
  retroarch:
    config: retroarch.yml
    release_pack: true
    device_group: computer
    extract_to: system/
    logo: https://raw.githubusercontent.com/libretro/RetroArch/master/media/retroarch-vector_invader-only.svg
    scraper: libretro
    source_url: https://raw.githubusercontent.com/libretro/libretro-database/master/dat/System.dat
    source_format: clrmamepro_dat
    hash_type: sha1
    verification_mode: existence
    base_destination: system
    # The directory RETRO_ENVIRONMENT_GET_SAVE_DIRECTORY returns
    # (runloop.c:2699-2700, libretro/RetroArch a81e450c): savefile_directory,
    # saves/ beside system/ by default (platform_unix.c:3364-3365,
    # platform_win32.c:1343, platform_darwin.m:456), with the core's
    # library_name appended since sort_savefiles_enable defaults to true
    # (config.def.h:1099, runloop.c:11285-11293).
    save_directory:
      folder: saves
      by_core: true
    case_insensitive_fs: true
    schedule: weekly
    cores: all_libretro
    target_scraper: retroarch_targets
    target_source: https://buildbot.libretro.com/nightly/
    install:
      detect:
      - os: linux
        method: config_file
        config: $HOME/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg
        parse_key: system_directory
      - os: linux
        method: config_file
        config: $HOME/snap/retroarch/current/.config/retroarch/retroarch.cfg
        parse_key: system_directory
      # Native: $XDG_CONFIG_HOME/retroarch when the variable is set, else
      # $HOME/.config/retroarch, then $HOME/.retroarch.cfg when that file is
      # missing (file_path_special.c fill_pathname_application_data,
      # configuration.c open_default_config_file). A value left at default
      # is the system folder of the first of the two folders.
      - os: linux
        method: config_file
        config: $XDG_CONFIG_HOME/retroarch/retroarch.cfg
        parse_key: system_directory
      - os: linux
        method: config_file
        config: $HOME/.config/retroarch/retroarch.cfg
        parse_key: system_directory
      - os: linux
        method: config_file
        config: $HOME/.retroarch.cfg
        parse_key: system_directory
      # configuration.c reads <Application Support>/RetroArch/config, and a value
      # left at default is ~/Documents/RetroArch/system (platform_darwin.m).
      # Older builds kept the file one level up.
      - os: darwin
        method: config_file
        config: $HOME/Library/Application Support/RetroArch/config/retroarch.cfg
        parse_key: system_directory
        bios_path: $HOME/Documents/RetroArch/system
      - os: darwin
        method: config_file
        config: $HOME/Library/Application Support/RetroArch/retroarch.cfg
        parse_key: system_directory
        bios_path: $HOME/Documents/RetroArch/system
      # Beside retroarch.exe first, then %APPDATA%; default <exe folder>\system.
      # The folders its installers, Steam and ES-DE put it in.
      - os: windows
        method: config_file
        config: 'C:\RetroArch-Win64\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: 'C:\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles%\RetroArch-Win64\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles%\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles%\ES-DE\Emulators\RetroArch-Win64\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles%\ES-DE\Emulators\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles(x86)%\RetroArch-Win64\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles(x86)%\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles(x86)%\ES-DE\Emulators\RetroArch-Win64\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles(x86)%\ES-DE\Emulators\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%APPDATA%\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles(x86)%\Steam\steamapps\common\RetroArch\retroarch.cfg'
        parse_key: system_directory
      - os: windows
        method: config_file
        config: '%ProgramFiles%\Steam\steamapps\common\RetroArch\retroarch.cfg'
        parse_key: system_directory
      # Handheld systems that run RetroArch as their frontend, each found by
      # what its own build writes. A system built on another (derives_from)
      # matches both and is the one meant.
      # muOS: MustardOS/internal f41f4a89: retroarch.sh:8-20, bind.sh:4,116-150,
      # retroarch.default.cfg:2806,3151. /mnt/mmc/MUOS is the older layout.
      - os: linux
        name: muOS
        method: file_exists
        file: /opt/muos
        bios_path: /run/muos/storage/bios
        config: [/opt/muos/share/info/config/retroarch.cfg, /opt/muos/share/emulator/retroarch/retroarch.default.cfg]
      - os: linux
        name: muOS
        method: file_exists
        file: /mnt/mmc/MUOS
        bios_path: /mnt/mmc/MUOS/bios
      # JELOS: JustEnoughLinuxOS/distribution 7b2e116c scripts/image:118-120,
      # options:17, runemu.sh:37, RK3566/retroarch.cfg:716.
      - os: linux
        name: JELOS
        method: os_release
        match: [OS_NAME=JELOS]
        bios_path: /storage/roms/bios
        config: [/storage/.config/retroarch/retroarch.cfg]
        home: /storage
      # KOLOS: AnonLinuxOS/KOLOS 7daf5950: OS_NAME=JELOS kept, jelos-ready.service
      # ("KOLOS system ready script") installed by scripts/install:100-102.
      - os: linux
        name: KOLOS
        method: file_exists
        file: /usr/lib/systemd/system/jelos-ready.service
        bios_path: /storage/roms/bios
        config: [/storage/.config/retroarch/retroarch.cfg]
        home: /storage
        derives_from: JELOS
      # UnofficialOS: RetroGFX/UnofficialOS 22635796 scripts/image:119-120, options:17,
      # packages/unofficialos/sources/scripts/runemu.sh:37.
      - os: linux
        name: UnofficialOS
        method: os_release
        match: [OS_NAME=UnofficialOS]
        bios_path: /storage/roms/bios
        config: [/storage/.config/retroarch/retroarch.cfg]
        home: /storage
      # ArchR: archr-linux/Arch-R dbd45d45 scripts/image:164-177, options:17,
      # factoryreset:9-10, RK3326/retroarch.cfg:718.
      - os: linux
        name: ArchR
        method: os_release
        match: [OS_NAME=ArchR]
        bios_path: /storage/roms/bios
        config: [/storage/.config/retroarch/retroarch.cfg]
        home: /storage
      # ArkOS: christianhaitian/arkos dedf4278 Update-RGB10.sh:76 (splash title).
      # Both configs move to /roms2 with "Switch to SD2 for Roms" (darkos
      # daecf488, scripts/Switch to SD2 for Roms.sh:91-92).
      - os: linux
        name: ArkOS
        method: file_exists
        file: [/home/ark, /opt/system]
        bios_path: /roms/bios
        config: [/home/ark/.config/retroarch/retroarch.cfg, /home/ark/.config/retroarch32/retroarch.cfg]
      - os: linux
        name: ArkOS
        method: file_matches
        file: /usr/share/plymouth/themes/text.plymouth
        pattern: '^title=\s*ArkOS\b'
        bios_path: /roms/bios
        config: [/home/ark/.config/retroarch/retroarch.cfg, /home/ark/.config/retroarch32/retroarch.cfg]
      # dArkOS: christianhaitian/darkos daecf488 finishing_touches.sh:359-361,
      # retroarch.cfg.rgb10:3043. The dArkOSRE, dArkOSen and ArkOS4Clone overlays
      # keep the title.
      - os: linux
        name: dArkOS
        method: file_matches
        file: /usr/share/plymouth/themes/text.plymouth
        pattern: '^title=\s*dArkOS'
        bios_path: /roms/bios
        config: [/home/ark/.config/retroarch/retroarch.cfg, /home/ark/.config/retroarch32/retroarch.cfg]
        derives_from: ArkOS
      # RetroOZ: RetroOZ 0.60 image: splash title, /opt/.retrooz/version,
      # retroarch32/retroarch.cfg:3046. /etc/retrooz_version is the file PortMaster
      # reads (PortMaster-GUI ccea6b74, PortMaster/device_info.txt:95).
      - os: linux
        name: RetroOZ
        method: file_matches
        file: /usr/share/plymouth/themes/text.plymouth
        pattern: '^title=\s*RetroOZ'
        bios_path: /roms/bios
        config: [/home/odroid/.config/retroarch/retroarch.cfg, /home/odroid/.config/retroarch32/retroarch.cfg]
      - os: linux
        name: RetroOZ
        method: file_exists
        file: /opt/.retrooz
        bios_path: /roms/bios
        config: [/home/odroid/.config/retroarch/retroarch.cfg, /home/odroid/.config/retroarch32/retroarch.cfg]
      - os: linux
        name: RetroOZ
        method: file_exists
        file: /etc/retrooz_version
        bios_path: /roms/bios
        config: [/home/odroid/.config/retroarch/retroarch.cfg, /home/odroid/.config/retroarch32/retroarch.cfg]
      # spruceOS: spruceOS 824b1aae spruce/scripts/helperFunctions.sh:157-165,
      # RetroArch/platform/retroarch-Brick.cfg.bak:3279.
      - os: linux
        name: spruceOS
        method: file_exists
        file: /mnt/SDCARD/spruce
        bios_path: /mnt/SDCARD/BIOS
        config: ['/mnt/SDCARD/Saves/ra-configs/retroarch-*.cfg']
        derives_from: TrimUI
      # CrossMix-OS: cizia64/CrossMix-OS 206d612f System/usr/trimui/scripts/
      # update_common.sh:20, patch_ra_cfg.sh:5, RetroArch/retroarch.cfg:3202.
      - os: linux
        name: CrossMix-OS
        method: file_exists
        file: /mnt/SDCARD/System/usr/trimui/crossmix-version.txt
        bios_path: /mnt/SDCARD/BIOS
        config: [/mnt/SDCARD/RetroArch/retroarch.cfg]
        derives_from: TrimUI
      # Onion: OnionUI/Onion 07505ea5 Makefile:75-76,
      # .tmp_update/script/patch_ra_cfg.sh:6, retroarch.cfg:3009.
      - os: linux
        name: Onion
        method: file_exists
        file: /mnt/SDCARD/.tmp_update/onionVersion/version.txt
        bios_path: /mnt/SDCARD/BIOS
        config: [/mnt/SDCARD/RetroArch/.retroarch/retroarch.cfg]
      # Allium: goweiwen/Allium ee0dda97 crates/common/src/constants.rs:19-34,
      # launch_without_savestate_auto_load.sh:2-7. Its RetroArch patch makes
      # $ROOT/BIOS the default system folder.
      - os: linux
        name: Allium
        method: file_exists
        file: /mnt/SDCARD/.allium
        bios_path: /mnt/SDCARD/BIOS
        config: [/mnt/SDCARD/RetroArch/.retroarch/retroarch.cfg]
      # Koriki: Rparadise-Team/Koriki 8513071c src/systemInfo/main.c:106,
      # .tmp_update/runtime.sh:271, RetroArch/.retroarch/retroarch.cfg:3191.
      - os: linux
        name: Koriki
        method: file_exists
        file: /mnt/SDCARD/Koriki/version.txt
        bios_path: /mnt/SDCARD/BIOS
        config: [/mnt/SDCARD/RetroArch/.retroarch/retroarch.cfg]
      # MiyooCFW: MiyooCFW buildroot d5912eeb board/miyoo/rootfs/etc/main:4 (HOME),
      # package/miyoo/miyoo-ctl/miyoo-ctl.mk:12. DINGUX RetroArch defaults to
      # $HOME/.retroarch/system.
      - os: linux
        name: MiyooCFW
        method: file_exists
        file: [/etc/main, /usr/bin/miyooctl]
        bios_path: /mnt/.retroarch/system
        config: [/mnt/.retroarch/retroarch.cfg]
        home: /mnt
      # plumOS: game-de-it/plumOS-pixel2_v2 dec872c0 rootfs/pixel2/etc/os-release:2,
      # sbin/init:29, plumos-retroarch-launch:342. Other plumOS builds append a
      # folder of their own at launch (plumOS-MF 0095017c,
      # plumos-retroarch-launch:15): found, not installed to.
      - os: linux
        name: plumOS
        method: file_exists
        file: /mnt/plumos-user
        bios_path: /mnt/plumos-user/bios
      - os: linux
        name: plumOS
        method: os_release
        match: [ID=plumos]
      # TrimUI: the stock firmware publishes no source naming its BIOS folder.
      # /usr/trimui is where PortMaster finds its libraries
      # (trimui/launch_hooks.txt:37). Found so that what runs on it is told
      # apart, never installed to.
      - os: linux
        name: TrimUI
        method: file_exists
        file: /usr/trimui
        installs: false
      # MinUI: MinUI dbf89435 workspace/all/common/defines.h:14-16, minarch.c:2942.
      # One Bios/<tag>/ folder per core, not written by the installer.
      - os: linux
        name: MinUI
        method: file_exists
        file: /mnt/SDCARD/.system/res
        installs: false
        derives_from: TrimUI
      - os: linux
        name: MinUI
        method: file_exists
        file: /mnt/sdcard/.system/res
        installs: false
        derives_from: TrimUI
      # Anbernic stock firmware: the stock Linux of Anbernic devices.
      - os: linux
        name: 'Anbernic stock firmware'
        method: file_exists
        file: /mnt/vendor/bin/dmenu.bin
        bios_path: /mnt/mmc/bios
      standalone_copies: *standalone_copies
  batocera:
    config: batocera.yml
    release_pack: true
    device_group: gaming-os
    extract_to: /userdata/bios/
    logo: https://raw.githubusercontent.com/batocera-linux/batocera-emulationstation/master/resources/splash_batocera.svg
    scraper: batocera
    source_url: https://raw.githubusercontent.com/batocera-linux/batocera.linux/master/package/batocera/core/batocera-scripts/scripts/batocera-systems
    source_format: python_dict
    hash_type: md5
    # configgen hands each libretro core /userdata/saves/<system> at every
    # launch, with sort_savefiles_enable off (package/batocera/core/
    # batocera-configgen/configgen/configgen/generators/libretro/
    # libretroConfig.py:225-228 and batoceraPaths.py:22 at batocera-43.1).
    # <system> is the ES system name (Emulator.py:119, args.system), so a
    # file is placed once below each system es_systems.yml offers the core
    # for (libretro_systems in batocera.yml). The pack keeps them in
    # userdata-saves/: batocera-systems lists bios/saves/dolphin-emu/
    # Triforce/segaboot.gcm, so saves/ already belongs to the BIOS tree.
    save_directory:
      folder: saves
      by_core: false
      by_system: true
      pack_folder: userdata-saves
    schedule: weekly
    target_scraper: batocera_targets
    target_source: https://github.com/batocera-linux/batocera.linux
    install:
      detect:
      # batocera.linux 38845725, package/batocera/core/batocera-system/
