      # was installed (retrobat-executable 702da66a,
      # RetroBat/RetroBat/Program.cs:57 and 99, RegistryTools.cs:15-50).
      - os: windows
        method: registry
        key: 'HKCU\SOFTWARE\RetroBat'
        value: LatestKnownInstallPath
        bios_subdir: bios
